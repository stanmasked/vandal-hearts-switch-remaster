name: MAP02 v134 private PS-X EXE ancestor symlink refusal
on:
  pull_request:
    paths:
      - '.github/workflows/map02-v134-dirfd-private-exe.yml'
      - '.github/workflows/map02-v104-content-guard.yml'
      - 'tools/analyze_map02_v131_private_mips_mmio.py'
      - 'tests/test_map02_v133_nonblocking_private_exe.py'
      - 'tests/test_map02_v134_dirfd_private_exe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fd-anchored-private-exe:
    name: no-follow directory walk (${{ matrix.cc }})
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Verify ancestor symlink, traversal, FIFO, regular file controls
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_map02_v134_dirfd_private_exe.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v133_nonblocking_private_exe.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v132_mips_delay_slots.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v131_private_mips_mmio.py' -v
