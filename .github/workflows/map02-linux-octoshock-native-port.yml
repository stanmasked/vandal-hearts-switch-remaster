name: MAP02 pinned Linux Octoshock native-port feasibility

on:
  pull_request:
    paths:
      - 'tools/map02_linux_octoshock/**'
      - 'tools/map02_linux_octoshock/official_managed_binding_smoke.cs'
      - 'tests/test_map02_public_ci_storage_policy.py'
      - 'tests/test_map02_linux_octoshock_owner_stage.py'
      - 'tests/test_map02_linux_octoshock_owner_runtime_verify.py'
      - '.github/workflows/map02-linux-octoshock-native-port.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pinned-source-linux-compile-spike:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out project tooling only
        uses: actions/checkout@v4

      - name: Enforce public CI storage policy
        run: python3 -m unittest discover -s tests -p 'test_map02_public_ci_storage_policy.py' -v

      - name: Test owner-local runtime staging safety contracts
        run: python3 -m unittest discover -s tests -p 'test_map02_linux_octoshock_owner_stage.py' -v

      - name: Test staged runtime integrity verifier against synthetic corruption
        run: python3 -m unittest discover -s tests -p 'test_map02_linux_octoshock_owner_runtime_verify.py' -v

      - name: Test POSIX compiler-sanity shim against synthetic upstream header
        run: python3 tests/test_map02_linux_octoshock_compiler_sanity.py

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install native build and no-media runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git binutils python3 mono-complete curl file xvfb libopenal1 liblua5.4-0 lsb-release libgl1

      - name: Build and stage the owner-local runtime with the pinned source builder
        run: |
          set -euo pipefail
          python3 tools/map02_linux_octoshock/build_and_stage_owner.py \
            --output-root "$RUNNER_TEMP/vh-map02-owner-runtime"

      - name: Independently verify staged runtime files, private permissions and pins
        run: python3 tools/map02_linux_octoshock/verify_owner_runtime.py "$RUNNER_TEMP/vh-map02-owner-runtime"

      - name: Verify staged runtime manifest and no-media boundary
        env:
          VH_MAP02_OWNER_RUNTIME: ${{ runner.temp }}/vh-map02-owner-runtime
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["VH_MAP02_OWNER_RUNTIME"]).resolve(strict=True)
          manifest = json.loads((root / "map02-owner-runtime-manifest.json").read_text(encoding="utf-8"))
          assert manifest["schema"] == "vh.map02.owner-local-runtime.v2"
          assert manifest["game_media_used"] is False
          assert manifest["bios_used"] is False
          assert manifest["bk2_used"] is False
          assert manifest["game_loaded"] is False
          assert manifest["psx_capture_ready"] is False
          assert (root / "dll/liboctoshock.dll.so").is_file()
          assert (root / "ExternalTools/VhMap02CoreWitness.dll").is_file()
          assert (root / "map02-owner-runtime-pins.env").is_file()
          assert not (root / "vandalhearts.bk2").exists()
          print("VH_MAP02_OWNER_RUNTIME_STAGED_NO_MEDIA_PASS native=1 witness_plugin=1 original_disc=0 bios=0 bk2=0 capture_ready=0")
          PY
