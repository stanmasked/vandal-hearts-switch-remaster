name: MAP02 BizHawk private power-on launcher (synthetic CI)
on:
  pull_request:
    paths:
      - '.github/workflows/map02-private-bizhawk-poweron-launch.yml'
      - 'tools/map02_private_bizhawk_poweron_launch.py'
      - 'tests/test_map02_private_bizhawk_poweron_launch.py'
      - 'tools/map02_private_two_capture_audit.py'
      - 'tools/map02_private_two_replay_runner.py'
      - 'tools/map02_private_process_group.py'
      - 'tools/map02_private_process_witness_binding.py'
      - 'tests/test_map02_private_process_witness_binding.py'
      - 'tests/test_map02_private_process_group.py'
      - 'tests/test_map02_private_two_replay_runner.py'
      - 'tests/test_map02_private_two_capture_audit.py'
      - 'tools/map02_private_png_pixels.py'
      - 'tests/test_map02_private_png_pixels.py'
      - 'docs/MAP02_PRIVATE_BIZHAWK_POWERON_LAUNCH.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-owner-assets-cli-preflight:
    name: Synthetic power-on CLI (${{ matrix.os }} Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-22.04
            python: '3.11'
          - os: macos-15-intel
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Test private launcher with fictional paths and mocked EmuHawk
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests \
            -p 'test_map02_private_bizhawk_poweron_launch.py' -v \
            2>&1 | tee /tmp/map02-bizhawk-owner-private-launch-tests.log
          summary="$(grep -E 'Ran [1-9][0-9]* tests' /tmp/map02-bizhawk-owner-private-launch-tests.log | tail -n 1)"
          test_count="$(printf '%s\n' "$summary" | sed -E 's/.*Ran ([0-9]+) tests.*/\1/')"
          if grep -E '^(FAILED|ERROR)' /tmp/map02-bizhawk-owner-private-launch-tests.log; then
            exit 1
          fi
          echo "VH_MAP02_LOCAL_BIZHAWK_LAUNCH_TEST_PASS synthetic_tests=${test_count} owner_bk2=0 actual_bizhawk=0 real_ps1=0 map02=unverified"

      - name: Audit two invented private replay folders (no original game files)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests \
            -p 'test_map02_private_two_capture_audit.py' -v \
            2>&1 | tee /tmp/map02-two-run-synthetic.log
          summary="$(grep -E 'Ran [1-9][0-9]* tests' /tmp/map02-two-run-synthetic.log | tail -n 1)"
          test_count="$(printf '%s\n' "$summary" | sed -E 's/.*Ran ([0-9]+) tests.*/\1/')"
          if grep -E '^(FAILED|ERROR)' /tmp/map02-two-run-synthetic.log; then
            exit 1
          fi
          test -n "$test_count"
          echo "VH_MAP02_TWO_PRIVATE_CAPTURES_SYNTHETIC_PASS tests=${test_count} original_bk2=0 actual_bizhawk=0 real_ps1=0"

      - name: Reconstruct invented PNG RGB and RGBA pixels across filter methods
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests \
            -p 'test_map02_private_png_pixels.py' -v \
            2>&1 | tee /tmp/map02-private-png-pixels.log
          summary="$(grep -E 'Ran [1-9][0-9]* tests' /tmp/map02-private-png-pixels.log | tail -n 1)"
          test_count="$(printf '%s\n' "$summary" | sed -E 's/.*Ran ([0-9]+) tests.*/\1/')"
          if grep -E '^(FAILED|ERROR)' /tmp/map02-private-png-pixels.log; then
            exit 1
          fi
          test -n "$test_count"
          echo "VH_MAP02_PRIVATE_PNG_PIXEL_NORMALIZATION_PASS tests=${test_count} original_png=0 original_bk2=0 ps1=unverified"

      - name: Orchestrate two invented owner-local emulator sessions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests \
            -p 'test_map02_private_two_replay_runner.py' -v \
            2>&1 | tee /tmp/map02-private-two-replay-runner.log
          summary="$(grep -E 'Ran [1-9][0-9]* tests' /tmp/map02-private-two-replay-runner.log | tail -n 1)"
          test_count="$(printf '%s\n' "$summary" | sed -E 's/.*Ran ([0-9]+) tests.*/\1/')"
          if grep -E '^(FAILED|ERROR)' /tmp/map02-private-two-replay-runner.log; then
            exit 1
          fi
          test -n "$test_count"
          echo "VH_MAP02_TWO_LOCAL_REPLAY_RUNNER_SYNTHETIC_PASS tests=${test_count} private_game=0 actual_bizhawk=0 ps1_scene=unverified"

      - name: Verify isolated synthetic emulator process group and timeout cleanup
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests \
            -p 'test_map02_private_process_group.py' -v \
            2>&1 | tee /tmp/map02-private-process-group.log
          summary="$(grep -E 'Ran [1-9][0-9]* tests' /tmp/map02-private-process-group.log | tail -n 1)"
          test_count="$(printf '%s\n' "$summary" | sed -E 's/.*Ran ([0-9]+) tests.*/\1/')"
          if grep -E '^(FAILED|ERROR)' /tmp/map02-private-process-group.log; then
            exit 1
          fi
          test -n "$test_count"
          echo "VH_MAP02_PRIVATE_PROCESS_GROUP_SYNTHETIC_PASS tests=${test_count} original_emulator=0 game_data=0 ps1=unverified"

      - name: Bind invented EmuHawk process birth receipts to fake Octoshock core witnesses
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests \
            -p 'test_map02_private_process_witness_binding.py' -v \
            2>&1 | tee /tmp/map02-private-birth-witness.log
          count=$(sed -nE 's/^Ran ([1-9][0-9]*) tests? in .*$/\1/p' /tmp/map02-private-birth-witness.log)
          if [[ "$count" != "19" ]]; then
            echo 'unexpected fictional process-core binding test count' >&2
            exit 1
          fi
          if grep -E '^(FAILED|ERROR)' /tmp/map02-private-birth-witness.log; then exit 1; fi
          grep -E '^OK' /tmp/map02-private-birth-witness.log
          echo "VH_MAP02_OWNER_PROCESS_CORE_BINDING_SYNTHETIC_PASS cases=$count real_psx=0 original_bk2=0"
