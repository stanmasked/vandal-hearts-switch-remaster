name: MAP02 BizHawk private power-on launcher (synthetic CI)
on:
  pull_request:
    paths:
      - '.github/workflows/map02-private-bizhawk-poweron-launch.yml'
      - 'tools/map02_private_bizhawk_poweron_launch.py'
      - 'tests/test_map02_private_bizhawk_poweron_launch.py'
      - 'docs/MAP02_PRIVATE_BIZHAWK_POWERON_LAUNCH.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-owner-assets-cli-preflight:
    name: Synthetic power-on CLI (${{ matrix.os }} Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-22.04
            python: '3.11'
          - os: macos-15-intel
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Test private launcher with fictional paths and mocked EmuHawk
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests \
            -p 'test_map02_private_bizhawk_poweron_launch.py' -v \
            2>&1 | tee /tmp/map02-bizhawk-owner-private-launch-tests.log
          grep -F 'Ran 19 tests' /tmp/map02-bizhawk-owner-private-launch-tests.log
          if grep -E '^(FAILED|ERROR)' /tmp/map02-bizhawk-owner-private-launch-tests.log; then
            exit 1
          fi
          echo 'VH_MAP02_LOCAL_BIZHAWK_LAUNCH_TEST_PASS synthetic=19 owner_bk2=0 actual_bizhawk=0 real_ps1=0 map02=unverified'
