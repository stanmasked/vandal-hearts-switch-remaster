name: MAP02 v181 native aligned MIPS LW SW ordinary RAM provenance
on:
  pull_request:
    paths:
      - '.github/workflows/map02-v181-word-ram-opcodes.yml'
      - '.github/workflows/map02-v104-content-guard.yml'
      - 'tools/apply_map02_v181_word_ram_opcodes.py'
      - 'tests/test_map02_v181_word_ram_opcodes.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aligned-ram-word:
    name: GCC Clang aligned guest LW SW real PC and memory address (${{ matrix.cc }})
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Compile all real word MIPS opcode RAM observer fixtures
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          python3 -m compileall -q tools/apply_map02_v181_word_ram_opcodes.py tests/test_map02_v181_word_ram_opcodes.py
          python3 -m unittest discover -s tests -p 'test_map02_v181_word_ram_opcodes.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v180_nongpu_opcode_provenance.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v179_nongpu_memory_exclusion.py' -v
          echo 'VH181_INDEPENDENT_WORD_RAM_PROVENANCE_PASS kinds=4 original_retail_executed=0'
