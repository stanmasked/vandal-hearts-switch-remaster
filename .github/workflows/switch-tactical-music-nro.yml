name: Switch tactical prototype with integrated audio

on:
  push:
    branches:
      - test/cdxa-extract-decode-pipeline
    paths:
      - "source/main.c"
      - "source/vh_*"
      - "source/game_state.h"
      - "source/platform_input.h"
      - "tests/test_vh_game_music_mailbox.c"
      - "tools/verify_switch_integrated_nro_preflight.py"
      - "tests/test_verify_switch_integrated_nro_preflight.py"
      - "tools/verify_switch_audio_bundle.py"
      - "docs/SWITCH_AUDIO_STAGE239_INTEGRATED_NRO_DEVICE_HANDOFF.md"
      - "Makefile"
      - ".github/workflows/switch-tactical-music-nro.yml"
  pull_request:
    paths:
      - "source/main.c"
      - "source/vh_*"
      - "tools/verify_switch_integrated_nro_preflight.py"
      - "tests/test_verify_switch_integrated_nro_preflight.py"
      - "tools/verify_switch_audio_bundle.py"
      - "docs/SWITCH_AUDIO_STAGE239_INTEGRATED_NRO_DEVICE_HANDOFF.md"
      - "Makefile"
      - ".github/workflows/switch-tactical-music-nro.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tactical-music-nro:
    name: Build tactical framebuffer game with nonblocking libnx audout
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run portable tactical-music and audio regressions
        shell: bash
        run: |
          set -euo pipefail
          make build/test_vh_game_music_mailbox
          ./build/test_vh_game_music_mailbox
          make test-audio-stream
      - name: Build and inspect integrated tactical NRO
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          make verify-nro
          test -s build/vandal-hearts-prototype.nro
      - name: Record exact native NRO SHA256 for operator
        shell: bash
        run: |
          set -euo pipefail
          test -s build/vandal-hearts-prototype.nro
          sha256sum "build/vandal-hearts-prototype.nro" > "build/tactical-native.sha256"
          cat "build/tactical-native.sha256"
          {
            echo "### Native libnx/audout NRO compiled"
            echo "Git SHA: \`$GITHUB_SHA\`"
            echo "Binary: \`build/vandal-hearts-prototype.nro\`"
            echo "SHA256 (NRO bytes):"
            echo "\`\`\`"
            cat "build/tactical-native.sha256"
            echo "\`\`\`"
            echo "Hardware status: HARDWARE NOT TESTED"
            echo "No SDL2/OpenAL devkitPro package download is required."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload integrated tactical NRO
        uses: actions/upload-artifact@v4
        with:
          name: vandal-hearts-tactical-with-native-music
          path: |
            build/vandal-hearts-prototype.nro
            build/tactical-native.sha256
          if-no-files-found: error
