name: MAP02 BK2 Start screenshot CSV crosscheck (synthetic CI)
on:
  pull_request:
    paths:
      - '.github/workflows/map02-private-start-csv-crosscheck.yml'
      - 'tools/verify_map02_private_start_anchor_against_bk2_csv.py'
      - 'tests/test_verify_map02_private_start_anchor_against_bk2_csv.py'
      - 'docs/MAP02_PRIVATE_START_ANCHOR_BK2_CSV_CROSSCHECK.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invented-bk2-csv-versus-screenshots:
    name: Synthetic BK2 CSV anchor (${{ matrix.os }} Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-22.04
            python: '3.11'
          - os: macos-15-intel
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Compare 13 fully invented source CSV and capture bundle scenarios
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests \
            -p 'test_verify_map02_private_start_anchor_against_bk2_csv.py' -v \
            2>&1 | tee /tmp/vh-map02-start-source-crosscheck.log
          grep -F 'Ran 13 tests' /tmp/vh-map02-start-source-crosscheck.log
          if grep -E '^(FAILED|ERROR)' /tmp/vh-map02-start-source-crosscheck.log; then
            exit 1
          fi
          echo 'VH_MAP02_BK2_START_CSV_CROSSCHECK_PASS synthetic=13 owner_bk2=0 owner_png=0 actual_bizhawk=0 scene=unknown'
