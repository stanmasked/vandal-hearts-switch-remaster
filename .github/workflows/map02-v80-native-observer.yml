name: MAP02 v80 native observer unit tests
on:
  pull_request:
    paths:
      - 'tools/map02_v80_native_timeline.*'
      - 'tools/apply_map02_v80_pcsx_rearmed.py'
      - 'tests/test_map02_v80_native_observer.py'
      - '.github/workflows/map02-v80-native-observer.yml'
  workflow_dispatch:
jobs:
  c-observer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_map02_v80_native_observer.py' -v
        env:
          CC: ${{ matrix.compiler }}
