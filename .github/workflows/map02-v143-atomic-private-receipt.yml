name: MAP02 v143 atomic private native MIPS receipt hardening
on:
  pull_request:
    paths:
      - '.github/workflows/map02-v143-atomic-private-receipt.yml'
      - '.github/workflows/map02-v104-content-guard.yml'
      - 'tools/apply_map02_v143_atomic_private_receipt.py'
      - 'tools/check_map02_v143_atomic_receipt.py'
      - 'tests/test_map02_v143_atomic_private_receipt.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-atomic-publish-synthetic:
    name: atomic source receipt full path nofollow (${{ matrix.cc }})
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Compile real receipt writer and refuse symlink and partial files
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          no_retail_exe_in_public_tests=1
          readonly no_retail_exe_in_public_tests
          test "$no_retail_exe_in_public_tests" = 1
          python3 -m unittest discover -s tests -p 'test_map02_v143_atomic_private_receipt.py' -v
          python3 -m tools.check_map02_v143_atomic_receipt --cc "$CC"
          python3 -m unittest discover -s tests -p 'test_map02_v142_native_private_receipt.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v141_private_original_mmio_claims.py' -v
          echo "VH143_ATOMIC_PRIVATE_RECEIPT_SOURCE_PASS retail_map02=0"
