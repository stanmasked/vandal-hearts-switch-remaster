name: Switch toolchain readiness

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/switch-toolchain.yml'
      - 'tools/**'
      - 'docs/**'
      - 'Makefile'
      - 'makefile'
      - 'source/**'
      - 'tests/**'
      - 'src/**'

permissions:
  contents: read

jobs:
  host-regression:
    name: Host C and Python regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run complete host test suite
        run: make test

  toolchain:
    name: Verify devkitPro Switch toolchain
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Switch toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          command -v aarch64-none-elf-gcc
          command -v elf2nro
          command -v nacptool
          command -v elf2nro || test -x "$DEVKITPRO/tools/bin/elf2nro"
          command -v nacptool || test -x "$DEVKITPRO/tools/bin/nacptool"
          test -f "$DEVKITPRO/libnx/include/switch.h"
          aarch64-none-elf-gcc --version
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITA64=$DEVKITA64"

      - name: Run host-side rule tests
        shell: bash
        run: |
          set -euxo pipefail
          make test

      - name: Run sanitizer-enabled host tests
        shell: bash
        run: |
          set -euxo pipefail
          make test-sanitize

      - name: Build and validate NRO
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          make verify-nro

      - name: Generate and verify per-build audio receipt
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/switch_audio_ci_build_receipt.py create \
            build/vandal-hearts-prototype.nro \
            --git-sha "$GITHUB_SHA" \
            --branch "$GITHUB_REF_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output build/vandal-hearts-prototype.build.json
          python3 tools/switch_audio_ci_build_receipt.py verify \
            build/vandal-hearts-prototype.nro \
            --receipt build/vandal-hearts-prototype.build.json \
            --expected-git-sha "$GITHUB_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-branch "$GITHUB_REF_NAME"

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: vandal-hearts-switch-prototype
          path: |
            build/vandal-hearts-prototype.nro
            build/vandal-hearts-prototype.build.json
          if-no-files-found: error
