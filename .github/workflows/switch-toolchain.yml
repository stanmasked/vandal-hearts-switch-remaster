name: Switch toolchain readiness

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/switch-toolchain.yml'
      - 'tools/**'
      - 'docs/**'
      - 'Makefile'
      - 'makefile'
      - 'source/**'
      - 'tests/**'
      - 'src/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  toolchain:
    name: Verify devkitPro Switch toolchain
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Switch toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          command -v aarch64-none-elf-gcc
          command -v elf2nro
          command -v nacptool
          command -v elf2nro || test -x "$DEVKITPRO/tools/bin/elf2nro"
          command -v nacptool || test -x "$DEVKITPRO/tools/bin/nacptool"
          test -f "$DEVKITPRO/libnx/include/switch.h"
          aarch64-none-elf-gcc --version
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITA64=$DEVKITA64"

      - name: Run host-side rule tests
        shell: bash
        run: |
          set -euxo pipefail
          make test

      - name: Run sanitizer-enabled host tests
        shell: bash
        run: |
          set -euxo pipefail
          make test-sanitize

      - name: Build and validate NRO
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          make verify-nro

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: vandal-hearts-switch-prototype
          path: build/*.nro
          if-no-files-found: error
