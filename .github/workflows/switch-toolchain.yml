name: Switch toolchain readiness

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/switch-toolchain.yml'
      - 'tools/**'
      - 'docs/**'
      - 'Makefile'
      - 'makefile'
      - 'source/**'
      - 'tests/**'
      - 'src/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  cancel-stale-queued-runs:
    name: Cancel stale queued runs for current branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel only queued runs from older commits on this branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          runs_json="$(curl -fsSL --get \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data-urlencode "branch=$BRANCH" \
            --data-urlencode "status=queued" \
            --data-urlencode "per_page=100" \
            "$GH_API_URL/repos/$REPOSITORY/actions/runs")"
          stale_ids="$(jq -r --arg sha "$CURRENT_SHA" \
            '.workflow_runs[]? | select(.head_sha != $sha) | .id' <<< "$runs_json")"
          if [[ -z "$stale_ids" ]]; then
            echo "No superseded queued runs found for $BRANCH"
            exit 0
          fi
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            code="$(curl -sS -o "$RUNNER_TEMP/cancel-response.json" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GH_API_URL/repos/$REPOSITORY/actions/runs/$run_id/cancel")"
            case "$code" in
              202) echo "Requested cancellation of superseded queued run $run_id" ;;
              409|422) echo "Run $run_id became non-cancellable before the request (HTTP $code)" ;;
              *) echo "::warning::Could not cancel stale queued run $run_id (HTTP $code)" ;;
            esac
          done <<< "$stale_ids"

  toolchain:
    name: Verify devkitPro Switch toolchain
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Switch toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          command -v aarch64-none-elf-gcc
          command -v elf2nro
          command -v nacptool
          command -v elf2nro || test -x "$DEVKITPRO/tools/bin/elf2nro"
          command -v nacptool || test -x "$DEVKITPRO/tools/bin/nacptool"
          test -f "$DEVKITPRO/libnx/include/switch.h"
          aarch64-none-elf-gcc --version
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITA64=$DEVKITA64"

      - name: Run host-side rule tests
        shell: bash
        run: |
          set -euxo pipefail
          make test

      - name: Run sanitizer-enabled host tests
        shell: bash
        run: |
          set -euxo pipefail
          make test-sanitize

      - name: Build and validate NRO
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          make verify-nro

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: vandal-hearts-switch-prototype
          path: build/*.nro
          if-no-files-found: error
