name: Switch toolchain readiness

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/switch-toolchain.yml'
      - 'tools/**'
      - 'docs/**'
      - 'Makefile'
      - 'makefile'
      - 'source/**'
      - 'src/**'

permissions:
  contents: read

jobs:
  toolchain:
    name: Verify devkitPro Switch toolchain
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Switch toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          command -v aarch64-none-elf-gcc || test -x "$DEVKITA64/bin/aarch64-none-elf-gcc"
          command -v elf2nro || test -x "$DEVKITPRO/tools/bin/elf2nro"
          command -v nacptool || test -x "$DEVKITPRO/tools/bin/nacptool"
          test -f "$DEVKITPRO/libnx/include/switch.h"
          aarch64-none-elf-gcc --version
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITA64=$DEVKITA64"

      - name: Build project if a Makefile exists
        shell: bash
        run: |
          set -euxo pipefail
          if [[ -f Makefile || -f makefile ]]; then
            export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
            export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
            make
          else
            echo 'Toolchain verified. No project Makefile exists yet; no NRO build was attempted.'
          fi
