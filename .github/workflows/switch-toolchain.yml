name: Switch toolchain readiness

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/switch-toolchain.yml'
      - 'tools/**'
      - 'docs/**'
      - 'Makefile'
      - 'makefile'
      - 'source/**'
      - 'tests/**'
      - 'src/**'

permissions:
  contents: read

jobs:
  toolchain:
    name: Verify devkitPro Switch toolchain
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Switch toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          command -v aarch64-none-elf-gcc
          command -v elf2nro
          command -v nacptool
          command -v elf2nro || test -x "$DEVKITPRO/tools/bin/elf2nro"
          command -v nacptool || test -x "$DEVKITPRO/tools/bin/nacptool"
          test -f "$DEVKITPRO/libnx/include/switch.h"
          aarch64-none-elf-gcc --version
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITA64=$DEVKITA64"

      - name: Run host-side rule tests
        shell: bash
        run: |
          set -euxo pipefail
          make test

      - name: Run sanitizer-enabled host tests
        shell: bash
        run: |
          set -euxo pipefail
          make test-sanitize

      - name: Cross-compile isolated RGB24 presentation modules for AArch64
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          COMPILER="$DEVKITA64/bin/aarch64-none-elf-gcc"
          GLES_INCLUDE="$DEVKITPRO/portlibs/switch/include"
          test -f "$GLES_INCLUDE/GLES2/gl2.h"
          mkdir -p build/aarch64-frame
          for unit in \
            source/frame_conversion.c \
            source/rgb24_scratch.c \
            source/switch_rgb24_presenter.c \
            source/switch_frame_bridge.c \
            source/switch_completed_frame.c \
            source/switch_converted_frame.c \
            source/switch_managed_frame.c \
            source/switch_present_hook.c \
            source/switch_upstream_observer.c; do
            "$COMPILER" -std=c11 -Wall -Wextra -Werror -O2 \
              -I"$GLES_INCLUDE" -I"$DEVKITPRO/libnx/include" -Isource \
              -c "$unit" -o "build/aarch64-frame/$(basename "${unit%.c}").o"
          done
          "$DEVKITA64/bin/aarch64-none-elf-ar" rcs \
            build/aarch64-frame/libvhframe.a build/aarch64-frame/*.o
          "$DEVKITA64/bin/aarch64-none-elf-ar" t build/aarch64-frame/libvhframe.a

      - name: Build and validate NRO
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          make verify-nro

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: vandal-hearts-switch-prototype
          path: build/*.nro
          if-no-files-found: error
