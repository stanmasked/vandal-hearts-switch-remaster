name: MAP02 v121 interpreted MIPS CPU GP0 Unai VRAM return
on:
  pull_request:
    paths:
      - '.github/workflows/map02-v121-mips-gp0-return.yml'
      - '.github/workflows/map02-v104-content-guard.yml'
      - 'tools/make_map02_v121_mips_gp0_return_exe.py'
      - 'tools/apply_map02_v121_pcsx_rearmed.py'
      - 'tools/summarize_map02_v121_mips_return.py'
      - 'tests/test_map02_v121_mips_return.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-synthetic-mips-gp0-a-b-c-d-a:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded original MIPS EXE GPU stores and status provenance
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_map02_v121_mips_return.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v120_real_gp0_return.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v119_five_native.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v119_quintuplet_runtime.py' -v
