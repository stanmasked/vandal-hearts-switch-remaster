name: MAP02 reconciled integration candidate

on:
  pull_request:
    paths:
      - '.github/workflows/map02-reconciled-stack.yml'
      - 'tests/test_map02_stacked_integration.c'
      - 'tools/audit_map02_stack.py'
      - 'source/main.c'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ancestry-content-proof:
    name: Compare historical 4v4 fix to final integration tree without changing refs
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read-only verify Git two-parent merge content is exactly unchanged
        shell: bash
        env:
          PINNED_PARENT: e4c58b0429b605c66a6f7ce30875154e85ec942f
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/pull/262/head:refs/remotes/origin/map02-262 \
            "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/map02-current"
          test "$(git rev-parse refs/remotes/origin/map02-262)" = "$PINNED_PARENT"
          test "$(git rev-parse refs/remotes/origin/map02-current)" = "$PR_HEAD"
          expected="$(git rev-parse "$PR_HEAD^{tree}")"
          merged="$(git merge-tree --write-tree "$PINNED_PARENT" "$PR_HEAD")"
          test "$merged" = "$expected"
          # Compare the original copied-fix edge, not the newest version
          # of main.c: later PRs legitimately extend the Switch entrypoint.
          git fetch --no-tags origin +refs/pull/265/head:refs/remotes/origin/map02-265
          test "$(git rev-parse refs/remotes/origin/map02-265)" = \
               "965229da0ee4e08ea9db1a3a61e79cd585c07f57"
          for file in \
            source/main.c \
            tests/run_map02_nexium_4v4.py \
            tests/test_map02_nexium_4v4_oracle.py \
            .github/workflows/map02-switch-eight-slot.yml
          do
            test "$(git rev-parse "$PINNED_PARENT:$file")" = \
                 "$(git rev-parse "965229da0ee4e08ea9db1a3a61e79cd585c07f57:$file")"
          done
          # The isolated integration branch now carries a genuine merge
          # commit with the historical #262 SHA as its second parent.
          reconcile_sha="551e4dd4e5545e4e1bf91dca2b4791ab82609977"
          test "$(git rev-parse "$reconcile_sha^1")" = "293fd34d824e2267aefb68c464f21f852d96b870"
          test "$(git rev-parse "$reconcile_sha^2")" = "$PINNED_PARENT"
          git diff --quiet "$reconcile_sha^1" "$reconcile_sha"
          git merge-base --is-ancestor "$reconcile_sha" "$PR_HEAD"
          git merge-base --is-ancestor "$PINNED_PARENT" "$PR_HEAD"
          echo 'VH_MAP02_RECONCILE_PASS historic_262_ancestor=1 tree_unchanged=1 shared_files=4 main_merge=0'
      - name: Ensure original authored assets survive exact integrated branch
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for file in \
            source/map02_battle_fixture.h \
            source/map02_roster8_smoke_data.h \
            source/map02_roster8.h \
            data/map02_roster8_4v4.json
          do
            test "$(git rev-parse "e4c58b0429b605c66a6f7ce30875154e85ec942f:$file")" = \
                 "$(git rev-parse "$PR_HEAD:$file")"
          done
          echo 'VH_MAP02_RECONCILE_DATA_PASS original_fixture_blobs=4'

  combined-combat:
    name: Integrated archer, guard, medic and both tactical arenas (${{ matrix.cc }})
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Run same C implementation with and without undefined-behavior sanitizer
        shell: bash
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          "$CC" -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            tests/test_map02_stacked_integration.c -o /tmp/map02-reconcile
          /tmp/map02-reconcile | tee /tmp/map02-reconcile.log
          grep -Fx 'VH_MAP02_STACK_NATIVE_PASS rosters=6 bow=1 medic=1 guard=1 original_scene=1 zero_retail=1' /tmp/map02-reconcile.log
          "$CC" -std=c11 -O0 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=undefined -fno-sanitize-recover=all \
            tests/test_map02_stacked_integration.c -o /tmp/map02-reconcile-ubsan
          /tmp/map02-reconcile-ubsan

  integrated-switch-nro:
    name: Build real optional 4v4 devkitPro/libnx NRO
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Check exact 4v4 JSON-to-C header and portable battle
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:$PATH"
          python3 -m py_compile tests/run_map02_nexium_guard_hud.py
          python3 tools/generate_map02_fixture.py --all --check
          python3 tools/generate_map02_roster8.py --output /tmp/map02_roster8_generated.h
          cmp source/map02_roster8_smoke_data.h /tmp/map02_roster8_generated.h
          python3 tools/generate_map02_roster8.py --scene secondary --output /tmp/map02_roster8_second_generated.h
          cmp source/map02_roster8_second_data.h /tmp/map02_roster8_second_generated.h
          make build/test_map02_two_scenarios
          ./build/test_map02_two_scenarios
          make verify-nro
          test -s build/vandal-hearts-prototype.nro
          echo 'VH_MAP02_SWITCH_4V4_NRO_PASS original_maps=2 optional_mode=1 retail=0'
      - uses: actions/upload-artifact@v4
        with:
          name: map02-reconciled-stack-switch-nro
          path: build/vandal-hearts-prototype.nro
          if-no-files-found: error
  nexium-reconciled-guard:
    name: NeXium guard READY ARMED BLOCKED statuses and reset
    needs: [ancestry-content-proof, combined-combat, integrated-switch-nro]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: map02-reconciled-stack-switch-nro
          path: nros
      - name: Install Vulkan and screenshot dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Download pinned current NeXium nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(curl -fsSL --retry 3 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          asset_url="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name == "nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          test -n "$asset_url"
          curl -fL --retry 3 --retry-all-errors "$asset_url" -o /tmp/nexium-linux.tar.gz
          mkdir -p /tmp/nexium
          tar -xzf /tmp/nexium-linux.tar.gz -C /tmp/nexium
          emu_bin="$(find /tmp/nexium -type f -executable \( -name nexium -o -name nexium-gui \) -print -quit)"
          test -n "$emu_bin"
          echo "NEXIUM_BIN=$emu_bin" >> "$GITHUB_ENV"
      - name: Capture actual guard HUD statuses and protected enemy hit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p map02-guard-hud-evidence
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          timeout --kill-after=5s 180s xvfb-run -a -s "-screen 0 1280x720x24" \
            python3 tests/run_map02_nexium_guard_hud.py \
              --nro "$PWD/nros/vandal-hearts-prototype.nro" \
              --evidence-dir map02-guard-hud-evidence \
            | tee map02-guard-hud-evidence/result.log
          grep -Fx 'VH_MAP02_NEXIUM_GUARD_HUD_PASS ready=1 armed=1 no_hit_expired=1 actual_hit_blocked=1 reduced_damage=1 reset=1 first_arena_hidden=1 legacy_preserved=1 retail=0' map02-guard-hud-evidence/result.log
      - name: Upload authentic emulator screenshots and execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-map02-reconciled-guard-runtime
          path: map02-guard-hud-evidence/
          if-no-files-found: warn

  nexium-reconciled-specialists:
    name: NeXium reconciled combat specialty (${{ matrix.scenario }})
    needs: [ancestry-content-proof, combined-combat, integrated-switch-nro]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [bow, medic]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: map02-reconciled-stack-switch-nro
          path: nros
      - name: Install Vulkan and screenshot dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Download pinned current NeXium nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(curl -fsSL --retry 3 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          asset_url="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name == "nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          test -n "$asset_url"
          curl -fL --retry 3 --retry-all-errors "$asset_url" -o /tmp/nexium-linux.tar.gz
          mkdir -p /tmp/nexium
          tar -xzf /tmp/nexium-linux.tar.gz -C /tmp/nexium
          emu_bin="$(find /tmp/nexium -type f -executable \( -name nexium -o -name nexium-gui \) -print -quit)"
          test -n "$emu_bin"
          echo "NEXIUM_BIN=$emu_bin" >> "$GITHUB_ENV"
      - name: Execute genuine NeXium controlled ${{ matrix.scenario }} encounter
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          dir="map02-reconciled-$SCENARIO-evidence"
          mkdir -p "$dir"
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          case "$SCENARIO" in
            bow)
              script=tests/run_map02_nexium_bow.py
              marker='VH_MAP02_NEXIUM_BOW_PASS second_arena=1 invalid_range=1 selection_preserved=1 line_of_sight=1 actual_b_fire=1 enemy_defeated=1 other_enemies_alive=1 reset=1 primary_preserved=1 legacy_preserved=1 retail=0'
              ;;
            medic)
              script=tests/run_map02_nexium_medic.py
              marker='VH_MAP02_NEXIUM_MEDIC_PASS second_arena=1 healthy_no_heal=1 natural_ai_damage=1 healer_b_action=1 healed=1 action_spent=1 reset=1 primary_preserved=1 legacy_preserved=1 retail=0'
              ;;
            *) echo 'unknown specialist route' >&2; exit 2 ;;
          esac
          timeout --kill-after=5s 180s xvfb-run -a -s "-screen 0 1280x720x24" \
            python3 "$script" \
              --nro "$PWD/nros/vandal-hearts-prototype.nro" \
              --evidence-dir "$dir" | tee "$dir/result.log"
          grep -Fx "$marker" "$dir/result.log"
      - name: Upload authentic emulator screenshots and execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-map02-reconciled-${{ matrix.scenario }}-runtime
          path: map02-reconciled-${{ matrix.scenario }}-evidence/
          if-no-files-found: warn
