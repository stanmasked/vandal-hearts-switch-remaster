name: MAP02 Stage275 compile pinned instrumented NeXium CPAL runner

on:
  pull_request:
    paths:
      - '.github/workflows/map02-nexium-cpal-cargo-check.yml'
      - 'docs/MAP02_NEXIUM_CPAL_TYPECHECK.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  VH_RESEARCH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  VH_PARENT_SHA: '1d666549d3fd99a2c0f557566880b6f7f852469d'
  NEXIUM_SOURCE_SHA: '089562567a0a8760dfdd8420e1f57c35159a9219'
  CARGO_TERM_COLOR: never

jobs:
  cpal-typecheck:
    name: Linux Cargo type-check real CPAL callbacks and kernel AudioOut
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact-stage research tools
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VH_RESEARCH_SHA }}
          path: research
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout immutable independent NeXium source
        uses: actions/checkout@v4
        with:
          repository: nexium-emu/nexium
          ref: 089562567a0a8760dfdd8420e1f57c35159a9219
          path: upstream
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - name: Fail closed on unexpected source or code changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = "$VH_RESEARCH_SHA"
          test "$(git -C upstream rev-parse HEAD)" = "$NEXIUM_SOURCE_SHA"
          test -s upstream/rustarmic/Cargo.toml
          test "$(git -C upstream submodule status --recursive | grep -c rustarmic)" -ge 1
          python3 - <<'PY'
          import os,subprocess
          changed=set(subprocess.check_output(
              ["git","-C","research","diff","--name-only",
               os.environ["VH_PARENT_SHA"],"HEAD"],text=True).splitlines())
          allowed={
              ".github/workflows/map02-nexium-cpal-cargo-check.yml",
              "docs/MAP02_NEXIUM_CPAL_TYPECHECK.md",
          }
          assert changed and changed<=allowed,(sorted(changed-allowed),sorted(changed))
          assert not subprocess.check_output(
              ["git","-C","upstream","status","--porcelain"],text=True).strip()
          print("Frozen parent, exactly two host-only research changes:",sorted(changed))
          PY
      - name: Install system dependencies for actual Linux CPAL/ALSA type-check
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            clang libclang-dev llvm-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev libopus-dev libssl-dev
          pkg-config --modversion alsa
          pkg-config --modversion opus
      - name: Set stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream
          cache-on-failure: true
      - name: Synthetic overlay tests, then apply to exact upstream code
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/tests \
            -p 'test_prepare_map02_nexium_cpal_overlay.py' -v
          python3 research/tools/prepare_map02_nexium_cpal_overlay.py \
            --upstream upstream --manifest stage275-source-overlay-receipt.json
      - name: Verify overlay applies to only declared NeXium code paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          m=json.loads(Path("stage275-source-overlay-receipt.json").read_text())
          expected={"nexium-runner/src/audio.rs",
                    "nexium-kernel/src/services/audio_out/handlers.rs",
                    "nexium-runner/Cargo.toml"}
          observed=set(subprocess.check_output(
              ["git","-C","upstream","diff","--name-only"],text=True).splitlines())
          assert m["upstream_git_sha_expected"]=="089562567a0a8760dfdd8420e1f57c35159a9219"
          assert observed==expected,(observed,expected)
          assert {x["path"] for x in m["source_files"]}==expected
          assert all(x["sha256_before"]!=x["sha256_after"] for x in m["source_files"])
          print("Only pinned runner/kernel/Cargo files changed:",sorted(observed))
          PY
          rustfmt --edition 2021 --emit stdout \
            upstream/nexium-runner/src/audio.rs >/dev/null
          rustfmt --edition 2021 --emit stdout \
            upstream/nexium-kernel/src/services/audio_out/handlers.rs >/dev/null
      - name: Resolve Cargo dependencies and record exact lockfile checksum
        shell: bash
        env:
          CARGO_NET_RETRY: '2'
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path upstream/Cargo.toml \
            2>&1 | tee stage275-lockfile-resolution.log
          test -s upstream/Cargo.lock
          sha256sum upstream/Cargo.lock | tee stage275-cargo-lock-sha256.txt
          rustc --version
          cargo --version
      - name: Type-check instrumented audio.rs AND kernel AudioOut with real dependencies
        shell: bash
        timeout-minutes: 30
        env:
          CARGO_NET_RETRY: '2'
        run: |
          set -euo pipefail
          # Runner depends on kernel; this checks both altered Rust files.
          # NeXium's CPU enums REQUIRE at least one concrete backend.
          # Select only pinned Rustarmic; do not pull the Dynarmic C++ backend.
          # The runner's CPAL Linux output is independent of CPU backend.
          cargo check --manifest-path upstream/Cargo.toml \
            --locked --package nexium-runner --no-default-features \
            --features backend-rustarmic \
            2>&1 | tee stage275-cpal-runner-typecheck.log
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          source=Path("stage275-source-overlay-receipt.json")
          m=json.loads(source.read_text())
          lock=Path("upstream/Cargo.lock")
          assert lock.is_file() and source.is_file()
          typecheck=Path("stage275-cpal-runner-typecheck.log")
          assert typecheck.stat().st_size>0
          assert "Finished" in typecheck.read_text(errors="replace")
          receipt={
            "schema":"vh-map02-nexium-cpal-typecheck/v1",
            "result":"INSTRUMENTED_NEXIUM_RUNNER_AND_KERNEL_CARGO_CHECK_PASSED",
            "upstream_git_sha":os.environ["NEXIUM_SOURCE_SHA"],
            "research_head_sha":os.environ["VH_RESEARCH_SHA"],
            "cargo_lock_sha256":hashlib.sha256(lock.read_bytes()).hexdigest(),
            "patched_source_files":m["source_files"],
            "rustc_version":subprocess.check_output(["rustc","--version"],text=True).strip(),
            "cargo_version":subprocess.check_output(["cargo","--version"],text=True).strip(),
            "linux_cpal_dependency_checked":True,
            "runner_cpu_feature":"backend-rustarmic",
            "dynarmic_cpp_backend_selected":False,
            "instrumented_nexium_binary_built":False,
            "original_nightly_binary_equivalence_verified":False,
            "guest_runtime_test_performed":False,
            "physical_switch_audio_proven":False,
            "cpal_callback_runtime_liveness_proven":False,
          }
          Path("stage275-typecheck-receipt.json").write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
      - name: Clearly report successful type checking vs missing runtime proof
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              print("### Stage275 pinned NeXium CPAL/kernel Cargo type-check",file=out)
              f=Path("stage275-typecheck-receipt.json")
              if not f.is_file():
                  print("**UNVERIFIED**: real Cargo type-check did not pass; "
                        "see stage275-cpal-runner-typecheck.log and dependency logs.",file=out)
              else:
                  receipt=json.loads(f.read_text())
                  print("Verified: "+receipt["result"],file=out)
                  print("Upstream SHA: "+receipt["upstream_git_sha"],file=out)
                  print("Resolved dependency lock SHA-256: "+
                        receipt["cargo_lock_sha256"],file=out)
                  print("No executable was built or launched. This is "
                        "a real Linux Rust type-check, **not** a NeXium "
                        "guest workload or audio repair.",file=out)
          PY
      - name: Upload research receipt and bounded build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map02-stage275-cpal-cargo-typecheck-evidence
          path: |
            stage275-source-overlay-receipt.json
            stage275-typecheck-receipt.json
            stage275-cargo-lock-sha256.txt
            stage275-lockfile-resolution.log
            stage275-cpal-runner-typecheck.log
          if-no-files-found: warn
