name: MAP02 owner private paired core and PNG acceptance (fictional CI)
on:
  pull_request:
    paths:
      - '.github/workflows/map02-private-paired-core-png-gate.yml'
      - 'tools/map02_private_paired_capture_core_png_gate.py'
      - 'tests/test_map02_private_paired_capture_core_png_gate.py'
      - 'tools/map02_private_process_witness_binding.py'
      - 'tools/map02_private_two_capture_audit.py'
      - 'tools/map02_private_core_witness_audit.py'
      - 'docs/MAP02_PRIVATE_PAIRED_CORE_PNG_ACCEPTANCE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fictional-owner-paired-acceptance:
    name: Fictional paired core/PNG evidence (${{ matrix.os }} Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-22.04
            python: '3.11'
          - os: macos-15-intel
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Reject swapped/stale witnesses, incomplete audits and mismatched PNGs
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests \
            -p 'test_map02_private_paired_capture_core_png_gate.py' -v \
            2>&1 | tee /tmp/vh-map02-private-paired-acceptance.log
          count=$(sed -nE 's/^Ran ([1-9][0-9]*) tests? in .*$/\1/p' /tmp/vh-map02-private-paired-acceptance.log)
          test "$count" = "20"
          if grep -E '^(FAILED|ERROR)' /tmp/vh-map02-private-paired-acceptance.log; then exit 1; fi
          grep -qx 'OK' /tmp/vh-map02-private-paired-acceptance.log
          echo "VH_MAP02_OWNER_PAIRED_CORE_PNG_FICTIONAL_PASS tests=$count private_assets=0 real_ps1=0 map02=unverified"
