name: MAP02 Stage304 ALSA preflight
on:
  pull_request:
    paths:
      - '.github/workflows/map02-alsa-userfunc-stage304.yml'
      - 'tools/map02_alsa_avail_preload_stage304.c'
      - 'tools/audit_map02_alsa_userfunc_stage304.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: ALSA preflight original ROM-free research code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python3 -m py_compile tools/audit_map02_alsa_userfunc_stage304.py
          python3 -m unittest discover -s tests -p 'test_audit_map02_alsa_userfunc_stage304.py' -v
