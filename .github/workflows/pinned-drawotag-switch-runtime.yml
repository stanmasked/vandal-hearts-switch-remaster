name: Original DrawOTag raster to Switch NRO

on:
  push:
    branches:
      - feat/upstream-rgb24-observer-binding
    paths:
      - "tools/patch_pc_gpu_present_observer.py"
      - "tools/switch_psyq_compat.h"
      - "probes/pinned_drawotag_switch_smoke.c"
      - "source/vh_private_map_bank.*"
      - "tests/test_private_map_bank.c"
      - "tests/test_drawotag_texture_fixtures.py"
      - "tests/test_inspect_psx_tim.py"
      - "tools/inspect_psx_tim.py"
      - "tools/inspect_vh_map_texture_bank.py"
      - "tests/test_inspect_vh_map_texture_bank.py"
      - "tests/test_pc_gpu_present_observer_patch.py"
      - "probes/pinned_pc_gpu_switch_smoke.c"
      - "source/switch_upstream_observer.*"
      - "source/switch_sdl2_observer_backend.*"
      - ".github/workflows/pinned-drawotag-switch-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-compile:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate original GPU texture test vectors
        run: python3 tests/test_drawotag_texture_fixtures.py
      - name: Preflight bounded original-format TIM data
        run: python3 tests/test_inspect_psx_tim.py
      - name: Verify original map texture bank layout and BIN extraction
        run: python3 tests/test_inspect_vh_map_texture_bank.py
      - name: Host-test private SD map bank file validation
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -O2 \
            tests/test_private_map_bank.c source/vh_private_map_bank.c \
            -o /tmp/vh-private-map-test
          /tmp/vh-private-map-test
      - name: Build official Switch SDL2 source with pinned checksums
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export PATH="$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/switch/bin:$PATH"
          workdir="$(mktemp -d)"
          cd "$workdir"
          curl --fail --location --retry 3 --retry-all-errors \
            https://www.libsdl.org/release/SDL2-2.28.5.tar.gz -o SDL2-2.28.5.tar.gz
          curl --fail --location --retry 3 --retry-all-errors \
            https://raw.githubusercontent.com/devkitPro/pacman-packages/master/switch/SDL2/SDL2-2.28.5.patch \
            -o SDL2-2.28.5.patch
          echo "332cb37d0be20cb9541739c61f79bae5a477427d79ae85e352089afdaf6666e4  SDL2-2.28.5.tar.gz" | sha256sum --check
          echo "eb2da665a014dc540ad3dfeb62b3f7c5e15ae090ebdd631fe8b78c1f272c7aa0  SDL2-2.28.5.patch" | sha256sum --check
          tar -xzf SDL2-2.28.5.tar.gz
          cd SDL2-2.28.5
          patch -p1 -i ../SDL2-2.28.5.patch
          source "$DEVKITPRO/switchvars.sh"
          ./configure --prefix="$PORTLIBS_PREFIX" --host=aarch64-none-elf \
            --disable-shared --enable-static --enable-audio --enable-joystick \
            --disable-power --disable-filesystem --enable-cpuinfo \
            --enable-pthreads --enable-timers --enable-video
          make -j2
          make install
          export PATH="$DEVKITPRO/portlibs/switch/bin:$PATH"
          command -v sdl2-config
          sdl2-config --version

      - name: Cross-compile pinned GPU translation unit with Switch GLES2
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/switch/bin:$PATH"
          git clone --filter=blob:none --no-checkout https://github.com/HalmyLyseas/VandalHearts-PcPort.git /tmp/vh-cross-upstream
          git -C /tmp/vh-cross-upstream checkout --detach 14552fffa0e0b47e02b57592e274fc6e7a649923
          python3 tools/patch_pc_gpu_present_observer.py /tmp/vh-cross-upstream/platform/pc/src/pc_gpu_window.c /tmp/vh-cross-upstream/platform/pc/src/pc_gpu_window_instrumented.c
          mkdir -p build/upstream-cross
          "$DEVKITA64/bin/aarch64-none-elf-gcc" -std=c11 -O2 -Wall -Wextra -flto -ffat-lto-objects -ffunction-sections -fdata-sections -DVH_SWITCH_COMPLETED_FRAME_OBSERVER -DVH_SWITCH_EXCLUSIVE_PRESENT -I/tmp/vh-cross-upstream/platform/pc/include -I/tmp/vh-cross-upstream/platform/pc/src $(sdl2-config --cflags) -c /tmp/vh-cross-upstream/platform/pc/src/pc_gpu_window_instrumented.c -o build/upstream-cross/pinned_gpu_switch.o
          "$DEVKITA64/bin/aarch64-none-elf-nm" build/upstream-cross/pinned_gpu_switch.o | grep ' PC_GpuPresent'
          echo "Pinned GPU translation unit cross-compilation passed (object only)."
      - name: Inventory unresolved original GPU platform dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-nm" --undefined-only build/upstream-cross/pinned_gpu_switch.o > build/upstream-cross/undefined-symbols.txt
          echo "Undefined external symbols in original pinned GPU translation unit:"
          cat build/upstream-cross/undefined-symbols.txt
          grep -q 'VH_ObserveCompletedRGB24' build/upstream-cross/undefined-symbols.txt
          if grep -Eq 'glDrawPixels|glPixelZoom|glRasterPos2f' build/upstream-cross/undefined-symbols.txt; then
            echo "Legacy desktop-only GL symbol leaked into Switch GPU object" >&2
            exit 1
          fi
          echo "Legacy glDrawPixels/glPixelZoom/glRasterPos2f dependencies are absent."
      - name: Compile original DrawOTag and native software rasterizer
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          for item in libgpu pc_raster; do
            "$DEVKITA64/bin/aarch64-none-elf-gcc" -std=c11 -O2 -Wall -Wextra \
              -flto -ffat-lto-objects -ffunction-sections -fdata-sections \
              -include tools/switch_psyq_compat.h \
              -I/tmp/vh-cross-upstream/platform/pc/include \
              -I/tmp/vh-cross-upstream/platform/pc/src \
              -I/tmp/vh-cross-upstream/include \
              -I"$DEVKITPRO/libnx/include" \
              -c "/tmp/vh-cross-upstream/platform/pc/src/$item.c" \
              -o "build/upstream-cross/$item.o"
          done
          "$DEVKITA64/bin/aarch64-none-elf-nm" --defined-only build/upstream-cross/libgpu.o | grep ' DrawOTag$'
          "$DEVKITA64/bin/aarch64-none-elf-nm" --defined-only build/upstream-cross/pc_raster.o | grep ' PC_GpuVram$'
      - name: Link original DrawOTag, rasterizer and pinned presenter into NRO
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/switch/bin:$PATH"
          "$DEVKITA64/bin/aarch64-none-elf-gcc" -O2 -flto -ffunction-sections -fdata-sections -Isource \
            -I"$DEVKITPRO/libnx/include" \
            $(sdl2-config --cflags) \
            -specs="$DEVKITPRO/libnx/switch.specs" -Wl,--gc-sections -pie \
            -I/tmp/vh-cross-upstream/platform/pc/include \
            -I/tmp/vh-cross-upstream/platform/pc/src \
            -include tools/switch_psyq_compat.h \
            probes/pinned_drawotag_switch_smoke.c source/switch_sdl2_observer_backend.c \
            source/vh_private_map_bank.c \
            source/switch_rgb24_presenter.c source/frame_conversion.c \
            source/switch_frame_bridge.c source/switch_completed_frame.c \
            source/switch_present_hook.c source/switch_upstream_observer.c \
            build/upstream-cross/libgpu.o build/upstream-cross/pc_raster.o \
            build/upstream-cross/pinned_gpu_switch.o \
            -o build/upstream-cross/pinned-drawotag-switch.elf \
            $(sdl2-config --libs) -lGLESv2 -L"$DEVKITPRO/libnx/lib" -lnx -lm
          "$DEVKITPRO/tools/bin/nacptool" --create "Original DrawOTag Raster Probe" "Vandal Hearts Switch Remaster" "0.1.0" build/upstream-cross/pinned-drawotag-switch.nacp
          "$DEVKITPRO/tools/bin/elf2nro" build/upstream-cross/pinned-drawotag-switch.elf build/upstream-cross/pinned-drawotag-switch.nro --nacp=build/upstream-cross/pinned-drawotag-switch.nacp
          python3 tests/check_nro.py build/upstream-cross/pinned-drawotag-switch.nro
      - name: Upload pinned GPU NRO
        uses: actions/upload-artifact@v4
        with:
          name: pinned-original-drawotag-switch-nro
          path: build/upstream-cross/pinned-drawotag-switch.nro
          if-no-files-found: error
      - name: Upload GPU cross-compile evidence
        uses: actions/upload-artifact@v4
        with:
          name: pinned-original-drawotag-switch-object-audit
          path: build/upstream-cross/
          if-no-files-found: error

  runtime:
    name: Run original DrawOTag raster NRO in NeXium
    runs-on: ubuntu-26.04
    needs: cross-compile
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pinned-original-drawotag-switch-nro
          path: nros
      - name: Install emulator runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Download NeXium nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(curl -fsSL --retry 3 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          asset_url="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name == "nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          test -n "$asset_url"
          curl -fL --retry 3 --retry-all-errors "$asset_url" -o /tmp/nexium-linux.tar.gz
          mkdir -p /tmp/nexium
          tar -xzf /tmp/nexium-linux.tar.gz -C /tmp/nexium
          emu_bin="$(find /tmp/nexium -type f -executable \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$emu_bin"
          echo "NEXIUM_BIN=$emu_bin" >> "$GITHUB_ENV"
      - name: Observe RGB24 frame on emulator display
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export NRO="nros/pinned-drawotag-switch.nro"
          export SHOT="runtime-evidence/observer.png"
          export SHOT_AFTER="runtime-evidence/observer-after.png"
          export LOG="runtime-evidence/observer-nexium.log"
          timeout --kill-after=5s 65s xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            set -euo pipefail
            "$NEXIUM_BIN" "$NRO" >"$LOG" 2>&1 &
            pid=$!
            # NeXium sometimes needs longer than a fixed 20s to display
            # the guest frame. Wait for our actual rendered red corner,
            # not merely an emulator window or a nonblack screenshot.
            ready=0
            sleep 10
            for attempt in $(seq 1 20); do
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "NeXium exited before observer frame was ready" >&2
                tail -n 80 "$LOG" >&2 || true
                exit 1
              fi
              window="$(xdotool search --onlyvisible --name "NeXium" 2>/dev/null | tail -n 1 || true)"
              if [ -n "$window" ]; then
                import -window "$window" "$SHOT"
                if python3 -c "import sys; from PIL import Image; p=Image.open(sys.argv[1]).convert(\"RGB\").getpixel((250,90)); sys.exit(0 if p[0]>=220 and p[1]<=35 and p[2]<=35 else 1)" "$SHOT"; then
                  echo "Observer RGB frame ready on poll $attempt"
                  ready=1
                  break
                fi
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "Observer frame never became ready" >&2
              tail -n 80 "$LOG" >&2 || true
              exit 1
            fi
            sleep 2
            import -window "$window" "$SHOT_AFTER"
            test -s "$SHOT_AFTER"
            kill -INT "$pid" 2>/dev/null || true
            sleep 1
            kill -KILL "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          '
          echo "NeXium runtime diagnostics (last 80 lines):"
          tail -n 80 "$LOG" || true
          python3 - "$SHOT" "$SHOT_AFTER" <<'PY'
          from PIL import Image
          import sys
          im = Image.open(sys.argv[1]).convert("RGB")
          print("NeXium screenshot:", im.size)
          if im.size != (1280, 720):
              raise SystemExit("Unexpected emulator screenshot size")
          after = Image.open(sys.argv[2]).convert("RGB")
          if after.size != im.size:
              raise SystemExit("Frame dimensions changed unexpectedly")
          sample = im.crop((320, 100, 960, 620))
          distinct = len(set(sample.resize((80, 65)).getdata()))
          print("Observer screenshot distinct sampled RGB colors:", distinct)
          if distinct < 5:
              raise SystemExit("Expected five original-raster tile colors missing")
          # Corner colors check bottom-up orientation and exact RGB channel order.
          # Source 12x9 fills a centered 926x720 viewport in 1280x720.
          markers = (
              ("top-left red", (255, 0, 0), (250, 90)),
              ("top-right green", (0, 255, 0), (1030, 90)),
              ("bottom-left blue", (0, 0, 255), (250, 630)),
              ("bottom-right yellow", (255, 255, 0), (1030, 630)),
          )
          for name, expected, (x, y) in markers:
              observed = im.getpixel((x, y))
              print(f"Observer marker {name}: expected {expected}, observed {observed}")
              if max(abs(a - b) for a, b in zip(observed, expected)) > 36:
                  raise SystemExit(f"RGB order or frame orientation mismatch: {name}")
          # This is a real original POLY_F4 -> FillQuad, not a VRAM preset.
          # 12x9 native coordinates (5,2) map to (600,200) in the centered viewport.
          for frame_image in (im, after):
              polygon_rgb = frame_image.getpixel((600, 200))
              print("Original F4 polygon marker RGB:", polygon_rgb)
              if max(abs(a-b) for a,b in zip(polygon_rgb, (255,0,255))) > 36:
                  raise SystemExit("Original FillQuad polygon color is incorrect")
          # Original LoadImage + indexed 4bpp SampleTexture + CLUT + FT4 FillQuad.
          # The test quad spans native x=4..8, y=5..7; sample central texels.
          indexed_samples = (
              ("4bpp red 0", (520, 440), (255, 0, 0)),
              ("4bpp green 1", (600, 440), (0, 255, 0)),
              ("4bpp red 2", (680, 440), (255, 0, 0)),
              ("4bpp green 3", (760, 440), (0, 255, 0)),
          )
          for frame_image in (im, after):
              for name, (x, y), expected in indexed_samples:
                  observed = frame_image.getpixel((x, y))
                  print(f"Original FT4 CLUT {name}: {observed}")
                  if max(abs(a-b) for a,b in zip(observed, expected)) > 36:
                      raise SystemExit(f"Original textured CLUT quad is incorrect: {name}")
          # Native 8bpp texture: packed indices 1,2 at x=128, separate CLUT y=41.
          # Quad x=8..10,y=3..5 is clear of the central animation sample.
          indexed8_samples = (
              ("8bpp blue", (835, 280), (0, 0, 255)),
              ("8bpp white", (910, 280), (255, 255, 255)),
          )
          for frame_image in (im, after):
              for name, (x, y), expected in indexed8_samples:
                  observed = frame_image.getpixel((x, y))
                  print(f"Original FT4 CLUT {name}: {observed}")
                  if max(abs(a-b) for a,b in zip(observed, expected)) > 36:
                      raise SystemExit(f"Original 8bpp indexed CLUT quad is incorrect: {name}")
          # 15bpp direct-colour: tpage 2 bypasses CLUT. Native quad x=2..4,y=4..6.
          direct15_samples = (
              ("15bpp yellow", (370, 440), (255, 255, 0)),
              ("15bpp magenta", (447, 440), (255, 0, 255)),
          )
          for frame_image in (im, after):
              for name, (x, y), expected in direct15_samples:
                  observed = frame_image.getpixel((x, y))
                  print(f"Original FT4 direct {name}: {observed}")
                  if max(abs(a-b) for a,b in zip(observed, expected)) > 36:
                      raise SystemExit(f"Original 15bpp direct texture is incorrect: {name}")
          # 0x0000 direct texel is transparent: it preserves the TILE's
          # changing blue channel; adjacent nonzero cyan texel must render.
          transparent_before = im.getpixel((370, 280))
          transparent_after = after.getpixel((370, 280))
          for pix in (transparent_before, transparent_after):
              if abs(pix[0] - 99) > 20 or abs(pix[1] - 99) > 20:
                  raise SystemExit(f"Zero texel failed to expose background: {pix}")
          if abs(transparent_after[2] - transparent_before[2]) <= 15:
              raise SystemExit("Zero texel does not expose changing background")
          for frame_image in (im, after):
              cyan = frame_image.getpixel((447, 280))
              print("Original transparent FT4 cyan neighbour:", cyan)
              if max(abs(a-b) for a,b in zip(cyan, (0,255,255))) > 36:
                  raise SystemExit("Opaque neighbour of transparent texel not drawn")
          # ABR=0 semi-transparency uses STP per texel. Red STP blends
          # with the animated background, while adjacent green (no STP)
          # is opaque even though the polygon has semi-trans enabled.
          for frame_image in (im, after):
              blended = frame_image.getpixel((835, 440))
              opaque = frame_image.getpixel((910, 440))
              print("Original FT4 STP red blend / opaque green:", blended, opaque)
              if abs(blended[0] - 173) > 32 or abs(blended[1] - 49) > 28:
                  raise SystemExit(f"Original STP ABR0 blend mismatch: {blended}")
              if max(abs(a-b) for a,b in zip(opaque, (0, 255, 0))) > 36:
                  raise SystemExit(f"Non-STP texel incorrectly blended: {opaque}")
          # SPRT's tpage comes from the preceding DR_MODE OT packet, not
          # from a per-sprite tpage field. Native x=0..2,y=3..5.
          for frame_image in (im, after):
              for name, (x, y), expected in (
                  ("SPRT red", (210, 280), (255, 0, 0)),
                  ("SPRT green", (290, 280), (0, 255, 0)),
              ):
                  observed = frame_image.getpixel((x, y))
                  print(f"Original SPRT via DR_MODE {name}: {observed}")
                  if max(abs(a-b) for a,b in zip(observed, expected)) > 36:
                      raise SystemExit(f"Original SPRT tpage/CLUT mismatch: {name}")
          # Original GP0(E2h) texture window: U=0/1 are redirected to
          # U=8/9 by DR_MODE maskX=1/offX=1, then reset for baseline SPRT.
          for frame_image in (im, after):
              for name, (x, y), expected in (
                  ("texture-window blue", (210, 440), (0, 0, 255)),
                  ("texture-window white", (290, 440), (255, 255, 255)),
              ):
                  observed = frame_image.getpixel((x, y))
                  print(f"Original GP0(E2h) {name}: {observed}")
                  if max(abs(a-b) for a,b in zip(observed, expected)) > 36:
                      raise SystemExit(f"Original GP0(E2h) texture window failed: {name}")
          # GP0(E2h) vertical mask: V0/1 maps to V8/9 (maskY=1,offY=1).
          # The 2x2 SPRT at native x2..4,y0..2 has a distinct CLUT
          # colour in each texel; subsequent DR_MODE clears both masks.
          for frame_image in (im, after):
              for name, (x, y), expected in (
                  ("V-window blue", (370, 40), (0, 0, 255)),
                  ("V-window white", (447, 40), (255, 255, 255)),
                  ("V-window magenta", (370, 120), (255, 0, 255)),
                  ("V-window yellow", (447, 120), (255, 255, 0)),
              ):
                  observed = frame_image.getpixel((x, y))
                  print(f"Original GP0(E2h) {name}: {observed}")
                  if max(abs(a-b) for a,b in zip(observed, expected)) > 36:
                      raise SystemExit(f"Original vertical GP0(E2h) window failed: {name}")
          # Original BGR555 STP ABR modes: addition, subtraction, +quarter.
          # Synthetic quads occupy native (2,7), (4,7), (6,7) and
          # reuse the same red STP / opaque green texel pair.
          abr_samples = (
              ("ABR1 additive red", (370, 630), (255, 99), 30),
              ("ABR2 subtractive red", (520, 630), (0, 99), 30),
              ("ABR3 quarter red", (680, 630), (156, 99), 30),
          )
          for frame_image in (im, after):
              for name, (x, y), (red, green), tolerance in abr_samples:
                  observed = frame_image.getpixel((x, y))
                  print(f"Original FT4 STP {name}: {observed}")
                  if abs(observed[0] - red) > tolerance or abs(observed[1] - green) > tolerance:
                      raise SystemExit(f"Original BGR555 STP blend mismatch: {name} = {observed}")
              for name, (x, y) in (
                  ("ABR1 opaque green", (447, 630)),
                  ("ABR2 opaque green", (600, 630)),
                  ("ABR3 opaque green", (760, 630)),
              ):
                  observed = frame_image.getpixel((x, y))
                  print(f"Original FT4 STP {name}: {observed}")
                  if max(abs(a-b) for a,b in zip(observed, (0,255,0))) > 36:
                      raise SystemExit(f"Non-STP texel incorrectly blended in {name}: {observed}")
          # PS1 TIM wire-format image: original OpenTIM/ReadTIM parses
          # CLUT and pixel sections, original LoadImage uploads both,
          # then original SPRT/DR_MODE samples a separate tpage x=384.
          for frame_image in (im, after):
              for name, (x, y), expected in (
                  ("TIM CLUT red", (835, 120), (255, 0, 0)),
                  ("TIM CLUT green", (910, 120), (0, 255, 0)),
              ):
                  observed = frame_image.getpixel((x, y))
                  print(f"Original serialized TIM SPRT {name}: {observed}")
                  if max(abs(a-b) for a,b in zip(observed, expected)) > 36:
                      raise SystemExit(f"Serialized TIM to VRAM/raster mismatch: {name}")
          # Vandal Hearts map DATs are raw 4bpp F_TEX + 1797-byte LAND_DT
          # records (not TIM). This synthetic bridge mimics the original
          # LoadMapTextures VRAM upload: F_TEX at x320,y0; the palette
          # from LAND_DT at x672,y496; CLUT slot 32; UV16/17,V16.
          for frame_image in (im, after):
              for name, (x, y), expected in (
                  ("F_TEX/LAND_DT red", (835, 630), (255, 0, 0)),
                  ("F_TEX/LAND_DT green", (910, 630), (0, 255, 0)),
              ):
                  observed = frame_image.getpixel((x, y))
                  print(f"Original map texture bank SPRT {name}: {observed}")
                  if max(abs(a-b) for a,b in zip(observed, expected)) > 36:
                      raise SystemExit(f"Original F_TEX/LAND_DT VRAM mapping mismatch: {name}")
          # The center pixel is deliberately dynamic: R=12->99, G=12->99,
          # B=frame*3 modulo 256. Verify the intended channel changes,
          # not merely a window animation elsewhere in the screenshot.
          first_center = im.getpixel((640, 360))
          second_center = after.getpixel((640, 360))
          print("Observer RGB center first/after:", first_center, second_center)
          for observed in (first_center, second_center):
              if abs(observed[0] - 99) > 20 or abs(observed[1] - 99) > 20:
                  raise SystemExit("Center RGB gradient channels are incorrect")
          if abs(second_center[2] - first_center[2]) <= 15:
              raise SystemExit("Expected moving blue channel did not update")
          # The four corner markers must stay fixed across time.
          for name, expected, (x, y) in markers:
              observed = after.getpixel((x, y))
              if max(abs(a - b) for a, b in zip(observed, expected)) > 36:
                  raise SystemExit(f"Corner marker changed after frame update: {name}")
          previous = im.crop((320, 100, 960, 620)).resize((160, 130))
          following = after.crop((320, 100, 960, 620)).resize((160, 130))
          changed = sum(max(abs(a[k] - b[k]) for k in range(3)) > 15
                        for a, b in zip(previous.getdata(), following.getdata()))
          print("Observer changed sample pixels across frames:", changed)
          if changed < 300:
              raise SystemExit("Observer image appears static between captures")
          PY
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-drawotag-nexium-evidence
          path: runtime-evidence/
          if-no-files-found: ignore
