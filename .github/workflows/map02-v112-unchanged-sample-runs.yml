name: MAP02 v112 consecutive Unai writes despite unchanged sampled VRAM
on:
  pull_request:
    paths:
      - '.github/workflows/map02-v112-unchanged-sample-runs.yml'
      - '.github/workflows/map02-v104-content-guard.yml'
      - 'tools/summarize_map02_v112_unchanged_sample_runs.py'
      - 'tests/test_map02_v112_unchanged_sample_runs.py'
      - 'tools/summarize_map02_v111_sample_store_divergence.py'
      - 'tools/summarize_map02_v110_class_boundary_checkpoints.py'
      - 'tools/summarize_map02_v109_gp0_class_vblank_stores.py'
      - 'tools/summarize_map02_v108_vblank_store_buckets.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-native-unchanged-sample-runs:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Audit native Unai store runs and strict VBlank edge conservation
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          for pattern in test_map02_v83_unai_dispatch.py test_map02_v84_unai_samples.py test_map02_v85_native_stores.py test_map02_v108_vblank_store_buckets.py test_map02_v109_gp0_class_vblank_stores.py test_map02_v110_class_boundary_checkpoints.py test_map02_v111_sample_store_divergence.py test_map02_v112_unchanged_sample_runs.py; do
            python3 -m unittest discover -s tests -p "$pattern" -v
          done
