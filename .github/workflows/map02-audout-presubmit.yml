name: MAP02 opt-in audout pre-submit page witness

on:
  pull_request:
    paths:
      - '.github/workflows/map02-audout-presubmit.yml'
      - 'source/vh_audout_presubmit_witness.*'
      - 'source/vh_audout_presubmit_optical.*'
      - 'tools/decode_map02_audout_presubmit.py'
      - 'tests/test_decode_map02_audout_presubmit.py'
      - 'tests/test_presubmit_optical_pixels.py'
      - 'tests/test_audit_presubmit_virtual_sink.py'
      - 'tools/audit_presubmit_virtual_sink.py'
      - 'source/vh_switch_game_audio.c'
      - 'source/vh_switch_game_audio.h'
      - 'source/main.c'
      - 'tests/test_vh_audout_presubmit_witness.c'
      - 'Makefile.map02-audio'
  workflow_dispatch:

permissions:
  contents: read

env:
  VH_EXACT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  host-witness:
    name: Fail-closed dual PCM digest and retry checks (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VH_EXACT_SOURCE_SHA }}
      - name: Reject unintended temporary PR merge commit
        run: test "$(git rev-parse HEAD)" = "$VH_EXACT_SOURCE_SHA"
      - name: Reject forged and damaged guest optical packets
        run: python3 -m unittest discover -s tests -p 'test_decode_map02_audout_presubmit.py' -v
      - name: Run generated-only host witness with sanitizers
        shell: bash
        run: |
          set -euo pipefail
          "${{ matrix.compiler }}" -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer -Isource \
            tests/test_vh_audout_presubmit_witness.c \
            source/vh_audout_presubmit_witness.c \
            source/vh_audout_presubmit_optical.c \
            -o /tmp/vh-audout-presubmit-test
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            /tmp/vh-audout-presubmit-test

  research-nro:
    name: Build separately opt-in libnx audout pre-submit witness NRO
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VH_EXACT_SOURCE_SHA }}
      - name: Verify exact source commit inside devkitPro
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$VH_EXACT_SOURCE_SHA"
      - name: Build gated native research-only NRO
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          make -f Makefile -f Makefile.map02-audio \
            MAP02_AUDIO_BUILD=build/map02-presubmit \
            MAP02_AUDIO_PRESUBMIT_WITNESS=1 map02-audio-nro
          test -s build/map02-presubmit/vandal-hearts-map02-audio.nro
          sha256sum build/map02-presubmit/vandal-hearts-map02-audio.nro \
            > build/map02-presubmit/nro.sha256
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('build/map02-presubmit')
          binary=(root/'vandal-hearts-map02-audio.nro').read_bytes()
          assert binary[16:20]==b'NRO0'
          receipt={'schema':'vh-map02-presubmit-guest-nro/v1',
                   'source_sha':os.environ['VH_EXACT_SOURCE_SHA'],
                   'event_sha':os.environ['GITHUB_SHA'],
                   'run_id':int(os.environ['GITHUB_RUN_ID']),
                   'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
                   'nro_sha256':hashlib.sha256(binary).hexdigest()}
          (root/'manifest.json').write_text(
              json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: map02-audout-presubmit-research-nro
          path: |
            build/map02-presubmit/vandal-hearts-map02-audio.nro
            build/map02-presubmit/nro.sha256
            build/map02-presubmit/manifest.json
          if-no-files-found: error

  nexiom-presubmit:
    name: Guest virtual sink PCM (${{ matrix.latency_ms }} ms, repeat ${{ matrix.repeat }})
    needs: [host-witness, research-nro]
    runs-on: ubuntu-26.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        # The NRO, PulseAudio sink and recording remain identical.
        # Only the guest host-audio client receives this OPTIONAL hint;
        # the separate parec monitor recorder uses default settings.
        # The parent A/B already repeated default and 20 twice each.
        # This child tests the next longer requested host latency points
        # without changing the guest NRO, null sink or capture pipeline.
        latency_ms: [40, 80]
        repeat: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VH_EXACT_SOURCE_SHA }}
      - name: Verify precise commit
        run: test "$(git rev-parse HEAD)" = "$VH_EXACT_SOURCE_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: map02-audout-presubmit-research-nro
          path: nros
      - name: Verify same-run opt-in executable identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('nros')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['schema']=='vh-map02-presubmit-guest-nro/v1'
          assert manifest['source_sha']==os.environ['VH_EXACT_SOURCE_SHA']
          assert manifest['event_sha']==os.environ['GITHUB_SHA']
          assert manifest['run_id']==int(os.environ['GITHUB_RUN_ID'])
          assert manifest['attempt']==int(os.environ['GITHUB_RUN_ATTEMPT'])
          binary=(root/'vandal-hearts-map02-audio.nro').read_bytes()
          assert binary[16:20]==b'NRO0'
          digest=hashlib.sha256(binary).hexdigest()
          assert manifest['nro_sha256']==digest
          assert (root/'nro.sha256').read_text().split()[0]==digest
          PY
      - name: Prepare headless graphics, Python imaging and Vulkan
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers pulseaudio pulseaudio-utils libasound2-plugins
      - name: Validate generated optical pixels and calibrated PNG decoding
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_presubmit_optical_pixels.py' -v
      - name: Reject false-positive monitor alignment fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_audit_presubmit_virtual_sink.py' -v
      - name: Download pinned NeXium nightly asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          url="$(printf '%s' "$release" | jq -r \
            '.assets[] | select(.name == "nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          test -n "$url"
          curl -fL --retry 3 --retry-all-errors "$url" \
            -o /tmp/nexium-presubmit.tar.gz
          mkdir -p /tmp/nexium-presubmit
          tar -xzf /tmp/nexium-presubmit.tar.gz -C /tmp/nexium-presubmit
          emulator="$(find /tmp/nexium-presubmit -type f -executable \
            \( -name nexium-gui -o -name nexium \) -print -quit)"
          test -n "$emulator"
          echo "NEXIUM_BIN=$emulator" >> "$GITHUB_ENV"
      - name: Run opt-in NRO and capture its guest framebuffer proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          cp nros/manifest.json runtime-evidence/
          export VH_PULSE_CLIENT_LATENCY_TRIAL="${{ matrix.latency_ms }}"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          manifest=json.loads(Path('runtime-evidence/manifest.json').read_text())
          trial={'schema':'vh-map02-pulse-client-latency-trial/v1',
                 'variant':os.environ['VH_PULSE_CLIENT_LATENCY_TRIAL'],
                 'independent_repeat':int('${{ matrix.repeat }}'),
                 'latency_hint_only_not_verified_effect':True,
                 'monitor_recorder_uses_default_latency':True,
                 'source_sha':manifest['source_sha'],
                 'nro_sha256':manifest['nro_sha256'],
                 'run_id':int(os.environ['GITHUB_RUN_ID']),
                 'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
                 '48k_sink_and_guest_audio_c_code_unchanged':True}
          Path('runtime-evidence/pulse-client-trial.json').write_text(
              json.dumps(trial,indent=2,sort_keys=True)+'\n')
          PY
          # NeXium must see a functioning 48-kHz device. Mirror the
          # already-green STUDIO_C virtual audout environment; otherwise
          # audio initialization can fail before the eight-page witness.
          rt="$RUNNER_TEMP/vh-map02-presubmit-pulse"
          mkdir -p "$rt"
          chmod 700 "$rt"
          export XDG_RUNTIME_DIR="$rt"
          pulseaudio --daemonize=yes --exit-idle-time=-1 \
            --log-target=file:runtime-evidence/pulseaudio.log
          export PULSE_SERVER="unix:$rt/pulse/native"
          pactl load-module module-null-sink sink_name=vh_map02_presubmit \
            rate=48000 channels=2 >runtime-evidence/pulse-module-id.txt
          pactl set-default-sink vh_map02_presubmit
          pactl list short sources > runtime-evidence/pulse-sources.txt
          pactl list sinks > runtime-evidence/pulse-sinks-before.txt
          pactl info > runtime-evidence/pulse-server-info.txt
          grep -F 'vh_map02_presubmit.monitor' runtime-evidence/pulse-sources.txt
          cat >"$RUNNER_TEMP/map02-presubmit-asound.conf" <<'ASOUND'
          pcm.!default { type pulse }
          ctl.!default { type pulse }
          ASOUND
          export ALSA_CONFIG_PATH="$RUNNER_TEMP/map02-presubmit-asound.conf"
          export SDL_AUDIODRIVER=pulse
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export ROOT="$PWD/runtime-evidence"
          export NRO="$PWD/nros/vandal-hearts-map02-audio.nro"
          # Record the very same 48-kHz virtual output used by this
          # guest, including unknown warm-up delay. The guest optical
          # receipt remains the independent source of PCM digests.
          parec --device=vh_map02_presubmit.monitor --format=s16le \
            --rate=48000 --channels=2 \
            >"$ROOT/presubmit-virtual-sink-s16le-48k.pcm" \
            2>"$ROOT/parec.log" &
          capture_pid=$!
          trap 'kill -TERM "$capture_pid" 2>/dev/null || true' EXIT
          sleep 1
          kill -0 "$capture_pid"
          timeout --kill-after=5s 45s xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            set -euo pipefail
            # Set the optional hint only on NeXium, *after* launching
            # the baseline parec recorder. It may be ignored by the
            # backend: a changed gap is not automatic causal proof.
            if [ "$VH_PULSE_CLIENT_LATENCY_TRIAL" != default ]; then
              export PULSE_LATENCY_MSEC="$VH_PULSE_CLIENT_LATENCY_TRIAL"
            else
              unset PULSE_LATENCY_MSEC || true
            fi
            "$NEXIUM_BIN" "$NRO" >"$ROOT/nexium-presubmit.log" 2>&1 &
            guest=$!
            trap "kill -KILL $guest 2>/dev/null || true" EXIT
            window=""
            for n in $(seq 1 30); do
              sleep 1
              window="$(xdotool search --onlyvisible --name NeXium 2>/dev/null | tail -n1 || true)"
              [ -z "$window" ] || break
              kill -0 "$guest" 2>/dev/null || exit 1
            done
            test -n "$window"
            sleep 4
            # Capture real PulseAudio sink-input request attributes,
            # not only an intended environment knob.
            (pactl list sink-inputs > "$ROOT/pulse-sink-inputs-during.txt") || true
            (pactl list short sink-inputs > "$ROOT/pulse-sink-inputs-short.txt") || true
            # If no optical receipt is generated, these screenshots keep
            # the actual UI stage visible rather than reporting only CRC.
            import -window "$window" "$ROOT/presubmit-guest-before-input.png" || true
            timeout 3 xdotool windowfocus --sync "$window" || true
            timeout 3 xdotool keydown --window "$window" c
            sleep 0.15
            timeout 3 xdotool keyup --window "$window" c
            sleep 3
            timeout 3 xdotool keydown --window "$window" x
            sleep 0.15
            timeout 3 xdotool keyup --window "$window" x
            sleep 3
            timeout 3 xdotool keydown --window "$window" m
            sleep 0.15
            timeout 3 xdotool keyup --window "$window" m
            sleep 3
            import -window "$window" "$ROOT/presubmit-guest.png"
            test -s "$ROOT/presubmit-guest.png"
            sleep 5
            import -window "$window" "$ROOT/presubmit-guest-late.png" || true
            # Recheck sink input; a 20ms hint may change the ALSA client
            # buffers or cause it to stop feeding the sink altogether.
            (pactl list sink-inputs > "$ROOT/pulse-sink-inputs-after-input.txt") || true
            # Do not block forever on a GUI that ignores SIGINT:
            # retain the captured PNG as evidence and reap boundedly.
            kill -INT "$guest" 2>/dev/null || true
            sleep 1
            kill -KILL "$guest" 2>/dev/null || true
            wait "$guest" 2>/dev/null || true
          '
          kill -TERM "$capture_pid" 2>/dev/null || true
          sleep 1
          kill -KILL "$capture_pid" 2>/dev/null || true
          wait "$capture_pid" 2>/dev/null || true
          trap - EXIT
          test -s "$ROOT/presubmit-virtual-sink-s16le-48k.pcm"
          pactl list sinks > "$ROOT/pulse-sinks-after.txt" || true
      - name: Report raw monitor signal independently of guest optical state
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from array import array
          import hashlib,json,math,sys
          from pathlib import Path
          root=Path("runtime-evidence")
          pcm=root/"presubmit-virtual-sink-s16le-48k.pcm"
          result={"schema":"vh-map02-latency-monitor-health/v1",
                  "variant":"${{ matrix.latency_ms }}",
                  "repeat":int("${{ matrix.repeat }}"),
                  "virtual_sink_hardware_proof":False}
          if pcm.is_file():
              raw=pcm.read_bytes()
              result["raw_pcm_sha256"]=hashlib.sha256(raw).hexdigest()
              result["raw_bytes"]=len(raw)
              result["valid_pcm16le_stereo"]=len(raw)>0 and len(raw)%4==0
              if result["valid_pcm16le_stereo"]:
                  samples=array("h");samples.frombytes(raw)
                  if sys.byteorder!="little":samples.byteswap()
                  result["stereo_frames"]=len(samples)//2
                  result["seconds"]=round((len(samples)//2)/48000,6)
                  result["nonzero_pcm16_samples"]=sum(x!=0 for x in samples)
                  result["rms"]=round(math.sqrt(
                      sum(float(x)*x for x in samples)/len(samples)),6)
                  result["all_zero_monitor_pcm"]=result["nonzero_pcm16_samples"]==0
          else:
              result["capture_missing"]=True
          (root/"presubmit-monitor-health.json").write_text(
              json.dumps(result,sort_keys=True,indent=2)+"\n")
          print(json.dumps(result,sort_keys=True,indent=2))
          PY
      - name: Decode actual guest CRC and assert eight descriptor identities
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/decode_map02_audout_presubmit.py \
            --image runtime-evidence/presubmit-guest.png \
            --output runtime-evidence/presubmit-guest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('runtime-evidence/presubmit-guest.json').read_text())
          assert report['result']=='GUEST_PRESUBMIT_PCM_PAGES_MATCHED'
          assert report['observed_pages']==8
          assert report['mismatches']==0
          assert all(p['descriptor_released_returns']==1 for p in report['pages'])
          assert not report['live_dac_samples_proven']
          assert not report['physical_switch_speaker_audio_verified']
          PY
      - name: Classify guest PCM fingerprint presence in the 48k monitor
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_presubmit_virtual_sink.py \
            --guest runtime-evidence/presubmit-guest.json \
            --monitor runtime-evidence/presubmit-virtual-sink-s16le-48k.pcm \
            --max-seconds 30 \
            --output runtime-evidence/presubmit-sink-parity.json
          result="$(python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('runtime-evidence/presubmit-sink-parity.json').read_text())
          print(result['result'])
          PY
          )"
          echo "PulseAudio client latency hint: ${{ matrix.latency_ms }} ms (effect not assumed)" >> "$GITHUB_STEP_SUMMARY"
          echo "Virtual sink PCM page classifier: $result" >> "$GITHUB_STEP_SUMMARY"
          # An inconclusive byte-match is not 'no sound' or a test pass.
          # Preserve real capture for follow-up gain/timing analysis.
          if [ "$result" = NO_EXACT_EIGHT_PAGE_SINK_MATCH ]; then
            echo "Exact virtual sink attribution NOT YET proven" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive actual guest evidence even if decode fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map02-presubmit-nexium-guest-proof-${{ matrix.latency_ms }}-r${{ matrix.repeat }}
          path: runtime-evidence/
          if-no-files-found: warn
