name: MAP02 complete 26-PR read-only integration audit

on:
  pull_request:
    paths:
      - '.github/workflows/map02-full-stack-integration.yml'
      - 'data/map02_full_stack_snapshot.json'
      - 'tools/audit_map02_full_stack.py'
      - 'tools/audit_map02_pr_metadata.py'
      - 'tests/test_map02_full_stack_audit.py'
      - 'tests/test_map02_live_pr_metadata.py'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  full-stack-audit:
    name: Verify 26 PR heads, one reviewed divergence and original data
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Reject malformed or forged 26-PR ancestry snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/audit_map02_full_stack.py tools/audit_map02_pr_metadata.py tests/test_map02_full_stack_audit.py tests/test_map02_live_pr_metadata.py
          python3 -m unittest discover -s tests -p 'test_map02_full_stack_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_live_pr_metadata.py' -v
      - name: Compare all 26 immutable PR refs and live GitHub Draft metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/map02-full-stack-audit
          python3 tools/audit_map02_full_stack.py \
            --repo . \
            --manifest data/map02_full_stack_snapshot.json \
            --verify-live-prs \
            --report build/map02-full-stack-audit/report.json \
            | tee build/map02-full-stack-audit/result.log
          grep -Fx 'VH_MAP02_FULL_STACK_AUDIT_PASS prs=26 pinned=25 linear_edges=24 reviewed_divergent=1 retail_assets=0 main_merge=0' build/map02-full-stack-audit/result.log
          grep -Fx 'VH_MAP02_FULL_STACK_LIVE_PRS_PASS count=26 draft=26 bases=26 head_shas=26' build/map02-full-stack-audit/result.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("build/map02-full-stack-audit/report.json").read_text())
          assert x["integration_merge_performed"] is False
          assert x["pr_count"] == 26 and x["pinned_upstream_prs"] == 25
          assert x["checked_edges"] == 25
          assert sum(e["result"] == "reviewed_core_divergence" for e in x["edges"]) == 1
          assert sum(e["result"] == "linear" for e in x["edges"]) == 24
          assert x["core_audit"]["integration_merge_performed"] is False
          assert len(x["core_audit"]["preserved_files"]) == 4
          reconciliation = x["divergent_tree_reconciliation"]
          assert reconciliation["edge"] == [262, 265]
          assert reconciliation["tree_identical"] is True
          assert reconciliation["history_rewritten"] is False
          assert reconciliation["simulated_merge_tree"] == reconciliation["unchanged_downstream_tree"]
          assert not x["forbidden_added_assets"]
          live = x["live_pr_metadata"]
          assert live["verified"] and live["pr_count"] == 26
          assert live["open_draft_unmerged"] == 26
          assert live["head_and_base_sha_pinned"] == 26
          PY
      - name: Save the read-only integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map02-full-stack-no-merge-audit
          path: build/map02-full-stack-audit/
          if-no-files-found: warn
