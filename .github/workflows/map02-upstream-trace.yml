  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-trace-patch:
    name: Apply generated trace patch to pinned upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout remaster diagnostics
        uses: actions/checkout@v4
        with:
          path: remaster
          persist-credentials: false

      - name: Checkout pinned public PC-port source
        uses: actions/checkout@v4
        with:
          repository: HalmyLyseas/VandalHearts-PcPort
          ref: 14552fffa0e0b47e02b57592e274fc6e7a649923
          path: upstream
          persist-credentials: false
          sparse-checkout: |
            src/states/game_setup.c
            src/core/graphics.c
            src/core/cd.c
            src/maps/unpack.c
            include/
            platform/pc/include/
            platform/pc/Makefile
            platform/pc/tools/gen_kanji_font.py
            platform/pc/tools/build_data_segment.py
            platform/pc/src/libcd.c
            platform/pc/src/libgte.c
            platform/pc/src/pc_raster.c
            platform/pc/src/libgpu.c
            platform/pc/src/pc_gpu_internal.h
          sparse-checkout-cone-mode: false

      - name: Audit local preflight against public pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          python3 -m remaster.tools.preflight_map02_pcport upstream \
            --no-webp --no-hdvideo > /tmp/map02-preflight-public.json || rc=$?
          test "$rc" -eq 2
          python3 - <<'PY'
          import json
          from pathlib import Path
          from remaster.tools.preflight_map02_pcport import KROM_US_SHA256, UPSTREAM_COMMIT
          result = json.loads(Path("/tmp/map02-preflight-public.json").read_text())
          assert result["checks"]["source_files_missing"] == [], result
          assert result["checks"]["upstream_revision"] == UPSTREAM_COMMIT, result
          assert {"retail_executable_missing", "krom_source_missing",
                  "disc_image_not_specified"}.issubset(result["blockers"]), result
          generator = Path("upstream/platform/pc/tools/gen_kanji_font.py").read_text()
          assert KROM_US_SHA256 in generator, "KROM digest must match pinned font generator"
          disc_backend = Path("upstream/platform/pc/src/libcd.c").read_text()
          for literal in ("SLUS_BOOT_LBA 23", "SLPM_BOOT_LBA 15200",
                          "BASLUS-00447VH", "BISCPS-45183VH", "BISLPM-86007VH",
                          "SECTOR_DATA_OFFSET"):
              assert literal in disc_backend, f"preflight disc probe drift: {literal}"
          print("Pinned source, font hash and disc boot identifiers match the local preflight.")
          PY

      - name: Run patch generator regression tests
        working-directory: remaster
        run: python3 -m unittest discover -s tests -p 'test_make_map02_trace_patch.py' -v

      - name: Run compiled JSONL integration test
        working-directory: remaster
        run: python3 -m unittest discover -s tests -p 'test_map02_trace_c_emitter.py' -v

      - name: Generate apply check and reverse diagnostic-only patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m remaster.tools.make_map02_trace_patch upstream --output map02-trace.patch
          cd upstream
          git apply --check ../map02-trace.patch
          git apply ../map02-trace.patch
          git diff --check
          # Compile both modified source units using upstream's game compile profile.
          (
            cd platform/pc
            mkdir -p build/include_stage
            for header in ../../include/*.h ../../include/*.inc; do
              ln -sf "$(realpath "$header")" "build/include_stage/$(basename "$header")"
            done
            for item in PsyQ types.h inline_gte.h; do
              ln -sf "$(realpath "include/$item")" "build/include_stage/$item"
            done
            common_flags=(
              -m64 -std=gnu89 -fno-builtin-csqrt
              -DPERMUTER -DPC_PORT -DPC_FEAT -DVH_REGION_US
              '-Dasm(x)=' -Ibuild/include_stage -Iinclude -I../..
              -include pc_forward_decls.h
              -Wno-incompatible-pointer-types -Wno-builtin-declaration-mismatch
              -Wno-discarded-qualifiers -Wno-pointer-to-int-cast
              -Wno-int-to-pointer-cast -Wno-int-conversion
            )
            mkdir -p build/map02-trace-objects
            # Compile actual relocatable object files, not just a syntax-only pass.
            for unit in game_setup graphics; do
              source="../../src/core/$unit.c"
              if [[ "$unit" == game_setup ]]; then source="../../src/states/$unit.c"; fi
              gcc "${common_flags[@]}" -DVH_TRACE_MAP02 -c "$source" \
                -o "build/map02-trace-objects/${unit}.trace.o"
              gcc "${common_flags[@]}" -c "$source" \
                -o "build/map02-trace-objects/${unit}.baseline.o"
            done
            # Confirm the renderer hook exists only when explicitly enabled.
            nm -a build/map02-trace-objects/graphics.trace.o | grep VH_Map02TraceDraw
            if nm -a build/map02-trace-objects/graphics.baseline.o | grep -q VH_Map02TraceDraw; then
              echo "Unexpected trace hook in baseline graphics object" >&2
              exit 1
            fi
          )
          expected=$(printf 'src/core/graphics.c\nsrc/states/game_setup.c')
          actual=$(git diff --name-only)
          test "$actual" = "$expected"
          test "$(grep -c VH_Map02TraceDraw src/core/graphics.c)" -eq 4
          git apply --reverse --check ../map02-trace.patch
          git apply --reverse ../map02-trace.patch
          test -z "$(git status --porcelain -- src/core/graphics.c src/states/game_setup.c)"

      - name: Compile source-pinned opt-in MAP02 camera instrumentation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=remaster python3 -m tools.instrument_map02_camera upstream \
            --output-dir /tmp/vh-map02-camera-source > /tmp/vh-map02-camera-source-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/vh-map02-camera-source-report.json").read_text())
          assert report["generated"] == ["graphics.camera.c", "libgte.camera.c"]
          assert len(report["camera_fields"]) == 16
          assert report["target_faces"] == [[8,19,0],[11,11,0]]
          assert report["gameplay_camera_captured"] is False
          print("Generated read-only pinned camera instrumentation; no game data captured.")
          PY
          (
            cd upstream/platform/pc
            common_flags=(
              -m64 -std=gnu89 -fno-builtin-csqrt
              -DPERMUTER -DPC_PORT -DPC_FEAT -DVH_REGION_US
              '-Dasm(x)=' -Ibuild/include_stage -Iinclude -I../..
              -include pc_forward_decls.h
              -Wno-incompatible-pointer-types -Wno-builtin-declaration-mismatch
              -Wno-discarded-qualifiers -Wno-pointer-to-int-cast
              -Wno-int-to-pointer-cast -Wno-int-conversion
            )
            mkdir -p build/map02-camera-objects
            for unit in graphics libgte; do
              gcc "${common_flags[@]}" -DVH_TRACE_MAP02_CAMERA \
                -c "/tmp/vh-map02-camera-source/${unit}.camera.c" \
                -o "build/map02-camera-objects/${unit}.trace.o"
              gcc "${common_flags[@]}" \
                -c "/tmp/vh-map02-camera-source/${unit}.camera.c" \
                -o "build/map02-camera-objects/${unit}.baseline.o"
            done
            nm -a build/map02-camera-objects/libgte.trace.o | grep ' T VH_Map02CameraRegisters'
            nm -a build/map02-camera-objects/graphics.trace.o | grep ' U VH_Map02CameraRegisters'
            if nm -a build/map02-camera-objects/libgte.baseline.o | grep -q VH_Map02CameraRegisters; then
              echo "GTE accessor leaked into non-opt-in build" >&2
              exit 1
            fi
            if nm -a build/map02-camera-objects/graphics.baseline.o | grep -q VH_Map02CameraEvent; then
              echo "Camera trace leaked into non-opt-in build" >&2
              exit 1
            fi
          )
          test -z "$(cd upstream && git status --porcelain -- src/core/graphics.c platform/pc/src/libgte.c)"

      - name: Compile opt-in original PC GPU event probe, baseline and mutation tests
        shell: bash
        run: |
          set -euo pipefail
          (
            cd remaster
            python3 -m unittest discover -s tests -p 'test_instrument_map02_gpu_native_events.py' -v
            python3 -m unittest discover -s tests -p 'test_verify_map02_native_gpu_capture.py' -v
            python3 -m unittest discover -s tests -p 'test_verify_map02_source_native_ft4_join.py' -v
            python3 -m unittest discover -s tests -p 'test_verify_map02_source_native_ot_order.py' -v
            python3 -m unittest discover -s tests -p 'test_verify_map02_native_overdraw.py' -v
          )
          PYTHONPATH=remaster python3 -m tools.instrument_map02_gpu_native_events \
            upstream/platform/pc/src/libgpu.c \
            --output /tmp/vh-map02-gpu-native/libgpu.capture.c \
            > /tmp/vh-map02-gpu-native.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("/tmp/vh-map02-gpu-native.json").read_text())
          assert report["source_pinned"]
          assert report["max_snapshot_records"] == 64
          assert report["transfer_hooks"] == ["LoadImage", "MoveImage", "ClearImage"]
          assert report["original_gameplay_captured"] is False
          print("Opt-in PC GPU probe generated, no original game data captured.")
          PY
          (
            cd upstream/platform/pc
            common_flags=(
              -m64 -std=gnu89 -fno-builtin-csqrt
              -DPERMUTER -DPC_PORT -DPC_FEAT -DVH_REGION_US
              '-Dasm(x)=' -Ibuild/include_stage -Iinclude -I../..
              -include pc_forward_decls.h
              -Wno-incompatible-pointer-types -Wno-builtin-declaration-mismatch
              -Wno-discarded-qualifiers -Wno-pointer-to-int-cast
              -Wno-int-to-pointer-cast -Wno-int-conversion
            )
            common_flags+=(-Isrc)
            mkdir -p build/map02-gpu-native-probe
            gcc "${common_flags[@]}" -DVH_MAP02_GPU_CAPTURE \
              -c /tmp/vh-map02-gpu-native/libgpu.capture.c \
              -o build/map02-gpu-native-probe/capture.o
            gcc "${common_flags[@]}" \
              -c /tmp/vh-map02-gpu-native/libgpu.capture.c \
              -o build/map02-gpu-native-probe/baseline.o
            nm -a build/map02-gpu-native-probe/capture.o | grep VH_CaptureEvent
            if nm -a build/map02-gpu-native-probe/baseline.o | grep -q VH_CaptureEvent; then
              echo "Unexpected native GPU recorder symbol in baseline libgpu" >&2
              exit 1
            fi
          )
          test -z "$(cd upstream && git status --porcelain -- platform/pc/src/libgpu.c)"

      - name: Compile source-pinned optional native PutPixel sample observer
        shell: bash
        run: |
          set -euo pipefail
          (
            cd remaster
            python3 -m unittest discover -s tests -p 'test_instrument_map02_native_putpixel.py' -v
            python3 -m unittest discover -s tests -p 'test_verify_map02_native_putpixel.py' -v
            python3 -m unittest discover -s tests -p 'test_map02_pc_writepixel_reference.py' -v
          )
          mkdir -p /tmp/vh-map02-native-pixel
          PYTHONPATH=remaster python3 -m tools.instrument_map02_native_putpixel \
            upstream/platform/pc/src/pc_raster.c \
            --output /tmp/vh-map02-native-pixel/pc_raster.capture.c \
            > /tmp/vh-map02-native-pixel/result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/vh-map02-native-pixel/result.json").read_text())
          assert result["source_pinned"] and result["native_vram_only"]
          assert result["max_pixel_records"] == 64
          assert not result["actual_gameplay_captured"]
          print("Native PutPixel opt-in observer produced from pinned public PC raster source.")
          PY
          (
            cd upstream/platform/pc
            common_flags=(
              -m64 -std=gnu89 -fno-builtin-csqrt
              -DPERMUTER -DPC_PORT -DPC_FEAT -DVH_REGION_US
              '-Dasm(x)=' -Ibuild/include_stage -Iinclude -I../.. -Isrc
              -include pc_forward_decls.h
              -Wno-incompatible-pointer-types -Wno-builtin-declaration-mismatch
              -Wno-discarded-qualifiers -Wno-pointer-to-int-cast
              -Wno-int-to-pointer-cast -Wno-int-conversion
            )
            mkdir -p build/map02-native-putpixel
            gcc "${common_flags[@]}" -DVH_MAP02_PUTPIXEL_SAMPLE \
              -c /tmp/vh-map02-native-pixel/pc_raster.capture.c \
              -o build/map02-native-putpixel/capture.o
            gcc "${common_flags[@]}" \
              -c /tmp/vh-map02-native-pixel/pc_raster.capture.c \
              -o build/map02-native-putpixel/baseline.o
            nm -a build/map02-native-putpixel/capture.o | grep VH_PixelSampleRecord
            if nm -a build/map02-native-putpixel/baseline.o | grep -q VH_PixelSampleRecord; then
              echo "Native pixel observer leaked into ordinary raster object" >&2
              exit 1
            fi
          )
          test -z "$(cd upstream && git status --porcelain -- platform/pc/src/pc_raster.c)"

      - name: Cross-compile synchronized native DrawOTag and PutPixel scopes
        shell: bash
        run: |
          set -euo pipefail
          (
            cd remaster
            python3 -m unittest discover -s tests -p 'test_instrument_map02_putpixel_scope.py' -v
            python3 -m unittest discover -s tests -p 'test_verify_map02_putpixel_scope.py' -v
            python3 -m unittest discover -s tests -p 'test_audit_map02_putpixel_samples.py' -v
            python3 -m unittest discover -s tests -p 'test_verify_map02_putpixel_multi_scope.py' -v
            python3 -m unittest discover -s tests -p 'test_publish_map02_multi_capture_manifest.py' -v
            python3 -m unittest discover -s tests -p 'test_instrument_map02_multi_putpixel_scope.py' -v
            python3 -m unittest discover -s tests -p 'test_instrument_map02_multi_putpixel_c11.py' -v
          )
          PYTHONPATH=remaster python3 -m tools.instrument_map02_putpixel_scope \
            upstream/platform/pc/src/libgpu.c \
            upstream/platform/pc/src/pc_raster.c \
            --output-dir /tmp/map02-scoped-gpu \
            > /tmp/map02-scoped-gpu.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("/tmp/map02-scoped-gpu.json").read_text())
          assert m["exact_original_gpu_sources_pinned"]
          assert m["synchronized_native_gpu_capture_in_same_binary"]
          assert m["pixel_calls_record_cap"] == 64
          assert not m["original_gameplay_captured"]
          PY
