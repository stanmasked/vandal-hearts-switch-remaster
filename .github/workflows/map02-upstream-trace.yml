            nm -a build/map02-native-raster-skips/combined.probe.o | grep VH_Map02PixelScopeSet
            if nm -a build/map02-native-raster-skips/combined.baseline.o | grep -Eq 'VH_Map02SkipAt|VH_Map02PixelScope|VH_PixelSampleRecord|VH_CaptureEvent'; then
