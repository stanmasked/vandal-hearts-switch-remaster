name: Map02 upstream trace patch verification

on:
  push:
    paths:
      - 'tools/make_map02_trace_patch.py'
      - 'tools/prepare_map02_pcport.py'
      - 'tools/extract_map02_trace.py'
      - 'tests/test_extract_map02_trace.py'
      - 'tools/instrument_map02_loader.py'
      - 'tools/instrument_map02_renderer.py'
      - 'tests/test_prepare_map02_pcport.py'
      - 'tests/test_instrument_map02_renderer.py'
      - 'tests/test_map02_renderer_smoke.py'
      - 'tools/capture_map02_runtime.py'
      - 'tests/test_capture_map02_runtime.py'
      - 'tests/test_make_map02_trace_patch.py'
      - 'tests/test_map02_trace_c_emitter.py'
      - '.github/workflows/map02-upstream-trace.yml'
  pull_request:
    paths:
      - 'tools/make_map02_trace_patch.py'
      - 'tools/prepare_map02_pcport.py'
      - 'tools/extract_map02_trace.py'
      - 'tests/test_extract_map02_trace.py'
      - 'tools/instrument_map02_loader.py'
      - 'tools/instrument_map02_renderer.py'
      - 'tests/test_prepare_map02_pcport.py'
      - 'tests/test_instrument_map02_renderer.py'
      - 'tests/test_map02_renderer_smoke.py'
      - 'tools/capture_map02_runtime.py'
      - 'tests/test_capture_map02_runtime.py'
      - 'tests/test_make_map02_trace_patch.py'
      - 'tests/test_map02_trace_c_emitter.py'
      - '.github/workflows/map02-upstream-trace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-trace-patch:
    name: Apply generated trace patch to pinned upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout remaster diagnostics
        uses: actions/checkout@v4
        with:
          path: remaster
          persist-credentials: false

      - name: Checkout pinned public PC-port source
        uses: actions/checkout@v4
        with:
          repository: HalmyLyseas/VandalHearts-PcPort
          ref: 14552fffa0e0b47e02b57592e274fc6e7a649923
          path: upstream
          persist-credentials: false
          sparse-checkout: |
            src/states/game_setup.c
            src/core/graphics.c
            include/
            platform/pc/include/
            platform/pc/Makefile
          sparse-checkout-cone-mode: false

      - name: Run patch generator regression tests
        working-directory: remaster
        run: python3 -m unittest discover -s tests -p 'test_make_map02_trace_patch.py' -v

      - name: Run compiled JSONL integration test
        working-directory: remaster
        run: python3 -m unittest discover -s tests -p 'test_map02_trace_c_emitter.py' -v

      - name: Generate apply check and reverse diagnostic-only patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m remaster.tools.make_map02_trace_patch upstream --output map02-trace.patch
          cd upstream
          git apply --check ../map02-trace.patch
          git apply ../map02-trace.patch
          git diff --check
          # Compile both modified source units using upstream's game compile profile.
          (
            cd platform/pc
            mkdir -p build/include_stage
            for header in ../../include/*.h ../../include/*.inc; do
              ln -sf "$(realpath "$header")" "build/include_stage/$(basename "$header")"
            done
            for item in PsyQ types.h inline_gte.h; do
              ln -sf "$(realpath "include/$item")" "build/include_stage/$item"
            done
            common_flags=(
              -m64 -std=gnu89 -fno-builtin-csqrt
              -DPERMUTER -DPC_PORT -DPC_FEAT -DVH_REGION_US
              '-Dasm(x)=' -Ibuild/include_stage -Iinclude -I../..
              -include pc_forward_decls.h
              -Wno-incompatible-pointer-types -Wno-builtin-declaration-mismatch
              -Wno-discarded-qualifiers -Wno-pointer-to-int-cast
              -Wno-int-to-pointer-cast -Wno-int-conversion
            )
            mkdir -p build/map02-trace-objects
            # Compile actual relocatable object files, not just a syntax-only pass.
            for unit in game_setup graphics; do
              source="../../src/core/$unit.c"
              if [[ "$unit" == game_setup ]]; then source="../../src/states/$unit.c"; fi
              gcc "${common_flags[@]}" -DVH_TRACE_MAP02 -c "$source" \
                -o "build/map02-trace-objects/${unit}.trace.o"
              gcc "${common_flags[@]}" -c "$source" \
                -o "build/map02-trace-objects/${unit}.baseline.o"
            done
            # Confirm the renderer hook exists only when explicitly enabled.
            nm -a build/map02-trace-objects/graphics.trace.o | grep VH_Map02TraceDraw
            if nm -a build/map02-trace-objects/graphics.baseline.o | grep -q VH_Map02TraceDraw; then
              echo "Unexpected trace hook in baseline graphics object" >&2
              exit 1
            fi
          )
          expected=$(printf 'src/core/graphics.c\nsrc/states/game_setup.c')
          actual=$(git diff --name-only)
          test "$actual" = "$expected"
          test "$(grep -c VH_Map02TraceDraw src/core/graphics.c)" -eq 4
          git apply --reverse --check ../map02-trace.patch
          git apply --reverse ../map02-trace.patch
          test -z "$(git status --porcelain -- src/core/graphics.c src/states/game_setup.c)"

      - name: Verify pinned make-overlay diagnostic object compilation
        shell: bash
        run: |
          set -euo pipefail
          (
            cd remaster
            python3 -m unittest discover -s tests -p 'test_prepare_map02_pcport.py' -v
            python3 -m unittest discover -s tests -p 'test_extract_map02_trace.py' -v
            python3 -m unittest discover -s tests -p 'test_capture_map02_runtime.py' -v
            python3 -m unittest discover -s tests -p 'test_instrument_map02_renderer.py' -v
            python3 -m unittest discover -s tests -p 'test_map02_renderer_smoke.py' -v
          )
          PYTHONPATH=remaster python3 -m tools.prepare_map02_pcport upstream /tmp/vh-map02-upstream-overlay-ci
          PYTHONPATH=remaster python3 -m tools.prepare_map02_pcport upstream /tmp/vh-map02-upstream-full-ci --full-trace
          python3 -c 'import json; p=json.load(open("/tmp/vh-map02-upstream-full-ci/source_provenance.json")); assert p["trace_mode"] == "full" and all(x["matches_pinned"] for x in p["source_files"].values())'
          (
            cd upstream/platform/pc
            make -n -f Makefile -f /tmp/vh-map02-upstream-full-ci/map02_trace.mk \
              BUILD_DIR=build-map02-full-ci \
              build-map02-full-ci/src/states/game_setup.o \
              build-map02-full-ci/src/core/graphics.o > /tmp/vh-map02-full-ci-make-plan.txt
            grep -F -- '-DVH_TRACE_MAP02' /tmp/vh-map02-full-ci-make-plan.txt
            grep -F -- '/tmp/vh-map02-upstream-full-ci/game_setup.trace.c' /tmp/vh-map02-full-ci-make-plan.txt
            grep -F -- '/tmp/vh-map02-upstream-full-ci/graphics.trace.c' /tmp/vh-map02-full-ci-make-plan.txt
          )
          python3 -c 'import json; p=json.load(open("/tmp/vh-map02-upstream-overlay-ci/source_provenance.json")); assert all(x["matches_pinned"] for x in p["source_files"].values())'
          (
            cd upstream/platform/pc
            mkdir -p build/map02-trace-objects
            flags=(
              -m64 -std=gnu89 -fno-builtin-csqrt
              -DPERMUTER -DPC_PORT -DPC_FEAT -DVH_REGION_US
              '-Dasm(x)=' -Ibuild/include_stage -Iinclude -I../..
              -include pc_forward_decls.h
              -Wno-incompatible-pointer-types -Wno-builtin-declaration-mismatch
              -Wno-discarded-qualifiers -Wno-pointer-to-int-cast
              -Wno-int-to-pointer-cast -Wno-int-conversion
            )
            gcc "${flags[@]}" -DVH_TRACE_MAP02_POST_LOAD -c /tmp/vh-map02-upstream-overlay-ci/game_setup.trace.c -o build/map02-trace-objects/game_setup.overlay.o
            gcc "${flags[@]}" -DVH_TRACE_MAP02_DRAW -c /tmp/vh-map02-upstream-overlay-ci/graphics.trace.c -o build/map02-trace-objects/graphics.overlay.o
            nm -a build/map02-trace-objects/graphics.overlay.o | grep vh_trace_map02_draw
            gcc "${flags[@]}" -DVH_TRACE_MAP02 -c /tmp/vh-map02-upstream-full-ci/game_setup.trace.c -o build/map02-trace-objects/game_setup.full.o
            gcc "${flags[@]}" -DVH_TRACE_MAP02 -c /tmp/vh-map02-upstream-full-ci/graphics.trace.c -o build/map02-trace-objects/graphics.full.o
            nm -a build/map02-trace-objects/graphics.full.o | grep VH_Map02TraceVisit
            nm -a build/map02-trace-objects/graphics.full.o | grep VH_Map02TraceSkip
            nm -a build/map02-trace-objects/graphics.full.o | grep VH_Map02TraceDraw
          )

      - name: Compile full-trace objects through real upstream Make rules
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/platform/pc
          make -f Makefile -f /tmp/vh-map02-upstream-full-ci/map02_trace.mk \
            BUILD_DIR=build-map02-full-ci \
            build-map02-full-ci/src/states/game_setup.o \
            build-map02-full-ci/src/core/graphics.o
          test -s build-map02-full-ci/src/states/game_setup.o
          test -s build-map02-full-ci/src/core/graphics.o
          nm -a build-map02-full-ci/src/core/graphics.o | grep -F VH_Map02TraceVisit
          nm -a build-map02-full-ci/src/core/graphics.o | grep -F VH_Map02TraceSkip
          nm -a build-map02-full-ci/src/core/graphics.o | grep -F VH_Map02TraceDraw
          strings build-map02-full-ci/src/states/game_setup.o | grep -F post_load
          # GNU ld can combine these two real Make-built units without
          # proprietary game data or a complete playable link.
          ld -r -o build-map02-full-ci/map02-instrumented-units.o \
            build-map02-full-ci/src/states/game_setup.o \
            build-map02-full-ci/src/core/graphics.o
          test -s build-map02-full-ci/map02-instrumented-units.o
          nm -g --defined-only build-map02-full-ci/map02-instrumented-units.o | grep -F vh_map02_trace_build_marker
          nm -g --defined-only build-map02-full-ci/map02-instrumented-units.o | grep -F vh_map02_trace_loader_marker
          python3 - <<'PY'
          import json
          from pathlib import Path
          provenance = json.loads(Path("/tmp/vh-map02-upstream-full-ci/source_provenance.json").read_text())
          marker = provenance["binary_marker"].encode("ascii") + b"\0"
          loader = provenance["binary_loader_marker"].encode("ascii") + b"\0"
          assert provenance["binary_marker"].split(":", 1)[1] == provenance["binary_loader_marker"].split(":", 1)[1]
          assert marker in Path("build-map02-full-ci/src/core/graphics.o").read_bytes()
          assert loader in Path("build-map02-full-ci/src/states/game_setup.o").read_bytes()
          combined = Path("build-map02-full-ci/map02-instrumented-units.o").read_bytes()
          assert marker in combined and loader in combined
          print("Verified matched loader/renderer markers in real Make-built and partial-linked objects.")
          PY
