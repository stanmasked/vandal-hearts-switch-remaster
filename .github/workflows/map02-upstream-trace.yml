      - name: Compile full-trace objects through real upstream Make rules
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/platform/pc
          make -f Makefile -f /tmp/vh-map02-upstream-full-ci/map02_trace.mk \
            BUILD_DIR=build-map02-full-ci \
            build-map02-full-ci/src/states/game_setup.o \
            build-map02-full-ci/src/core/graphics.o
          test -s build-map02-full-ci/src/states/game_setup.o
          test -s build-map02-full-ci/src/core/graphics.o
          nm -a build-map02-full-ci/src/core/graphics.o | grep -F VH_Map02TraceVisit
          nm -a build-map02-full-ci/src/core/graphics.o | grep -F VH_Map02TraceSkip
          nm -a build-map02-full-ci/src/core/graphics.o | grep -F VH_Map02TraceDraw
          strings build-map02-full-ci/src/states/game_setup.o | grep -F post_load
          # GNU ld can combine these two real Make-built units without
          # proprietary game data or a complete playable link.
          ld -r -o build-map02-full-ci/map02-instrumented-units.o \
            build-map02-full-ci/src/states/game_setup.o \
            build-map02-full-ci/src/core/graphics.o
          test -s build-map02-full-ci/map02-instrumented-units.o
          nm -g --defined-only build-map02-full-ci/map02-instrumented-units.o | grep -F vh_map02_trace_build_marker
          nm -g --defined-only build-map02-full-ci/map02-instrumented-units.o | grep -F vh_map02_trace_loader_marker
          python3 - <<'PY'
          import json
          from pathlib import Path
          provenance = json.loads(Path("/tmp/vh-map02-upstream-full-ci/source_provenance.json").read_text())
          marker = provenance["binary_marker"].encode("ascii") + b"\0"
          loader = provenance["binary_loader_marker"].encode("ascii") + b"\0"
          assert provenance["binary_marker"].split(":", 1)[1] == provenance["binary_loader_marker"].split(":", 1)[1]
          assert marker in Path("build-map02-full-ci/src/core/graphics.o").read_bytes()
          assert loader in Path("build-map02-full-ci/src/states/game_setup.o").read_bytes()
          combined = Path("build-map02-full-ci/map02-instrumented-units.o").read_bytes()
          assert marker in combined and loader in combined
          print("Verified matched loader/renderer markers in real Make-built and partial-linked objects.")
          PY
