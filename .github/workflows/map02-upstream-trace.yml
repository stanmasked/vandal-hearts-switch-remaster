      - name: Verify native DDA vertical scanline rejections on pinned original PC GPU
        shell: bash
        run: |
          set -euo pipefail
          (
            cd remaster
            python3 -m unittest discover -s tests -p 'test_instrument_map02_dda_span.py' -v
            python3 -m unittest discover -s tests -p 'test_map02_dda_span_composition.py' -v
            python3 -m unittest discover -s tests -p 'test_verify_map02_dda_native_spans.py' -v
            python3 -m unittest discover -s tests -p 'test_audit_map02_independent_dda_journals.py' -v
            python3 -m unittest discover -s tests -p 'test_preflight_map02_private_dda_capture.py' -v
            python3 -m unittest discover -s tests -p 'test_verify_map02_private_capture_session.py' -v
            python3 -m unittest discover -s tests -p 'test_run_map02_private_native_capture.py' -v
            python3 -m unittest discover -s tests -p 'test_map02_native_elf_process_image.py' -v
            python3 -m unittest discover -s tests -p 'test_audit_map02_launch_two_word_binding.py' -v
            python3 -m unittest discover -s tests -p 'test_map02_launch_two_word_process_integration.py' -v
            python3 -m unittest discover -s tests -p 'test_instrument_map02_vertical_dda.py' -v
            python3 -m unittest discover -s tests -p 'test_verify_map02_vertical_dda.py' -v
            python3 -m unittest discover -s tests -p 'test_verify_map02_raster_skips.py' -v
          )
          PYTHONPATH=remaster python3 -m tools.instrument_map02_vertical_dda \
            upstream/platform/pc/src/libgpu.c \
            upstream/platform/pc/src/pc_raster.c \
            --output-dir /tmp/vh-map02-vertical-dda \
            > /tmp/vh-map02-vertical-dda.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("/tmp/vh-map02-vertical-dda.json").read_text())
          assert m["original_pc_gpu_sources_pinned"]
          assert m["same_native_drawotag_session"]
          assert m["single_coordinate_bounded_record_cap"] == 64
          assert len(m["vertical_scanline_reasons"]) == 4
          assert m["vertical_row_rejected_but_horizontal_coverage_unknown"]
          assert not m["per_pixel_triangle_coverage_verified"]
          PY
          PYTHONPATH=remaster python3 - <<'PY'
          from pathlib import Path
          from tools.instrument_map02_dda_span import prepare_span
          report = prepare_span(
              Path("upstream/platform/pc/src/libgpu.c"),
              Path("upstream/platform/pc/src/pc_raster.c"),
              Path("/tmp/vh-map02-native-span-overlay"))
          assert report["pinned_original_gpu"]
          assert not report["vertical_rejected_row_coverage_proven"]
          gpu_old = Path("/tmp/vh-map02-vertical-dda/libgpu.vertical.c").read_bytes()
          gpu_new = Path("/tmp/vh-map02-native-span-overlay/libgpu.span.c").read_bytes()
          assert gpu_old == gpu_new, "span overlay changed the native GPU observer"
          vertical = Path("/tmp/vh-map02-vertical-dda/pc_raster.vertical.c").read_text()
          span = Path("/tmp/vh-map02-native-span-overlay/pc_raster.span.c").read_text()
          for reason in (4, 5, 6, 7):
              anchor = f"VH_Map02SkipAt(vh_pixel_sample_x, y, {reason});"
              assert vertical.count(anchor) == span.count(anchor) == 1
          assert span.count("VH_Map02SpanObserve(cx, y, x_start, x_bound);") == 1
          PY
          PYTHONPATH=remaster python3 - <<'PY'
          from pathlib import Path
          from tools.instrument_map02_dda_rejected_edges import instrument_rejected_edges
          original = Path("/tmp/vh-map02-native-span-overlay/pc_raster.span.c")
          candidate = original.with_name("pc_raster.candidate.c")
          generated = instrument_rejected_edges(original.read_text(encoding="utf-8"))
          for reason in (4, 5, 6, 7):
              observer = f"VH_Map02RejectedEdges(cx, y, left_x, right_x, {reason});"
              assert generated.count(observer) == 1, f"missing or duplicate native candidate reason {reason}"
              skip = f"VH_Map02SkipAt(vh_pixel_sample_x, y, {reason});"
              assert generated.count(skip) == 1, f"original vertical event {reason} changed"
          assert generated.count("static void VH_Map02RejectedEdges(") == 1
          candidate.write_text(generated, encoding="utf-8")
          PY
          (
            cd upstream/platform/pc
            flags=(
              -m64 -std=gnu89 -fno-builtin-csqrt
              -DPERMUTER -DPC_PORT -DPC_FEAT -DVH_REGION_US
              '-Dasm(x)=' -Ibuild/include_stage -Iinclude -I../.. -Isrc
              -include pc_forward_decls.h
              -Wno-incompatible-pointer-types -Wno-builtin-declaration-mismatch
              -Wno-discarded-qualifiers -Wno-pointer-to-int-cast
              -Wno-int-to-pointer-cast -Wno-int-conversion
              -Werror=implicit-function-declaration
            )
            mkdir -p build/map02-vertical-dda
            for mode in diagnostic baseline; do
              extra=()
              if [[ "$mode" == diagnostic ]]; then
                extra=(-DVH_MAP02_GPU_CAPTURE -DVH_MAP02_PUTPIXEL_SCOPE
                       -DVH_MAP02_RASTER_SKIP_TRACE -DVH_MAP02_DDA_VERTICAL_TRACE)
              fi
              gcc "${flags[@]}" "${extra[@]}" \
                -c /tmp/vh-map02-vertical-dda/libgpu.vertical.c \
                -o "build/map02-vertical-dda/gpu.${mode}.o"
              gcc "${flags[@]}" "${extra[@]}" \
                -c /tmp/vh-map02-vertical-dda/pc_raster.vertical.c \
                -o "build/map02-vertical-dda/raster.${mode}.o"
              span_extra=()
              if [[ "$mode" == diagnostic ]]; then
                span_extra=(-DVH_MAP02_DDA_SPAN_TRACE)
              fi
              gcc "${flags[@]}" "${extra[@]}" "${span_extra[@]}" \
                -c /tmp/vh-map02-native-span-overlay/pc_raster.span.c \
                -o "build/map02-vertical-dda/span.${mode}.o"
              ld -r "build/map02-vertical-dda/gpu.${mode}.o" \
                "build/map02-vertical-dda/raster.${mode}.o" \
                -o "build/map02-vertical-dda/linked.${mode}.o"
              ld -r "build/map02-vertical-dda/gpu.${mode}.o" \
                "build/map02-vertical-dda/span.${mode}.o" \
                -o "build/map02-vertical-dda/span-linked.${mode}.o"
              candidate_extra=()
              if [[ "$mode" == diagnostic ]]; then
                candidate_extra=(-DVH_MAP02_DDA_REJECTED_EDGES_TRACE)
              fi
              gcc "${flags[@]}" "${extra[@]}" "${span_extra[@]}" "${candidate_extra[@]}" \
                -c /tmp/vh-map02-native-span-overlay/pc_raster.candidate.c \
                -o "build/map02-vertical-dda/candidate.${mode}.o"
              ld -r "build/map02-vertical-dda/gpu.${mode}.o" \
                "build/map02-vertical-dda/candidate.${mode}.o" \
                -o "build/map02-vertical-dda/candidate-linked.${mode}.o"
              # Independent syntax/semantic compile with Clang of the identical
              # source-pinned candidate overlay, in both flag configurations.
              clang "${flags[@]}" "${extra[@]}" "${span_extra[@]}" \
                -c /tmp/vh-map02-native-span-overlay/pc_raster.span.c \
                -o "build/map02-vertical-dda/span-clang.${mode}.o"
              clang "${flags[@]}" "${extra[@]}" "${span_extra[@]}" "${candidate_extra[@]}" \
                -c /tmp/vh-map02-native-span-overlay/pc_raster.candidate.c \
                -o "build/map02-vertical-dda/candidate-clang.${mode}.o"
              clang "${flags[@]}" "${extra[@]}" \
                -c /tmp/vh-map02-vertical-dda/libgpu.vertical.c \
                -o "build/map02-vertical-dda/gpu-clang.${mode}.o"
              ld -r "build/map02-vertical-dda/gpu-clang.${mode}.o" \
                "build/map02-vertical-dda/candidate-clang.${mode}.o" \
                -o "build/map02-vertical-dda/candidate-linked-clang.${mode}.o"
              if [[ "$mode" == diagnostic ]]; then
                nm --defined-only "build/map02-vertical-dda/candidate-linked-clang.${mode}.o" |
                  grep VH_Map02RejectedEdges
              elif nm --defined-only "build/map02-vertical-dda/candidate-linked-clang.${mode}.o" |
                   grep -q VH_Map02RejectedEdges; then
                echo "Candidate observer leaked into Clang baseline" >&2
                exit 1
              fi
            done
            # Candidate instrumentation is opt-in: the baseline raster must
            # retain exactly the same executable instructions as the span
            # overlay with candidate tracing disabled. Compare text sections,
            # not object file metadata (which contains source path details).
            objcopy --only-section=.text -O binary \
              build/map02-vertical-dda/span.baseline.o \
              build/map02-vertical-dda/span-baseline.text.bin
            objcopy --only-section=.text -O binary \
              build/map02-vertical-dda/candidate.baseline.o \
              build/map02-vertical-dda/candidate-baseline.text.bin
            cmp build/map02-vertical-dda/span-baseline.text.bin \
                build/map02-vertical-dda/candidate-baseline.text.bin
            # Raw .text bytes alone miss ELF relocations: two equivalent
            # instruction sequences can still refer to different targets.
            # Compare source-pinned baseline relocation tables as well.
            readelf -rW build/map02-vertical-dda/span.baseline.o \
              > build/map02-vertical-dda/span-baseline.relocations.txt
            readelf -rW build/map02-vertical-dda/candidate.baseline.o \
              > build/map02-vertical-dda/candidate-baseline.relocations.txt
            cmp build/map02-vertical-dda/span-baseline.relocations.txt \
                build/map02-vertical-dda/candidate-baseline.relocations.txt
            # The same fail-closed baseline parity check for Clang.
            objcopy --only-section=.text -O binary \
              build/map02-vertical-dda/span-clang.baseline.o \
              build/map02-vertical-dda/span-clang-baseline.text.bin
            objcopy --only-section=.text -O binary \
              build/map02-vertical-dda/candidate-clang.baseline.o \
              build/map02-vertical-dda/candidate-clang-baseline.text.bin
            cmp build/map02-vertical-dda/span-clang-baseline.text.bin \
                build/map02-vertical-dda/candidate-clang-baseline.text.bin
            readelf -rW build/map02-vertical-dda/span-clang.baseline.o \
              > build/map02-vertical-dda/span-clang-baseline.relocations.txt
            readelf -rW build/map02-vertical-dda/candidate-clang.baseline.o \
              > build/map02-vertical-dda/candidate-clang-baseline.relocations.txt
            cmp build/map02-vertical-dda/span-clang-baseline.relocations.txt \
                build/map02-vertical-dda/candidate-clang-baseline.relocations.txt
            nm --defined-only build/map02-vertical-dda/candidate-linked.diagnostic.o | grep VH_Map02RejectedEdges
            if nm --defined-only build/map02-vertical-dda/candidate-linked.baseline.o | grep -q VH_Map02RejectedEdges; then
              echo "Candidate observer leaked into baseline" >&2
              exit 1
            fi
            nm -a build/map02-vertical-dda/span-linked.diagnostic.o | grep VH_Map02SpanObserve
            if nm -a build/map02-vertical-dda/span-linked.baseline.o | grep -Eq "VH_Map02SpanObserve|VH_Map02SkipAt|VH_Map02PixelScope|VH_PixelSampleRecord"; then
              echo "Span observer leaked into baseline" >&2
              exit 1
            fi
            nm -a build/map02-vertical-dda/linked.diagnostic.o | grep VH_Map02SkipAt
            nm -a build/map02-vertical-dda/linked.diagnostic.o | grep VH_Map02PixelScopeSet
            if nm -a build/map02-vertical-dda/linked.baseline.o | grep -Eq 'VH_Map02SkipAt|VH_Map02PixelScope|VH_PixelSampleRecord|VH_CaptureEvent'; then
              echo "Private vertical DDA diagnostic symbol leaked into ordinary PC rendering" >&2
              exit 1
            fi
          )
          test -z "$(cd upstream && git status --porcelain -- platform/pc/src/libgpu.c platform/pc/src/pc_raster.c)"

      - name: Publish source-pinned DDA candidate build evidence
        shell: bash
        env:
          REMASTER_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cd upstream/platform/pc
          test "$(git rev-parse HEAD)" = 14552fffa0e0b47e02b57592e274fc6e7a649923
          test -s build/map02-vertical-dda/candidate-linked.diagnostic.o
          test -s build/map02-vertical-dda/candidate-linked.baseline.o
          test -s build/map02-vertical-dda/candidate-linked-clang.diagnostic.o
          test -s build/map02-vertical-dda/candidate-linked-clang.baseline.o
          {
            echo "### Source-pinned original PC GPU — DDA candidate build"
            echo "Pinned upstream: \`$(git rev-parse HEAD)\`"
            echo "Checked-out remaster commit (PR merge revision): \`$GITHUB_SHA\`"
            echo "Remaster source branch HEAD: \`$REMASTER_SOURCE_HEAD\`"
            echo "GCC: \`$(gcc -dumpfullversion -dumpversion)\`"
            echo "Clang: \`$(clang -dumpversion)\`"
            echo "GCC/Clang: diagnostic and baseline objects built and partially linked."
            echo "GCC/Clang: baseline text, relocations and symbol isolation checked."
            echo "#### SHA-256 of real linked candidate objects"
            for object in candidate-linked.diagnostic.o candidate-linked.baseline.o \
                          candidate-linked-clang.diagnostic.o candidate-linked-clang.baseline.o; do
              sha256sum "build/map02-vertical-dda/$object"
            done
            echo "This is a compile/link check, NOT an original MAP02 gameplay capture."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save reproducible original GPU object manifest
