            nm build/map02-multiscope-gpu/combined.capture.o | grep VH_PixelSampleRecord
            nm build/map02-multiscope-gpu/combined.capture.o | grep VH_CaptureEvent
            if nm -a build/map02-multiscope-gpu/combined.baseline.o | grep -Eq 'VH_Map02PixelScope|VH_PixelSampleRecord|VH_CaptureEvent'; then
              echo "Two-coordinate observer leaked into baseline GPU build" >&2
