          printf '%s\n' "$REMASTER_SOURCE_HEAD" > build/map02-vertical-dda/evidence/remaster-source-head.txt
          gcc --version | head -1 > build/map02-vertical-dda/evidence/gcc-version.txt
          clang --version | head -1 > build/map02-vertical-dda/evidence/clang-version.txt
          (
            cd build/map02-vertical-dda
            sha256sum candidate-linked.diagnostic.o candidate-linked.baseline.o \
                      candidate-linked-clang.diagnostic.o candidate-linked-clang.baseline.o \
              > evidence/objects.sha256
            sha256sum --check evidence/objects.sha256
          )
          test "$(wc -l < build/map02-vertical-dda/evidence/objects.sha256)" -eq 4

