name: MAP02 v187 exact native RAM snapshots at real VBlank boundaries
on:
  pull_request:
    paths:
      - '.github/workflows/map02-v187-native-ram-snapshots.yml'
      - '.github/workflows/map02-v104-content-guard.yml'
      - 'tools/apply_map02_v187_native_ram_snapshots.py'
      - 'tests/test_map02_v187_native_ram_snapshots.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt-source-audit:
    name: Exact pre-execution RAM snapshot audit (${{ matrix.cc }})
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Confirm strict event order, numeric receipts and fail-closed diagnostics
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          python3 -m compileall -q tools/apply_map02_v187_native_ram_snapshots.py tests/test_map02_v187_native_ram_snapshots.py
          python3 -m unittest discover -s tests -p 'test_map02_v187_native_ram_snapshots.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v186_late_vblank_ram_corruption.py' -v
          echo 'VH187_INDEPENDENT_NATIVE_RAM_SNAPSHOT_PASS boundaries=3 fault_variants=9 original_retail_executed=0'
