name: Host texture safety tests

on:
  push:
    paths:
      - "source/texture_sample.h"
      - "source/ps1_indexed_texture.h"
      - "source/ps1_abr_blend.h"
      - "source/map02_terrain_lighting.h"
      - "source/map02_face_direction.h"
      - "tests/test_map02_face_direction.c"
      - "tests/test_map02_terrain_lighting.c"
      - "tests/test_ps1_abr_blend.c"
      - "source/ft4_textured_quad.h"
      - "tests/test_ps1_indexed_texture.c"
      - "tests/test_ft4_textured_quad.c"
      - "tests/test_texture_sample.c"
      - "Makefile"
      - ".github/workflows/host-texture-tests.yml"
  pull_request:
    paths:
      - "source/texture_sample.h"
      - "source/ps1_indexed_texture.h"
      - "source/ps1_abr_blend.h"
      - "source/map02_terrain_lighting.h"
      - "source/map02_face_direction.h"
      - "tests/test_map02_face_direction.c"
      - "tests/test_map02_terrain_lighting.c"
      - "tests/test_ps1_abr_blend.c"
      - "source/ft4_textured_quad.h"
      - "tests/test_ps1_indexed_texture.c"
      - "tests/test_ft4_textured_quad.c"
      - "tests/test_texture_sample.c"
      - "Makefile"
      - ".github/workflows/host-texture-tests.yml"
  workflow_dispatch:

jobs:
  texture-sampling:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run texture sampling unit test
        run: make build/test_texture_sample build/test_ft4_textured_quad build/test_ps1_indexed_texture build/test_ps1_abr_blend build/test_map02_terrain_lighting build/test_map02_face_direction && ./build/test_texture_sample && ./build/test_ft4_textured_quad && ./build/test_ps1_indexed_texture && ./build/test_ps1_abr_blend && ./build/test_map02_terrain_lighting && ./build/test_map02_face_direction
      - name: Run texture sampling sanitizers
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_texture_sample.c -o build/test_texture_sample_sanitize
          ./build/test_texture_sample_sanitize
          gcc -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_ft4_textured_quad.c -o build/test_ft4_textured_quad_sanitize
          ./build/test_ft4_textured_quad_sanitize
          gcc -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_ps1_indexed_texture.c -o build/test_ps1_indexed_texture_sanitize
          ./build/test_ps1_indexed_texture_sanitize
          gcc -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_ps1_abr_blend.c -o build/test_ps1_abr_blend_sanitize
          ./build/test_ps1_abr_blend_sanitize
          gcc -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_map02_terrain_lighting.c -o build/test_map02_terrain_lighting_sanitize
          ./build/test_map02_terrain_lighting_sanitize
          gcc -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_map02_face_direction.c -o build/test_map02_face_direction_sanitize
          ./build/test_map02_face_direction_sanitize
