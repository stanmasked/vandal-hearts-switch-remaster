name: Host texture safety tests

on:
  push:
    paths:
      - "source/texture_sample.h"
      - "tests/test_texture_sample.c"
      - "Makefile"
      - ".github/workflows/host-texture-tests.yml"
  pull_request:
    paths:
      - "source/texture_sample.h"
      - "tests/test_texture_sample.c"
      - "Makefile"
      - ".github/workflows/host-texture-tests.yml"
  workflow_dispatch:

jobs:
  texture-sampling:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run texture sampling unit test
        run: make build/test_texture_sample && ./build/test_texture_sample
      - name: Run texture sampling sanitizers
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_texture_sample.c -o build/test_texture_sample_sanitize
          ./build/test_texture_sample_sanitize
