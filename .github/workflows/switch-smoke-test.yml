name: Switch homebrew smoke test
# CI smoke test only; full game port is not built by this workflow.
# Uses the current libnx Pad API for controller polling.

on:
  push:
    branches:
      - experiment/switch-homebrew-smoke-test
    paths:
      - "switch-test/**"
      - "switch-test-graphics/**"
      - "scripts/fetch_upstream_pcport.sh"
      - "scripts/audit_switch_blockers.py"
      - ".github/workflows/switch-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build libnx smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch pinned upstream source for inspection
        run: bash scripts/fetch_upstream_pcport.sh .cache/upstream-pc-port

      - name: Audit desktop backend for Switch blockers
        run: python3 scripts/audit_switch_blockers.py .cache/upstream-pc-port | tee switch-blocker-audit.txt

      - name: Build NRO with devkitPro toolchain
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            devkitpro/devkita64:latest \
            sh -lc 'make -C switch-test && make -C switch-test-graphics'

      - name: Upload Switch homebrew artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: switch-smoke-test-nro
          path: |
            switch-test/*.nro
            switch-test-graphics/*.nro
            switch-blocker-audit.txt
          if-no-files-found: error
          retention-days: 14
