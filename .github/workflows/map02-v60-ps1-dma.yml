          print("PASS real OT mutation rejection for E6 state, quad source, full-frame pixel and clip.")
          PY
          sha256sum proof/v58_original_ordered_mask proof/ordered_mask_v58.o \
            proof/order_shims_v58.o proof/pc_gpu_trace_v58.o >> proof/SHA256SUMS
      - name: Run authentic original GPU VHT1 mask E6 record and replay in fresh processes
        shell: bash
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          "$CC" -std=gnu89 -O2 -g -ffunction-sections -fdata-sections \
            -DPC_PORT -DPC_FEAT -DVH_MAP02_V39_TRACE \
            -Ipcport/platform/pc/include -Ipcport/platform/pc/src \
            -c remaster/tests/map02_v59_trace_roundtrip.c -o proof/trace_driver_v59.o
          "$CC" -std=gnu89 -O2 -g -ffunction-sections -fdata-sections \
            -DPC_PORT -DPC_FEAT -DVH_MAP02_V39_TRACE \
            -Ipcport/platform/pc/include -Ipcport/platform/pc/src \
            -c remaster/tests/map02_v59_real_trace_shims.c -o proof/trace_shims_v59.o
          "$CC" -std=gnu89 -O2 -g -ffunction-sections -fdata-sections \
            -DPC_PORT -DPC_FEAT -DVH_MAP02_V39_TRACE \
            -Ipcport/platform/pc/include -Ipcport/platform/pc/src \
            -c pcport/platform/pc/src/pc_gpu_trace.c -o proof/real_pc_gpu_trace_v59.o
          "$CC" -Wl,--gc-sections \
            proof/trace_driver_v59.o proof/trace_shims_v59.o \
            proof/real_pc_gpu_trace_v59.o proof/libgpu.o proof/pc_raster.o \
            -lm -lpthread -o proof/v59_original_vht1_roundtrip
          nm proof/v59_original_vht1_roundtrip | grep -q PC_GpuReplayTrace
          nm proof/v59_original_vht1_roundtrip | grep -q TrcPrim
          nm proof/v59_original_vht1_roundtrip | grep -q PC_SetDrawMaskPacket
          trace=proof/SYNTHETIC_V59_E6_OT_TRACE.vht
          VH_INTERNAL_SCALE=2 VH_RASTER_THREADS=1 VH_GPU_RECORD="$trace" \
            VH_GPU_RECORD_FRAMES=4 ./proof/v59_original_vht1_roundtrip record "$trace" \
            > proof/SYNTHETIC_V59_RECORD.log \
            2> proof/SYNTHETIC_V59_RECORD.stderr
          grep -F 'V59 RECORDED_VHT1_FRAMES=4 SYNTHETIC_ONLY' \
            proof/SYNTHETIC_V59_RECORD.stderr
          grep -F '[trace] recording complete (4 frames)' \
            proof/SYNTHETIC_V59_RECORD.stderr
          for workers in 1 2 4; do
            VH_INTERNAL_SCALE=2 VH_RASTER_THREADS="$workers" \
              VH_MAP02_V59_TRACE_FRAMES=1 VH_GPU_REPLAY_HASH_HIRES=1 \
              ./proof/v59_original_vht1_roundtrip replay "$trace" \
              > "proof/SYNTHETIC_V59_REPLAY_$workers.log" \
              2> "proof/SYNTHETIC_V59_REPLAY_$workers.stderr"
            grep -F 'REPLAY frames=4 combined=' \
              "proof/SYNTHETIC_V59_REPLAY_$workers.log"
            grep -F "[raster] hi-res worker threads: $workers" \
              "proof/SYNTHETIC_V59_REPLAY_$workers.stderr"
          done
          python3 -m remaster.tools.verify_map02_v59_trace \
            "$trace" proof/SYNTHETIC_V59_RECORD.log \
            proof/SYNTHETIC_V59_REPLAY_1.log \
            proof/SYNTHETIC_V59_REPLAY_2.log \
            proof/SYNTHETIC_V59_REPLAY_4.log \
            --output proof/SYNTHETIC_V59_VHT1_E6_ROUNDTRIP_PROOF.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=json.loads(Path("proof/SYNTHETIC_V59_VHT1_E6_ROUNDTRIP_PROOF.json").read_text())
          assert p["status"]=="original_vht1_e6_roundtrip_verified",p
          assert p["frames"]==4 and p["gpu_mask_packets"]==11
          assert p["original_trace_record_replay_frames"]==12
          assert p["independent_full_frame_native_hash_equalities"]==12
          assert p["independent_full_frame_hd_hash_equalities"]==12
          assert not p["HD_replacement_approved"]
          assert not p["genuine_retail_gpu_packets_proven"]
          print("PASS: original TrcWrite/TrcPrim writes VHT1, original PC_GpuReplayTrace consumes VHT1")
          print("PASS: all 4 frames have matching whole-VRAM and whole-2x native/HD FNV byte signatures with 1/2/4 threads")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,struct
          trace=Path("proof/SYNTHETIC_V59_E6_OT_TRACE.vht")
          data=trace.read_bytes()
          pattern=struct.pack("<I",0xe6000001)
          assert data.count(pattern)>=1
          corrupted=data.replace(pattern,struct.pack("<I",0xe6000000),1)
          bad=Path("proof/SYNTHETIC_V59_CORRUPTED_MASK.vht")
          bad.write_bytes(corrupted)
          cmd=["python3","-m","remaster.tools.verify_map02_v59_trace",str(bad),
               "proof/SYNTHETIC_V59_RECORD.log",
               "proof/SYNTHETIC_V59_REPLAY_1.log",
               "proof/SYNTHETIC_V59_REPLAY_2.log",
               "proof/SYNTHETIC_V59_REPLAY_4.log"]
          result=subprocess.run(cmd,text=True,capture_output=True)
          assert result.returncode==1,(result.returncode,result.stdout[-300:])
          bad.unlink()
          replay=Path("proof/SYNTHETIC_V59_REPLAY_4.log").read_text()
          import re
          changed=re.sub(r"hihash=[a-f0-9]{16}","hihash=0000000000000000",replay,count=1)
          assert changed!=replay
          tampered=Path("proof/SYNTHETIC_V59_CORRUPTED_HD.log")
          tampered.write_text(changed)
          cmd=["python3","-m","remaster.tools.verify_map02_v59_trace",str(trace),
               "proof/SYNTHETIC_V59_RECORD.log",
               "proof/SYNTHETIC_V59_REPLAY_1.log",
               "proof/SYNTHETIC_V59_REPLAY_2.log",str(tampered)]
          result=subprocess.run(cmd,text=True,capture_output=True)
          assert result.returncode==1,(result.returncode,result.stdout[-300:])
          tampered.unlink()
          print("PASS: mutated genuine recorded E6 command and original replay HD framebuffer proof rejected.")
          PY
          sha256sum proof/v59_original_vht1_roundtrip proof/trace_driver_v59.o \
            proof/trace_shims_v59.o proof/real_pc_gpu_trace_v59.o \
            proof/SYNTHETIC_V59_E6_OT_TRACE.vht >> proof/SHA256SUMS
      - name: Distinguish actual PS1 DMA2 GP0 linked-list words from original PC-port VHT1
        shell: bash
        run: |
          set -euo pipefail
          python3 -m remaster.tools.make_map02_v60_synthetic_dma \
            --ram proof/SYNTHETIC_V60_PS1_DMA_RAM.bin \
            --manifest proof/SYNTHETIC_V60_PS1_DMA_MANIFEST.json
          python3 -m remaster.tools.verify_map02_v60_ps1_dma \
            --ram proof/SYNTHETIC_V60_PS1_DMA_RAM.bin \
            --manifest proof/SYNTHETIC_V60_PS1_DMA_MANIFEST.json \
            --vht1 proof/SYNTHETIC_V59_E6_OT_TRACE.vht \
            --output proof/SYNTHETIC_V60_DMA_SEMANTIC_PROOF.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          report=json.loads(Path("proof/SYNTHETIC_V60_DMA_SEMANTIC_PROOF.json").read_text())
          assert report["status"]=="synthetic_cross_format_semantic_order_verified",report
          assert report["frames"]==4 and report["dma_nodes"]==19,report
          assert report["gp0_e6_words"]==11 and report["gp0_ft4_commands"]==11,report
          assert report["source_class"]=="synthetic",report
          assert not report["retail_gp0_provenance_verified"]
          assert not report["retail_MAP02_verified"]
          assert not report["HD_replacement_approved"]
          print("PASS: 19 hardware-format DMA2 nodes, real GP0 E6+FT4 lengths, 4 synthetic frames")
          print("PASS: all 11 real GP0(E6) state transitions align semantically with separate original VHT1 format")
          print("CLOSED GATE: original retail DMA provenance and HD replacement are NOT proven")
          PY
          python3 - <<'PY'
          import subprocess,struct
          from pathlib import Path
          good=Path("proof/SYNTHETIC_V60_PS1_DMA_RAM.bin").read_bytes()
          bad=Path("proof/SYNTHETIC_V60_CORRUPT_E6.bin")
          needle=struct.pack("<I",0xe6000001)
          assert needle in good
          bad.write_bytes(good.replace(needle,struct.pack("<I",0xe6000000),1))
          cmd=["python3","-m","remaster.tools.verify_map02_v60_ps1_dma",
               "--ram",str(bad),
               "--manifest","proof/SYNTHETIC_V60_PS1_DMA_MANIFEST.json",
               "--vht1","proof/SYNTHETIC_V59_E6_OT_TRACE.vht"]
          result=subprocess.run(cmd,capture_output=True,text=True)
          assert result.returncode==1,(result.returncode,result.stdout[-300:])
          bad.unlink()
          # A custom PC-port VHT1 trace must be refused if masquerading as
          # hardware DMA RAM even when the manifest checksum is changed.
          import json,hashlib
          source=Path("proof/SYNTHETIC_V59_E6_OT_TRACE.vht").read_bytes()
          disguised=Path("proof/SYNTHETIC_V60_VHT1_AS_DMA.bin")
          disguised.write_bytes(source+b"\x00"*((-len(source))%4))
          metadata=json.loads(Path("proof/SYNTHETIC_V60_PS1_DMA_MANIFEST.json").read_text())
          metadata["sha256"]=hashlib.sha256(disguised.read_bytes()).hexdigest()
          malicious=Path("proof/SYNTHETIC_V60_VHT1_AS_DMA.json")
          malicious.write_text(json.dumps(metadata))
          cmd=["python3","-m","remaster.tools.verify_map02_v60_ps1_dma",
               "--ram",str(disguised),"--manifest",str(malicious)]
          result=subprocess.run(cmd,capture_output=True,text=True)
          assert result.returncode==1,(result.returncode,result.stdout[-300:])
          disguised.unlink();malicious.unlink()
          print("PASS: altered hardware DMA mask and VHT1-as-PS1 masquerade rejected")
          PY
          sha256sum proof/SYNTHETIC_V60_PS1_DMA_RAM.bin \
            proof/SYNTHETIC_V60_PS1_DMA_MANIFEST.json >> proof/SHA256SUMS
      - name: Upload runtime logs and binary hash proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map02-v60-${{ matrix.cc }}-hardware-dma-provenance-synthetic
          path: proof/
          if-no-files-found: warn
