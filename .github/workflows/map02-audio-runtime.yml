name: MAP02 native audio combined runtime prototype

on:
  pull_request:
    paths:
      - "source/main.c"
      - "source/vh_*"
      - "Makefile.map02-audio"
      - "tests/test_map02_music_input.c"
      - ".github/workflows/map02-audio-runtime.yml"
  push:
    paths:
      - "source/main.c"
      - "source/vh_*"
      - "Makefile.map02-audio"
      - ".github/workflows/map02-audio-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contracts:
    name: MAP02 music input and graphics safety (GCC/Clang)
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and exercise synthetic A/B music scene contract
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          mkdir -p build
          "$CC" -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer -Isource \
            tests/test_map02_music_input.c source/vh_game_music_mailbox.c \
            -o build/test_map02_music_input
          ./build/test_map02_music_input
          bash tools/run_staged_audio_foundation_tests.sh "$CC"
      - name: Preserve original MAP02 renderer host tests
        shell: bash
        run: |
          set -euo pipefail
          make build/test_game_rules build/test_software_renderer \
               build/test_ps1_abr_blend build/test_map02_face_direction \
               build/test_map02_projection build/test_map02_terrain_ot_scene \
               build/test_map02_vram4_frame
          for t in test_game_rules test_software_renderer test_ps1_abr_blend \
                   test_map02_face_direction test_map02_projection \
                   test_map02_terrain_ot_scene test_map02_vram4_frame; do
            "./build/$t"
          done

  switch-nro:
    name: Build original MAP02 and opt-in MAP02+audout NRO
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify unchanged default Switch MAP02 NRO
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          make verify-nro
      - name: Compile and validate MAP02 music NRO with libnx, no SDL2
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          make -f Makefile -f Makefile.map02-audio map02-audio-nro
          test -s build/map02-audio/vandal-hearts-map02-audio.nro
          sha256sum build/map02-audio/vandal-hearts-map02-audio.nro \
            > build/map02-audio/nro.sha256
          if cmp -s build/vandal-hearts-prototype.nro \
                    build/map02-audio/vandal-hearts-map02-audio.nro; then
            echo "Audio NRO unexpectedly identical to baseline" >&2
            exit 1
          fi
      - name: Archive both exact-run NROs for NeXium
        uses: actions/upload-artifact@v4
        with:
          name: map02-default-and-audio-nro
          path: |
            build/vandal-hearts-prototype.nro
            build/map02-audio/vandal-hearts-map02-audio.nro
            build/map02-audio/nro.sha256
          if-no-files-found: error
