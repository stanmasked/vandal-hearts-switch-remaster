jobs:
  scoped-blend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python diagnostics and tests parse
        run: python3 -m compileall -q tools tests
      - name: Check synthetic source, sink, and generated-code integration
        run: |
          python3 -m unittest -v \
            tests.test_instrument_map02_scoped_blend \
            tests.test_map02_scoped_blend_sink \
            tests.test_map02_scoped_blend_integration \
            tests.test_instrument_map02_drawotag_scope \
            tests.test_map02_blendg1_witness \
            tests.test_map02_scoped_blend_jsonl_bridge \
            tests.test_publish_map02_blendg1_witness \
            tests.test_map02_blendg1_complete_events \
            tests.test_map02_scoped_blend_stage \
            tests.test_promote_map02_putpixel_stage \
            tests.test_map02_paired_publish_chain \
            tests.test_check_map02_original_gpu_tus \
            tests.test_map02_vram_edges \
            tests.test_map02_vram_edge_witness \
            tests.test_publish_map02_vram_edges_witness \
            tests.test_check_map02_private_capture_ready \
            tests.test_instrument_map02_gpu_native_events \
            tests.test_verify_map02_gpu_capture_receipt \
            tests.test_verify_map02_native_gpu_windows \
            tests.test_map02_source_native_windows \
            tests.test_verify_map02_window_scoped_join \
            tests.test_publish_map02_window_scoped_witness \
            tests.test_map02_local_capture_handoff
      - name: Checkout pinned public original PC raster source
        uses: actions/checkout@v4
        with:
          repository: HalmyLyseas/VandalHearts-PcPort
          ref: 14552fffa0e0b47e02b57592e274fc6e7a649923
          path: upstream-pc
          persist-credentials: false
      - name: Fail closed on upstream rasterizer source drift
        run: |
          python3 -m tools.instrument_map02_scoped_blend \
            upstream-pc/platform/pc/src/pc_raster.c \
            "${RUNNER_TEMP}/pc_raster.scoped-probe.c"
          test -s "${RUNNER_TEMP}/pc_raster.scoped-probe.c"
          python3 -m tools.instrument_map02_drawotag_scope \
            upstream-pc/platform/pc/src/libgpu.c \
            "${RUNNER_TEMP}/libgpu.scoped-probe.c"
          test -s "${RUNNER_TEMP}/libgpu.scoped-probe.c"
      - name: Compile and relocatable-link original PC GPU units (ordinary, scoped, staged)
        run: |
          python3 -m tools.check_map02_original_gpu_tus upstream-pc
      - name: Run original PC rasterizer with synthetic native VRAM BlendG1
        run: python3 -m tools.check_map02_original_raster_runtime upstream-pc
      - name: Run actual original DrawOTag with synthetic DR_MODE F4 FT4
        run: python3 -m tools.check_map02_original_drawotag_runtime upstream-pc
      - name: Execute original GPU recorder and reject 64-event overflow
        run: python3 -m tools.check_map02_original_gpu_recorder_runtime upstream-pc
      - name: Stress original DrawOTag with overlapping STP and draw-mode switches
        run: python3 -m tools.check_map02_original_drawotag_complex upstream-pc
      - name: Execute original DrawOTag with GPU windows and pixel+BlendG1+VRAM edges together
        run: python3 -m tools.check_map02_joint_window_scoped_runtime upstream-pc
