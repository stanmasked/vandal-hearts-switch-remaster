name: Verified NeXium idle-vs-switch eight-pair comparison

on:
  push:
    branches:
      - test/cdxa-extract-decode-pipeline
    paths:
      - .github/workflows/nexium-eight-pair-variability.yml
      - tools/analyze_nexium_idle_switch_variability.py
      - tools/analyze_nexium_steady_state.py
      - tools/analyze_nexium_steady_segments.py
      - tools/analyze_nexium_steady_segment_sensitivity.py
      - tools/analyze_nexium_steady_temporal_contrasts.py
      - tools/analyze_nexium_steady_boundary_shifts.py
      - tools/analyze_nexium_steady_boundary_pair_grid.py
      - tools/analyze_nexium_steady_disjoint_bands.py
      - tools/analyze_nexium_steady_rate_exposure.py
      - tools/analyze_nexium_steady_second_profile.py
      - tools/analyze_nexium_steady_scene_alignment.py
      - tests/test_analyze_nexium_steady_scene_alignment.py
      - tests/test_analyze_nexium_steady_second_profile.py
      - tests/test_analyze_nexium_steady_rate_exposure.py
      - tests/test_analyze_nexium_steady_disjoint_bands.py
      - tests/test_analyze_nexium_steady_boundary_pair_grid.py
      - tests/test_analyze_nexium_steady_boundary_shifts.py
      - tests/test_analyze_nexium_steady_temporal_contrasts.py
      - tests/test_analyze_nexium_steady_segment_sensitivity.py
      - tests/test_analyze_nexium_steady_segments.py
      - tests/test_analyze_nexium_steady_state.py
      - tests/test_analyze_nexium_idle_switch_variability.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compare-paired-original-sd-witnesses:
    name: Reverify eight NeXium same-NRO idle/switch pairs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_IDS: "39077499594 39077898370 39078007443 39078024366 39078053051 39078369183 39078393956 39079372486"
    steps:
      - name: Checkout independent Stage277 comparator
        uses: actions/checkout@v4

      - name: Confirm each source run completed successfully in this repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified-pairs
          : > verified-pairs/source-workflow-runs.txt
          for run_id in $SOURCE_RUN_IDS; do
            [[ "$run_id" =~ ^[0-9]{8,15}$ ]] || exit 2
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.conclusion')"
            name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.name')"
            branch="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.head_branch')"
            if [[ "$status" != success || "$name" != "Experimental NRO runtime smoke test" ||
                  "$branch" != "test/cdxa-extract-decode-pipeline" ]]; then
              echo "Not a successful original NeXium run in the required branch: $run_id" >&2
              exit 2
            fi
            echo "$run_id" >> verified-pairs/source-workflow-runs.txt
          done
          test "$(sort -nu verified-pairs/source-workflow-runs.txt | wc -l)" -eq 8

      - name: Download and independently repackage original run artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/neXium-eight"
          while IFS= read -r id; do
            folder="$RUNNER_TEMP/neXium-eight/$id"
            mkdir -p "$folder"
            gh run download "$id" --repo "$GITHUB_REPOSITORY" \
              --name nexium-runtime-evidence --dir "$folder"
            test -s "$folder/integrated-nro-preflight.json"
            test -s "$folder/runtime-evidence/idle-control/idle-audout-verification.json"
            test -s "$folder/runtime-evidence/scene-soak/soak-audout-exact-slow-verification.json"
          done < verified-pairs/source-workflow-runs.txt
          python3 - "$RUNNER_TEMP/neXium-eight" <<'PY'
          import pathlib,sys,zipfile
          root=pathlib.Path(sys.argv[1])
          for run in sorted(root.iterdir()):
              if not run.is_dir() or not run.name.isdecimal():
                  raise SystemExit("unexpected run input")
              parts=sorted(run.rglob("*"))
              if len(parts)>400 or any(path.is_symlink() for path in parts):
                  raise SystemExit("unexpected symlink or excessive entries")
              with zipfile.ZipFile(root/(run.name+".zip"),"w",
                                  compression=zipfile.ZIP_DEFLATED) as z:
                  for path in parts:
                      if path.is_file():
                          z.write(path,path.relative_to(run).as_posix())
          PY

      - name: Reaudit all eight original-SD verdicts and exact slow-call copies
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r id; do
            args+=(--archive "$RUNNER_TEMP/neXium-eight/$id.zip")
          done < verified-pairs/source-workflow-runs.txt
          python3 tools/compare_nexium_idle_switch_pairs.py \
            "${args[@]}" --output verified-pairs/idle-vs-switch-eight-runs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("verified-pairs/idle-vs-switch-eight-runs.json")
          report=json.loads(p.read_text())
          requested={int(x) for x in Path(
              "verified-pairs/source-workflow-runs.txt").read_text().splitlines()}
          if (report["result"]!="SAME_NRO_IDLE_SWITCH_ARCHIVED_PAIRS_REVERIFIED"
                  or len(report["pairs"])!=8
                  or set(report["independent_workflow_run_ids"])!=requested
                  or report["original_guest_sd_reopened_offline"] is not False
                  or report["randomized_or_causal_inference"] is not False
                  or report["audible_output_or_physical_switch_tested"] is not False):
              raise SystemExit("incomplete or overclaimed eight-pair evidence")
          print(json.dumps({
              "pairs":len(report["pairs"]),"nro_sha256":report["nro_sha256"],
              "rates":report["rates"],"causal_inference":False},sort_keys=True))
          PY
          python3 tools/analyze_nexium_idle_switch_variability.py \
            --verified-pairs verified-pairs/idle-vs-switch-eight-runs.json \
            --output verified-pairs/paired-rate-variation.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("verified-pairs/paired-rate-variation.json").read_text())
          if (report["pair_count"]!=8 or
                  report["result"]!="EXPLORATORY_PAIRED_NEXIUM_VARIABILITY_COMPUTED" or
                  report["switching_order_randomized"] is not False or
                  report["bootstrap_is_inferential_confidence_interval"] is not False or
                  report["statistical_causal_music_claim"] is not False):
              raise SystemExit("unverifiable paired sensitivity interpretation")
          print("Pair-preserving noncausal variation bounds:",report["bands"])
          PY
          python3 tools/analyze_nexium_steady_state.py \
            "${args[@]}" --output verified-pairs/steady-state-only-s1-to-s51.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("verified-pairs/steady-state-only-s1-to-s51.json")
          record=json.loads(p.read_text())
          if (record["result"]!="ORIGINAL_SD_BOUND_COMMON_51S_AUDOUT_REVERIFIED" or
                  record["complete_verified_source_pair_count"]!=8 or
                  record["matched_second_count_per_mode"]!=51 or
                  record["startup_second_excluded"] is not True or
                  record["music_switch_causality_established"] is not False or
                  record["physical_switch_tested"] is not False):
              raise SystemExit("invalid common steady guest window comparison")
          print("Common guest seconds 1-51 per mode:",
                record["steady_pair_verdict"]["totals"],
                record["steady_pair_verdict"]["rates"])
          PY
          python3 tools/analyze_nexium_steady_segments.py \
            --verified-steady-state verified-pairs/steady-state-only-s1-to-s51.json \
            --output verified-pairs/steady-state-three-17s-segments.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("verified-pairs")
          full=json.loads((root/"steady-state-only-s1-to-s51.json").read_text())
          result=json.loads((root/"steady-state-three-17s-segments.json").read_text())
          if (result["result"]!="STAGE279_VERIFIED_TEMPORAL_THIRDS_RECONCILED"
                  or result["pair_count"]!=8
                  or result["segment_count"]!=3
                  or [(s["first_guest_second"],s["last_guest_second"])
                      for s in result["segments"]] != [(1,17),(18,34),(35,51)]
                  or result["physical_switch_tested"] is not False
                  or result["music_switch_causal_effect_proven"] is not False):
              raise SystemExit("invalid Stage280 temporal sensitivity report")
          for key,value in full["steady_pair_verdict"]["totals"].items():
              if sum(s["totals"][key] for s in result["segments"])!=value:
                  raise SystemExit("Stage280 partitions lost complete-window counts")
          print("Per-third switching minus idle audout rates:",
                [s["switch_minus_idle_per_1000"] for s in result["segments"]])
          PY
          python3 tools/analyze_nexium_steady_segment_sensitivity.py \
            --verified-steady-state verified-pairs/steady-state-only-s1-to-s51.json \
            --verified-temporal-thirds verified-pairs/steady-state-three-17s-segments.json \
            --output verified-pairs/steady-state-three-17s-sensitivity.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("verified-pairs")
          report=json.loads((root/"steady-state-three-17s-sensitivity.json").read_text())
          if (report["result"]!="THREE_VERIFIED_TEMPORAL_THIRDS_PAIRED_SENSITIVITY"
                  or report["pair_count"]!=8 or len(report["thirds"])!=3
                  or not report["source_stage280_report_exactly_rederived"]
                  or report["is_formal_confidence_interval"] is not False
                  or report["music_switch_causality_established"] is not False
                  or report["physical_switch_tested"] is not False):
              raise SystemExit("invalid Stage281 paired temporal sensitivity")
          for third in report["thirds"]:
              for threshold in ("ge40","ge50"):
                  band=third["bands"][threshold]
                  if (len(band["individual_pair_differences_per_1000"])!=8
                          or sum(band[key] for key in (
                              "positive_pairs","negative_pairs","exact_ties"))!=8
                          or band["whole_pair_resampling"]["is_formal_confidence_interval"] is not False):
                      raise SystemExit("incomplete Stage281 within-pair audit")
          print("Three temporal bins verified; ≥40ms leave-one-pair-out bounds:",
                [[t["bands"]["ge40"]["leave_one_pair_out_min_per_1000"],
                  t["bands"]["ge40"]["leave_one_pair_out_max_per_1000"]]
                 for t in report["thirds"]])
          PY
          python3 tools/analyze_nexium_steady_temporal_contrasts.py \
            --verified-steady-state verified-pairs/steady-state-only-s1-to-s51.json \
            --verified-temporal-thirds verified-pairs/steady-state-three-17s-segments.json \
            --verified-third-sensitivity verified-pairs/steady-state-three-17s-sensitivity.json \
            --output verified-pairs/steady-state-temporal-contrasts.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path(
              "verified-pairs/steady-state-temporal-contrasts.json").read_text())
          if (result["result"]!="VERIFIED_EIGHT_PAIR_TEMPORAL_CONTRAST_SENSITIVITY"
                  or result["pair_count"]!=8 or len(result["contrasts"])!=3
                  or not result["upstream_281_exactly_recalculated"]
                  or not result["same_pair_indices_used_in_both_resampled_windows"]
                  or result["confidence_interval_claim"] is not False
                  or result["physical_switch_tested"] is not False
                  or result["music_switch_causality_established"] is not False):
              raise SystemExit("incomplete Stage282 same-pair temporal contrast audit")
          for segment in result["contrasts"]:
              for threshold in ("ge40","ge50"):
                  band=segment["bands"][threshold]
                  if (len(band["per_pair_earlier_minus_later_per_1000"])!=8
                          or sum(band[key] for key in (
                              "positive_pairs","negative_pairs","exact_ties"))!=8
                          or band["same_pair_correlated_resampling"]["is_formal_confidence_interval"] is not False):
                      raise SystemExit("invalid Stage282 per-pair contrast")
          print("Eight-pair 17s middle-minus-late >=40ms audout contrast:",
                result["middle_minus_late_ge40_per_1000"])
          PY
          python3 tools/analyze_nexium_steady_boundary_shifts.py \
            --verified-steady-state verified-pairs/steady-state-only-s1-to-s51.json \
            --verified-temporal-thirds verified-pairs/steady-state-three-17s-segments.json \
            --verified-third-sensitivity verified-pairs/steady-state-three-17s-sensitivity.json \
            --verified-temporal-contrasts verified-pairs/steady-state-temporal-contrasts.json \
            --output verified-pairs/steady-state-fixed-left-boundary-shifts.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path(
              "verified-pairs/steady-state-fixed-left-boundary-shifts.json").read_text())
          if (report["result"]!="FIVE_PRESPECIFIED_NEARBY_BOUNDARIES_RECONCILED"
                  or report["pair_count"]!=8
                  or report["offsets_seconds"]!=[-4,-3,-2,-1,0]
                  or len(report["candidate_boundaries"])!=5
                  or report["upstream_stage282_recomputed_exactly"] is not True
                  or report["unshifted_contrast_matches_stage282"] is not True
                  or report["randomized_or_causal_conclusion"] is not False
                  or report["physical_switch_tested"] is not False
                  or report["audible_underruns_or_DAC_clock_measured"] is not False):
              raise SystemExit("invalid fixed-boundary audout sensitivity")
          for row in report["candidate_boundaries"]:
              if (len(row["source_workflow_run_ids"])!=8
                      or row["later_seconds"][0]!=row["earlier_seconds"][1]+1):
                  raise SystemExit("incorrect fixed same-pair window split")
              for band in ("ge40","ge50"):
                  item=row["bands"][band]
                  if (len(item["within_pair_contrasts_per_1000"])!=8
                          or sum(item[key] for key in (
                              "positive_pairs","negative_pairs","exact_ties"))!=8):
                      raise SystemExit("lost same-NRO pair in boundary sensitivity")
          print("Stage283 >=40ms temporal contrast for all five offsets:",
                [[x["shift_seconds"],x["bands"]["ge40"][
                    "difference_of_pooled_rate_differences_per_1000"]]
                 for x in report["candidate_boundaries"]])
          PY
          python3 tools/analyze_nexium_steady_boundary_pair_grid.py \
            --verified-steady-state verified-pairs/steady-state-only-s1-to-s51.json \
            --verified-temporal-thirds verified-pairs/steady-state-three-17s-segments.json \
            --verified-third-sensitivity verified-pairs/steady-state-three-17s-sensitivity.json \
            --verified-temporal-contrasts verified-pairs/steady-state-temporal-contrasts.json \
            --verified-boundary-shifts verified-pairs/steady-state-fixed-left-boundary-shifts.json \
            --output verified-pairs/steady-state-boundary-pair-grid.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("verified-pairs/steady-state-boundary-pair-grid.json").read_text())
          if (result["result"]!="FIVE_BOUNDARIES_EIGHT_DELETIONS_RECONCILED"
                  or result["pair_count"]!=8 or result["shift_count"]!=5
                  or result["fixed_shifts_seconds"]!=[-4,-3,-2,-1,0]
                  or len(result["grid"])!=5
                  or result["stage283_recomputed_exactly_from_source"] is not True
                  or result["same_workflow_pair_removed_in_both_modes_and_both_windows"] is not True
                  or result["scene_switch_causal_effect_established"] is not False
                  or result["physical_switch_tested"] is not False):
              raise SystemExit("Stage284 paired boundary audit invalid")
          for band in ("ge40","ge50"):
              summ=result["matrix_summary"][band]
              if (summ["total_shift_by_excluded_pair_cells"]!=40
                      or summ["positive_cells"]+summ["negative_cells"]
                         +summ["exact_zero_cells"]!=40
                      or any(len(x["bands"][band]["leave_one_pair_out"])!=8
                             for x in result["grid"])):
                  raise SystemExit("incomplete 5x8 original-SD pair deletion matrix")
          print("Stage284 leave-one-pair-out 5x8 grid:",result["matrix_summary"])
          PY
          python3 tools/analyze_nexium_steady_disjoint_bands.py \
            --verified-steady-state verified-pairs/steady-state-only-s1-to-s51.json \
            --verified-temporal-thirds verified-pairs/steady-state-three-17s-segments.json \
            --verified-third-sensitivity verified-pairs/steady-state-three-17s-sensitivity.json \
            --verified-temporal-contrasts verified-pairs/steady-state-temporal-contrasts.json \
            --verified-boundary-shifts verified-pairs/steady-state-fixed-left-boundary-shifts.json \
            --verified-boundary-pair-grid verified-pairs/steady-state-boundary-pair-grid.json \
            --output verified-pairs/steady-state-disjoint-slow-call-bands.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("verified-pairs/steady-state-disjoint-slow-call-bands.json").read_text())
          if (report["result"]!="DISJOINT_40_TO_50_AND_GE50_BANDS_RECONCILED"
                  or report["pair_count"]!=8 or len(report["boundary_rows"])!=5
                  or report["fixed_shifts_seconds"]!=[-4,-3,-2,-1,0]
                  or report["exact_fraction_conservation_before_rounding"] is not True
                  or report["stage284_recomputed_from_archived_original_sd_evidence"] is not True
                  or report["physical_switch_tested"] is not False
                  or report["audible_glitches_measured"] is not False):
              raise SystemExit("Stage285 disjoint band audit incomplete")
          for band in ("ge40","between40and50","ge50"):
              stats=report["matrix_summary"][band]
              if (stats["evaluated_shift_and_exclusion_cells"]!=40
                      or sum(stats[x] for x in ("positive_cells","negative_cells","zero_cells"))!=40):
                  raise SystemExit("Stage285 missing source pair or threshold cell")
          print("Stage285 audited integer 40-50/50+ disjoint band contrast:",
                report["matrix_summary"])
          PY
          python3 tools/analyze_nexium_steady_rate_exposure.py \
            --verified-steady-state verified-pairs/steady-state-only-s1-to-s51.json \
            --verified-temporal-thirds verified-pairs/steady-state-three-17s-segments.json \
            --verified-third-sensitivity verified-pairs/steady-state-three-17s-sensitivity.json \
            --verified-temporal-contrasts verified-pairs/steady-state-temporal-contrasts.json \
            --verified-boundary-shifts verified-pairs/steady-state-fixed-left-boundary-shifts.json \
            --verified-boundary-pair-grid verified-pairs/steady-state-boundary-pair-grid.json \
            --verified-disjoint-bands verified-pairs/steady-state-disjoint-slow-call-bands.json \
            --output verified-pairs/steady-state-rate-exposure-decomposition.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path(
              "verified-pairs/steady-state-rate-exposure-decomposition.json").read_text())
          if (report["result"]!="EXACT_SYMMETRIC_AUDOUT_RATE_EXPOSURE_COMPONENTS_RECONCILED"
                  or report["pair_count"]!=8
                  or len(report["windows"])!=5
                  or report["shifts_seconds"]!=[-4,-3,-2,-1,0]
                  or report["upstream_stage285_exactly_recomputed"] is not True
                  or report["exact_fraction_identity_before_rounding"] is not True
                  or report["no_denominator_interpolation_or_fabricated_calls"] is not True
                  or report["physical_switch_tested"] is not False
                  or report["audible_underruns_measured"] is not False):
              raise SystemExit("Stage286 exposure accounting incomplete")
          for band in ("ge40","between40and50","ge50"):
              summary=report["matrix_summary"][band]
              if (summary["total_shift_and_excluded_pair_cells"]!=40
                      or sum(summary[x] for x in (
                          "count_effect_positive_cells",
                          "count_effect_negative_cells",
                          "count_effect_zero_cells"))!=40
                      or sum(summary[x] for x in (
                          "denominator_effect_positive_cells",
                          "denominator_effect_negative_cells",
                          "denominator_effect_zero_cells"))!=40):
                  raise SystemExit("Stage286 lost numerator/denominator cells")
          print("Stage286 exact slow-call numerator and attempt-denominator effects:",
                report["matrix_summary"])
          PY
          python3 tools/analyze_nexium_steady_second_profile.py \
            --verified-steady-state verified-pairs/steady-state-only-s1-to-s51.json \
            --verified-temporal-thirds verified-pairs/steady-state-three-17s-segments.json \
            --verified-third-sensitivity verified-pairs/steady-state-three-17s-sensitivity.json \
            --verified-temporal-contrasts verified-pairs/steady-state-temporal-contrasts.json \
            --verified-boundary-shifts verified-pairs/steady-state-fixed-left-boundary-shifts.json \
            --verified-boundary-pair-grid verified-pairs/steady-state-boundary-pair-grid.json \
            --verified-disjoint-bands verified-pairs/steady-state-disjoint-slow-call-bands.json \
            --verified-rate-exposure verified-pairs/steady-state-rate-exposure-decomposition.json \
            --output verified-pairs/steady-state-second-profile.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("verified-pairs/steady-state-second-profile.json")
          report=json.loads(p.read_text())
          if (report["result"]!="AUDITED_51_SECOND_SLOW_CALL_CONCENTRATION_RECONCILED"
                  or report["pair_count"]!=8 or report["seconds_included"]!=51
                  or report["excluded_startup_guest_second"]!=0
                  or report["upstream_stage286_recomputed_exactly"] is not True
                  or report["exact_count_and_17s_third_conservation"] is not True
                  or report["exact_ge40_equals_two_disjoint_bands_before_rounding"] is not True
                  or report["guest_service_seconds_not_scheduler_execution_trace"] is not True
                  or report["music_switch_causality_proven"] is not False
                  or report["physical_switch_tested"] is not False):
              raise SystemExit("Stage287 per-second source audit incomplete")
          assert [row["guest_audio_service_second"] for row in report["per_second"]]==list(range(1,52))
          for threshold in ("ge40","between40and50","ge50"):
              stats=report["band_summary"][threshold]
              if (sum(stats[k] for k in ("positive_seconds","negative_seconds",
                                          "exact_zero_seconds"))!=51
                      or len(stats["absolute_gap_concentration"]["top_seconds"])!=5):
                  raise SystemExit("Stage287 per-second rate conservation failed")
          print("Stage287 40-50ms per-second positive/negative/zero and concentration:",
                report["band_summary"]["between40and50"])
          PY
          python3 tools/analyze_nexium_steady_scene_alignment.py \
            "${args[@]}" \
            --verified-steady-state verified-pairs/steady-state-only-s1-to-s51.json \
            --verified-temporal-thirds verified-pairs/steady-state-three-17s-segments.json \
            --verified-third-sensitivity verified-pairs/steady-state-three-17s-sensitivity.json \
            --verified-temporal-contrasts verified-pairs/steady-state-temporal-contrasts.json \
            --verified-boundary-shifts verified-pairs/steady-state-fixed-left-boundary-shifts.json \
            --verified-boundary-pair-grid verified-pairs/steady-state-boundary-pair-grid.json \
            --verified-disjoint-bands verified-pairs/steady-state-disjoint-slow-call-bands.json \
            --verified-rate-exposure verified-pairs/steady-state-rate-exposure-decomposition.json \
            --verified-second-profile verified-pairs/steady-state-second-profile.json \
            --output verified-pairs/steady-state-guest-scene-alignment.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("verified-pairs/steady-state-guest-scene-alignment.json").read_text())
          if (x["result"]!="SAME_GUEST_CLOCK_SCENE_INPUT_AUDOUT_RECONCILED"
                  or x["pair_count"]!=8 or len(x["events"])!=80
                  or x["scene_input_seconds"]["matched_pair_seconds"]!=80
                  or x["other_guest_seconds"]["matched_pair_seconds"]!=328
                  or x["all_matched_seconds"]["matched_pair_seconds"]!=408
                  or x["historical_live_original_sd_audits_required"] is not True
                  or x["upstream_stage287_recalculated_exactly"] is not True
                  or x["same_guest_monotonic_clock_for_scene_and_audout"] is not True
                  or x["independent_audio_scheduler_event_trace_present"] is not False
                  or x["host_pcm_clock_alignment_proven"] is not False
                  or x["scene_switch_causality_proven"] is not False
                  or x["physical_switch_tested"] is not False):
              raise SystemExit("Stage288 guest scene/slow software alignment incomplete")
          if x["near_input_slow_calls_ge40"]!=(
                  x["near_input_slow_calls_40to50"]+x["near_input_slow_calls_ge50"]):
              raise SystemExit("Stage288 disjoint duration bands are inconsistent")
          for e in x["events"]:
              if (e["slow_calls_completed_before_input"]
                  +e["slow_calls_began_after_input"]
                  +e["slow_calls_straddled_input"]
                  !=e["slow_call_beginnings_within_500ms"]):
                  raise SystemExit("Stage288 event temporal order not conserved")
          print("Stage288 verified clock-bound scene/slow observations:",
                {"scene_inputs":len(x["events"]),
                 "near_ge40":x["near_input_slow_calls_ge40"],
                 "near_40to50":x["near_input_slow_calls_40to50"],
                 "near_ge50":x["near_input_slow_calls_ge50"],
                 "scene_40to50_per_1000":x["scene_input_seconds"]["rate_per_1000"]["switch"]["between40and50"],
                 "other_40to50_per_1000":x["other_guest_seconds"]["rate_per_1000"]["switch"]["between40and50"]})
          PY
          sha256sum "$RUNNER_TEMP/neXium-eight/"*.zip \
            > verified-pairs/repacked-source-archives.sha256
          echo "Eight distinct, successful, same-NRO NeXium paired guest evidence archives checked." >> "$GITHUB_STEP_SUMMARY"
          echo "Prior workflows independently audited guest SD originals; archived copies are rechecked here." >> "$GITHUB_STEP_SUMMARY"
          echo "Virtual API slow calls do not prove audio glitches, hardware behavior or causal effects." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload eight-pair reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-verified-eight-idle-switch-pairs
          path: verified-pairs/
          if-no-files-found: warn
          retention-days: 30
