name: MAP02 selectable authored scenes and controller selection
on:
  pull_request:
    paths:
      - 'data/map02_fixture.json'
      - 'data/map02_fixture_b.json'
      - 'tools/generate_map02_fixture.py'
      - 'source/map02_encounter_data.h'
      - 'source/map02_encounter_b_data.h'
      - 'source/map02_battle_fixture.h'
      - 'source/main.c'
      - 'tests/test_map02_two_scenarios.c'
      - 'tests/test_map02_two_scenarios.py'
      - 'Makefile'
      - '.github/workflows/map02-selectable-scenarios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    name: Two-map catalog, bounds, victory and reset (${{ matrix.cc }})
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Validate both JSON maps and reject unapproved scene IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_map02_fixture.py --all --check
          python3 -m unittest discover -s tests -p 'test_map02_two_scenarios.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_encounter_data.py' -v
      - name: Execute catalog selection and alternate complete victory
        shell: bash
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          "$CC" -std=c11 -Wall -Wextra -Werror -pedantic -O2 tests/test_map02_two_scenarios.c -o /tmp/vh-map02-catalog
          /tmp/vh-map02-catalog | tee /tmp/vh-catalog.log
          "$CC" -std=c11 -Wall -Wextra -Werror -pedantic -O0 tests/test_map02_battle_fixture.c -o /tmp/vh-map02-original
          /tmp/vh-map02-original
          grep -Fx 'VH_MAP02_TWO_SCENARIOS_PASS catalog=2 original_preserved=1 alternate_victory=1 bounds_rejected=2 reset=1 retail=0' /tmp/vh-catalog.log
  switch:
    name: Build actual Switch NRO containing two selectable scenes
    runs-on: ubuntu-22.04
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify NRO and both scenario encodings
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:$PATH"
          python3 tools/generate_map02_fixture.py --all --check
          make build/test_map02_two_scenarios
          ./build/test_map02_two_scenarios
          make verify-nro
          test -s build/vandal-hearts-prototype.nro
          echo 'VH_MAP02_TWO_SCENARIOS_NRO_PASS maps=2 controller=L_R reset=Y'
      - uses: actions/upload-artifact@v4
        with:
          name: vh-map02-two-map-nro
          path: build/vandal-hearts-prototype.nro
          if-no-files-found: error
