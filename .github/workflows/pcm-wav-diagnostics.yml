      - 'tests/test_vh_audio_listening_marks.c'
      - 'tests/test_vh_audio_listening_oracle.c'
      - 'tests/test_vh_audio_pause_fifo.c'
      - 'tests/test_vh_audio_pause_wrap.c'
      - 'tests/test_vh_native_audio_soak.c'
      - 'tests/test_vh_native_spu.c'
      - 'tests/test_vh_native_vab.c'
      - 'source/vh_native_vab.c'
      - 'source/vh_audio_stream.c'
      - 'tools/inspect_native_pcm_capture.py'
      - 'tools/analyze_pcm_discontinuities.py'
      - 'tests/test_analyze_pcm_discontinuities.py'
      - 'source/vh_native_seq.c'
      - 'source/vh_native_seq.h'
      - 'source/vh_native_spu.c'
      - 'source/vh_native_spu.h'
      - 'source/vh_audio_output_recovery.c'
      - 'source/vh_audio_output_recovery.h'
      - 'source/vh_audio_listening_marks.h'
      - 'source/vh_audio_mark_buttons.h'
      - 'source/vh_audio_listener_input.h'
      - 'tests/test_vh_audio_listener_input.c'
      - 'tests/test_vh_audio_mark_buttons.c'
      - 'source/vh_audio_input_poll.h'
      - 'source/vh_audio_report_pages.h'
      - 'source/vh_audio_compute_timing.h'
      - 'source/vh_audio_compute_wait_join.h'
      - 'source/vh_audio_page_telemetry.h'
      - 'tests/test_vh_audio_page_telemetry.c'
      - 'tests/test_vh_audio_resume_abort_telemetry.c'
      - 'tests/test_vh_audio_compute_wait_join.c'
      - 'tests/test_vh_audio_compute_timing.c'
      - 'tests/test_vh_audio_report_pages.c'
      - 'tests/test_vh_audio_input_poll.c'
      - 'source/vh_audio_resample.c'
      - '.github/workflows/pcm-wav-diagnostics.yml'
  workflow_dispatch:

jobs:
  pcm-wav-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate WAV diagnostics
        run: |
          python3 -m unittest discover -s tests -p 'test_analyze_pcm*.py' -v
          python3 tests/test_seq_pcm_measurements.py
          python3 tests/test_native_pcm_capture.py
          python3 tests/test_analyze_pcm_discontinuities.py
      - name: Measure actual native C SEQ to SPU to 48k WAV
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
            tests/export_native_seq_pcm_wav.c \
            source/vh_native_seq.c source/vh_native_spu.c \
            source/vh_spu_reverb.c source/vh_spu_gaussian.c \
            source/vh_audio_resample.c source/vh_audio_stream.c \
            -lm -o /tmp/export_native_seq_pcm_wav
          /tmp/export_native_seq_pcm_wav /tmp/native-seq-spu-48k.wav
          python3 tools/analyze_pcm_wav.py /tmp/native-seq-spu-48k.wav \
            --expected-rate 48000 --fail-on-silence
      - name: Verify native PCM reproducibility
        run: |
          /tmp/export_native_seq_pcm_wav /tmp/native-seq-spu-48k-repeat.wav
          cmp /tmp/native-seq-spu-48k.wav /tmp/native-seq-spu-48k-repeat.wav
          sha256sum /tmp/native-seq-spu-48k.wav
          python3 tools/inspect_native_pcm_capture.py /tmp/native-seq-spu-48k.wav
          python3 tools/inspect_native_pcm_capture.py /tmp/native-seq-spu-48k-repeat.wav
          python3 tools/analyze_pcm_discontinuities.py /tmp/native-seq-spu-48k.wav
          python3 tools/analyze_pcm_wav.py /tmp/native-seq-spu-48k-repeat.wav \
            --expected-rate 48000 --fail-on-silence
      - name: Verify resampler PCM invariant to source block partitioning
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
            tests/test_vh_resample_partition.c source/vh_audio_resample.c \
            -o /tmp/test_vh_resample_partition
          /tmp/test_vh_resample_partition
      - name: Verify long-run PCM resampler clock stability
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
            tests/test_vh_resample_long_clock.c source/vh_audio_resample.c \
            -o /tmp/test_vh_resample_long_clock
          /tmp/test_vh_resample_long_clock
      - name: Check resampler block and long clock tests under UBSan
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
            -fsanitize=undefined -fno-sanitize-recover=all \
            tests/test_vh_resample_partition.c source/vh_audio_resample.c \
            -o /tmp/test_vh_resample_partition_ubsan
          /tmp/test_vh_resample_partition_ubsan
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
            -fsanitize=undefined -fno-sanitize-recover=all \
            tests/test_vh_resample_long_clock.c source/vh_audio_resample.c \
            -o /tmp/test_vh_resample_long_clock_ubsan
          /tmp/test_vh_resample_long_clock_ubsan
      - name: Native PCM signal diagnostics under UBSan
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
            -fsanitize=undefined -fno-sanitize-recover=all \
            tests/export_native_seq_pcm_wav.c \
            source/vh_native_seq.c source/vh_native_spu.c \
            source/vh_spu_reverb.c source/vh_spu_gaussian.c \
            source/vh_audio_resample.c source/vh_audio_stream.c \
            -lm -o /tmp/export_native_seq_pcm_wav_ubsan
          /tmp/export_native_seq_pcm_wav_ubsan /tmp/native-seq-spu-48k-ubsan.wav
          cmp /tmp/native-seq-spu-48k.wav /tmp/native-seq-spu-48k-ubsan.wav
          python3 tools/inspect_native_pcm_capture.py /tmp/native-seq-spu-48k-ubsan.wav
          python3 tools/analyze_pcm_wav.py /tmp/native-seq-spu-48k-ubsan.wav \
            --expected-rate 48000 --fail-on-silence
      - name: Detect native PCM memory faults with AddressSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -fno-sanitize-recover=all \
            tests/export_native_seq_pcm_wav.c \
            source/vh_native_seq.c source/vh_native_spu.c \
            source/vh_spu_reverb.c source/vh_spu_gaussian.c \
            source/vh_audio_resample.c source/vh_audio_stream.c \
            -lm -o /tmp/export_native_seq_pcm_wav_asan
          /tmp/export_native_seq_pcm_wav_asan /tmp/native-seq-spu-48k-asan.wav
          cmp /tmp/native-seq-spu-48k.wav /tmp/native-seq-spu-48k-asan.wav
          python3 tools/inspect_native_pcm_capture.py /tmp/native-seq-spu-48k-asan.wav
          python3 tools/analyze_pcm_wav.py /tmp/native-seq-spu-48k-asan.wav \
            --expected-rate 48000 --fail-on-silence
          python3 tools/analyze_pcm_discontinuities.py /tmp/native-seq-spu-48k-asan.wav
      - name: ASan and UBSan on variable-block resampling
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -fno-sanitize-recover=all \
            tests/test_vh_resample_partition.c source/vh_audio_resample.c \
            -o /tmp/test_vh_resample_partition_asan
          /tmp/test_vh_resample_partition_asan
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -fno-sanitize-recover=all \
            tests/test_vh_resample_long_clock.c source/vh_audio_resample.c \
            -o /tmp/test_vh_resample_long_clock_asan
          /tmp/test_vh_resample_long_clock_asan
      - name: Check resampler output capacity and guard integrity under ASan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -fno-sanitize-recover=all \
            tests/test_vh_resample_capacity_guard.c source/vh_audio_resample.c \
            -o /tmp/test_vh_resample_capacity_guard
          /tmp/test_vh_resample_capacity_guard
      - name: Check repeated failed-capacity retry preserves PCM
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -fno-sanitize-recover=all \
            tests/test_vh_resample_retry.c source/vh_audio_resample.c \
            -o /tmp/test_vh_resample_retry
          /tmp/test_vh_resample_retry
      - name: Verify resampler state resume without duplicate PCM
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -fno-sanitize-recover=all \
            tests/test_vh_resample_resume.c source/vh_audio_resample.c \
            -o /tmp/test_vh_resample_resume
          /tmp/test_vh_resample_resume
      - name: Validate queued PCM across synthetic pause under sanitizers
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -fno-sanitize-recover=all \
            tests/test_vh_audio_pause_fifo.c source/vh_audio_stream.c \
            -o /tmp/test_vh_audio_pause_fifo
          /tmp/test_vh_audio_pause_fifo
      - name: Validate PCM pause across FIFO ring wrap and underrun
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -fno-sanitize-recover=all \
            tests/test_vh_audio_pause_wrap.c source/vh_audio_stream.c \
            -o /tmp/test_vh_audio_pause_wrap
          /tmp/test_vh_audio_pause_wrap
      - name: Verify long-running SEQ SPU reverb PCM under sanitizers
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -fno-sanitize-recover=all \
            tests/test_vh_native_audio_soak.c \
            source/vh_native_seq.c source/vh_native_spu.c \
            source/vh_spu_reverb.c source/vh_spu_gaussian.c \
            source/vh_audio_resample.c source/vh_audio_stream.c \
            -lm -o /tmp/test_vh_native_audio_soak_asan
          /tmp/test_vh_native_audio_soak_asan
      - name: Compare optimized and sanitized full SEQ SPU soak
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
            tests/test_vh_native_audio_soak.c \
            source/vh_native_seq.c source/vh_native_spu.c \
            source/vh_spu_reverb.c source/vh_spu_gaussian.c \
            source/vh_audio_resample.c source/vh_audio_stream.c \
            -lm -o /tmp/test_vh_native_audio_soak_optimized
          /tmp/test_vh_native_audio_soak_optimized > /tmp/soak-optimized.txt
          /tmp/test_vh_native_audio_soak_asan > /tmp/soak-sanitized.txt
          diff -u /tmp/soak-optimized.txt /tmp/soak-sanitized.txt
          cat /tmp/soak-optimized.txt
      - name: Gate PCM verification on sparse VAB note selection
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
            tests/test_vh_native_vab.c source/vh_native_vab.c \
            source/vh_native_seq.c source/vh_native_spu.c \
            source/vh_spu_reverb.c source/vh_spu_gaussian.c \
            source/vh_spu_adpcm.c source/vh_audio_stream.c \
            -lm -o /tmp/test_vh_native_vab_pcm_gate
          /tmp/test_vh_native_vab_pcm_gate
      - name: Validate sparse VAB selection under ASan and UBSan
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -fno-sanitize-recover=all \
            tests/test_vh_native_vab.c source/vh_native_vab.c \
            source/vh_native_seq.c source/vh_native_spu.c \
            source/vh_spu_reverb.c source/vh_spu_gaussian.c \
            source/vh_spu_adpcm.c source/vh_audio_stream.c \
            -lm -o /tmp/test_vh_native_vab_sanitized
          /tmp/test_vh_native_vab_sanitized
      - name: Check VAB selection reproducibility across optimization levels
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O0 -Isource \
            tests/test_vh_native_vab.c source/vh_native_vab.c \
            source/vh_native_seq.c source/vh_native_spu.c \
            source/vh_spu_reverb.c source/vh_spu_gaussian.c \
            source/vh_spu_adpcm.c source/vh_audio_stream.c \
            -lm -o /tmp/test_vh_native_vab_o0
          /tmp/test_vh_native_vab_o0 > /tmp/vab-o0.txt
          /tmp/test_vh_native_vab_pcm_gate > /tmp/vab-o2.txt
          /tmp/test_vh_native_vab_sanitized > /tmp/vab-sanitized.txt
          diff -u /tmp/vab-o0.txt /tmp/vab-o2.txt
          diff -u /tmp/vab-o2.txt /tmp/vab-sanitized.txt
      - name: Recheck VAB selection determinism across repeated executions
        run: |
          /tmp/test_vh_native_vab_pcm_gate > /tmp/vab-repeat-1.txt
          /tmp/test_vh_native_vab_pcm_gate > /tmp/vab-repeat-2.txt
          /tmp/test_vh_native_vab_pcm_gate > /tmp/vab-repeat-3.txt
          cmp /tmp/vab-repeat-1.txt /tmp/vab-repeat-2.txt
          cmp /tmp/vab-repeat-1.txt /tmp/vab-repeat-3.txt
          cmp /tmp/vab-o2.txt /tmp/vab-repeat-1.txt
      - name: Verify synthetic scene-source PCM clock continuity
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
            -fsanitize=undefined -fno-sanitize-recover=all \
            tests/test_vh_pcm_scene_source_switch.c source/vh_audio_resample.c \
            -o /tmp/test_vh_pcm_scene_source_switch
          /tmp/test_vh_pcm_scene_source_switch
      - name: Check two decoded VAB banks across SEQ SPU scene transition
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -fno-sanitize-recover=all \
            tests/test_vh_native_bank_switch.c source/vh_native_vab.c \
            source/vh_native_seq.c source/vh_native_spu.c \
            source/vh_spu_reverb.c source/vh_spu_gaussian.c \
            source/vh_spu_adpcm.c source/vh_audio_resample.c \
            source/vh_audio_stream.c -lm -o /tmp/test_vh_native_bank_switch
          /tmp/test_vh_native_bank_switch | tee /tmp/vab-seams-first.txt
          /tmp/test_vh_native_bank_switch > /tmp/vab-seams-repeat.txt
          cmp /tmp/vab-seams-first.txt /tmp/vab-seams-repeat.txt
          grep -Fq 'VAB seam adjacent-sample deltas (PCM16):' /tmp/vab-seams-first.txt
          grep -Fq 'VAB extended transition soak: 16 scenes, 256 blocks, 15 switches,' /tmp/vab-seams-first.txt
          grep -Fq 'VAB all scene seams (PCM16):' /tmp/vab-seams-first.txt
      - name: Compare EON enabled VAB music switches against dry PCM reference
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -fno-sanitize-recover=all \
            tests/test_vh_native_bank_switch_reverb.c source/vh_native_vab.c \
            source/vh_native_seq.c source/vh_native_spu.c \
            source/vh_spu_reverb.c source/vh_spu_gaussian.c \
            source/vh_spu_adpcm.c source/vh_audio_resample.c \
            source/vh_audio_stream.c -lm -o /tmp/test_vh_vab_eon_differential
          /tmp/test_vh_vab_eon_differential | tee /tmp/vab-eon-first.txt
          /tmp/test_vh_vab_eon_differential > /tmp/vab-eon-repeat.txt
          cmp /tmp/vab-eon-first.txt /tmp/vab-eon-repeat.txt
          grep -Fq 'VAB differential EON wet/dry:' /tmp/vab-eon-first.txt
      - name: Audit local synthetic fixture banks without exporting music
        run: |
          set -euo pipefail
          make test-local-music-transition
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -fno-sanitize-recover=all \
            tools/vh_local_music_transition_probe.c \
            source/vh_audio_assets.c source/vh_native_vab.c \
            source/vh_native_seq.c source/vh_native_spu.c \
            source/vh_spu_reverb.c source/vh_spu_adpcm.c \
            source/vh_spu_gaussian.c source/vh_audio_resample.c \
            source/vh_audio_stream.c -lm -o /tmp/vh_local_music_transition_probe_asan
          VH_LOCAL_MUSIC_TRANSITION_PROBE=/tmp/vh_local_music_transition_probe_asan \
            python3 -m unittest discover -s tests \
              -p 'test_vh_local_music_transition_probe.py' -v
      - name: Validate native SPU ADSR release curves and block partition under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          make build/test_vh_native_spu
          ./build/test_vh_native_spu
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -fno-sanitize-recover=all \
            tests/test_vh_native_spu.c \
            source/vh_native_spu.c source/vh_spu_reverb.c \
            source/vh_spu_gaussian.c source/vh_spu_adpcm.c \
