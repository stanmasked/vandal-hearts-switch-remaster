      - 'source/vh_native_vab.c'
      - 'source/vh_audio_stream.c'
      - 'tools/inspect_native_pcm_capture.py'
      - 'tools/analyze_pcm_discontinuities.py'
      - 'tests/test_analyze_pcm_discontinuities.py'
      - 'source/vh_native_seq.c'
      - 'source/vh_native_seq.h'
      - 'source/vh_native_spu.c'
