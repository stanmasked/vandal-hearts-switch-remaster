name: MAP02 v118 exact native four-handler sampled VRAM returns
on:
  pull_request:
    paths:
      - '.github/workflows/map02-v118-four-handler-returns.yml'
      - '.github/workflows/map02-v104-content-guard.yml'
      - 'tools/map02_v115_sample_identity.*'
      - 'tools/apply_map02_v118_pcsx_rearmed.py'
      - 'tools/summarize_map02_v118_quadruplet_runtime.py'
      - 'tests/test_map02_v118_four_native.py'
      - 'tests/test_map02_v118_quadruplet_runtime.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-four-callback-return-witness:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Native exact 24-value observation return regressions
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          for pattern in test_map02_v83_unai_dispatch.py test_map02_v84_unai_samples.py test_map02_v85_native_stores.py test_map02_v114_vblank_readback_coverage.py test_map02_v115_sample_value_identity.py test_map02_v115_identity_runtime.py test_map02_v116_sample_gap_identity.py test_map02_v116_gap_runtime.py test_map02_v117_aba_native.py test_map02_v117_triplet_runtime.py test_map02_v118_four_native.py test_map02_v118_quadruplet_runtime.py; do
            python3 -m unittest discover -s tests -p "$pattern" -v
          done
