name: Music director optional wet-tail regression

on:
  # The draft PR is the primary gate; using push AND pull_request
  # launched duplicate sanitizer matrices on every update.
  pull_request:
    paths:
      - "source/vh_music_scene.c"
      - "source/vh_music_scene.h"
      - "source/vh_native_seq.c"
      - "source/vh_native_seq.h"
      - "source/vh_native_spu.c"
      - "source/vh_native_spu.h"
      - "source/vh_spu_reverb.c"
      - "source/vh_audio_resample.c"
      - "source/vh_audio_stream.c"
      - "source/vh_switch_game_audio.c"
      - "Makefile"
      - "tests/test_vh_music_scene.c"
      - "tests/test_vh_music_scene_soak.c"
      - "tools/verify_switch_wet_tail_nro.py"
      - "tests/test_verify_switch_wet_tail_nro.py"
      - ".github/workflows/music-director-wet-tail.yml"
  workflow_dispatch:

# Cancel stale PR revisions, not an unrelated branch or manual run.
concurrency:
  group: wet-tail-director-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wet-tail-nro-provenance:
    name: Validate wet-tail NRO provenance negative controls
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify existing baseline provenance and new pair gate
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests \
            -p 'test_verify_switch_runtime_nro.py' -v
          python3 -m unittest discover -s tests \
            -p 'test_verify_switch_wet_tail_nro.py' -v

  music-director-optin:
    name: Wet-tail director (${{ matrix.compiler }}; ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Compile cue-switch and legacy compatibility tests with sanitizers
        run: |
          mkdir -p build
          ${{ matrix.compiler }} -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer -Isource \
            tests/test_vh_music_scene.c source/vh_music_scene.c \
            source/vh_native_seq.c source/vh_native_spu.c \
            source/vh_spu_reverb.c source/vh_spu_gaussian.c \
            source/vh_audio_stream.c -lm \
            -o build/test_music_director_wet_tail
      - name: Verify opt-in, default, fade, silence, bank teardown
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build/test_music_director_wet_tail
      - name: Compile 1200-block director PCM and 48k resampler soak
        run: |
          ${{ matrix.compiler }} -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer -Isource \
            tests/test_vh_music_scene_soak.c source/vh_music_scene.c \
            source/vh_native_seq.c source/vh_native_spu.c \
            source/vh_spu_reverb.c source/vh_spu_gaussian.c \
            source/vh_audio_resample.c source/vh_audio_stream.c -lm \
            -o build/test_music_director_soak
      - name: Ensure legacy full-session 48k PCM behavior is unchanged
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build/test_music_director_soak

  switch-game-wet-tail-variants:
    name: Integrated tactical NRO wet-tail=${{ matrix.mode }}
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [0, 1]
    steps:
      - name: Check out exact PR revision
        uses: actions/checkout@v4
      - name: Build isolated gameplay NRO variant without SDL2
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          make BUILD=build/wet-tail-${{ matrix.mode }} \
               GAME_AUDIO_WET_TAIL=${{ matrix.mode }} all
          test -s build/wet-tail-${{ matrix.mode }}/vandal-hearts-prototype.nro
          sha256sum build/wet-tail-${{ matrix.mode }}/vandal-hearts-prototype.nro \
            > build/wet-tail-${{ matrix.mode }}/nro.sha256
          {
            echo "### Experimental wet-tail tactical NRO"
            echo "Mode: \`${{ matrix.mode }}\` (0=legacy default, 1=experimental)"
            echo "Git SHA: \`$GITHUB_SHA\`"
            echo "Hardware: NOT TESTED; compile-only"
            echo "No commercial PS1 content bundled"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload isolated synthetic music NRO and digest
        uses: actions/upload-artifact@v4
        with:
          name: tactical-wet-tail-${{ matrix.mode }}
          path: |
            build/wet-tail-${{ matrix.mode }}/vandal-hearts-prototype.nro
            build/wet-tail-${{ matrix.mode }}/nro.sha256
          if-no-files-found: error

  verify-switch-wet-tail-build-pair:
    name: Verify two exact-run research NRO binaries
    needs: switch-game-wet-tail-variants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download paired NROs from this same workflow run
        uses: actions/download-artifact@v4
        with:
          pattern: tactical-wet-tail-*
          path: variants
      - name: Verify per-mode SHA256 and that binaries differ
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified
          for mode in 0 1; do
            root="variants/tactical-wet-tail-$mode"
            test -d "$root"
            nro="$(find "$root" -type f -name 'vandal-hearts-prototype.nro' -print -quit)"
            manifest="$(find "$root" -type f -name 'nro.sha256' -print -quit)"
            test -n "$nro" && test -n "$manifest"
            test -s "$nro" && test -s "$manifest"
            expected="$(awk 'NR==1{print $1}' "$manifest")"
            actual="$(sha256sum "$nro" | cut -d ' ' -f1)"
            test "$expected" = "$actual"
            printf '%s %s %s\n' "$mode" "$actual" "$GITHUB_SHA" \
              >> verified/binary-variants.txt
          done
          a="$(awk '$1==0{print $2}' verified/binary-variants.txt)"
          b="$(awk '$1==1{print $2}' verified/binary-variants.txt)"
          test "$a" != "$b"
          {
            echo "### Same-run tactical music NRO pair"
            echo "Both NROs match the SHA256 recorded by their individual build jobs."
            echo "Mode 0 and mode 1 binaries have different SHA256s."
            echo "Build-only evidence; no emulator launch or hardware audio asserted."
            cat verified/binary-variants.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload paired-mode provenance
        uses: actions/upload-artifact@v4
        with:
          name: wet-tail-research-nro-pair-verified
          path: verified/binary-variants.txt
          if-no-files-found: error
