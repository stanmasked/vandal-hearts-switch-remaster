name: MAP02 owner-private visual candidates (synthetic CI)
on:
  pull_request:
    paths:
      - '.github/workflows/map02-private-visual-candidates.yml'
      - 'tools/verify_map02_private_visual_candidates.py'
      - 'tests/test_verify_map02_private_visual_candidates.py'
      - 'docs/MAP02_PRIVATE_VISUAL_CANDIDATES.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invented-png-and-frame-markers:
    name: Synthetic PNG/marker integrity (${{ matrix.os }} Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-22.04
            python: '3.11'
          - os: macos-15-intel
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Check 15 fully invented PNG, hash, manual marker invariants
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests \
            -p 'test_verify_map02_private_visual_candidates.py' -v \
            2>&1 | tee /tmp/vh-map02-visual-candidates.log
          grep -F 'Ran 15 tests' /tmp/vh-map02-visual-candidates.log
          if grep -E '^(FAILED|ERROR)' /tmp/vh-map02-visual-candidates.log; then
            exit 1
          fi
          echo "VH_MAP02_VISUAL_CANDIDATES_PASS synthetic=15 owner_png=0 owner_bk2=0 ps1_emulation=0 scene_verified=0"
