name: Stage342 four original NeXium source and NRO capture audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/stage342-four-original-neXium-captures.yml'
permissions:
  contents: read
  actions: read
jobs:
  genuine-four-capture-audit:
    name: Independently source-replay four actual successful NeXium guest-host audio runs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Stage337 four-source and Stage341 original PCM monitor regressions
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_compare_nexium_stage337_four_original_captures.py' -v
          python3 -m unittest discover -s tests -p 'test_audit_nexium_stage341_capture_quality_link.py' -v
      - name: Require all original NeXium source workflows to have completed successfully
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for run in 39166023593 39167324026 39175592570; do
            test "$(gh api "repos/stanmasked/vandal-hearts-switch-remaster/actions/runs/$run" --jq '.status')" = completed
            test "$(gh api "repos/stanmasked/vandal-hearts-switch-remaster/actions/runs/$run" --jq '.conclusion')" = success
          done
          status=queued
          for n in $(seq 1 35); do
            status="$(gh api repos/stanmasked/vandal-hearts-switch-remaster/actions/runs/39182548276 --jq '.status')"
            if [ "$status" = completed ]; then break; fi
            echo "New source run is pending; original source not yet accepted."
            sleep 30
          done
          test "$status" = completed
          test "$(gh api repos/stanmasked/vandal-hearts-switch-remaster/actions/runs/39182548276 --jq '.conclusion')" = success
          test "$(gh api repos/stanmasked/vandal-hearts-switch-remaster/actions/runs/39182548276 --jq '.head_sha')" = 96f29d51ab3ba040e335401377f1e5ab81f2c371
          test "$(gh api repos/stanmasked/vandal-hearts-switch-remaster/actions/runs/39182548276 --jq '.run_attempt')" = 1

      - name: Download first original successful guest audio source
        uses: actions/download-artifact@v4
        with:
          name: nexium-runtime-evidence
          run-id: 39166023593
          github-token: ${{ github.token }}
          path: first-source

      - name: Download second original successful guest audio source
        uses: actions/download-artifact@v4
        with:
          name: nexium-runtime-evidence
          run-id: 39167324026
          github-token: ${{ github.token }}
          path: second-source

      - name: Download third original successful guest audio source
        uses: actions/download-artifact@v4
        with:
          name: nexium-runtime-evidence
          run-id: 39175592570
          github-token: ${{ github.token }}
          path: third-source

      - name: Download fourth new successful guest audio source
        uses: actions/download-artifact@v4
        with:
          name: nexium-runtime-evidence
          run-id: 39182548276
          github-token: ${{ github.token }}
          path: fourth-source

      - name: Check original capture NRO metadata versus separate PCM quality for third and fourth
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("tools").resolve()))
          from compare_nexium_stage337_four_original_captures import find_unique
          from audit_nexium_stage336_capture_build_binding import read_json,verify_monitor_quality
          for name in ("third-source","fourth-source"):
              root=Path(name)
              source=read_json(find_unique(root,"pcm-monitor-report.json"))
              quality=read_json(find_unique(root,"pcm-quality-report.json"))
              preflight=read_json(find_unique(root,"integrated-nro-preflight.json"),max_bytes=4096)
              verify_monitor_quality(source,quality)
              if source["source_nro_sha256"]!=preflight["nro_sha256"]:
                  raise SystemExit("Source NRO/monitor SHA mismatch in "+name)
              print(name,"original source NRO+PCM quality confirmed")
          PY

      - name: Recompute original guest software, host clocks, strict PCM and exact NRO binding
        run: |
          set -euo pipefail
          mkdir -p stage342-audit
          python3 tools/compare_nexium_stage337_four_original_captures.py \
            --first-archive first-source \
            --second-archive second-source \
            --third-archive third-source \
            --fourth-archive fourth-source \
            --old-pins tools/nexium_stage335_first_two_original_source_pins.json \
            --third-git-sha 0b90b38f73d28784e3014c6a012843d755ece581 \
            --third-run-id 39175592570 \
            --third-attempt 1 \
            --fourth-git-sha 96f29d51ab3ba040e335401377f1e5ab81f2c371 \
            --fourth-run-id 39182548276 \
            --fourth-attempt 1 \
            --output stage342-audit/four-original-sources.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("stage342-audit/four-original-sources.json").read_text())
          if (r["result"]!="FOUR_DISTINCT_ORIGINAL_NEXIUM_GUEST_HOST_CAPTURE_COHORTS_SOURCE_VERIFIED"
              or r["all_three_previous_stage335_original_sources_replayed"] is not True
              or r["original_fourth_stage334_receipt_recomputed_exactly"] is not True
              or r["original_fourth_stage336_receipt_recomputed_exactly"] is not True
              or r["historical_third_and_new_fourth_NRO_PCM_monitor_source_bound"] is not True
              or r["all_four_original_guest_host_CSV_source_hashes_distinct"] is not True
              or r["no_software_guest_clock_converted_into_host_PCM_clock"] is not True
              or r["physical_Nintendo_Switch_audio_tested"] is not False):
              raise SystemExit("Stage342 strict original four-source provenance rejected")
          c=r["cohorts"]
          if (len(c)!=4 or
              [x["guest_last_software_duration_ns"] for x in c[:3]]!=[11225937,22352500,18486979] or
              [x["guest_prior_lower_median_software_ns"] for x in c[:3]]!=[32154011,31247083,32374948] or
              type(c[3]["guest_last_software_duration_ns"]) is not int):
              raise SystemExit("Original guest software source cohort mismatch")
          for x in c:
              print(x["source"],"guest software last call ns",x["guest_last_software_duration_ns"],
                    "previous median ns",x["guest_prior_lower_median_software_ns"],
                    "rank",x["guest_last_first_possible_rank"],
                    "host monotonic intervals ns",[d["host_monotonic_delta_ns"] for d in x["host_control_intervals"]])
          PY
          echo "Stage342: four original archived source captures and separate NRO/PCM provenance verified; not physical Switch DAC/speaker audio or guest-host clock synchronization." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload only source-derived compact verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage342-four-genuine-neXium-guest-host-source-audit
          path: stage342-audit/
          if-no-files-found: warn
