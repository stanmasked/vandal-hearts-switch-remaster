name: MAP02 private Start screenshot anchor (synthetic CI)
on:
  pull_request:
    paths:
      - '.github/workflows/map02-private-start-anchor-screenshots.yml'
      - 'tools/map02_bizhawk_private_start_anchor_capture.lua'
      - 'tools/verify_map02_private_start_anchor_reruns.py'
      - 'tests/test_map02_bizhawk_start_anchor_capture_mock.lua'
      - 'tests/test_verify_map02_private_start_anchor_reruns.py'
      - 'docs/MAP02_PRIVATE_START_ANCHOR_SCREENSHOTS.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invented-repeatability:
    name: Invented screenshot reruns (${{ matrix.os }} Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-22.04
            python: '3.11'
          - os: macos-15-intel
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Validate two invented screenshot sets and fake console logs
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests \
            -p 'test_verify_map02_private_start_anchor_reruns.py' -v \
            2>&1 | tee /tmp/vh-map02-private-anchor-reruns.log
          grep -F 'Ran 13 tests' /tmp/vh-map02-private-anchor-reruns.log
          if grep -E '^(FAILED|ERROR)' /tmp/vh-map02-private-anchor-reruns.log; then
            exit 1
          fi
          echo "VH_MAP02_START_SCREENSHOT_RERUNS_PASS synthetic=13 real_bizhawk=0 owner_png=0 map02_frame=unknown"
  fake-bizhawk-capture:
    name: Execute capture Lua against fourteen invented emulator scenarios
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install isolated Lua 5.4 interpreter
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lua5.4
      - name: Execute actual Lua capture tool with fake movie/client/emu/io only
        shell: bash
        run: |
          set -euo pipefail
          lua5.4 tests/test_map02_bizhawk_start_anchor_capture_mock.lua \
            2>&1 | tee /tmp/vh-map02-private-anchor-mock.log
          grep -F 'VH_MAP02_START_ANCHOR_LUA_MOCK_PASS cases=14 original_movie=0 real_bizhawk=0 captured_owner_images=0 map02_verified=0' \
            /tmp/vh-map02-private-anchor-mock.log
