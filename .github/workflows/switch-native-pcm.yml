name: Switch native PCM transport cross-compile

on:
  pull_request:
    paths:
      - "source/vh_audio_stream.c"
      - "source/vh_audio_stream.h"
      - "probes/sdl2_audio_smoke.c"
      - "tests/test_vh_audio_stream.c"
      - "Makefile"
      - ".github/workflows/switch-native-pcm.yml"
  workflow_dispatch:

jobs:
  native-pcm:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile native audio transport for Nintendo Switch AArch64
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          mkdir -p build
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-gcc" \
            -std=c11 -Wall -Wextra -Werror -O2 -Isource \
            -c source/vh_audio_stream.c -o build/vh_audio_stream_switch.o
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-nm" \
            --defined-only build/vh_audio_stream_switch.o
          test -s build/vh_audio_stream_switch.o
      - name: Upload cross-compiled transport object
        uses: actions/upload-artifact@v4
        with:
          name: switch-native-pcm-transport
          path: build/vh_audio_stream_switch.o
          if-no-files-found: error
