name: Native libnx PS1 SEQ VAB music plus graphics probe

on:
  workflow_dispatch:
  push:
    branches:
      - feat/native-av-ps1-seq-integration
    paths:
      - '.github/workflows/native-ps1-music-av.yml'
      - 'probes/libnx_ps1_music_av.c'
      - 'source/vh_*'
      - 'source/game_renderer.h'
      - 'source/game_state.h'
      - 'source/game_rules.h'
      - 'source/platform_input.h'
      - 'source/software_renderer.h'
      - 'tests/test_vh_native_audio_soak.c'
      - 'tests/test_vh_audio_output_recovery.c'
      - 'tests/test_vh_audio_page_telemetry.c'
      - 'tests/test_vh_audio_resume_abort_telemetry.c'
      - 'tests/test_vh_audio_focus_trace.c'
      - 'tests/test_vh_audio_manual_transport.c'
      - 'tests/test_vh_decoded_vab_audout.c'
      - 'tests/test_native_vab_python_reference.py'
      - 'tests/test_native_spu_reverb_reference.py'
      - 'tests/test_native_seq_timing_adsr_reference.py'
      - 'tests/native_seq_adsr_trace.c'
      - 'tools/generate_ps1_music_sd_fixture.py'
      - 'tests/test_generate_ps1_music_sd_fixture.py'
      - 'tests/check_native_av_screenshot.py'
      - 'tests/test_check_native_av_screenshot.py'
      - 'tests/verify_native_av_guest_witness.py'
      - 'tests/test_verify_native_av_guest_witness.py'
      - 'tests/inspect_native_av_physical_screenshots.py'
      - 'tests/test_inspect_native_av_physical_screenshots.py'
      - 'tests/verify_native_av_physical_report.py'
      - 'tests/test_verify_native_av_physical_report.py'
      - 'tests/verify_native_av_nro_manifest.py'
      - 'tests/test_verify_native_av_nro_manifest.py'
      - 'tests/check_nro.py'
      - 'Makefile'
  pull_request:
    paths:
      - '.github/workflows/native-ps1-music-av.yml'
      - 'probes/libnx_ps1_music_av.c'
      - 'source/vh_*'
      - 'tests/test_vh_native_audio_soak.c'
      - 'tests/test_vh_audio_output_recovery.c'
      - 'tests/test_vh_audio_page_telemetry.c'
      - 'tests/test_vh_audio_resume_abort_telemetry.c'
      - 'tests/test_vh_audio_focus_trace.c'
      - 'tests/test_vh_audio_manual_transport.c'
      - 'tests/test_vh_decoded_vab_audout.c'
      - 'tests/test_native_vab_python_reference.py'
      - 'tests/test_native_spu_reverb_reference.py'
      - 'tests/test_native_seq_timing_adsr_reference.py'
      - 'tests/verify_native_av_guest_witness.py'
      - 'tests/test_verify_native_av_guest_witness.py'
      - 'tests/inspect_native_av_physical_screenshots.py'
      - 'tests/test_inspect_native_av_physical_screenshots.py'
      - 'tests/verify_native_av_physical_report.py'
      - 'tests/test_verify_native_av_physical_report.py'
      - 'tests/verify_native_av_nro_manifest.py'
      - 'tests/test_verify_native_av_nro_manifest.py'
      - 'tests/native_seq_adsr_trace.c'
      - 'tools/generate_ps1_music_sd_fixture.py'
      - 'tests/test_generate_ps1_music_sd_fixture.py'
      - 'Makefile'

permissions:
  contents: read

jobs:
  diagnostic-png-regressions:
    name: Synthetic diagnostic PNG regression tests (no hardware)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up isolated Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for screenshot fixtures
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Test all physical-frame pixel invariants on generated PNGs
        run: python -m unittest discover -s tests -p 'test_inspect_native_av_physical_screenshots.py' -v
      - name: Test independent PNG/report rebinding with negative fixtures
        run: python -m unittest discover -s tests -p 'test_verify_native_av_physical_report.py' -v
      - name: Test complete seven-NRO manifest and source commit policy
        run: python -m unittest discover -s tests -p 'test_verify_native_av_nro_manifest.py' -v
      - name: Test scenario-to-published-NRO binding without launching NeXium
        run: python -m unittest discover -s tests -p 'test_verify_native_av_guest_witness.py' -v

  native-av:
    name: Compile original format SEQ VAB SPU plus video (no SDL2)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Validate native PS1 SEQ SPU and 44.1 to 48 kHz audio
        shell: bash
        run: |
          set -euxo pipefail
          make test-audio-stream
          python3 -m unittest discover -s tests -p 'test_generate_ps1_music_sd_fixture.py' -v
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -Isource \
            -fsanitize=undefined -fno-sanitize-recover=all \
            tests/test_vh_native_audio_soak.c source/vh_native_seq.c \
            source/vh_native_spu.c source/vh_spu_reverb.c \
            source/vh_spu_adpcm.c source/vh_spu_gaussian.c \
            source/vh_audio_resample.c source/vh_audio_stream.c \
            -lm -o build/test_ps1_music_av_ubsan
          ./build/test_ps1_music_av_ubsan

      - name: Build PS1 music plus framebuffer NRO
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          make ps1-music-av-probe
          make ps1-music-av-zr-probe
          make ps1-music-av-zl-probe
          make ps1-music-av-resume-probe
          make ps1-music-av-resume-retry-probe
          make ps1-music-av-focus-probe
          make ps1-music-av-focus-manual-probe
          test -s build/libnx-ps1-music-av.nro
          test -s build/libnx-ps1-music-av-zr.nro
          test -s build/libnx-ps1-music-av-zl.nro
          test -s build/libnx-ps1-music-av-resume.nro
          test -s build/libnx-ps1-music-av-resume-retry.nro
          test -s build/libnx-ps1-music-av-focus.nro
          test -s build/libnx-ps1-music-av-focus-manual.nro

      - name: Fingerprint all seven published NROs and CI source commit
        shell: bash
        run: |
          set -euo pipefail
          (
            cd build
            sha256sum \
              libnx-ps1-music-av.nro \
              libnx-ps1-music-av-zr.nro \
              libnx-ps1-music-av-zl.nro \
              libnx-ps1-music-av-resume.nro \
              libnx-ps1-music-av-resume-retry.nro \
              libnx-ps1-music-av-focus.nro \
              libnx-ps1-music-av-focus-manual.nro > native-ps1-av-nro-sha256.txt
            sha256sum --check native-ps1-av-nro-sha256.txt
            printf '%s\n' "$GITHUB_SHA" > native-ps1-av-source-commit.txt
          )
          python3 tests/verify_native_av_nro_manifest.py build --expected-commit "$GITHUB_SHA"

      - name: Upload NRO without proprietary audio assets
        uses: actions/upload-artifact@v4
        with:
          name: native-libnx-ps1-music-av-probe
          path: |
            build/libnx-ps1-music-av.nro
            build/libnx-ps1-music-av-zr.nro
            build/libnx-ps1-music-av-zl.nro
            build/libnx-ps1-music-av-resume.nro
            build/libnx-ps1-music-av-resume-retry.nro
            build/libnx-ps1-music-av-focus.nro
            build/libnx-ps1-music-av-focus-manual.nro
            build/native-ps1-av-nro-sha256.txt
            build/native-ps1-av-source-commit.txt
          if-no-files-found: error


  emulator:
    name: NeXium guest SD case ${{ matrix.sd_case }} (audio not recorded)
    runs-on: ubuntu-26.04
    needs: [native-av, diagnostic-png-regressions]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sd_case: [empty, full, partial, zr, zl, resume, resume_retry]
    steps:
      - uses: actions/checkout@v4
      - name: Download combined libnx AV NRO
        uses: actions/download-artifact@v4
        with:
          name: native-libnx-ps1-music-av-probe
          path: nros
      - name: Confirm downloaded NRO bytes against the published fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/verify_native_av_nro_manifest.py nros --expected-commit "$GITHUB_SHA" --exact-inventory

      - name: Prepare isolated synthetic SD fixture (no game assets)
        shell: bash
        env:
          SD_CASE: ${{ matrix.sd_case }}
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          sd_root="$RUNNER_TEMP/vh-neXium-$SD_CASE"
          mkdir -p "$sd_root"
          mode="$SD_CASE"
          if [[ "$mode" == "zr" || "$mode" == "zl" || "$mode" == "resume" || "$mode" == "resume_retry" ]]; then mode=empty; fi
          python3 -m tools.generate_ps1_music_sd_fixture "$sd_root" --mode "$mode" > runtime-evidence/sd-fixture-manifest.json
          echo "NEXIUM_DATA_ROOT=$sd_root" >> "$GITHUB_ENV"

      - name: Install headless display and Vulkan
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers

      - name: Download NeXium nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          release_json="$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          asset_url="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name == "nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          test -n "$asset_url"
          curl -fL --retry 3 "$asset_url" -o /tmp/nexium-linux.tar.gz
          mkdir -p /tmp/nexium
          tar -xzf /tmp/nexium-linux.tar.gz -C /tmp/nexium
          emu_bin="$(find /tmp/nexium -type f -executable \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$emu_bin"
          echo "NEXIUM_BIN=$emu_bin" >> "$GITHUB_ENV"

      - name: Capture two native AV framebuffer states
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export NRO="nros/libnx-ps1-music-av.nro"
          if [[ "${{ matrix.sd_case }}" == "zr" ]]; then
            export NRO="nros/libnx-ps1-music-av-zr.nro"
          elif [[ "${{ matrix.sd_case }}" == "zl" ]]; then
            export NRO="nros/libnx-ps1-music-av-zl.nro"
          elif [[ "${{ matrix.sd_case }}" == "resume" ]]; then
            export NRO="nros/libnx-ps1-music-av-resume.nro"
          elif [[ "${{ matrix.sd_case }}" == "resume_retry" ]]; then
            export NRO="nros/libnx-ps1-music-av-resume-retry.nro"
          fi
          export SHOT1="runtime-evidence/av-before.png"
          export SHOT2="runtime-evidence/av-after.png"
          export LOG="runtime-evidence/nexium.log"
          timeout --kill-after=5s 85s xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            set -euo pipefail
            "$NEXIUM_BIN" "$NRO" >"$LOG" 2>&1 &
            pid=$!
            cleanup() {
              kill -INT "$pid" 2>/dev/null || true
              sleep 1
              kill -KILL "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            }
            trap cleanup EXIT
            sleep 33
            kill -0 "$pid"
            window="$(xdotool search --onlyvisible --name "NeXium" 2>/dev/null | tail -n 1 || true)"
            test -n "$window"
            timeout --kill-after=2s 10s import -window "$window" "$SHOT1"
            sleep 2
            timeout --kill-after=2s 10s import -window "$window" "$SHOT2"
            test -s "$SHOT1"
            test -s "$SHOT2"
          '
          python3 -m unittest discover -s tests -p 'test_check_native_av_screenshot.py' -v
          python3 -m unittest discover -s tests -p 'test_verify_native_av_guest_witness.py' -v
          # Static pixel fixtures only; no claim of guest or physical HOME.
          python3 -m unittest discover -s tests -p 'test_inspect_native_av_physical_screenshots.py' -v
          case "${{ matrix.sd_case }}" in
            empty)
              source="synthetic"
              audout="initialized"
              pipeline="buffers_returned"
              ;;
            full)
              source="user_files"
              audout="initialized"
              pipeline="buffers_returned"
              ;;
            zr)
              source="synthetic"
              audout="initialized"
              pipeline="buffers_returned"
              ;;
            zl)
              source="synthetic"
              audout="unavailable_or_error"
              pipeline="inactive_or_error"
              ;;
            resume|resume_retry)
              source="synthetic"
              audout="initialized"
              pipeline="buffers_returned"
              ;;
            partial)
              source="invalid_or_partial"
              audout="unavailable_or_error"
              pipeline="inactive_or_error"
              ;;
            *) exit 2 ;;
          esac
          scene_switch_gate=()
          if [[ "$source" == "synthetic" && "${{ matrix.sd_case }}" != "zl" ]]; then
            scene_switch_gate=(--require-synthetic-scene-switches)
          elif [[ "$source" == "user_files" ]]; then
            scene_switch_gate=(--require-no-synthetic-switches)
          fi
          zr_gate=()
          zl_gate=()
          resume_gate=()
          if [[ "${{ matrix.sd_case }}" == "resume" ]]; then
            resume_gate=(--require-guest-resume-continuation)
          elif [[ "${{ matrix.sd_case }}" == "resume_retry" ]]; then
            resume_gate=(--require-guest-resume-continuation
                         --require-guest-resume-retry)
          fi
          if [[ "${{ matrix.sd_case }}" == "zr" ]]; then
            zr_gate=(--require-guest-zr-recovery)
          elif [[ "${{ matrix.sd_case }}" == "zl" ]]; then
            zl_gate=(--require-guest-zl-no-replay)
          fi
          python3 tests/check_native_av_screenshot.py "$SHOT1" "$SHOT2" \
            --require-audio-source "$source" --require-audout-status "$audout" \
            --require-audio-pipeline "$pipeline" "${scene_switch_gate[@]}" \
            "${zr_gate[@]}" "${zl_gate[@]}" "${resume_gate[@]}" \
            --witness-out runtime-evidence/native-av-guest-witness.json \
            --nro-file "$NRO" --source-revision "$GITHUB_SHA" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT"
          # Independent verifier reads the created JSON and recomputes
          # hashes and framebuffer observations from the exact files.
          python3 tests/verify_native_av_guest_witness.py \
            --witness runtime-evidence/native-av-guest-witness.json \
            --before "$SHOT1" --after "$SHOT2" --nro "$NRO" \
            --revision "$GITHUB_SHA" --scenario "${{ matrix.sd_case }}" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --published-nro-dir nros

      - name: Publish validated AV guest evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: native-ps1-music-av-nexium-${{ matrix.sd_case }}-evidence
          path: runtime-evidence/
          if-no-files-found: error

      - name: Retain failure-only diagnostics without witness JSON
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-ps1-music-av-nexium-${{ matrix.sd_case }}-diagnostics
          path: |
            runtime-evidence/av-before.png
            runtime-evidence/av-after.png
            runtime-evidence/nexium.log
            runtime-evidence/sd-fixture-manifest.json
          if-no-files-found: warn

  verify-published-evidence:
    name: Verify all seven uploaded NeXium evidence bundles
    runs-on: ubuntu-26.04
    needs: [native-av, emulator]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install offline image validator
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pil
      - name: Download the published NRO artifact
        uses: actions/download-artifact@v4
        with:
          name: native-libnx-ps1-music-av-probe
          path: nros
      - name: Download all published guest evidence bundles
        uses: actions/download-artifact@v4
        with:
          pattern: native-ps1-music-av-nexium-*-evidence
          path: published-evidence
          merge-multiple: false
      - name: Re-verify downloaded PNG and NRO bytes for every case
        shell: bash
        run: |
          set -euo pipefail
          for scenario in empty full partial zr zl resume resume_retry; do
            folder="published-evidence/native-ps1-music-av-nexium-${scenario}-evidence"
            nro="nros/libnx-ps1-music-av.nro"
            case "$scenario" in
              zr) nro="nros/libnx-ps1-music-av-zr.nro" ;;
              zl) nro="nros/libnx-ps1-music-av-zl.nro" ;;
              resume) nro="nros/libnx-ps1-music-av-resume.nro" ;;
              resume_retry) nro="nros/libnx-ps1-music-av-resume-retry.nro" ;;
            esac
            test -s "$folder/native-av-guest-witness.json"
            test -s "$folder/av-before.png"
            test -s "$folder/av-after.png"
            test -s "$nro"
            python3 tests/verify_native_av_guest_witness.py \
              --witness "$folder/native-av-guest-witness.json" \
              --before "$folder/av-before.png" \
              --after "$folder/av-after.png" \
              --nro "$nro" --revision "$GITHUB_SHA" --scenario "$scenario" \
              --github-run-id "$GITHUB_RUN_ID" \
              --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
              --published-nro-dir nros
          done
