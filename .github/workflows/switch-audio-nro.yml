name: Switch native music audio NRO

on:
  push:
    branches:
      - test/cdxa-extract-decode-pipeline
    paths:
      - "source/vh_*"
      - "probes/sdl2_audio_smoke.c"
      - "tests/test_vh_audio_assets.c"
      - "Makefile"
      - "tools/classify_switch_portlib_install.py"
      - ".github/workflows/switch-audio-nro.yml"
  pull_request:
    paths:
      - "source/vh_*"
      - "probes/sdl2_audio_smoke.c"
      - "Makefile"
      - "tools/classify_switch_portlib_install.py"
      - ".github/workflows/switch-audio-nro.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-nro:
    name: Build and validate Switch SDL2 music audio NRO
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260219
    timeout-minutes: 30
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4

      - name: Validate official pinned Switch SDL2 portlib without network install
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          PORT="$DEVKITPRO/portlibs/switch"
          {
            echo "STAGE402_ORIGINAL_AUDIO_WORKFLOW_OFFICIAL_IMAGE"
            echo "STAGE402_DEVKITA64_COMPILER=$(test -x "$DEVKITA64/bin/aarch64-none-elf-gcc" && echo yes || echo no)"
            echo "STAGE402_SDL2_CONFIG=$(test -x "$PORT/bin/sdl2-config" && echo yes || echo no)"
            echo "STAGE402_SDL2_HEADER=$(test -f "$PORT/include/SDL2/SDL.h" && echo yes || echo no)"
            echo "STAGE402_SDL2_ARCHIVE=$(test -s "$PORT/lib/libSDL2.a" && echo yes || echo no)"
          } | tee stage402-official-sdl2-availability.txt
          if [ ! -x "$DEVKITA64/bin/aarch64-none-elf-gcc" ] ||
             [ ! -x "$PORT/bin/sdl2-config" ] ||
             [ ! -f "$PORT/include/SDL2/SDL.h" ] ||
             [ ! -s "$PORT/lib/libSDL2.a" ]; then
            echo "::error::MISSING_OFFICIAL_SWITCH_SDL2_PORTLIB: image lacks SDL2; no NRO build claimed"
            exit 2
          fi
          "$PORT/bin/sdl2-config" --version
          echo "STAGE402_ORIGINAL_WORKFLOW_SDL2_VERIFIED" >> stage402-official-sdl2-availability.txt

      - name: Preserve original workflow SDL2 dependency verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage402-original-switch-sdl2-official-image-receipt
          path: |
            stage402-official-sdl2-availability.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Compile and inspect music NRO
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/switch/bin:$PATH"
          make sdl2-audio-probe
          test -s build/sdl2-audio-switch-probe.nro

      - name: Run synthetic native music tests
        shell: bash
        run: |
          set -euo pipefail
          make test-audio-stream

      - name: Upload synthetic/local-resource audio NRO
        uses: actions/upload-artifact@v4
        with:
          name: switch-music-audio-nro
          path: build/sdl2-audio-switch-probe.nro
          if-no-files-found: error
