name: Switch native music audio NRO

on:
  push:
    branches:
      - test/cdxa-extract-decode-pipeline
    paths:
      - "source/vh_*"
      - "probes/sdl2_audio_smoke.c"
      - "tests/test_vh_audio_assets.c"
      - "Makefile"
      - "tools/classify_switch_portlib_install.py"
      - ".github/workflows/switch-audio-nro.yml"
  pull_request:
    paths:
      - "source/vh_*"
      - "probes/sdl2_audio_smoke.c"
      - "Makefile"
      - "tools/classify_switch_portlib_install.py"
      - ".github/workflows/switch-audio-nro.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-nro:
    name: Build and validate Switch SDL2 music audio NRO
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 30
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4

      - name: Install Nintendo Switch SDL2 development libraries
        shell: bash
        run: |
          set -euo pipefail
          conf="${DEVKITPRO:-/opt/devkitpro}/pacman/etc/pacman.conf"
          if [ -f "$conf" ] && ! grep -q '^XferCommand[[:space:]]*=' "$conf"; then
            sed -i '/^\[options\]/a XferCommand = /usr/bin/curl --user-agent "pacman/6.1.0 (Linux x86_64) libalpm/14.0.0" -L -C - -f -o %o %u' "$conf"
          fi
          # Keep the original package-manager bytes for post-failure provenance.
          install_log="stage366-sdl2-install.log"
          installed=0
          for attempt in 1 2; do
            if dkp-pacman -Sy --noconfirm switch-sdl2 >"$install_log" 2>&1; then
              cat "$install_log"
              installed=1
              break
            fi
            cat "$install_log"
            # HTTP 403 is an external mirror authorization/CDN failure.
            # Retrying it repeatedly only delays an actionable diagnosis.
            if grep -Eq '403|Forbidden' "$install_log"; then break; fi
            sleep "$attempt"
          done
          if [ "$installed" -ne 1 ]; then
            # pipefail keeps the original classifier's non-zero result.
            # Never turn unavailable SDL2 into a successful NRO build.
            python3 tools/classify_switch_portlib_install.py \
              --package switch-sdl2 --log "$install_log" \
              | tee stage366-sdl2-diagnostic.txt
            exit 1
          fi
          test -x "${DEVKITPRO:-/opt/devkitpro}/portlibs/switch/bin/sdl2-config"

      - name: Preserve Stage366 SDL2 install evidence even when dependency fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage366-sdl2-portlib-install-evidence
          path: |
            stage366-sdl2-install.log
            stage366-sdl2-diagnostic.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Compile and inspect music NRO
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/switch/bin:$PATH"
          make sdl2-audio-probe
          test -s build/sdl2-audio-switch-probe.nro

      - name: Run synthetic native music tests
        shell: bash
        run: |
          set -euo pipefail
          make test-audio-stream

      - name: Upload synthetic/local-resource audio NRO
        uses: actions/upload-artifact@v4
        with:
          name: switch-music-audio-nro
          path: build/sdl2-audio-switch-probe.nro
          if-no-files-found: error
