              99) pattern='test_map02_v99_interrupted.py';;
              100) pattern='test_map02_v100_directory_sync.py';;
              101) pattern='test_map02_v101_reopen.py';;
              102) pattern='test_map02_v102_anchored_paths.py';;
              103) pattern='test_map02_v103_inode_guard.py';;
              104) pattern='test_map02_v104_content_guard.py';;
