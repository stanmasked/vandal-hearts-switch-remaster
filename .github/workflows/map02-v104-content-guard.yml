      - name: Build actual Unai software renderer with C/C++ observability
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cc == 'clang' && 'clang++' || 'g++' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl1.2-dev libpng-dev zlib1g-dev
          git -C upstream-pcsx submodule update --init --depth=1
          mkdir -p proof/public
          (
            cd upstream-pcsx
            CC="$CC" CXX="$CXX" ./configure --platform=generic --gpu=unai --disable-dynarec --sound-drivers=sdl
            make -j2 VH_MAP02_V66_PCSX_PROBE=1 CC="$CC" CXX="$CXX" > ../proof/private-build.log 2>&1
            test -s pcsx
            grep -Fx 'USE_ASYNC_GPU = 1' config.mak
            nm pcsx | grep -w vh88_async_counter
            nm pcsx | grep -w vh89_copy_metric
            nm pcsx | grep -w vh90_stat
            nm pcsx | grep -w vh92_pressure_metric
            nm pcsx | grep -w vh80_record
            nm pcsx | grep -w vh81_format_jsonl
            nm pcsx | grep -w vh82_publish_private
          ) || { tail -n 100 proof/private-build.log; exit 1; }
          echo 'Pinned Unai actual pixel store C/C++ instrumentation linked, synthetic-only' > proof/public/v104-build-summary.txt
