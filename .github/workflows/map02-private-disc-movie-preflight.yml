name: MAP02 private disc/movie preflight (synthetic CI)
on:
  pull_request:
    paths:
      - '.github/workflows/map02-private-disc-movie-preflight.yml'
      - 'tools/map02_private_disc_movie_preflight.py'
      - 'tools/map02_private_bin_digest_init.py'
      - 'tests/test_map02_private_bin_digest_init.py'
      - 'tests/test_map02_private_disc_movie_preflight.py'
      - 'docs/MAP02_PRIVATE_DISC_MOVIE_PREFLIGHT.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disc-movie-preflight:
    name: Fictional CD sectors and BK2 metadata (${{ matrix.os }} Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-22.04
            python: '3.11'
          - os: macos-15-intel
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Validate invented media preflight cases
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests \
            -p 'test_map02_private_disc_movie_preflight.py' -v \
            2>&1 | tee /tmp/vh-map02-media-preflight-test.log
          count=$(sed -nE 's/^Ran ([1-9][0-9]*) tests? in .*$/\1/p' /tmp/vh-map02-media-preflight-test.log)
          if [[ ! "$count" =~ ^[1-9][0-9]*$ ]]; then
            echo 'missing or repeated valid unittest summary' >&2
            exit 1
          fi
          if grep -E '^(FAILED|ERROR)' /tmp/vh-map02-media-preflight-test.log; then
            exit 1
          fi
          grep -qx 'OK' /tmp/vh-map02-media-preflight-test.log
          echo "VH_MAP02_MEDIA_PREFLIGHT_PASS synthetic=${count} original_bin=0 original_bk2=0 bios=0 replay=0"
      - name: Verify secure fictional full-BIN digest reference bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests \
            -p 'test_map02_private_bin_digest_init.py' -v \
            2>&1 | tee /tmp/vh-map02-private-bin-bootstrap.log
          count=$(sed -nE 's/^Ran ([1-9][0-9]*) tests? in .*$/\1/p' /tmp/vh-map02-private-bin-bootstrap.log)
          if [[ "$count" != "14" ]]; then
            echo 'unexpected fictional BIN bootstrap test count' >&2
            exit 1
          fi
          if grep -E '^(FAILED|ERROR)' /tmp/vh-map02-private-bin-bootstrap.log; then
            exit 1
          fi
          grep -qx 'OK' /tmp/vh-map02-private-bin-bootstrap.log
          echo "VH_MAP02_PRIVATE_BIN_REFERENCE_BOOTSTRAP_PASS tests=$count original_bin=0 owner_digest_published=0"
