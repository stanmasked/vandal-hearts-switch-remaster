name: MAP02 private disc/movie preflight (synthetic CI)
on:
  pull_request:
    paths:
      - '.github/workflows/map02-private-disc-movie-preflight.yml'
      - 'tools/map02_private_disc_movie_preflight.py'
      - 'tools/map02_windows_private_output_acl.py'
      - 'tools/map02_windows_private_output_acl.ps1'
      - 'tools/map02_windows_private_acl_ci_probe.ps1'
      - 'tests/test_map02_windows_private_output_acl.py'
      - 'tools/map02_private_two_capture_audit.py'
      - 'tools/map02_private_two_replay_runner.py'
      - 'tools/map02_private_bizhawk_poweron_launch.py'
      - 'tools/map02_private_psx_firmware_probe.py'
      - 'tools/map02_private_core_witness_audit.py'
      - 'tests/test_map02_private_core_witness_audit.py'
      - 'tools/map02_runtime_core_witness/**'
      - 'docs/MAP02_RUNTIME_CORE_WITNESS.md'
      - 'tests/test_map02_private_psx_firmware_probe.py'
      - 'tools/map02_private_bin_digest_init.py'
      - 'tests/test_map02_private_bin_digest_init.py'
      - 'tests/test_map02_private_disc_movie_preflight.py'
      - 'docs/MAP02_PRIVATE_DISC_MOVIE_PREFLIGHT.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disc-movie-preflight:
    name: Fictional CD sectors and BK2 metadata (${{ matrix.os }} Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-22.04
            python: '3.11'
          - os: macos-15-intel
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Validate invented media preflight cases
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests \
            -p 'test_map02_private_disc_movie_preflight.py' -v \
            2>&1 | tee /tmp/vh-map02-media-preflight-test.log
          count=$(sed -nE 's/^Ran ([1-9][0-9]*) tests? in .*$/\1/p' /tmp/vh-map02-media-preflight-test.log)
          if [[ ! "$count" =~ ^[1-9][0-9]*$ ]]; then
            echo 'missing or repeated valid unittest summary' >&2
            exit 1
          fi
          if grep -E '^(FAILED|ERROR)' /tmp/vh-map02-media-preflight-test.log; then
            exit 1
          fi
          grep -qx 'OK' /tmp/vh-map02-media-preflight-test.log
          echo "VH_MAP02_MEDIA_PREFLIGHT_PASS synthetic=${count} original_bin=0 original_bk2=0 bios=0 replay=0"
      - name: Verify secure fictional full-BIN digest reference bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests \
            -p 'test_map02_private_bin_digest_init.py' -v \
            2>&1 | tee /tmp/vh-map02-private-bin-bootstrap.log
          count=$(sed -nE 's/^Ran ([1-9][0-9]*) tests? in .*$/\1/p' /tmp/vh-map02-private-bin-bootstrap.log)
          if [[ "$count" != "14" ]]; then
            echo 'unexpected fictional BIN bootstrap test count' >&2
            exit 1
          fi
          if grep -E '^(FAILED|ERROR)' /tmp/vh-map02-private-bin-bootstrap.log; then
            exit 1
          fi
          grep -qx 'OK' /tmp/vh-map02-private-bin-bootstrap.log
          echo "VH_MAP02_PRIVATE_BIN_REFERENCE_BOOTSTRAP_PASS tests=$count original_bin=0 owner_digest_published=0"
      - name: Compare invented PSX firmware metadata and local BIOS fingerprints
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests \
            -p 'test_map02_private_psx_firmware_probe.py' -v \
            2>&1 | tee /tmp/vh-map02-psx-firmware-probe.log
          count=$(sed -nE 's/^Ran ([1-9][0-9]*) tests? in .*$/\1/p' /tmp/vh-map02-psx-firmware-probe.log)
          if [[ "$count" != "17" ]]; then
            echo 'unexpected fictional PSX firmware candidate test count' >&2
            exit 1
          fi
          if grep -E '^(FAILED|ERROR)' /tmp/vh-map02-psx-firmware-probe.log; then
            exit 1
          fi
          grep -qx 'OK' /tmp/vh-map02-psx-firmware-probe.log
          echo "VH_MAP02_PRIVATE_PSX_FIRMWARE_METADATA_PASS cases=$count actual_bios=0 original_bk2=0 emuhawk=0"
      - name: Audit 20 fictional in-process PSX runtime core witnesses
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests \
            -p 'test_map02_private_core_witness_audit.py' -v \
            2>&1 | tee /tmp/vh-map02-runtime-core-witness.log
          count=$(sed -nE 's/^Ran ([1-9][0-9]*) tests? in .*$/\1/p' /tmp/vh-map02-runtime-core-witness.log)
          if [[ "$count" != "20" ]]; then
            echo 'unexpected synthetic runtime core witness test count' >&2
            exit 1
          fi
          if grep -E '^(FAILED|ERROR)' /tmp/vh-map02-runtime-core-witness.log; then
            exit 1
          fi
          grep -qx 'OK' /tmp/vh-map02-runtime-core-witness.log
          echo "VH_MAP02_RUNTIME_CORE_WITNESS_SYNTHETIC_PASS cases=$count real_emuhawk=0 loaded_core_authenticated=0"
      - name: Reject invented unsafe Windows private capture ACLs
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests \
            -p 'test_map02_windows_private_output_acl.py' -v \
            2>&1 | tee /tmp/vh-map02-windows-output-acl.log
          count=$(sed -nE 's/^Ran ([1-9][0-9]*) tests? in .*$/\1/p' /tmp/vh-map02-windows-output-acl.log)
          if [[ "$count" != "10" ]]; then
            echo 'unexpected synthetic NTFS ACL preflight test count' >&2
            exit 1
          fi
          if grep -E '^(FAILED|ERROR)' /tmp/vh-map02-windows-output-acl.log; then
            exit 1
          fi
          grep -qx 'OK' /tmp/vh-map02-windows-output-acl.log
          echo "VH_MAP02_WINDOWS_OUTPUT_ACL_SYNTHETIC_PASS cases=$count ps1_original=0"
