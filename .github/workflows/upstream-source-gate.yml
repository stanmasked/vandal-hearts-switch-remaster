name: Pinned upstream source gate

on:
  push:
    branches:
      - ci/pinned-upstream-source-gate
  pull_request:
    paths:
      - ".github/workflows/upstream-source-gate.yml"
      - "docs/UPSTREAM_SOURCE_GATE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Switch project
        uses: actions/checkout@v4

      - name: Checkout audited upstream source revision
        uses: actions/checkout@v4
        with:
          repository: HalmyLyseas/VandalHearts-PcPort
          ref: 14552fffa0e0b47e02b57592e274fc6e7a649923
          path: upstream
          persist-credentials: false

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build libsdl2-dev libopenal-dev libgl-dev python3

      - name: Verify pinned source and required build entry points
        shell: bash
        run: |
          set -euo pipefail
          expected=14552fffa0e0b47e02b57592e274fc6e7a649923
          actual="$(git -C upstream rev-parse HEAD)"
          test "$actual" = "$expected"
          test -s upstream/README.md
          test -s upstream/docs/building.md
          test -s upstream/platform/pc/CMakeLists.txt
          test -s upstream/platform/pc/Makefile
          test -s upstream/docs/pc-port/data-segment.md
          grep -q 'find_package(SDL2 REQUIRED)' upstream/platform/pc/CMakeLists.txt
          grep -q 'VH_PSX_EXE' upstream/platform/pc/CMakeLists.txt
          grep -q 'SLUS_004.47' upstream/docs/building.md
          echo "Pinned upstream revision and native build entry points verified."

      - name: Configure upstream native PC build without optional HD libraries
        run: |
          cmake -S upstream/platform/pc -B build-upstream -G Ninja \
            -DVH_WEBP=OFF -DVH_HDVIDEO=OFF
          echo "CMake configure passed. No game executable/disc data was supplied; this is not a compile, link, or runtime test."
