      - name: Execute real MIPS UV-strided FT4 tpage-X64 and STP FT3 diagonal GPU VRAM oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m remaster.tools.make_map02_v73_uv_tpage_mips_exe \
            --output proof/SYNTHETIC_V73_UV_TPAGE_FT3.EXE
          test "$(stat -c %s proof/SYNTHETIC_V73_UV_TPAGE_FT3.EXE)" -eq 4096
          mkdir -m 700 proof/v73-home
          timeout 30s env SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            HOME="$PWD/proof/v73-home" \
            VH_MAP02_V66_PCSX_LOG="$PWD/proof/V73_SYNTHETIC_GPU_INPUT.jsonl" \
            VH_MAP02_V69_CALLBACK_LOG="$PWD/proof/V73_SYNTHETIC_PLUGIN_CALLBACKS.jsonl" \
            ./upstream-pcsx/pcsx -novid -nodrc -nothread --vh73-uv-diagonal-smoke \
              proof/SYNTHETIC_V73_UV_TPAGE_FT3.EXE \
            > proof/V73_NATIVE_PIXEL_ORACLE.txt 2>&1 || {
              tail -n 90 proof/V73_NATIVE_PIXEL_ORACLE.txt
              exit 1
            }
          grep -F 'VH73_VRAM_PASS checked=399 uv=16 tpage=16 diagonal=16 guard=351' \
            proof/V73_NATIVE_PIXEL_ORACLE.txt
          python3 -m remaster.tools.audit_map02_v69_plugin_callbacks \
            --log proof/V73_SYNTHETIC_PLUGIN_CALLBACKS.jsonl \
            --output proof/V73_SYNTHETIC_CALLBACK_COUNTS.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from remaster.tools.make_map02_v73_uv_tpage_mips_exe import build,GP0_SEQUENCE,expected_pixel
          raw=Path("proof/SYNTHETIC_V73_UV_TPAGE_FT3.EXE").read_bytes()
          exe,pc,code=build()
          assert exe==raw and len(exe)==4096
          events=[json.loads(t) for t in Path("proof/V73_SYNTHETIC_GPU_INPUT.jsonl").read_text().splitlines()]
          gp0=[x["word"] for x in events if x["kind"]=="GP0_MMIO"]
          gp1=[x["word"] for x in events if x["kind"]=="GP1_WRITE"]
          assert gp0==list(GP0_SEQUENCE),(len(gp0),len(GP0_SEQUENCE))
          assert 0x01000000 in gp1
          report=json.loads(Path("proof/V73_SYNTHETIC_CALLBACK_COUNTS.json").read_text())
          assert report["plugin_callback_counts"]["writeData"]>=len(GP0_SEQUENCE)
          assert report["plugin_callback_counts"]["writeStatus"]>=1
          for gate in ("gpu_plugin_fifo_consumption_verified","gpu_rendering_or_pixel_parity_verified",
                       "retail_gp0_provenance_verified","original_retail_MAP02_verified",
                       "HD_replacement_approved"):
              assert report[gate] is False,gate
          oracle=[expected_pixel(x,y) for y in range(55,62) for x in range(39,96)]
          assert len(oracle)==399 and oracle.count(0)==351
          assert sum(v!=0 for v in oracle)==48
          print("PASS real PCSX GPU VRAM: 399 exact native pixels, FT4 UV tpage and FT3 diagonal")
          print("CLOSED synthetic software GPU output does not approve retail MAP02 or Switch HD")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import struct
          from remaster.tools.make_map02_v73_uv_tpage_mips_exe import build,GP0_SEQUENCE,MAGIC
          from remaster.tools.make_map02_v70_synthetic_psx_exe import lui,ori
          exe,pc,mips=build()
          bad=bytearray(exe)
          bad[0x4c:0x54]=b"BADMARK!"
          Path("proof/V73_BAD_MARKER.EXE").write_bytes(bad)
          def replace_gpu_word(index,old,new):
              # MIPS sequence is 6 opcodes of GP1 init, then
              # 3 fixed opcodes (lui/ori/sw) for each GP0 word.
              assert GP0_SEQUENCE[index]==old,(index,GP0_SEQUENCE[index],old)
              changed=bytearray(exe)
              if (old>>16)!=(new>>16):
                  struct.pack_into("<I",changed,2048+4*(6+3*index),lui(9,new>>16))
              if (old&0xffff)!=(new&0xffff):
                  struct.pack_into("<I",changed,2048+4*(7+3*index),ori(9,9,new&0xffff))
              return changed
          uv=GP0_SEQUENCE.index(0x01000008)
          Path("proof/V73_BAD_UV.EXE").write_bytes(replace_gpu_word(uv,0x01000008,0x01000004))
          page=GP0_SEQUENCE.index(0x01010004)
          Path("proof/V73_BAD_TPAGE.EXE").write_bytes(replace_gpu_word(page,0x01010004,0x01000004))
          second=GP0_SEQUENCE.index(0x27000000,GP0_SEQUENCE.index(0x27000000)+1)
          Path("proof/V73_BAD_DIAGONAL.EXE").write_bytes(replace_gpu_word(second,0x27000000,0x25000000))
          PY
          timeout 15s env SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            HOME="$PWD/proof/v73-home" \
            ./upstream-pcsx/pcsx -novid -nodrc -nothread --vh73-uv-diagonal-smoke \
              proof/V73_BAD_MARKER.EXE > proof/V73_BAD_MARKER_LOG.txt 2>&1 && {
              echo 'ERROR: marker forgery passed'
              exit 1
            }
          grep -F 'VH73_EXE_REFUSED' proof/V73_BAD_MARKER_LOG.txt
          for mistake in UV TPAGE DIAGONAL; do
            timeout 15s env SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
              HOME="$PWD/proof/v73-home" \
              ./upstream-pcsx/pcsx -novid -nodrc -nothread --vh73-uv-diagonal-smoke \
                "proof/V73_BAD_${mistake}.EXE" \
              > "proof/V73_BAD_${mistake}_LOG.txt" 2>&1 && {
                echo "ERROR: incorrect ${mistake} GPU pixels passed oracle"
                exit 1
              }
            grep -F 'VH73_VRAM_REFUSED' "proof/V73_BAD_${mistake}_LOG.txt"
          done
          echo "PASS VRAM oracle rejects wrong UV interpolation, tpage and FT3 diagonal STP"
          sha256sum proof/SYNTHETIC_V73_UV_TPAGE_FT3.EXE \
            proof/V73_NATIVE_PIXEL_ORACLE.txt proof/V73_SYNTHETIC_CALLBACK_COUNTS.json \
            >> proof/SHA256SUMS
