permissions:
  contents: read

jobs:
  synthetic-uv-tpage-ft3-diagonal-matrix:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Checkout diagnostics
        uses: actions/checkout@v4
        with:
          path: remaster
          persist-credentials: false
      - name: Checkout exact public PC-port source
        uses: actions/checkout@v4
        with:
          repository: HalmyLyseas/VandalHearts-PcPort
          ref: 14552fffa0e0b47e02b57592e274fc6e7a649923
          path: pcport
          persist-credentials: false
      - name: Apply read-only origin + frame observers to disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 -m remaster.tools.make_map02_trace_patch pcport --output "$RUNNER_TEMP/map02-v42.patch"
          (
            cd pcport
            git apply --check "$RUNNER_TEMP/map02-v42.patch"
            git apply "$RUNNER_TEMP/map02-v42.patch"
          )
          python3 -m remaster.tools.instrument_map02_v39 pcport \
            --header remaster/tools/vh_map02_v39_tokens.h --apply
          python3 -m remaster.tools.instrument_map02_v40 pcport --apply
          python3 -m remaster.tools.instrument_map02_v41 pcport --apply
          python3 -m remaster.tools.instrument_map02_v47 pcport --apply
          python3 -m remaster.tools.instrument_map02_v48 pcport --apply
          python3 -m remaster.tools.instrument_map02_v49 pcport --apply
          # Apply the bounded v57 GP0(E6) change to the disposable pinned copy ONLY.
          python3 -m remaster.tools.apply_map02_gpu_mask_v57 pcport --check
          python3 -m remaster.tools.apply_map02_gpu_mask_v57 pcport --apply
          python3 -m remaster.tools.apply_map02_gp0_ot_v58 pcport --check
          python3 -m remaster.tools.apply_map02_gp0_ot_v58 pcport --apply
          python3 -m remaster.tools.instrument_map02_v59_trace pcport --check
          python3 -m remaster.tools.instrument_map02_v59_trace pcport --apply
          (
            cd pcport
            git diff --check
            git rev-parse HEAD | grep -x 14552fffa0e0b47e02b57592e274fc6e7a649923
          )
      - name: Run preflight unit and adversarial bounds tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s remaster/tests -p 'test_map02_prs_v45.py' -v
      - name: Run face provenance join adversarial cases
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s remaster/tests -p 'test_map02_face_evidence_v46.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_faces_v47.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_pixels_v48.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_vram_v49.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_gpu_modes_v50.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_hires_modes_v51.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_overdraw_v52.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_actual_ot_v53.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_large_ot_v54.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_spatial_ot_v55.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_triangle_seams_v56.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_gpu_mask_v57.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_gp0_ot_v58.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_v59_trace.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_v60_ps1_dma.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_v61_private_capture.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_v62_gp0.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_v63_gp0_gp1_state.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_v64_event_journal.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_v65_gpu_probe.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_v66_pcsx_patch.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_v67_versioned_ram.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_v68_mixed_gpu.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_v69_plugin_callbacks.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_v70_psx_exe.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_v71_vram_oracle.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_v72_ft4_oracle.py' -v
          python3 -m unittest discover -s remaster/tests -p 'test_map02_v73_uv_tpage_diagonal.py' -v
      - name: Compile original PRS unpacker, game terrain producer, GTE and GPU
        shell: bash
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          mkdir -p proof
          opts=(-std=gnu89 -O2 -g -fno-omit-frame-pointer
                -ffunction-sections -fdata-sections
                -DPC_PORT -DPC_FEAT -DVH_MAP02_V39_TRACE
                -Ipcport/platform/pc/include -Ipcport/platform/pc/src)
          "$CC" "${opts[@]}" -c pcport/platform/pc/src/libgpu.c -o proof/libgpu.o
          "$CC" "${opts[@]}" -c pcport/platform/pc/src/pc_raster.c -o proof/pc_raster.o
          "$CC" "${opts[@]}" -c remaster/tests/map02_v42_test_shims.c -o proof/test_shims.o
          # The pinned game source still contains GNU89 forward-declaration
          # ambiguities diagnosed by Clang. Match v39-v41 object-build gate.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pcport/src/core/graphics.c")
          s = p.read_text()
          anchor = '#include "PsyQ/gtemac.h"'
          assert s.count(anchor) == 1
          extra = ('\nvoid UpdateMapTileLighting(MapTileModel *tileModel);'
                   '\nvoid RenderMapTile(u32 *ot, MapTileModel *tileModel, s32 gridColor);'
                   '\nvoid RenderEdgeMapTile(u32 *ot, MapTileModel *tileModel, s32 gridColor);'
                   '\nvoid RenderOverheadMapTile(u32 *ot, MapTileModel *tileModel, s32 brightness);')
          p.write_text(s.replace(anchor, anchor + extra, 1))
          PY
          common=(-std=gnu89 -O2 -g -fno-omit-frame-pointer
                  -ffunction-sections -fdata-sections
                  -DPERMUTER -DPC_PORT -DPC_FEAT -DVH_REGION_US
                  -DVH_TRACE_MAP02 -DVH_MAP02_V39_TRACE
                  '-Dasm(x)='
                  -Ipcport/platform/pc/include -Ipcport/platform/pc/src -Ipcport/include
                  -Iremaster/tests/fixtures
                  -Ipcport
                  -include pc_forward_decls.h
                  -Wno-incompatible-pointer-types -Wno-int-conversion
                  -Wno-int-to-pointer-cast -Wno-pointer-to-int-cast)
          "$CC" "${common[@]}" -c pcport/src/core/graphics.c -o proof/graphics.o
          "$CC" "${opts[@]}" -c pcport/platform/pc/src/libgte.c -o proof/libgte.o
          "$CC" "${common[@]}" -c pcport/src/maps/unpack.c -o proof/unpack.o
          "$CC" "${common[@]}" -c remaster/tests/map02_v49_vram_runtime.c -o proof/driver.o
          "$CC" -Wl,--gc-sections -o proof/map02_gpu_runtime \
            proof/driver.o proof/unpack.o proof/graphics.o proof/libgte.o proof/libgpu.o proof/pc_raster.o proof/test_shims.o \
            -lm -lpthread
          nm -a proof/map02_gpu_runtime | grep -q PC_Map02V39MarkSubmitted
          nm -a proof/map02_gpu_runtime | grep -q RenderMapTile
          nm -a proof/map02_gpu_runtime | grep -q PC_GTE_RTPT
          nm -a proof/map02_gpu_runtime | grep -q ProcessMapFileData
          nm -a proof/map02_gpu_runtime | grep -q UnpackMapFileData
          strings proof/map02_gpu_runtime | grep -F '[v40-terrain-hires] f=%u'
          sha256sum proof/*.o proof/map02_gpu_runtime > proof/SHA256SUMS
      - name: Compare real C unpacker against bounded Python across token classes
        shell: bash
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          "$CC" -std=gnu89 -O2 -ffunction-sections -fdata-sections \
            -c remaster/tests/map02_v45_unpack_tokens_native.c -o proof/native_tokens.o
          "$CC" -Wl,--gc-sections proof/native_tokens.o proof/unpack.o \
            -o proof/native_token_differential
          ./proof/native_token_differential > proof/NATIVE_TOKEN_DIFFERENTIAL.txt
          python3 - <<'PY'
          from pathlib import Path
          from remaster.tools.preflight_map02_prs_v45 import unpack_bounded
          fixtures = {
              "literal": (b"\x00ABCDEFGH", 8),
              "absolute": (b"\x01\x00\x00", 3),
              "relative": (b"\x01\x80", 2),
              "literal_run": (b"\x01\xc0abcdefgh", 8),
              "relative_overlap": (b"\x02A\x81", 3),
              "absolute_overlap": (bytes((2, ord("X"), 3, 222)), 4),
          }
          result = Path("proof/NATIVE_TOKEN_DIFFERENTIAL.txt").read_text()
          rows = [line.split() for line in result.splitlines()
                  if line.startswith("NATIVE_TOKEN ")]
          assert len(rows) == len(fixtures), (rows, result)
          assert len({row[1] for row in rows}) == len(fixtures)
          for _, name, length, native_hash in rows:
              payload, expected = fixtures[name]
              data = unpack_bounded(payload, expected)
              h = 1469598103934665603
              for byte in data:
                  h = ((h ^ byte) * 1099511628211) & 0xffffffffffffffff
              assert int(length) == expected, name
              assert native_hash == f"{h:016x}", (name, native_hash, f"{h:016x}")
          print("PASS: bounded Python and original PC-port decoder match on all six token fixtures.")
          PY
      - name: Execute genuine PRS unpacker and validate generated synthetic data
        shell: bash
        run: |
          set -euo pipefail
          VH_V45_SYNTHETIC_PRS_OUTPUT=proof/SYNTHETIC_M_MAP02.PRS ./proof/map02_gpu_runtime > proof/real-producer-SYNTHETIC-graphics.jsonl 2> proof/real-producer-SYNTHETIC-stderr.log || { tail -n 120 proof/real-producer-SYNTHETIC-stderr.log; exit 1; }
          VH_RASTER_THREADS=1 ./proof/map02_gpu_runtime \
            2> proof/real-producer-SYNTHETIC-single-worker-stderr.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          a = Path("proof/real-producer-SYNTHETIC-stderr.log").read_text()
          b = Path("proof/real-producer-SYNTHETIC-single-worker-stderr.log").read_text()
          rx = re.compile(r"\[v44\] FRAMEBUFFER_HASH native=([0-9a-f]+) hires=([0-9a-f]+)")
          assert "[raster] hi-res worker threads: 2" in a, "did not enable two-thread rasterizer"
          assert "[raster] hi-res worker threads: 1" in b, "did not enable single-thread control"
          ma, mb = rx.findall(a), rx.findall(b)
          assert len(ma) == len(mb) == 1, (ma, mb)
          assert ma[0] == mb[0], f"framebuffer mismatch between 2 and 1 threads: {ma}, {mb}"
          assert "[v45] PASS real UnpackMapFileData" in a and "[v45] PASS real UnpackMapFileData" in b
          assert "[v44] UNPACK_OK " in a and "[v44] UNPACK_OK " in b
          print("PASS: original GPU VRAM and hi-res buffers hash-identically with 1 vs 2 threads.")
          print("framebuffer native={}, hires={}".format(*ma[0]))
          PY
          grep -F '[v45] PASS real UnpackMapFileData' proof/real-producer-SYNTHETIC-stderr.log
          grep -F '[v45] REFERENCE_DECODED_FNV64=' proof/real-producer-SYNTHETIC-stderr.log
          grep -F '[v44] UNPACK_OK ' proof/real-producer-SYNTHETIC-stderr.log
          python3 -m remaster.tools.verify_map02_v41 \
            proof/real-producer-SYNTHETIC-stderr.log \
            --output proof/real-producer-SYNTHETIC-correlated.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("proof/real-producer-SYNTHETIC-correlated.json").read_text())
          assert r["status"] == "provenance_correlated", r
          assert r["paired_primitive_count"] == 3, r
          assert r["ot_primitive_count"] == 3, r
          assert r["frames_with_events"] == 2, r
          assert r["native_sample_count"] > 0, r
          assert r["hires_sample_count"] > 0, r
          assert r["errors"] == [], r
          assert not r["gameplay_execution_proven"], r
          assert not r["pixel_equivalence_proven"], r
          lines = Path("proof/real-producer-SYNTHETIC-stderr.log").read_text().splitlines()
          for name in ("v39-terrain-ot", "v39-terrain-dda", "v40-terrain-hires"):
              assert any(f"[{name}]" in x for x in lines), name
          # An untagged matching-UV sprite and a wrong-map FT4 still draw
          # but must not gain a terrain provenance event.
          assert not any("[v39-terrain-ot] f=3 " in x for x in lines), lines
          assert {p["gfx"] for p in r["examples_of_paired_frame_tokens"]} == {641, 643}, r
