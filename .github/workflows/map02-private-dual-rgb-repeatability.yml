name: MAP02 private paired RGB capture repeatability (synthetic CI)
on:
  pull_request:
    paths:
      - '.github/workflows/map02-private-dual-rgb-repeatability.yml'
      - 'tools/map02_private_dual_capture_rgb_repeatability.py'
      - 'tests/test_map02_private_dual_capture_rgb_repeatability.py'
      - 'docs/MAP02_PRIVATE_DUAL_RGB_REPEATABILITY.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-rgb-synthetic:
    name: Fictional paired PNG captures (${{ matrix.os }} Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-22.04
            python: '3.11'
          - os: macos-15-intel
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Validate invented two-capture repeatability situations
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests \
            -p 'test_map02_private_dual_capture_rgb_repeatability.py' -v \
            2>&1 | tee /tmp/vh-map02-private-dual-rgb-test.log
          count=$(sed -nE 's/^Ran ([1-9][0-9]*) tests? in .*$/\1/p' /tmp/vh-map02-private-dual-rgb-test.log)
          if [[ ! "$count" =~ ^[1-9][0-9]*$ ]]; then
            echo 'missing or repeated valid unittest summary' >&2
            exit 1
          fi
          if grep -E '^(FAILED|ERROR)' /tmp/vh-map02-private-dual-rgb-test.log; then
            exit 1
          fi
          grep -qx 'OK' /tmp/vh-map02-private-dual-rgb-test.log
          echo "VH_MAP02_DUAL_RGB_TEST_PASS synthetic=${count} owner_bk2=0 owner_png=0 real_octoshock=0 map02_identified=0"
