name: MAP02 v140 native MIPS GPU DMA MMIO effect equality
on:
  pull_request:
    paths:
      - '.github/workflows/map02-v140-native-mmio-effects.yml'
      - '.github/workflows/map02-v104-content-guard.yml'
      - 'tools/apply_map02_v140_mmio_effects.py'
      - 'tools/check_map02_v140_native_mmio_effects.py'
      - 'tests/test_map02_v140_native_mmio_effects.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-derived-mips-mmio-values:
    name: exact source MMIO effective addresses and values (${{ matrix.cc }})
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Source-only GP0/DMA data integrity, sanitizer and four mutations
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          no_retail_images_in_ci=1
          readonly no_retail_images_in_ci
          test "$no_retail_images_in_ci" = 1
          python3 -m unittest discover -s tests -p 'test_map02_v140_native_mmio_effects.py' -v
          python3 -m tools.check_map02_v140_native_mmio_effects --cc "$CC"
          python3 -m unittest discover -s tests -p 'test_map02_v139_native_words.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v138_interpreter_pc.py' -v
          echo "VH140_SYNTHETIC_MMIO_DATA_PASS original_retail_map02=0"
