name: Host SPU audio regressions

on:
  push:
    branches:
      - test/cdxa-extract-decode-pipeline
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - "source/**"
      - "probes/sdl2_audio_smoke.c"
      - "Makefile"
      - "docs/VAB_STRUCTURE_AUDIT.md"
      - ".github/workflows/host-audio-tests.yml"
  workflow_dispatch:

jobs:
  spu-audio:
    name: spu-audio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Python syntax checks
        run: python3 -m compileall -q tools tests
      - name: Native C stereo PCM ring regression
        run: |
          mkdir -p build
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_audio_stream.c source/vh_audio_stream.c \
             -o build/test_vh_audio_stream
          ./build/test_vh_audio_stream
      - name: Native C PCM ring undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g \
             -fsanitize=undefined -fno-omit-frame-pointer -Isource \
             tests/test_vh_audio_stream.c source/vh_audio_stream.c \
             -o build/test_vh_audio_stream_ubsan
          ./build/test_vh_audio_stream_ubsan
      - name: Native SPU ADPCM + 20-voice mixing regression
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_native_spu.c source/vh_native_spu.c source/vh_spu_reverb.c \
             source/vh_spu_gaussian.c source/vh_spu_adpcm.c \
             source/vh_audio_stream.c \
             -lm -o build/test_vh_native_spu
          ./build/test_vh_native_spu
      - name: Native SPU and ADPCM undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g \
             -fsanitize=undefined -fno-omit-frame-pointer -Isource \
             tests/test_vh_native_spu.c source/vh_native_spu.c source/vh_spu_reverb.c \
             source/vh_spu_gaussian.c source/vh_spu_adpcm.c \
             source/vh_audio_stream.c \
             -lm -o build/test_vh_native_spu_ubsan
          ./build/test_vh_native_spu_ubsan
      - name: Native SEQ 512-frame scheduler and voice ownership
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_native_seq.c source/vh_native_seq.c \
             source/vh_native_spu.c source/vh_spu_reverb.c source/vh_spu_gaussian.c \
             source/vh_audio_stream.c -lm -o build/test_vh_native_seq
          ./build/test_vh_native_seq
      - name: Native SEQ scheduler under UBSan
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
             -fsanitize=undefined -fno-omit-frame-pointer \
             tests/test_vh_native_seq.c source/vh_native_seq.c \
             source/vh_native_spu.c source/vh_spu_reverb.c source/vh_spu_gaussian.c \
             source/vh_audio_stream.c -lm -o build/test_vh_native_seq_ubsan
          ./build/test_vh_native_seq_ubsan
      - name: Native sparse VH/VB bank and SEQ to stereo regression
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_native_vab.c source/vh_native_vab.c \
             source/vh_native_seq.c source/vh_native_spu.c source/vh_spu_reverb.c \
             source/vh_spu_adpcm.c source/vh_spu_gaussian.c \
             source/vh_audio_stream.c -lm -o build/test_vh_native_vab
          ./build/test_vh_native_vab
      - name: Native VH/VB loader under UBSan
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
             -fsanitize=undefined -fno-omit-frame-pointer \
             tests/test_vh_native_vab.c source/vh_native_vab.c \
             source/vh_native_seq.c source/vh_native_spu.c source/vh_spu_reverb.c \
             source/vh_spu_adpcm.c source/vh_spu_gaussian.c \
             source/vh_audio_stream.c -lm -o build/test_vh_native_vab_ubsan
          ./build/test_vh_native_vab_ubsan
      - name: Read-only local asset loader with missing/oversized bank tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_audio_assets.c source/vh_audio_assets.c \
             source/vh_native_vab.c source/vh_native_seq.c \
             source/vh_native_spu.c source/vh_spu_reverb.c source/vh_spu_adpcm.c \
             source/vh_spu_gaussian.c source/vh_audio_stream.c \
             -lm -o build/test_vh_audio_assets
          ./build/test_vh_audio_assets
      - name: Read-only local audio asset loader with UBSan
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
             -fsanitize=undefined -fno-omit-frame-pointer \
             tests/test_vh_audio_assets.c source/vh_audio_assets.c \
             source/vh_native_vab.c source/vh_native_seq.c \
             source/vh_native_spu.c source/vh_spu_reverb.c source/vh_spu_adpcm.c \
             source/vh_spu_gaussian.c source/vh_audio_stream.c \
             -lm -o build/test_vh_audio_assets_ubsan
          ./build/test_vh_audio_assets_ubsan
      - name: Cross-block 44100-to-48000 stereo resampler
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_audio_resample.c source/vh_audio_resample.c \
             -o build/test_vh_audio_resample
          ./build/test_vh_audio_resample
      - name: 48k audout resampler under UBSan
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g \
             -fsanitize=undefined -fno-omit-frame-pointer -Isource \
             tests/test_vh_audio_resample.c source/vh_audio_resample.c \
             -o build/test_vh_audio_resample_ubsan
          ./build/test_vh_audio_resample_ubsan
      - name: STUDIO_C native reverb and tail regression
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
            tests/test_vh_spu_reverb.c source/vh_spu_reverb.c \
            source/vh_native_spu.c source/vh_spu_gaussian.c \
            source/vh_audio_stream.c -lm -o build/test_vh_spu_reverb
          ./build/test_vh_spu_reverb
      - name: STUDIO_C reverb under UBSan
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
            -fsanitize=undefined -fno-omit-frame-pointer \
            tests/test_vh_spu_reverb.c source/vh_spu_reverb.c \
            source/vh_native_spu.c source/vh_spu_gaussian.c \
            source/vh_audio_stream.c -lm -o build/test_vh_spu_reverb_ubsan
          ./build/test_vh_spu_reverb_ubsan
      - name: SEQ to STUDIO_C to audout-resampler 2048-block soak
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
            tests/test_vh_native_audio_soak.c source/vh_native_seq.c \
            source/vh_native_spu.c source/vh_spu_reverb.c \
            source/vh_spu_gaussian.c source/vh_audio_resample.c \
            source/vh_audio_stream.c -lm -o build/test_vh_native_audio_soak
          ./build/test_vh_native_audio_soak
      - name: Gameplay scene music cue and crossfade regression
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_music_scene.c source/vh_music_scene.c \
             source/vh_native_seq.c source/vh_native_spu.c \
             source/vh_spu_reverb.c source/vh_spu_gaussian.c \
             source/vh_audio_stream.c -lm -o build/test_vh_music_scene
          ./build/test_vh_music_scene
      - name: Gameplay scene cue transitions under UBSan
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
             -fsanitize=undefined -fno-omit-frame-pointer \
             tests/test_vh_music_scene.c source/vh_music_scene.c \
             source/vh_native_seq.c source/vh_native_spu.c \
             source/vh_spu_reverb.c source/vh_spu_gaussian.c \
             source/vh_audio_stream.c -lm -o build/test_vh_music_scene_ubsan
          ./build/test_vh_music_scene_ubsan
      - name: Scene transitions through 48k PCM 1200-block soak
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_music_scene_soak.c source/vh_music_scene.c \
             source/vh_native_seq.c source/vh_native_spu.c \
             source/vh_spu_reverb.c source/vh_spu_gaussian.c \
             source/vh_audio_resample.c source/vh_audio_stream.c \
             -lm -o build/test_vh_music_scene_soak
          ./build/test_vh_music_scene_soak
      - name: Tactical input music mailbox regression
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_game_music_mailbox.c source/vh_game_music_mailbox.c \
             -pthread -o build/test_vh_game_music_mailbox
          ./build/test_vh_game_music_mailbox
      - name: Tactical music mailbox under UBSan
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
             -fsanitize=undefined -fno-omit-frame-pointer \
             tests/test_vh_game_music_mailbox.c source/vh_game_music_mailbox.c \
             -pthread -o build/test_vh_game_music_mailbox_ubsan
          ./build/test_vh_game_music_mailbox_ubsan
      - name: Suspension and focus resume preserve native audio clocks
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_music_focus_resume.c \
             source/vh_game_music_mailbox.c source/vh_music_scene.c \
             source/vh_native_seq.c source/vh_native_spu.c \
             source/vh_spu_reverb.c source/vh_spu_gaussian.c \
             source/vh_audio_resample.c source/vh_audio_stream.c \
             -lm -o build/test_vh_music_focus_resume
          ./build/test_vh_music_focus_resume
      - name: Suspension/resume audio clocks under UBSan
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
             -fsanitize=undefined -fno-omit-frame-pointer \
             tests/test_vh_music_focus_resume.c \
             source/vh_game_music_mailbox.c source/vh_music_scene.c \
             source/vh_native_seq.c source/vh_native_spu.c \
             source/vh_spu_reverb.c source/vh_spu_gaussian.c \
             source/vh_audio_resample.c source/vh_audio_stream.c \
             -lm -o build/test_vh_music_focus_resume_ubsan
          ./build/test_vh_music_focus_resume_ubsan
      - name: Native SPU ADPCM versus Python differential test
        run: python3 tests/test_native_spu_adpcm.py
      - name: Compare native Gaussian against Python reference
        run: python3 tests/test_native_spu_gaussian.py
      - name: Differential-check native VH/VB resolver against Python
        run: python3 tests/test_native_vab_python_reference.py
      - name: Differential-check native STUDIO_C against PC-port integer oracle
        run: python3 tests/test_native_spu_reverb_reference.py
      - name: STUDIO_C optimized vs baseline FIR checksum and throughput
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             -DVH_REV_FIR_REFERENCE=1 tests/bench_vh_spu_reverb.c \
             source/vh_spu_reverb.c -lm -o build/bench_vh_reverb_reference
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/bench_vh_spu_reverb.c source/vh_spu_reverb.c \
             -lm -o build/bench_vh_reverb_optimized
          build/bench_vh_reverb_reference | tee build/reverb_reference.txt
          build/bench_vh_reverb_optimized | tee build/reverb_optimized.txt
          grep '^CHECKSUM ' build/reverb_reference.txt > build/reference.checksum
          grep '^CHECKSUM ' build/reverb_optimized.txt > build/optimized.checksum
          diff -u build/reference.checksum build/optimized.checksum
          python3 - <<'PY'
          from pathlib import Path
          def number(path, key):
              for line in Path(path).read_text().splitlines():
                  if line.startswith(key+" "):
                      return float(line.split()[1])
              raise AssertionError(key)
          baseline = number("build/reverb_reference.txt", "ELAPSED_NS")
          optimized = number("build/reverb_optimized.txt", "ELAPSED_NS")
          print("Host diagnostic speedup (not a Switch measurement):",
                f"{baseline/optimized:.2f}x")
          PY
      - name: Run VAB, SPU and synthetic audio tests
        run: |
          python3 tests/test_inspect_spu_vag.py
          python3 tests/test_inspect_vab_header.py
          python3 tests/test_inspect_vab_sizes.py
          python3 tests/test_decode_spu_adpcm.py
          python3 tests/test_decode_vab_sample.py
          python3 tests/test_resolve_vab_note.py
          python3 tests/test_simulate_spu_voice.py
          python3 tests/test_render_vab_note.py
          python3 tests/test_spu_gaussian_interpolation.py
          python3 tests/test_mix_spu_stereo.py
          python3 tests/test_inspect_ps1_seq.py
          python3 tests/test_seq_to_chord_schedule.py
          python3 tests/test_render_ps1_seq.py
          python3 tests/test_seq_voice_slots.py
          python3 tests/test_repeat_ps1_seq.py
          python3 tests/test_spu_voice_lifetime.py
          python3 tests/test_schedule_ps1_seq_blocks.py
