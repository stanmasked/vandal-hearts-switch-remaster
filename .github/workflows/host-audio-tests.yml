name: Host SPU audio regressions

on:
  push:
    branches:
      - test/cdxa-extract-decode-pipeline
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - "source/**"
      - "probes/sdl2_audio_smoke.c"
      - "Makefile"
      - "docs/VAB_STRUCTURE_AUDIT.md"
      - ".github/workflows/host-audio-tests.yml"
  workflow_dispatch:

jobs:
  spu-audio:
    name: spu-audio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Python syntax checks
        run: python3 -m compileall -q tools tests
      - name: Audout cross-run repeatability negative controls
        run: python3 -m unittest discover -s tests -p 'test_audit_nexium_audout_repeatability.py' -v
      - name: Stage 271 audout second-window maxima negative controls
        run: python3 -m unittest discover -s tests -p 'test_analyze_nexium_audout_window_maxima.py' -v
      - name: Audout per-call latency histogram provenance regressions
        run: python3 -m unittest discover -s tests -p 'test_audit_nexium_audout_latency.py' -v
      - name: Guest clock to audout window cross-binding negative controls
        run: python3 -m unittest discover -s tests -p 'test_audit_nexium_audout_scene_correlation.py' -v
      - name: Matched steady-state guest seconds 1-51 regressions
        run: python3 -m unittest discover -s tests -p 'test_analyze_nexium_steady_state.py' -v
      - name: Stage 280 three 17-second audio-window partitions and negative controls
        run: python3 -m unittest discover -s tests -p 'test_analyze_nexium_steady_segments.py' -v
      - name: Stage 281 leave-one-pair-out three-window sensitivity regressions
        run: python3 -m unittest discover -s tests -p 'test_analyze_nexium_steady_segment_sensitivity.py' -v
      - name: Stage 282 same-pair temporal contrast and drift regressions
        run: python3 -m unittest discover -s tests -p 'test_analyze_nexium_steady_temporal_contrasts.py' -v
      - name: Stage 283 fixed 17-second boundary shift synthetic regressions
        run: python3 -m unittest discover -s tests -p 'test_analyze_nexium_steady_boundary_shifts.py' -v
      - name: Stage 284 5x8 boundary-by-pair exclusion regression controls
        run: python3 -m unittest discover -s tests -p 'test_analyze_nexium_steady_boundary_pair_grid.py' -v
      - name: Stage 285 disjoint 40-50ms vs ge50ms integer conservation
        run: python3 -m unittest discover -s tests -p 'test_analyze_nexium_steady_disjoint_bands.py' -v
      - name: Stage 286 exact numerator-vs-exposure rate decomposition regressions
        run: python3 -m unittest discover -s tests -p 'test_analyze_nexium_steady_rate_exposure.py' -v
      - name: Stage 287 audited 51-second slow-call concentration tests
        run: python3 -m unittest discover -s tests -p 'test_analyze_nexium_steady_second_profile.py' -v
      - name: Stage 288 authenticated guest INPUT and precise slow-call alignment
        run: python3 -m unittest discover -s tests -p 'test_analyze_nexium_steady_scene_alignment.py' -v
      - name: Stage 289 guest audout pre-submit service probe negative controls
        run: python3 -m unittest discover -s tests -p 'test_audit_nexium_audout_service_probes.py' -v
      - name: Stage 290 strict original-SD two-mode pre-submit probe comparison tests
        run: python3 -m unittest discover -s tests -p 'test_analyze_nexium_idle_switch_service_probes.py' -v
      - name: Stage 291 original slow-call sample phase independence negative controls
        run: python3 -m unittest discover -s tests -p 'test_analyze_nexium_probe_phase_sensitivity.py' -v
      - name: Stage 292 full-session and actual 1-in-16 probe phase rate conservation
        run: python3 -m unittest discover -s tests -p 'test_analyze_nexium_phase_selection_gap.py' -v
      - name: Stage 293 exact 16-call slow-latency group occupancy regressions
        run: python3 -m unittest discover -s tests -p 'test_analyze_nexium_slow_call_cycle_occupancy.py' -v
      - name: Stage295 compare two REAL guest service queue sample phases with synthetic negatives
        run: python3 -m unittest discover -s tests -p 'test_compare_nexium_real_queue_phases.py' -v
      - name: Stage296 four original-SD real phase queries with reversed order tests
        run: python3 -m unittest discover -s tests -p 'test_audit_nexium_phase_order_reversal.py' -v
      - name: Stage297 original-SD four full-audout versus 1-in-16 queried call tests
        run: python3 -m unittest discover -s tests -p 'test_audit_nexium_phase_order_full_call_rates.py' -v
      - name: Stage298 exact sampled phase versus 15 unqueried source-call complements
        run: python3 -m unittest discover -s tests -p 'test_audit_nexium_phase_order_call_complement.py' -v
      - name: Stage299 virtual PCM integrity and discontinuity candidate synthetic tests
        run: python3 -m unittest discover -s tests -p 'test_analyze_nexium_pcm_stream_integrity.py' -v
      - name: Stage300 exact digital silence run placement within actual host-scene markers
        run: python3 -m unittest discover -s tests -p 'test_analyze_nexium_pcm_scene_silence.py' -v
      - name: Stage301 independent marker envelope conservation and forgery controls
        run: python3 -m unittest discover -s tests -p 'test_audit_nexium_pcm_marker_uncertainty.py' -v
      - name: Stage302 recording boundary-censored PCM silence synthetic tests
        run: python3 -m unittest discover -s tests -p 'test_audit_nexium_pcm_terminal_silence.py' -v
      - name: Stage303 recorder stop snapshot and uncertain partial-frame regressions
        run: python3 -m unittest discover -s tests -p 'test_audit_nexium_pcm_recorder_stop.py' -v
      - name: Stage304 host Plus exit controls and buffered terminal-PCM synthetic tests
        run: python3 -m unittest discover -s tests -p 'test_audit_nexium_pcm_exit_controls.py' -v
      - name: Stage305 strict buffered Plus/PCM terminal zero onset fence and baseline tests
        run: python3 -m unittest discover -s tests -p 'test_audit_nexium_pcm_plus_fence.py' -v
      - name: Stage307 guest software exit C11 timeline on GCC and Clang
        run: |
          set -euxo pipefail
          for cc in gcc clang; do
            "$cc" -std=c11 -Wall -Wextra -Werror -O2 -Isource \
              tests/test_vh_audio_exit_timeline.c \
              -o "/tmp/test-vh-audio-exit-$cc"
            "/tmp/test-vh-audio-exit-$cc"
          done
      - name: Stage307 optional guest SD exit timeline provenance tests
        run: python3 -m unittest discover -s tests -p 'test_audit_nexium_guest_exit_timeline.py' -v
      - name: Stage308 guest optical/music scene versus guest exit software clock tests
        run: python3 -m unittest discover -s tests -p 'test_audit_nexium_guest_optical_exit_clock.py' -v
      - name: Statistical sensitivity of complete paired NeXium audio sessions
        run: python3 -m unittest discover -s tests -p 'test_analyze_nexium_idle_switch_variability.py' -v
      - name: Multi-pair no-switch original-SD archive negative controls
        run: python3 -m unittest discover -s tests -p 'test_compare_nexium_idle_switch_pairs.py' -v
      - name: No-switch audio baseline original-SD forgery regressions
        run: python3 -m unittest discover -s tests -p 'test_audit_nexium_audout_idle_control.py' -v
      - name: Same-NRO cross-run original-SD audit archive negative controls
        run: python3 -m unittest discover -s tests -p 'test_compare_nexium_verified_slow_runs.py' -v
      - name: Exact slow-call original guest SD tamper regressions
        run: python3 -m unittest discover -s tests -p 'test_audit_nexium_audout_slow_calls.py' -v
      - name: Native C stereo PCM ring regression
        run: |
          mkdir -p build
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_audio_stream.c source/vh_audio_stream.c \
             -o build/test_vh_audio_stream
          ./build/test_vh_audio_stream
      - name: Native C PCM ring undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g \
             -fsanitize=undefined -fno-omit-frame-pointer -Isource \
             tests/test_vh_audio_stream.c source/vh_audio_stream.c \
             -o build/test_vh_audio_stream_ubsan
          ./build/test_vh_audio_stream_ubsan
      - name: Native SPU ADPCM + 20-voice mixing regression
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_native_spu.c source/vh_native_spu.c source/vh_spu_reverb.c \
             source/vh_spu_gaussian.c source/vh_spu_adpcm.c \
             source/vh_audio_stream.c \
             -lm -o build/test_vh_native_spu
          ./build/test_vh_native_spu
      - name: Native SPU and ADPCM undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g \
             -fsanitize=undefined -fno-omit-frame-pointer -Isource \
             tests/test_vh_native_spu.c source/vh_native_spu.c source/vh_spu_reverb.c \
             source/vh_spu_gaussian.c source/vh_spu_adpcm.c \
             source/vh_audio_stream.c \
             -lm -o build/test_vh_native_spu_ubsan
          ./build/test_vh_native_spu_ubsan
      - name: Native SEQ 512-frame scheduler and voice ownership
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_native_seq.c source/vh_native_seq.c \
             source/vh_native_spu.c source/vh_spu_reverb.c source/vh_spu_gaussian.c \
             source/vh_audio_stream.c -lm -o build/test_vh_native_seq
          ./build/test_vh_native_seq
      - name: Native SEQ scheduler under UBSan
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
             -fsanitize=undefined -fno-omit-frame-pointer \
             tests/test_vh_native_seq.c source/vh_native_seq.c \
             source/vh_native_spu.c source/vh_spu_reverb.c source/vh_spu_gaussian.c \
             source/vh_audio_stream.c -lm -o build/test_vh_native_seq_ubsan
          ./build/test_vh_native_seq_ubsan
      - name: Native sparse VH/VB bank and SEQ to stereo regression
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_native_vab.c source/vh_native_vab.c \
             source/vh_native_seq.c source/vh_native_spu.c source/vh_spu_reverb.c \
             source/vh_spu_adpcm.c source/vh_spu_gaussian.c \
             source/vh_audio_stream.c -lm -o build/test_vh_native_vab
          ./build/test_vh_native_vab
      - name: Native VH/VB loader under UBSan
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
             -fsanitize=undefined -fno-omit-frame-pointer \
             tests/test_vh_native_vab.c source/vh_native_vab.c \
             source/vh_native_seq.c source/vh_native_spu.c source/vh_spu_reverb.c \
             source/vh_spu_adpcm.c source/vh_spu_gaussian.c \
             source/vh_audio_stream.c -lm -o build/test_vh_native_vab_ubsan
          ./build/test_vh_native_vab_ubsan
      - name: Read-only local asset loader with missing/oversized bank tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_audio_assets.c source/vh_audio_assets.c \
             source/vh_native_vab.c source/vh_native_seq.c \
             source/vh_native_spu.c source/vh_spu_reverb.c source/vh_spu_adpcm.c \
             source/vh_spu_gaussian.c source/vh_audio_stream.c \
             -lm -o build/test_vh_audio_assets
          ./build/test_vh_audio_assets
      - name: Read-only local audio asset loader with UBSan
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
             -fsanitize=undefined -fno-omit-frame-pointer \
             tests/test_vh_audio_assets.c source/vh_audio_assets.c \
             source/vh_native_vab.c source/vh_native_seq.c \
             source/vh_native_spu.c source/vh_spu_reverb.c source/vh_spu_adpcm.c \
             source/vh_spu_gaussian.c source/vh_audio_stream.c \
             -lm -o build/test_vh_audio_assets_ubsan
          ./build/test_vh_audio_assets_ubsan
      - name: Cross-block 44100-to-48000 stereo resampler
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_audio_resample.c source/vh_audio_resample.c \
             -o build/test_vh_audio_resample
          ./build/test_vh_audio_resample
      - name: 48k audout resampler under UBSan
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g \
             -fsanitize=undefined -fno-omit-frame-pointer -Isource \
             tests/test_vh_audio_resample.c source/vh_audio_resample.c \
             -o build/test_vh_audio_resample_ubsan
          ./build/test_vh_audio_resample_ubsan
      - name: Cross-version Switch NRO audio CSV comparisons and coverage gates
        run: |
          python3 tests/test_compare_switch_audio_sessions.py
      - name: Offline Switch PCM journal analysis and hostile CSV validation
        run: |
          python3 tests/test_analyze_switch_audio_log.py
      - name: Four C exported NRO-style sessions recover from interrupted SD temp
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/switch_audio_export_session.c \
             source/vh_audio_diag_export.c source/vh_audio_diag_journal.c \
             -o build/switch_audio_export_session
          python3 tests/test_switch_audio_export_restart_e2e.py
      - name: SD export staging and 6 filesystem error paths
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_audio_diag_export.c \
             source/vh_audio_diag_export.c source/vh_audio_diag_journal.c \
             -o build/test_vh_audio_diag_export
          ./build/test_vh_audio_diag_export
      - name: SD export error handling under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
             -fsanitize=address,undefined -fno-omit-frame-pointer \
             tests/test_vh_audio_diag_export.c \
             source/vh_audio_diag_export.c source/vh_audio_diag_journal.c \
             -o build/test_vh_audio_diag_export_asan
          ./build/test_vh_audio_diag_export_asan
      - name: Long-session audio CSV ring journal and fault events
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_audio_diag_journal.c source/vh_audio_diag_journal.c \
             -o build/test_vh_audio_diag_journal
          ./build/test_vh_audio_diag_journal
      - name: Diagnostic journal CSV under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
             -fsanitize=address,undefined -fno-omit-frame-pointer \
             tests/test_vh_audio_diag_journal.c source/vh_audio_diag_journal.c \
             -o build/test_vh_audio_diag_journal_asan
          ./build/test_vh_audio_diag_journal_asan
      - name: Switch audio diagnostic HUD ASCII and counter bounds
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_audio_diagnostics.c source/vh_audio_diagnostics.c \
             -o build/test_vh_audio_diagnostics
          ./build/test_vh_audio_diagnostics
      - name: Switch audio diagnostic HUD under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
             -fsanitize=address,undefined -fno-omit-frame-pointer \
             tests/test_vh_audio_diagnostics.c source/vh_audio_diagnostics.c \
             -o build/test_vh_audio_diagnostics_asan
          ./build/test_vh_audio_diagnostics_asan
      - name: Normal exit 2-ms PCM taper and resume timing counters
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_audio_output_edges.c source/vh_audio_output_edges.c \
             -o build/test_vh_audio_output_edges
          ./build/test_vh_audio_output_edges
      - name: Exit-tail PCM and latency counters under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
             -fsanitize=address,undefined -fno-omit-frame-pointer \
             tests/test_vh_audio_output_edges.c source/vh_audio_output_edges.c \
             -o build/test_vh_audio_output_edges_asan
          ./build/test_vh_audio_output_edges_asan
      - name: 4-ms PCM restart de-click envelope and cross-page boundary
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_audio_output_ramp.c source/vh_audio_output_ramp.c \
             -o build/test_vh_audio_output_ramp
          ./build/test_vh_audio_output_ramp
      - name: 4-ms de-click envelope under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
             -fsanitize=address,undefined -fno-omit-frame-pointer \
             tests/test_vh_audio_output_ramp.c source/vh_audio_output_ramp.c \
             -o build/test_vh_audio_output_ramp_asan
          ./build/test_vh_audio_output_ramp_asan
      - name: Audout exact released-buffer ownership and stale queue
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_audio_buffer_lease.c \
             source/vh_audio_buffer_lease.c source/vh_audio_output_recovery.c \
             -o build/test_vh_audio_buffer_lease
          ./build/test_vh_audio_buffer_lease
      - name: Audout page ownership under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
             -fsanitize=address,undefined -fno-omit-frame-pointer \
             tests/test_vh_audio_buffer_lease.c \
             source/vh_audio_buffer_lease.c source/vh_audio_output_recovery.c \
             -o build/test_vh_audio_buffer_lease_asan
          ./build/test_vh_audio_buffer_lease_asan
      - name: Audout restart and exact PCM replay across SEQ scene changes
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_audio_output_recovery.c \
             source/vh_audio_output_recovery.c source/vh_audio_output_ramp.c \
             source/vh_music_scene.c \
             source/vh_audio_resample.c source/vh_native_seq.c \
             source/vh_native_spu.c source/vh_spu_reverb.c \
             source/vh_spu_gaussian.c source/vh_audio_stream.c \
             -lm -o build/test_vh_audio_output_recovery
          ./build/test_vh_audio_output_recovery
      - name: Audout recovery under UBSan and AddressSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
             -fsanitize=address,undefined -fno-omit-frame-pointer \
             tests/test_vh_audio_output_recovery.c \
             source/vh_audio_output_recovery.c source/vh_audio_output_ramp.c \
             source/vh_music_scene.c \
             source/vh_audio_resample.c source/vh_native_seq.c \
             source/vh_native_spu.c source/vh_spu_reverb.c \
             source/vh_spu_gaussian.c source/vh_audio_stream.c \
             -lm -o build/test_vh_audio_output_recovery_asan
          ./build/test_vh_audio_output_recovery_asan
      - name: STUDIO_C native reverb and tail regression
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
            tests/test_vh_spu_reverb.c source/vh_spu_reverb.c \
            source/vh_native_spu.c source/vh_spu_gaussian.c \
            source/vh_audio_stream.c -lm -o build/test_vh_spu_reverb
          ./build/test_vh_spu_reverb
      - name: STUDIO_C reverb under UBSan
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
            -fsanitize=undefined -fno-omit-frame-pointer \
            tests/test_vh_spu_reverb.c source/vh_spu_reverb.c \
            source/vh_native_spu.c source/vh_spu_gaussian.c \
            source/vh_audio_stream.c -lm -o build/test_vh_spu_reverb_ubsan
          ./build/test_vh_spu_reverb_ubsan
      - name: SEQ to STUDIO_C to audout-resampler 2048-block soak
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
            tests/test_vh_native_audio_soak.c source/vh_native_seq.c \
            source/vh_native_spu.c source/vh_spu_reverb.c \
            source/vh_spu_gaussian.c source/vh_audio_resample.c \
            source/vh_audio_stream.c -lm -o build/test_vh_native_audio_soak
          ./build/test_vh_native_audio_soak
      - name: Gameplay scene music cue and crossfade regression
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_music_scene.c source/vh_music_scene.c \
             source/vh_native_seq.c source/vh_native_spu.c \
             source/vh_spu_reverb.c source/vh_spu_gaussian.c \
             source/vh_audio_stream.c -lm -o build/test_vh_music_scene
          ./build/test_vh_music_scene
      - name: Gameplay scene cue transitions under UBSan
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
             -fsanitize=undefined -fno-omit-frame-pointer \
             tests/test_vh_music_scene.c source/vh_music_scene.c \
             source/vh_native_seq.c source/vh_native_spu.c \
             source/vh_spu_reverb.c source/vh_spu_gaussian.c \
             source/vh_audio_stream.c -lm -o build/test_vh_music_scene_ubsan
          ./build/test_vh_music_scene_ubsan
      - name: Scene transitions through 48k PCM 1200-block soak
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_music_scene_soak.c source/vh_music_scene.c \
             source/vh_native_seq.c source/vh_native_spu.c \
             source/vh_spu_reverb.c source/vh_spu_gaussian.c \
             source/vh_audio_resample.c source/vh_audio_stream.c \
             -lm -o build/test_vh_music_scene_soak
          ./build/test_vh_music_scene_soak
      - name: Tactical input music mailbox regression
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isource \
             tests/test_vh_game_music_mailbox.c source/vh_game_music_mailbox.c \
             -pthread -o build/test_vh_game_music_mailbox
          ./build/test_vh_game_music_mailbox
      - name: Tactical music mailbox under UBSan
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -Isource \
             -fsanitize=undefined -fno-omit-frame-pointer \
             tests/test_vh_game_music_mailbox.c source/vh_game_music_mailbox.c \
             -pthread -o build/test_vh_game_music_mailbox_ubsan
          ./build/test_vh_game_music_mailbox_ubsan
      - name: Suspension and focus resume preserve native audio clocks
        run: |
