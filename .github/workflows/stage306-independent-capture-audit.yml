name: Stage306 independent NeXium PCM capture repeatability

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/stage306-independent-capture-audit.yml'
      - 'tools/compare_nexium_pcm_plus_capture_runs.py'
      - 'tests/test_compare_nexium_pcm_plus_capture_runs.py'

permissions:
  contents: read
  actions: read

jobs:
  independent-capture-audit:
    name: Replay and compare two independent original NeXium captures
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout Stage299-305 source analyzers
        uses: actions/checkout@v4

      - name: Stage306 synthetic adversarial tests
        run: python3 -m unittest discover -s tests -p 'test_compare_nexium_pcm_plus_capture_runs.py' -v

      - name: Retrieve first original NeXium PCM capture
        uses: actions/download-artifact@v4
        with:
          name: nexium-runtime-evidence
          run-id: 39134188130
          github-token: ${{ github.token }}
          path: original-sources/39134188130

      - name: Retrieve second original NeXium PCM capture
        uses: actions/download-artifact@v4
        with:
          name: nexium-runtime-evidence
          run-id: 39134382535
          github-token: ${{ github.token }}
          path: original-sources/39134382535

      - name: Independently replay original PCM and source receipts from each capture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p comparison-evidence
          for run_id in 39134188130 39134382535; do
            source_path="$(find "original-sources/$run_id" -type f -name 'nexium-scenes-s16le-48k.pcm' -print -quit)"
            test -n "$source_path" && test -f "$source_path"
            source_dir="$(dirname "$source_path")"
            echo "Stage306 source workflow run: $run_id"
            for name in nexium-monitor-s16le-48k.pcm pcm-quality-report.json \
                        nexium-scenes-s16le-48k.pcm scene-audio-report.json \
                        scene-events.csv pcm-stream-integrity-stage299.json \
                        pcm-scene-silence-stage300.json pcm-marker-envelopes-stage301.json \
                        pcm-recording-edge-silence-stage302.json \
                        pcm-recorder-stop-stage303.json scene-recorder-stop.csv \
                        scene-exit-controls.csv; do
              test -f "$source_dir/$name" && test ! -L "$source_dir/$name"
            done
            sha256sum "$source_dir/nexium-scenes-s16le-48k.pcm"
            python3 tools/audit_nexium_pcm_exit_controls.py \
              --monitor "$source_dir/nexium-monitor-s16le-48k.pcm" \
              --monitor-report "$source_dir/pcm-quality-report.json" \
              --scenes "$source_dir/nexium-scenes-s16le-48k.pcm" \
              --scene-report "$source_dir/scene-audio-report.json" \
              --events "$source_dir/scene-events.csv" \
              --stage299 "$source_dir/pcm-stream-integrity-stage299.json" \
              --stage300 "$source_dir/pcm-scene-silence-stage300.json" \
              --stage301 "$source_dir/pcm-marker-envelopes-stage301.json" \
              --stage302 "$source_dir/pcm-recording-edge-silence-stage302.json" \
              --stage303 "$source_dir/pcm-recorder-stop-stage303.json" \
              --stop-csv "$source_dir/scene-recorder-stop.csv" \
              --control-csv "$source_dir/scene-exit-controls.csv" \
              --output "comparison-evidence/pcm-exit-controls-stage304-$run_id.json"
            python3 tools/audit_nexium_pcm_plus_fence.py \
              --monitor "$source_dir/nexium-monitor-s16le-48k.pcm" \
              --monitor-report "$source_dir/pcm-quality-report.json" \
              --scenes "$source_dir/nexium-scenes-s16le-48k.pcm" \
              --scene-report "$source_dir/scene-audio-report.json" \
              --events "$source_dir/scene-events.csv" \
              --stage299 "$source_dir/pcm-stream-integrity-stage299.json" \
              --stage300 "$source_dir/pcm-scene-silence-stage300.json" \
              --stage301 "$source_dir/pcm-marker-envelopes-stage301.json" \
              --stage302 "$source_dir/pcm-recording-edge-silence-stage302.json" \
              --stage303 "$source_dir/pcm-recorder-stop-stage303.json" \
              --stage304 "comparison-evidence/pcm-exit-controls-stage304-$run_id.json" \
              --stop-csv "$source_dir/scene-recorder-stop.csv" \
              --control-csv "$source_dir/scene-exit-controls.csv" \
              --output "comparison-evidence/pcm-plus-onset-fence-stage305-$run_id.json"
          done

      - name: Compare separately source-verified independent recorder sessions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/compare_nexium_pcm_plus_capture_runs.py \
            --capture 39134188130:comparison-evidence/pcm-plus-onset-fence-stage305-39134188130.json \
            --capture 39134382535:comparison-evidence/pcm-plus-onset-fence-stage305-39134382535.json \
            --output comparison-evidence/independent-plus-PCM-stage306.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("comparison-evidence/independent-plus-PCM-stage306.json").read_text())
          if (report["result"]!="INDEPENDENT_SOURCE_BOUND_PLUS_PCM_RUNS_COMPARED"
                  or report["run_count"]!=2
                  or report["distinct_workflow_run_ids"] is not True
                  or report["distinct_original_scene_pcm_sha256"] is not True
                  or report["sample_frame_proximity_does_not_prove_Plus_causality"] is not True
                  or report["original_music_or_audible_dropout_verified"] is not False
                  or report["physical_Nintendo_Switch_audio_tested"] is not False):
              raise SystemExit("Stage306 independent source/claim boundary mismatch")
          print("Stage306 independently verified original NeXium capture classes:",
                report["onset_class_counts"])
          for run in report["runs"]:
              print("Source run",run["workflow_run_id"],
                    "SHA256",run["scene_pcm_sha256"],
                    "onset",run["terminal_zero_onset_class"],
                    "press offset frame bounds",run["source_frames_from_press_snapshot_min_max"])
          PY
          echo "Stage306: separately replayed two SHA-distinct original NeXium virtual PCM captures from independent GitHub Actions runs; reports repeatability of buffered Plus proximity, not guest-time causality or physical audio quality." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload independently computed comparison receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage306-independent-capture-receipts
          path: comparison-evidence/
          if-no-files-found: warn
