name: MAP02 private BK2 animation-baseline witness (synthetic CI)
on:
  pull_request:
    paths:
      - '.github/workflows/map02-private-animation-baseline.yml'
      - 'tools/verify_map02_private_animation_baseline.py'
      - 'tests/test_verify_map02_private_animation_baseline.py'
      - 'docs/MAP02_PRIVATE_ANIMATION_BASELINE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invented-animation-baseline:
    name: Synthetic pre-animation guard (${{ matrix.os }} Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-22.04
            python: '3.11'
          - os: macos-15-intel
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install Pillow for invented 16x16 PNGs
        shell: bash
        run: python -m pip install 'Pillow>=10,<12'
      - name: Test twelve fabricated temporal animation masks
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_verify_map02_private_animation_baseline.py' -v             2>&1 | tee "$RUNNER_TEMP/map02-animation-baseline.log"
          grep -F 'Ran 12 tests' "$RUNNER_TEMP/map02-animation-baseline.log"
          if grep -E '^(FAILED|ERROR)' "$RUNNER_TEMP/map02-animation-baseline.log"; then exit 1; fi
          echo 'VH_MAP02_ANIMATION_BASELINE_PASS synthetic=12 private_bk2=0 real_ps1=0 map02_scene_authenticated=0'
