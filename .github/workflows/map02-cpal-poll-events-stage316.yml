name: MAP02 Stage316 actual CPAL two-ordinal poll request/revents categories
on:
  pull_request:
    paths:
      - '.github/workflows/map02-cpal-poll-events-stage316.yml'
      - 'tools/map02_poll_events_stage316.c'
      - 'tools/capture_map02_poll_events_stage316.py'
      - 'tools/run_map02_poll_events_guest_stage316.sh'
      - 'tools/audit_map02_poll_events_stage316.py'
      - 'tests/test_audit_map02_poll_events_stage316.py'
      - 'docs/MAP02_CPAL_POLL_EVENTS_STAGE316.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PINNED_STAGE315_PARENT: '69d456441d2bfe9ac6bdca247da4b34a3b81fa87'
  PINNED_STAGE309_HOST_SOURCE_HEAD: '42c050bfe11a3cfd420190147653890561236152'
  PINNED_STAGE309_REAL_BUILD_ACTION: '39589981836'
  STAGE309_ELF_SHA: 'e5ddfc61ac9435dc5a6e2dcd569766db0c444bbdeef8a3fa6a65c9c2e9fc6f25'
  ORIGINAL_UNMODIFIED_NRO_SHA: '371c9fd9f1f41ad87cbb5f7f96a3e5e9d56878f8cfff2bf7fea2c17120c2611b'
jobs:
  real-new-tagged-gui-neXium:
    name: Source verify two anonymous CPAL poll ordinal mask classes, hint ${{ matrix.hint }}ms
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        hint: [21, 22]
    env:
      VH_HINT: ${{ matrix.hint }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scope this new experiment to exactly six research files and synthetic negative controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,subprocess
          changed=set(subprocess.check_output(["git","diff","--name-only",
                             os.environ["PINNED_STAGE315_PARENT"],"HEAD"],text=True).splitlines())
          allowed={
              ".github/workflows/map02-cpal-poll-events-stage316.yml",
              "tools/map02_poll_events_stage316.c",
              "tools/capture_map02_poll_events_stage316.py",
              "tools/run_map02_poll_events_guest_stage316.sh",
              "tools/audit_map02_poll_events_stage316.py",
              "tests/test_audit_map02_poll_events_stage316.py",
              "docs/MAP02_CPAL_POLL_EVENTS_STAGE316.md"
          }
          assert changed and changed<=allowed,sorted(changed-allowed)
          PY
          python3 -m unittest discover -s tests -p 'test_audit_map02_real_direct_tls_guests_stage310.py' -v
          python3 -m unittest discover -s tests -p 'test_audit_map02_alsa_inflight_stage311.py' -v
          python3 -m unittest discover -s tests -p 'test_audit_map02_linux_task_state_stage302.py' -v
          python3 -m unittest discover -s tests -p 'test_audit_map02_proc_task_wait_stage312.py' -v
          python3 -m unittest discover -s tests -p 'test_audit_map02_private_proc_tls_join_stage313.py' -v
          python3 -m unittest discover -s tests -p 'test_audit_map02_libc_wait_stage314.py' -v
          python3 -m unittest discover -s tests -p 'test_audit_map02_poll_arguments_stage315.py' -v
          python3 -m unittest discover -s tests -p 'test_audit_map02_poll_events_stage316.py' -v
          python3 -m unittest discover -s tests -p 'test_patch_map02_cpal_thread_tag_stage308.py' -v
          python3 -m unittest discover -s tests -p 'test_audit_map02_alsa_userspace_stage305.py' -v
          python3 -m py_compile tools/capture_map02_same_tls_guests_stage310.py tools/audit_map02_real_direct_tls_guests_stage310.py
          python3 -m py_compile tools/capture_map02_alsa_inflight_stage311.py tools/audit_map02_alsa_inflight_stage311.py
          python3 -m py_compile tools/audit_map02_proc_task_wait_stage312.py
          python3 -m py_compile tools/capture_map02_private_proc_tls_join_stage313.py tools/audit_map02_private_proc_tls_join_stage313.py
          python3 -m py_compile tools/capture_map02_libc_wait_stage314.py tools/audit_map02_libc_wait_stage314.py
          python3 -m py_compile tools/capture_map02_poll_arguments_stage315.py tools/audit_map02_poll_arguments_stage315.py
          python3 -m py_compile tools/capture_map02_poll_events_stage316.py tools/audit_map02_poll_events_stage316.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path("tools/run_map02_poll_events_guest_stage316.sh").read_text()
          for needle in ("for button in c x m","sleep 9",
                         'VH_MAP02_STAGE308_CALLBACK_TAG=1',
                         'LD_PRELOAD="$MAP02_STAGE305_SHIM"',
                         'cpal-tag-anonymous-atomic.csv',
                         'alsa-inflight-anonymous-atomic.csv',
                         'linux-task-state-samples.csv',
                         'linux-task-monitor-ready-ns.txt',
                         'linux-task-private-tls-join-anonymous.csv',
                         'libc-wait-anonymous-atomic.csv',
                         'poll-parameters-anonymous-atomic.csv',
                         'poll-events-anonymous-atomic.csv',
                         'guest-first-input-monotonic-ns.txt',
                         'guest-final-observation-monotonic-ns.txt',
                         'export NEXIUM_CPU_BACKEND=rustarmic'):
              assert needle in s,needle
          c=Path("tools/map02_poll_events_stage316.c").read_text()
          assert 'vh_map02_stage308_cpal_callback_mark' in c
          assert "VH_PRIVATE_TID_OFFSET 53760" in c
          assert "VH_LIBC_WAIT_OFFSET 54784" in c
          assert "VH_POLL_ARGUMENT_OFFSET 60928" in c
          assert "VH_POLL_EVENT_OFFSET 27664" in c
          assert "VH_POLL_EVENT_FIELDS 9" in c
          assert "VH_POLL_EVENT_LAST_OFFSET 32272" in c
          assert "poll_event_last[alias][0]" in c
          assert "poll_event_last[alias][1]" in c
          assert "vh_poll_event_entry(alias,fds,nfds);" in c
          assert "vh_poll_event_return(alias,fds,nfds,rc);" in c
          assert "VH_POLL_META_FIELDS 9" in c
          assert "vh_poll_arguments(alias,nfds,timeout);" in c
          assert "vh_poll_return(alias,rc);" in c
          assert c.count("vh_libc_begin(")==5
          assert c.count("vh_libc_finish(")==5
          assert "syscall(SYS_gettid)" in c
          assert c.count("syscall(SYS_gettid)")==1
          PY
      - uses: actions/download-artifact@v4
        with:
          name: map02-stage309-new-optin-direct-alsa-cpal-tagged-nexium-linux-x86_64
          run-id: ${{ env.PINNED_STAGE309_REAL_BUILD_ACTION }}
          github-token: ${{ github.token }}
          path: host
      - uses: actions/download-artifact@v4
        with:
          name: map02-audout-presubmit-research-nro
          run-id: 39460035568
          github-token: ${{ github.token }}
          path: guest
      - name: Fail closed on exact NEW compiled experimental host and OLD unchanged generated guest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence research
          chmod 0755 host/nexium
          echo "$STAGE309_ELF_SHA  host/nexium" | sha256sum -c -
          echo "$ORIGINAL_UNMODIFIED_NRO_SHA  guest/vandal-hearts-map02-audio.nro" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,os,struct
          from pathlib import Path
          binary=Path("host/nexium").read_bytes()
          m=json.loads(Path("host/manifest.json").read_text())
          assert binary[:4]==b"\x7fELF" and struct.unpack_from("<H",binary,18)[0]==62
          assert hashlib.sha256(binary).hexdigest()==os.environ["STAGE309_ELF_SHA"]
          assert m["schema"]=="vh-map02-stage309-real-compiled-opt-in-cpal-alsa-tls-host/v1"
          assert m["result"]=="STAGE309_EXPERIMENTAL_SAME_TLS_TAGGED_NEXIUM_LINUX_BINARY_COMPILED"
          assert m["research_head_sha"]==os.environ["PINNED_STAGE309_HOST_SOURCE_HEAD"]
          assert m["executable_sha256"]==os.environ["STAGE309_ELF_SHA"]
          assert m["pinned_upstream_source_sha"]=="089562567a0a8760dfdd8420e1f57c35159a9219"
          assert m["cargo_lock_sha256"]=="e6e8fcb90624650afddd1f25327dd4e6b042b094e8336cb5f43d2dc370e28739"
          assert m["stage309_direct_cpal_alsa_tls_probe_function_compiled"] is True
          assert m["stage309_direct_cpal_alsa_tls_source_marker_in_both_callbacks"] is True
          assert b"VH_MAP02_STAGE308_CALLBACK_TAG" in binary
          assert b"vh_map02_stage308_cpal_callback_mark" in binary
          assert b"VH_MAP02_CPAL_TRACE_PATH" in binary
          assert b"VH_MAP02_CPAL_LIFETIME_PATH" in binary
          nro=Path("guest/vandal-hearts-map02-audio.nro").read_bytes()
          g=json.loads(Path("guest/manifest.json").read_text())
          assert nro[16:20]==b"NRO0"
          assert g["schema"]=="vh-map02-presubmit-guest-nro/v1"
          assert g["source_sha"]=="04b20024a50327091cff430eb5c28e4722d4ec76"
          assert g["run_id"]==39460035568
          assert g["nro_sha256"]==os.environ["ORIGINAL_UNMODIFIED_NRO_SHA"]
          Path("evidence/stage310-host-source-sha-manifest.json").write_text(
              json.dumps(m,sort_keys=True,indent=2)+"\n")
          pair={
              "schema":"vh-map02-stage310-direct-tls-new-host-romfree-guest-pair/v1",
              "experimental_stage309_host_sha256":os.environ["STAGE309_ELF_SHA"],
              "unchanged_romfree_original_guest_sha256":g["nro_sha256"],
              "actual_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "hint_ms":int(os.environ["VH_HINT"]),
              "licensed_original_game_rom_or_music_used":False,
              "physical_switch_audio_proven":False,
          }
          Path("evidence/stage310-actual-elf-nro-pair.json").write_text(
              json.dumps(pair,sort_keys=True,indent=2)+"\n")
          PY
      - name: Install exact GUI plus ALSA/Pulse synthetic dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-xcb1 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri \
            pulseaudio pulseaudio-utils libasound2-plugins \
            libasound2-dev gcc binutils
          ldd host/nexium >evidence/host-linked-libraries.txt
          ! grep -F 'not found' evidence/host-linked-libraries.txt
      - name: Compile direct same-TLS research shim and verify separate two-thread ALSA-null parity
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=gnu11 -O2 -Werror -Wall -Wextra -fPIC -shared \
            tools/map02_poll_events_stage316.c \
            -o research/libmap02-stage316-poll-events.so -lasound -ldl -pthread
          gcc -std=gnu11 -O2 -Werror -Wall -Wextra \
            tools/map02_same_tls_synthetic_stage310.c \
            -o research/map02-stage310-two-thread-synthetic-null -lasound -ldl -pthread
          nm -D research/libmap02-stage316-poll-events.so | \
            grep -E ' [TW] vh_map02_stage308_cpal_callback_mark$'
          plain="$(research/map02-stage310-two-thread-synthetic-null)"
          python3 tools/capture_map02_alsa_userspace_stage305.py \
            --init --source "$RUNNER_TEMP/stage310-null-PRIVATE.bin"
          hooked="$(env \
            LD_PRELOAD="$PWD/research/libmap02-stage316-poll-events.so" \
            VH_STAGE305_ALSA_COUNTER_PATH="$RUNNER_TEMP/stage310-null-PRIVATE.bin" \
            research/map02-stage310-two-thread-synthetic-null)"
          test "$plain" = "$hooked"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,mmap,os,struct
          from tools.capture_map02_alsa_userspace_stage305 import snapshot,SIZE
          source=Path(os.environ["RUNNER_TEMP"])/"stage310-null-PRIVATE.bin"
          with source.open("rb") as f,mmap.mmap(f.fileno(),SIZE,access=mmap.ACCESS_READ) as mm:
              aliases,rows=snapshot(mm)
              tags=[struct.unpack_from("<Q",mm,32768+i*8)[0] for i in range(min(64,aliases))]
          assert aliases==2,(aliases,rows,tags)
          prep={alias:counts[0] for alias,op,*counts in rows if op=="prepare"}
          assert sorted(prep.values())==[10,15],prep
          marked=[i for i,v in enumerate(tags) if v]
          assert len(marked)==1 and tags[marked[0]]==7 and prep[marked[0]]==10
          raw=Path("research/libmap02-stage316-poll-events.so").read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          manifest={
              "schema":"vh-map02-stage310-alsainterposer-v1",
              "shim_elf_sha256":sha,
              "synthetic_two_thread_stage308_proof_rechecked":True,
              "native_tagged_host_and_alsa_share_same_shim":True,
              "same_process_source_marker_symbol_available":True,
              "experimental_instrumentation_causes_scheduler_perturbation":True,
              "actual_guest_callback_hook_ownership_verified":False,
              "physical_switch_audio_fixed":False,
          }
          Path("evidence/stage310-new-tagged-shim.json").write_text(
              json.dumps(manifest,sort_keys=True,indent=2)+"\n")
          print("Exactly two synthetic TLS aliases, marked one has 7 tags and 10 ALSA preparations",sha)
          PY
      - name: REAL new source-pinned NeXium GUI, original research ROM-free guest and direct TLS marker
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          export MAP02_HOST="$PWD/host/nexium"
          export MAP02_NRO="$PWD/guest/vandal-hearts-map02-audio.nro"
          export MAP02_EVIDENCE="$PWD/evidence"
          export MAP02_STAGE305_SHIM="$PWD/research/libmap02-stage316-poll-events.so"
          export VH_MAP02_CPAL_LIFETIME_PATH="$MAP02_EVIDENCE/host-cpal-lifetime-p.csv"
          bash tools/run_map02_poll_events_guest_stage316.sh
          for name in cpal-tag-anonymous-atomic.csv alsa-userspace-anonymous-atomic.csv \
              alsa-inflight-anonymous-atomic.csv \
              linux-task-state-samples.csv linux-task-monitor-ready-ns.txt \
              linux-task-private-tls-join-anonymous.csv \
              libc-wait-anonymous-atomic.csv \
              poll-parameters-anonymous-atomic.csv \
              poll-events-anonymous-atomic.csv \
              host-cpal-audioout-timeline.csv host-cpal-lifetime-p.csv \
              guest-first-input-monotonic-ns.txt guest-final-observation-monotonic-ns.txt \
              guest-final.png virtual-pulse-48k-stereo-s16le.pcm; do
            test -s "evidence/$name"
          done
      - name: Real CPAL P/L replay, optical guest source truth and virtual 48k PCM
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_map02_cpal_lifetime_stage299.py \
            --p evidence/host-cpal-lifetime-p.csv \
            --l evidence/host-cpal-audioout-timeline.csv \
            --first-input-marker evidence/guest-first-input-monotonic-ns.txt \
            --final-observation-marker evidence/guest-final-observation-monotonic-ns.txt \
            --output evidence/host-cpal-lifetime-audit.json
          python3 tools/decode_map02_prejoin_stage.py \
            --image evidence/guest-prejoin.png \
            --output evidence/guest-prejoin-stage.json
          if python3 tools/decode_map02_audout_presubmit.py \
            --image evidence/guest-final.png \
            --output evidence/guest-final-receipt.json; then
            echo "Generated ROM-free optical CRC 8/8 pass" >evidence/optical-status.txt
          else
            echo "Generated optical CRC UNVERIFIED" >evidence/optical-status.txt
          fi
          python3 - <<'PY'
          from array import array
          from pathlib import Path
          import hashlib,json,sys
          p=Path("evidence/virtual-pulse-48k-stereo-s16le.pcm")
          r={"schema":"vh-map02-stage310-virtual-48k-stereo-pcm/v1",
             "physical_switch_audio_proven":False}
          if p.exists():
              b=p.read_bytes()
              r.update(pcm16le_sha256=hashlib.sha256(b).hexdigest(),
                       bytes=len(b),sample_format_valid=len(b)>0 and len(b)%4==0)
              if r["sample_format_valid"]:
                  a=array("h");a.frombytes(b)
                  if sys.byteorder!="little":a.byteswap()
                  r["nonzero_pcm16_samples"]=sum(v!=0 for v in a)
          Path("evidence/stage310-virtual-pcm-health.json").write_text(
              json.dumps(r,sort_keys=True,indent=2)+"\n")
          print(json.dumps(r,sort_keys=True))
          PY
      - name: Independent reparse of TRUE same-TLS CPAL callback markers and ALSA functions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_map02_real_direct_tls_guests_stage310.py \
            --evidence evidence --hint "$VH_HINT" --run-id "$GITHUB_RUN_ID" \
            --output evidence/stage310-direct-tls-guest-audit.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("evidence/stage310-direct-tls-guest-audit.json").read_text())
          assert r["result"]=="REAL_STAGE310_NEW_HOST_DIRECT_CPAL_ALSA_TLS_SNAPSHOT_REPARSED"
          assert r["requested_pulse_latency_hint_ms"]==int(os.environ["VH_HINT"])
          assert r["experimental_stage309_host_sha256"]==os.environ["STAGE309_ELF_SHA"]
          assert r["marker_and_alsa_export_same_alias_is_direct_source_thread_identity"]
          assert r["no_audio_root_cause_or_production_switch_sound_fix_proven"]
          print("Observed in this guest at requested hint",r["requested_pulse_latency_hint_ms"])
          print("Original host P/L callback count",r["host_original_cpal_p_reported_callback_entry_delta"])
          print("Direct CPAL marker total",r["guest_window_source_tagged_cpal_marker_increments"])
          for entry in r["matched_native_thread_aliases"]:
              if entry["real_tagged_cpal_callback_entry_delta"] or entry["alsa_export_total_deltas"]["writei"]:
                  print("Anonymous TLS alias",entry)
          PY
      - name: Independent source-replay of REAL ALSA exported begin, return and negative phases
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_map02_alsa_inflight_stage311.py \
            --evidence evidence --hint "$VH_HINT" --run-id "$GITHUB_RUN_ID" \
            --output evidence/stage311-real-alsa-entry-return-audit.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("evidence/stage311-real-alsa-entry-return-audit.json").read_text())
          assert r["result"]=="REAL_STAGE311_SOURCE_PINNED_NEW_HOST_ALSA_RETURN_PHASES_REPARSED"
          assert r["compiled_stage309_new_host_sha256"]==os.environ["STAGE309_ELF_SHA"]
          assert r["hint_ms"]==int(os.environ["VH_HINT"])
          assert r["production_audio_fixed"] is False
          print("Stage311 real source-reparsed guest wait/end phases:")
          for item in r["per_tls_alias_and_function"]:
              if item["source_window_begun_delta"] or item["observed_snapshots_with_unreturned_calls"]:
                  print(item)
          PY
      - name: Validate real anonymized Linux scheduler state source and independent pinned guest CPAL timeline
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_map02_proc_task_wait_stage312.py \
            --evidence evidence --hint "$VH_HINT" --run-id "$GITHUB_RUN_ID" \
            --output evidence/stage312-linux-task-wait-source-audit.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("evidence/stage312-linux-task-wait-source-audit.json").read_text())
          assert r["result"]=="REAL_STAGE312_TAGGED_GUEST_PROC_TASK_WAIT_BUCKETS_REPARSED"
          assert r["hint_ms"]==int(os.environ["VH_HINT"])
          assert r["host_stage309_compiled_experimental_ELF_sha256"]==os.environ["STAGE309_ELF_SHA"]
          assert r["verified_native_CPAL_ALSA_TLS_aliases_are_not_proc_aliases"] is True
          assert r["no_kernel_wait_site_or_CPAL_scheduler_root_cause_proven"] is True
          print("Actual Linux wait state histogram:",r["guest_task_state_observations"])
          print("Sanitized wait category histogram:",r["guest_sanitized_wait_bucket_observations"])
          print("Anonymous task aliases:",r["source_distinct_anonymous_proc_task_aliases"])
          print("CPU tick growth aliases:",r["task_aliases_showing_CPU_tick_growth"])
          print("Original guest-window CPAL callbacks:",r["original_CPAL_P_L_guest_callback_count"])
          PY
      - name: Verify source-only private TID to proven CPAL TLS and Linux task join
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_map02_private_proc_tls_join_stage313.py \
            --evidence evidence --hint "$VH_HINT" --run-id "$GITHUB_RUN_ID" \
            --output evidence/stage313-private-proc-cpal-TLS-audit.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("evidence/stage313-private-proc-cpal-TLS-audit.json")
          r=json.loads(p.read_text())
          assert r["result"]=="REAL_STAGE313_TAGGED_CPAL_TO_LINUX_TASK_PRIVATE_JOIN_REPARSED"
          assert r["requested_pulse_hint_ms"]==int(os.environ["VH_HINT"])
          assert r["exact_stage309_experimental_host_ELF_sha256"]==os.environ["STAGE309_ELF_SHA"]
          assert r["private_native_TID_never_uploaded"] is True
          assert r["no_audio_root_cause_or_production_fix_proven"] is True
          print("Source-verified native anonymous proc/TLS alias join count:",
                r["direct_same_process_source_join_count"])
          print("CPAL positively tagged before first guest input: ",
                r["source_cpal_tagged_pre_input_task_count"])
          print("Per-CPAL task categorized wait and Linux state:",
                r["cpal_tagged_pre_input_native_task_wait_evidence"])
          PY
      - name: Audit actual real native CPAL libc poll / epoll wait call boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_map02_libc_wait_stage314.py \
            --evidence evidence --hint "$VH_HINT" --run-id "$GITHUB_RUN_ID" \
            --output evidence/stage314-real-native-cpal-libc-wait-audit.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("evidence/stage314-real-native-cpal-libc-wait-audit.json").read_text())
          assert r["result"]=="REAL_STAGE314_AUTHENTIC_CPAL_LIBC_WAIT_PHASES_SOURCE_REPARSED"
          assert r["hint_ms"]==int(os.environ["VH_HINT"])
          assert r["host_experimental_neXium_ELF_sha256"]==os.environ["STAGE309_ELF_SHA"]
          assert r["private_native_tid_to_proven_tls_alias_join_source_verified"] is True
          assert r["no_audio_wakeup_root_cause_or_production_fix_proven"] is True
          print("Actual native CPAL post-input callbacks:",r["genuine_post_input_CPAL_callback_entries"])
          print("CPAL native wait libc source rows:",r["cpal_same_native_thread_libc_waits"])
          print("Total CPAL wait exported entries and returns:",
                r["CPAL_thread_libc_export_entries_observed"],
                r["CPAL_thread_libc_export_returns_observed"])
          print("Libc poll phase in-flight last observation:",
                r["CPAL_thread_outstanding_libc_calls_at_last_sample"])
          PY
