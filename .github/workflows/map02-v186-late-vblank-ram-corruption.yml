name: MAP02 v186 late native VBlank RAM fault refusals
on:
  pull_request:
    paths:
      - '.github/workflows/map02-v186-late-vblank-ram-corruption.yml'
      - '.github/workflows/map02-v104-content-guard.yml'
      - 'tools/apply_map02_v186_late_vblank_ram_corruption.py'
      - 'tests/test_map02_v186_late_vblank_ram_corruption.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  later-phase-audit:
    name: RAM later-boundary audit (${{ matrix.cc }})
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Verify late faults are read before any guest repair
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          python3 -m compileall -q tools/apply_map02_v186_late_vblank_ram_corruption.py tests/test_map02_v186_late_vblank_ram_corruption.py
          python3 -m unittest discover -s tests -p 'test_map02_v186_late_vblank_ram_corruption.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v185_ram_vblank_persistence.py' -v
          echo 'VH186_INDEPENDENT_RAM_LATE_PHASE_PASS faults=6 boundaries=2,3 original_retail_executed=0'
