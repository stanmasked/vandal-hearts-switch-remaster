name: MAP02 Stage292 corrected-run re-audit paired real 21 and 22ms CPAL/AudioOut evidence

on:
  pull_request:
    paths:
      - '.github/workflows/map02-cpal-lifecycle-paired-21-22-audit.yml'
      - 'tools/audit_map02_cpal_lifecycle_paired_21_22.py'
      - 'tests/test_audit_map02_cpal_lifecycle_paired_21_22.py'
      - 'docs/MAP02_CPAL_LIFECYCLE_PAIRED_21_22_AUDIT.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  VH_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  VH_STAGE291_FROZEN: 'af17517c7ee65855427a910559b59fe02355019f'

jobs:
  independent-paired-evidence:
    name: Re-decode real guest PNGs and PCM against source-pinned CPAL 21/22 timelines
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VH_EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure only four new research audit files and frozen Stage281 parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VH_EXACT_HEAD"
          python3 - <<'PY'
          import os,subprocess
          changes=set(subprocess.check_output(
              ["git","diff","--name-only",os.environ["VH_STAGE291_FROZEN"],"HEAD"],
              text=True).splitlines())
          allowed={
              ".github/workflows/map02-cpal-lifecycle-paired-21-22-audit.yml",
              "tools/audit_map02_cpal_lifecycle_paired_21_22.py",
              "tests/test_audit_map02_cpal_lifecycle_paired_21_22.py",
              "docs/MAP02_CPAL_LIFECYCLE_PAIRED_21_22_AUDIT.md",
          }
          assert changes and changes<=allowed,sorted(changes-allowed)
          print("Only independent ROM-free audit code added:",sorted(changes))
          PY
      - name: Install only CPU optical decoder dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pil
      - name: Run generated-only 14 adversarial test scenarios
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests \
            -p 'test_audit_map02_cpal_paired_21_22.py' -v
      - name: Download the actual 21ms pending audout experiment archive
        uses: actions/download-artifact@v4
        with:
          name: map02-stage291-first-real-21ms-cpal-guest-evidence
          run-id: 39497887866
          github-token: ${{ github.token }}
          path: real-21
      - name: Download the actual 22ms verified guest CRC/PCM experiment archive
        uses: actions/download-artifact@v4
        with:
          name: map02-stage290-first-real-22ms-cpal-guest-evidence
          run-id: 39495636729
          github-token: ${{ github.token }}
          path: real-22
      - name: Re-decode BOTH raw actual optical PNG/PCM archives and real CPAL counter CSVs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage292-results
          test -s real-21/guest-prejoin.png
          test -s real-22/guest-prejoin.png
          test -s real-21/guest-final.png
          test -s real-22/guest-final.png
          test -s real-21/virtual-pulse-48k-stereo-s16le.pcm
          test -s real-22/virtual-pulse-48k-stereo-s16le.pcm
          python3 tools/audit_map02_cpal_lifecycle_paired_21_22.py \
            --run21 real-21 --run22 real-22 \
            --output stage292-results/independent-real-21-22-cpal-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("stage292-results/independent-real-21-22-cpal-audit.json")
          r=json.loads(p.read_text())
          assert r["result"] in ("ONE_NEW_ELF_21_22_GUEST_CONTRAST_VERIFIED",
                                 "TWO_COMPLETE_ARCHIVES_SHOW_DIFFERENT_OR_MIXED_RESULTS")
          assert r["same_new_compiled_elf_and_generated_guest_nro"] is True
          assert len(r["trials"])==2
          assert r["trials"][0]["hint_ms"]==21
          assert r["trials"][1]["hint_ms"]==22
          assert r["host_lifecycle_and_error_counters_independently_reparsed"] is True
          assert r["real_raw_guest_png_and_virtual_pcm_independently_checked"] is True
          assert r["one_matched_pair_not_repeated_sampling"] is True
          assert r["pending_guest_call_not_permanent_deadlock_proof"] is True
          assert r["physical_nintendo_switch_dac_proven"] is False
          print("Independent real new-host PNG, L-row lifecycle/error CPAL, PCM pair check complete")
          PY
      - name: Publish exact bounded comparison and scientific cautions
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("stage292-results/independent-real-21-22-cpal-audit.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              print("### Stage292 independent source-pinned CPAL 21/22ms comparison",file=out)
              if not p.exists():
                  print("**UNVERIFIED**: actual paired host/guest archive audit unavailable.",file=out)
              else:
                  r=json.loads(p.read_text())
                  print("Result: "+r["result"],file=out)
                  if "trials" in r:
                      print("Same host SHA-256: "+r["exact_nexium_lifecycle_elf_sha256"],file=out)
                      print("Same opt-in NRO SHA-256: "+r["same_rom_free_research_guest_nro_sha256"],file=out)
                      print("| Hint | CPAL calls | CPAL error callbacks | Lifecycle state | AudioOut appends | Guest prejoin | Nonzero PCM16 | Guest optical |",file=out)
                      print("|---:|---:|---:|---|---:|---:|---:|---|",file=out)
                      for x in r["trials"]:
                          print(f'| {x["hint_ms"]} ms | {x["cpal_entries_after_input"]}/'
                                f'{x["cpal_returns_after_input"]} | '
                                f'{x["cpal_error_callbacks_after_input"]} | '
                                f'{x["cpal_lifecycle_final_name"]} | '
                                f'{x["audioout_appends_after_input"]} | '
                                f'{x["prejoin_audout_entries"]}/'
                                f'{x["prejoin_audout_returns"]} | '
                                f'{x["actual_nonzero_pcm16_samples"]} | '
                                f'{x["guest_final_optical_result"]} |',file=out)
                      print("**One pair only; mixed behavior is not suppressed and no permanent deadlock proven**. "
                            "Pulse latency is a requested hint, not measured CPAL hardware "
                            "period. Not evidence of original game music or physical Nintendo "
                            "Switch speaker output.",file=out)
                  else:
                      print("**No contrast claimed:** "+r.get("reason",""),file=out)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map02-stage292-independent-one-pair-21-22-audit
          path: stage292-results/
          if-no-files-found: warn
