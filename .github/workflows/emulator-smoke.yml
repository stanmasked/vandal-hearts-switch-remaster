          python3 tools/audit_nexium_audout_idle_control.py \
            --sd-root "$RUNNER_TEMP/vh-nexium-idle276-${GITHUB_RUN_ID}" \
            --evidence runtime-evidence/idle-control \
            --preflight integrated-nro-preflight.json \
