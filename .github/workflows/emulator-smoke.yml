      - name: Verify observed framebuffer music labels and scene evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from PIL import Image, ImageChops
          from pathlib import Path
          from statistics import median
          root=Path("runtime-evidence")
          states=["field_initial","focus_1","field_1","focus_2","field_2"]
          images=[Image.open(root/f"scene-{s}.png").convert("RGB") for s in states]
          if any(image.size != (1280,720) for image in images):
              raise SystemExit("invalid controlled-scene screenshot dimensions")
          # UI panel around explicit MUSIC FIELD / MUSIC FOCUS label.
          cropped=[im.crop((960,600,1140,638)) for im in images]
          changed=[]
          for x,y in zip(cropped,cropped[1:]):
              diff=ImageChops.difference(x,y)
              changed.append(sum(1 for r,g,b in diff.getdata() if max(r,g,b)>24))
          report=json.loads((root/"scene-audio-report.json").read_text())
          if len(report["intervals"])!=5:
              raise SystemExit("scene capture did not include five distinct windows")
          timing=json.loads((root/"scene-transition-observations.json").read_text())
          if (timing["pcm_sha256"]!=report["pcm_sha256"]
              or timing["timing_result"]!="HOST_RELATIVE_DETECTION_ONLY"
              or len(timing["transitions"])!=4
              or not all(t["stable_expected_scene_detected"] for t in timing["transitions"])):
              raise SystemExit("repeated PCM transition could not be detected in host-relative windows")
          if (timing["actual_input_to_audio_latency_ms"] is not None
              or timing["hardware_status"]!="HARDWARE NOT TESTED"):
              raise SystemExit("host audio timing cannot certify device latency")
          if min(changed)<25:
              raise SystemExit(f"music status label did not visibly toggle: {changed}")
          summary={
              "schema":"vh-nexium-scene-visual/v1",
              "music_ui_changed_pixel_counts":changed,
              "pcm_evidence_result":report["result"],
              "hardware_status":"HARDWARE NOT TESTED",
              "audible_music_confirmed":False
          }
          (root/"scene-visual-report.json").write_text(json.dumps(summary,indent=2)+"\n")
          print(json.dumps(summary,indent=2))
          PY

