name: Experimental NRO runtime smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/emulator-smoke.yml'
      - 'source/main.c'
      - 'source/game_state.h'
      - 'source/game_rules.h'
      - 'Makefile'
      - 'source/vh_switch_game_audio.c'
      - 'source/vh_switch_game_audio.h'
      - 'source/vh_audio_exit_timeline.h'
      - 'tools/audit_nexium_guest_exit_timeline.py'
      - 'tests/test_audit_nexium_guest_exit_timeline.py'
      - 'tests/test_vh_audio_exit_timeline.c'
      - 'source/vh_audout_queue_telemetry.c'
      - 'source/vh_audout_queue_telemetry.h'
      - 'source/vh_audout_queue_export.c'
      - 'source/vh_audout_queue_export.h'
      - 'tools/analyze_nexium_idle_switch_service_probes.py'
      - 'tools/analyze_nexium_probe_phase_sensitivity.py'
      - 'tools/analyze_nexium_phase_selection_gap.py'
      - 'tools/compare_nexium_real_queue_phases.py'
      - 'tools/audit_nexium_phase_order_reversal.py'
      - 'tools/audit_nexium_phase_order_full_call_rates.py'
      - 'tools/audit_nexium_phase_order_call_complement.py'
      - 'tests/test_audit_nexium_phase_order_call_complement.py'
      - 'tests/test_audit_nexium_phase_order_full_call_rates.py'
      - 'tests/test_audit_nexium_phase_order_reversal.py'
      - 'tests/test_compare_nexium_real_queue_phases.py'
      - 'tools/analyze_nexium_slow_call_cycle_occupancy.py'
      - 'tests/test_analyze_nexium_slow_call_cycle_occupancy.py'
      - 'tests/test_analyze_nexium_phase_selection_gap.py'
      - 'tests/test_analyze_nexium_probe_phase_sensitivity.py'
      - 'tests/test_analyze_nexium_idle_switch_service_probes.py'
      - 'tests/test_vh_audout_queue_telemetry.c'
      - 'tests/test_vh_audout_queue_export.c'
      - 'tools/audit_nexium_audout_queue.py'
      - 'tools/audit_nexium_audout_latency.py'
      - 'tools/audit_nexium_audout_scene_correlation.py'
      - 'tools/audit_nexium_audout_slow_calls.py'
      - 'tools/compare_nexium_verified_slow_runs.py'
      - 'tests/test_compare_nexium_verified_slow_runs.py'
      - 'tests/test_audit_nexium_audout_slow_calls.py'
      - 'tests/test_audit_nexium_audout_scene_correlation.py'
      - 'tests/test_audit_nexium_audout_latency.py'
      - 'tools/audit_nexium_audout_repeatability.py'
      - 'tools/analyze_nexium_audout_window_maxima.py'
      - 'tests/test_analyze_nexium_audout_window_maxima.py'
      - 'tests/test_audit_nexium_audout_repeatability.py'
      - 'tools/verify_switch_runtime_nro.py'
      - 'tests/test_verify_switch_runtime_nro.py'
      - 'tests/test_audit_nexium_audout_queue.py'
      - 'tests/check_nro.py'
      - 'tools/analyze_nexium_scene_audio.py'
      - 'tools/analyze_nexium_pcm_stream_integrity.py'
      - 'tools/analyze_nexium_pcm_scene_silence.py'
      - 'tests/test_analyze_nexium_pcm_scene_silence.py'
      - 'tests/test_analyze_nexium_pcm_stream_integrity.py'
      - 'tools/capture_nexium_scene_audio.sh'
      - 'tests/test_analyze_nexium_scene_audio.py'
      - 'tools/analyze_nexium_transition_timing.py'
      - 'tools/audit_switch_guest_scene_trace.py'
      - 'tools/audit_nexium_guest_sd_handoff.py'
      - 'tools/decode_nexium_guest_trace_frame.py'
      - 'tests/test_decode_nexium_guest_trace_frame.py'
      - 'tools/capture_nexium_scene_soak.sh'
      - 'tools/audit_nexium_audout_idle_control.py'
      - 'tools/compare_nexium_idle_switch_pairs.py'
      - 'tools/analyze_nexium_idle_switch_variability.py'
      - 'tools/analyze_nexium_steady_state.py'
      - 'tests/test_analyze_nexium_steady_state.py'
      - 'tests/test_analyze_nexium_idle_switch_variability.py'
      - 'tests/test_compare_nexium_idle_switch_pairs.py'
      - 'tests/test_audit_nexium_audout_idle_control.py'
      - 'tools/audit_nexium_scene_soak.py'
      - 'tests/test_audit_nexium_scene_soak.py'
      - 'source/vh_audio_scene_optical.c'
      - 'source/vh_audio_scene_optical.h'
      - 'tests/test_vh_audio_scene_optical.c'
      - 'tests/test_audit_nexium_guest_sd_handoff.py'
      - 'source/vh_audio_scene_trace_export.c'
      - 'source/vh_audio_scene_trace_export.h'
      - 'tests/test_vh_audio_scene_trace_export.c'
      - 'tests/test_audit_switch_guest_scene_trace.py'
      - 'tests/test_analyze_nexium_transition_timing.py'

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build libnx NRO for runtime smoke test
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test libnx prototype
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/switch/bin:$PATH"
          make test
          python3 -m unittest discover -s tests -p "test_analyze_nexium_pcm.py" -v
          python3 -m unittest discover -s tests -p "test_analyze_nexium_pcm_stream_integrity.py" -v
          python3 -m unittest discover -s tests -p "test_analyze_nexium_pcm_scene_silence.py" -v
          python3 -m unittest discover -s tests -p "test_analyze_nexium_scene_audio.py" -v
          python3 -m unittest discover -s tests -p "test_audit_nexium_audout_queue.py" -v
          python3 -m unittest discover -s tests -p "test_audit_nexium_audout_latency.py" -v
          python3 -m unittest discover -s tests -p "test_audit_nexium_audout_scene_correlation.py" -v
          python3 -m unittest discover -s tests -p "test_audit_nexium_audout_slow_calls.py" -v
          python3 -m unittest discover -s tests -p "test_compare_nexium_verified_slow_runs.py" -v
          python3 -m unittest discover -s tests -p "test_audit_nexium_audout_repeatability.py" -v
          python3 -m unittest discover -s tests -p "test_analyze_nexium_audout_window_maxima.py" -v
          python3 -m unittest discover -s tests -p "test_verify_switch_runtime_nro.py" -v
          python3 -m unittest discover -s tests -p "test_analyze_nexium_transition_timing.py" -v
          python3 -m unittest discover -s tests -p "test_audit_nexium_guest_sd_handoff.py" -v
          bash -n tools/capture_nexium_scene_soak.sh
          python3 -m unittest discover -s tests -p "test_audit_nexium_audout_idle_control.py" -v
          python3 -m unittest discover -s tests -p "test_compare_nexium_idle_switch_pairs.py" -v
          python3 -m unittest discover -s tests -p "test_analyze_nexium_idle_switch_variability.py" -v
          python3 -m unittest discover -s tests -p "test_analyze_nexium_steady_state.py" -v
          # The experimental phase must pass strict original-SD CSV
          # negative controls before either NRO is permitted to build.
          python3 -m unittest discover -s tests -p "test_audit_nexium_audout_service_probes.py" -v
          bash -n tools/capture_nexium_scene_audio.sh
          make verify-nro
          # Different build directory prevents replacing the phase0 NRO.
          make BUILD=build-phase8 AUDOUT_PROBE_PHASE=8 all
          test -s build-phase8/vandal-hearts-prototype.nro
          # Keep artifact's root at build/ so the historical NRO path
          # nros/vandal-hearts-prototype.nro does not change.
          cp build-phase8/vandal-hearts-prototype.nro build/vandal-hearts-phase8.nro

      - name: Bind NRO bytes to current source revision and workflow run
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          nro=Path("build/vandal-hearts-prototype.nro")
          data=nro.read_bytes()
          record={
              "schema":"vh-switch-same-run-nro/v1",
              "git_sha":os.environ["GITHUB_SHA"],
              "run_id":int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "nro_name":nro.name,
              "nro_bytes":len(data),
              "nro_sha256":hashlib.sha256(data).hexdigest(),
          }
          Path("build/runtime-nro-manifest.json").write_text(
              json.dumps(record,sort_keys=True)+"\n",encoding="ascii")
          alt=Path("build/vandal-hearts-phase8.nro")
          alt_data=alt.read_bytes()
          phase8={
              "schema":"vh-switch-explicit-probe-phase/v1",
              "git_sha":os.environ["GITHUB_SHA"],
              "run_id":int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "phase":8,
              "nro_bytes":len(alt_data),
              "nro_sha256":hashlib.sha256(alt_data).hexdigest(),
              "baseline_sha256":record["nro_sha256"],
          }
          if phase8["nro_sha256"]==record["nro_sha256"]:
              raise SystemExit("phase8 NRO is identical to phase0 baseline")
          Path("build/runtime-phase8-manifest.json").write_text(
              json.dumps(phase8,sort_keys=True)+"\n",encoding="ascii")
          print(json.dumps({"baseline":record,"experiment":phase8},sort_keys=True))
          PY

      - name: Upload NROs for emulator smoke test
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-nro
          path: |
            build/vandal-hearts-prototype.nro
            build/runtime-nro-manifest.json
          if-no-files-found: error

      - name: Upload isolated phase8 experimental NRO
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-phase8
          path: |
            build/vandal-hearts-phase8.nro
            build/runtime-phase8-manifest.json
          if-no-files-found: error

  run-in-emulator:
    name: Launch current-workflow audout NRO in NeXium
    runs-on: ubuntu-26.04
    needs: build
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download NRO built by current workflow run
        uses: actions/download-artifact@v4
        with:
          name: runtime-smoke-nro
          path: nros

      - name: Download isolated phase8 NRO from current workflow run
        uses: actions/download-artifact@v4
        with:
          name: runtime-smoke-phase8
          path: phase8

      - name: Require NRO from current run, commit and attempt
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_switch_runtime_nro.py nros \
            --git-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            | tee integrated-nro-preflight.json
          echo "Candidate: same-workflow libnx/audout NRO (not proof of audible sound)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install headless display and Vulkan runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers \
            pulseaudio pulseaudio-utils libasound2-plugins

      - name: Verify optical pixel decoder with tampering regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p "test_decode_nexium_guest_trace_frame.py" -v
          bash -n tools/capture_nexium_scene_soak.sh
          python3 -m unittest discover -s tests -p "test_audit_nexium_scene_soak.py" -v

      - name: Download NeXium nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          release_json="$(curl -fsSL --retry 3 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          asset_url="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name == "nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          test -n "$asset_url"
          curl -fL --retry 3 --retry-all-errors "$asset_url" -o /tmp/nexium-linux.tar.gz
          mkdir -p /tmp/nexium
          tar -xzf /tmp/nexium-linux.tar.gz -C /tmp/nexium
          emu_bin="$(find /tmp/nexium -type f -executable \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          if [ -z "$emu_bin" ]; then
            emu_bin="$(find /tmp/nexium -type f -executable ! -name 'ffmpeg' -print -quit)"
          fi
          test -n "$emu_bin"
          echo "NEXIUM_BIN=$emu_bin" >> "$GITHUB_ENV"
          echo "NeXium executable: $emu_bin"
          ldd "$emu_bin" || true

      - name: Run framebuffer, texture, and input probes
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p runtime-evidence
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          if [ -z "$icd" ]; then
            echo "Lavapipe Vulkan ICD not found" | tee runtime-evidence/runner.log
            exit 1
          fi
          echo "Vulkan ICD: $icd" | tee runtime-evidence/runner.log
          result=0

          run_probe() {
            local nro="$1"
            local label="$2"
            local check_input="${3:-0}"
            local shot="runtime-evidence/$label.png"
            local shot_selected="runtime-evidence/$label-selected.png"
            local shot_cancelled="runtime-evidence/$label-cancelled.png"
            local shot_invalid="runtime-evidence/$label-invalid-move.png"
            local shot_enemy_blocked="runtime-evidence/$label-enemy-blocked.png"
            local shot_after="runtime-evidence/$label-after-move.png"
            local shot_plus="runtime-evidence/$label-after-plus.png"
            local log="runtime-evidence/$label.log"
            export NRO="$nro" SHOT="$shot" SHOT_SELECTED="$shot_selected" SHOT_CANCELLED="$shot_cancelled" SHOT_INVALID="$shot_invalid" SHOT_ENEMY_BLOCKED="$shot_enemy_blocked" SHOT_AFTER="$shot_after" SHOT_PLUS="$shot_plus" LOG="$log" CHECK_INPUT="$check_input" VK_ICD_FILENAMES="$icd"
            echo "Launching $nro in NeXium" | tee -a runtime-evidence/runner.log

            if ! timeout --kill-after=5s 60s xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
              set -euo pipefail
              "$NEXIUM_BIN" "$NRO" >"$LOG" 2>&1 &
              pid=$!
              for i in $(seq 1 30); do
                sleep 1
                state="$(ps -o stat= -p "$pid" 2>/dev/null | tr -d " " || true)"
                if [ -z "$state" ] || [[ "$state" == Z* ]] || ! kill -0 "$pid" 2>/dev/null; then
                  wait "$pid" || rc=$?
                  cat "$LOG"
                  echo "NeXium exited before screenshot (status ${rc:-unknown})"
                  exit 1
                fi
              done
              window="$(xdotool search --onlyvisible --name "NeXium" 2>/dev/null | tail -n 1 || true)"
              if [ -z "$window" ]; then
                echo "NeXium window not found" >&2
                exit 1
              fi
              timeout --kill-after=2s 10s import -window "$window" "$SHOT"
              if [ "$CHECK_INPUT" = "1" ]; then
                timeout --kill-after=1s 3s xdotool windowfocus --sync "$window" || true
                timeout --kill-after=1s 3s xdotool keydown --window "$window" c
                sleep 0.15
                timeout --kill-after=1s 3s xdotool keyup --window "$window" c
                sleep 0.3
                timeout --kill-after=2s 10s import -window "$window" "$SHOT_SELECTED"
                timeout --kill-after=1s 3s xdotool keydown --window "$window" x
                sleep 0.15
                timeout --kill-after=1s 3s xdotool keyup --window "$window" x
                sleep 0.3
                timeout --kill-after=2s 10s import -window "$window" "$SHOT_CANCELLED"
                timeout --kill-after=1s 3s xdotool keydown --window "$window" c
                sleep 0.15
                timeout --kill-after=1s 3s xdotool keyup --window "$window" c
                sleep 0.15
                for press in 1 2; do
                  timeout --kill-after=1s 3s timeout --kill-after=1s 3s xdotool keydown --window "$window" Right
                  sleep 0.15
                  timeout --kill-after=1s 3s timeout --kill-after=1s 3s xdotool keyup --window "$window" Right
                  sleep 0.15
                done
                timeout --kill-after=1s 3s xdotool keydown --window "$window" c
                sleep 0.15
                timeout --kill-after=1s 3s xdotool keyup --window "$window" c
                sleep 0.3
                timeout --kill-after=2s 10s import -window "$window" "$SHOT_AFTER"
                timeout --kill-after=1s 3s xdotool keydown --window "$window" c
                sleep 0.15
                timeout --kill-after=1s 3s xdotool keyup --window "$window" c
                sleep 0.15
                for press in 1 2 3; do
                  timeout --kill-after=1s 3s timeout --kill-after=1s 3s xdotool keydown --window "$window" Right
                  sleep 0.15
                  timeout --kill-after=1s 3s timeout --kill-after=1s 3s xdotool keyup --window "$window" Right
                  sleep 0.15
                done
                timeout --kill-after=1s 3s xdotool keydown --window "$window" c
                sleep 0.15
                timeout --kill-after=1s 3s xdotool keyup --window "$window" c
                sleep 0.3
                timeout --kill-after=2s 10s import -window "$window" "$SHOT_INVALID"

                for press in 1 2; do
                  timeout --kill-after=1s 3s xdotool keydown --window "$window" Left
                  sleep 0.15
                  timeout --kill-after=1s 3s xdotool keyup --window "$window" Left
                  sleep 0.15
                done
                timeout --kill-after=1s 3s xdotool keydown --window "$window" Down
                sleep 0.15
                timeout --kill-after=1s 3s xdotool keyup --window "$window" Down
                sleep 0.15
                timeout --kill-after=1s 3s xdotool keydown --window "$window" c
                sleep 0.15
                timeout --kill-after=1s 3s xdotool keyup --window "$window" c
                sleep 0.15
                timeout --kill-after=1s 3s xdotool keydown --window "$window" c
                sleep 0.15
                timeout --kill-after=1s 3s xdotool keyup --window "$window" c
                sleep 0.15
                for press in 1 2; do
                  timeout --kill-after=1s 3s timeout --kill-after=1s 3s xdotool keydown --window "$window" Right
                  sleep 0.15
                  timeout --kill-after=1s 3s timeout --kill-after=1s 3s xdotool keyup --window "$window" Right
                  sleep 0.15
                done
                timeout --kill-after=1s 3s xdotool keydown --window "$window" c
                sleep 0.15
                timeout --kill-after=1s 3s xdotool keyup --window "$window" c
                sleep 0.3
                timeout --kill-after=2s 10s import -window "$window" "$SHOT_ENEMY_BLOCKED"

                # NeXium default keyboard mapping sends M as the Switch Plus button.
                # Capture the guest after Plus to gather evidence that applet exit is handled.
                timeout --kill-after=1s 3s xdotool keydown --window "$window" m
                sleep 0.2
                timeout --kill-after=1s 3s xdotool keyup --window "$window" m
                sleep 1
                if xdotool getwindowname "$window" >/dev/null 2>&1; then
                  timeout --kill-after=2s 10s import -window "$window" "$SHOT_PLUS" || true
                fi
              fi
              sleep 1
              test -s "$SHOT"
              test -s "$SHOT_AFTER"
              if [ "$CHECK_INPUT" = "1" ]; then
                test -s "$SHOT_SELECTED"
                test -s "$SHOT_CANCELLED"
                test -s "$SHOT_INVALID"
                test -s "$SHOT_ENEMY_BLOCKED"
              fi
              kill -INT "$pid" 2>/dev/null || true
              sleep 2
              kill -KILL "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            '; then
              echo "Runtime launch/screenshot failed for $label" | tee -a runtime-evidence/runner.log
              result=1
              return
            fi

            if ! python3 - "$shot" "$shot_selected" "$shot_cancelled" "$shot_invalid" "$shot_enemy_blocked" "$shot_after" "$shot_plus" "$label" <<'PY'
          from PIL import Image
          from pathlib import Path
          import sys

          before = Image.open(sys.argv[1]).convert("RGB")
          selected = Image.open(sys.argv[2]).convert("RGB") if Path(sys.argv[2]).exists() else None
          cancelled = Image.open(sys.argv[3]).convert("RGB") if Path(sys.argv[3]).exists() else None
          invalid = Image.open(sys.argv[4]).convert("RGB") if Path(sys.argv[4]).exists() else None
          enemy_blocked = Image.open(sys.argv[5]).convert("RGB") if Path(sys.argv[5]).exists() else None
          after = Image.open(sys.argv[6]).convert("RGB")
          plus = Image.open(sys.argv[7]).convert("RGB") if Path(sys.argv[7]).exists() else None
          label = sys.argv[8]
          if plus is not None:
              from PIL import ImageChops
              diff = ImageChops.difference(enemy_blocked, plus)
              changed = sum(1 for pixel in diff.getdata() if max(pixel) > 24)
              print(f"{label}: pixels changed after Plus/M input={changed}; screenshot saved for inspection")
          else:
              print(f"{label}: no post-Plus screenshot captured; emulator/app may have closed its window")
          hero = (86, 190, 244)
          cursor = (255, 219, 102)

          def near_color_count(image, color, box):
              crop = image.crop(box)
              return sum(
                  1 for r, g, b in crop.getdata()
                  if max(abs(r - color[0]), abs(g - color[1]), abs(b - color[2])) <= 16
              )

          hero_before = near_color_count(before, hero, (0, 0, before.width, before.height))
          hero_after = near_color_count(after, hero, (0, 0, after.width, after.height))
          print(f"{sys.argv[1]}: size={before.size}, hero pixels={hero_before}")
          print(f"{sys.argv[2]}: size={after.size}, hero pixels={hero_after}")
          if before.size != (1280, 720) or after.size != (1280, 720):
              raise SystemExit("Unexpected screenshot dimensions")
          if hero_before < 50 or hero_after < 50:
              raise SystemExit("Expected hero marker color was not detected")

          changed = sum(
              1 for a, b in zip(before.getdata(), after.getdata())
              if max(abs(a[0]-b[0]), abs(a[1]-b[1]), abs(a[2]-b[2])) > 24
          )
          print(f"{label}: changed pixels between screenshots={changed}")
          if changed < 100:
              raise SystemExit("Framebuffer output did not visibly change after input")

          if label == "libnx-framebuffer":
              grid_x, grid_y, cell = 352, 100, 72
              def tile_box(x, y):
                  return (x + 4, y + 4, x + cell - 4, y + cell - 4)
              tile_one = tile_box(grid_x + cell, grid_y + 2 * cell)
              tile_two = tile_box(grid_x + 2 * cell, grid_y + 2 * cell)
              tile_three = tile_box(grid_x + 3 * cell, grid_y + 2 * cell)
              before_one = near_color_count(before, cursor, tile_one)
              before_two = near_color_count(before, cursor, tile_two)
              before_three = near_color_count(before, cursor, tile_three)
              after_one = near_color_count(after, cursor, tile_one)
              after_two = near_color_count(after, cursor, tile_two)
              after_three = near_color_count(after, cursor, tile_three)
              print(f"{label}: cursor yellow counts before=({before_one},{before_two},{before_three}) after=({after_one},{after_two},{after_three})")
              if not (before_one >= 300 and before_two <= 100 and before_three <= 100 and
                      after_one <= 100 and after_two <= 100 and after_three >= 300):
                  raise SystemExit("Two Right-arrow presses did not move the cursor exactly two tiles")

              if selected is None or cancelled is None:
                  raise SystemExit("Missing selection/cancel screenshots")
              range_color = (43, 91, 91)
              range_selected = near_color_count(selected, range_color, tile_two)
              range_cancelled = near_color_count(cancelled, range_color, tile_two)
              hero_start = near_color_count(before, hero, tile_one)
              hero_start_after = near_color_count(after, hero, tile_one)
              hero_destination = near_color_count(after, hero, tile_three)
              print(f"{label}: range tile pixels selected={range_selected} cancelled={range_cancelled}")
              print(f"{label}: hero pixels start before={hero_start} after={hero_start_after}; destination after={hero_destination}")
              if not (range_selected >= 300 and range_cancelled <= 100):
                  raise SystemExit("A selection / B cancel did not toggle the movement-range highlight")
              if not (hero_start >= 300 and hero_start_after <= 100 and hero_destination >= 300):
                  raise SystemExit("Valid selected move did not relocate the hero two tiles right")

              if invalid is None:
                  raise SystemExit("Missing invalid-move screenshot")
              tile_four = tile_box(grid_x + 4 * cell, grid_y + 2 * cell)
              tile_six = tile_box(grid_x + 6 * cell, grid_y + 2 * cell)
              invalid_hero = near_color_count(invalid, hero, tile_three)
              invalid_cursor = near_color_count(invalid, cursor, tile_six)
              invalid_range = near_color_count(invalid, range_color, tile_four)
              print(f"{label}: after out-of-range attempt hero-at-origin-destination={invalid_hero}, cursor-at-invalid-tile={invalid_cursor}, selected-range={invalid_range}")
              if not (invalid_hero >= 300 and invalid_cursor >= 300 and invalid_range >= 300):
                  raise SystemExit("Out-of-range move was not rejected while preserving hero position and selection")

              if enemy_blocked is None:
                  raise SystemExit("Missing enemy-blocked screenshot")
              tile_old_hero = tile_box(grid_x + 3 * cell, grid_y + 2 * cell)
              tile_new_hero = tile_box(grid_x + 4 * cell, grid_y + 3 * cell)
              tile_enemy = tile_box(grid_x + 6 * cell, grid_y + 3 * cell)
              tile_enemy_range = tile_box(grid_x + 5 * cell, grid_y + 3 * cell)
              old_hero_after_block = near_color_count(enemy_blocked, hero, tile_old_hero)
              new_hero_after_block = near_color_count(enemy_blocked, hero, tile_new_hero)
              enemy_marker = near_color_count(enemy_blocked, (235, 89, 98), tile_enemy)
              cursor_on_enemy = near_color_count(enemy_blocked, cursor, tile_enemy)
              range_after_block = near_color_count(enemy_blocked, range_color, tile_enemy_range)
              print(f"{label}: enemy-blocked attempt old-hero={old_hero_after_block}, new-hero={new_hero_after_block}, enemy-marker={enemy_marker}, cursor={cursor_on_enemy}, selected-range={range_after_block}")
              if not (old_hero_after_block <= 100 and new_hero_after_block >= 300 and
                      enemy_marker >= 300 and cursor_on_enemy >= 300 and range_after_block >= 300):
                  raise SystemExit("Move onto the enemy tile was not rejected while preserving the hero and selection")

 
          else:
              print("SDL2 input is not asserted here; SDL2 joystick input is checked in the separate workflow.")
          PY
            then
              echo "Render or right-arrow input check failed for $label" | tee -a runtime-evidence/runner.log
              result=1
            fi
          }

          run_probe "nros/vandal-hearts-prototype.nro" "libnx-framebuffer" "1"
          exit "$result"

      - name: Capture guest audio through isolated PulseAudio monitor
        id: audio_capture
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          runtime_dir="${RUNNER_TEMP}/vh-pulse-runtime"
          mkdir -p "$runtime_dir"
          chmod 700 "$runtime_dir"
          export XDG_RUNTIME_DIR="$runtime_dir"
          pulseaudio --daemonize=yes --exit-idle-time=-1 \
            --log-target=file:runtime-evidence/pulseaudio.log
          export PULSE_SERVER="unix:$runtime_dir/pulse/native"
          pactl info > runtime-evidence/pulse-server.txt
          pactl load-module module-null-sink \
            sink_name=vh_nexium_capture rate=48000 channels=2 \
            sink_properties=device.description=VH_NeXium_Test \
            > runtime-evidence/pulse-module-id.txt
          pactl set-default-sink vh_nexium_capture
          cat > "${RUNNER_TEMP}/vh-asound.conf" <<'ASOUND'
          pcm.!default { type pulse }
          ctl.!default { type pulse }
          ASOUND
          export ALSA_CONFIG_PATH="${RUNNER_TEMP}/vh-asound.conf"
          export SDL_AUDIODRIVER=pulse
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          parec --device=vh_nexium_capture.monitor --rate=48000 \
            --channels=2 --format=s16le --raw \
            > runtime-evidence/nexium-monitor-s16le-48k.pcm \
            2>runtime-evidence/parec.log &
          recorder=$!
          sleep 1
          timeout --kill-after=5s 46s xvfb-run -a -s "-screen 0 1280x720x24" \
            "$NEXIUM_BIN" nros/vandal-hearts-prototype.nro \
            >runtime-evidence/nexium-audio-run.log 2>&1 &
          guest=$!
          for sample in 1 2 3 4; do
            sleep 10
            {
              echo "=== audio sink-input sample $sample ==="
              pactl list sink-inputs
            } >>runtime-evidence/pulse-sink-inputs.txt
          done
          guest_exit=0
          wait "$guest" || guest_exit=$?
          echo "$guest_exit" > runtime-evidence/nexium-audio-guest-exit-code.txt
          kill -INT "$recorder" 2>/dev/null || true
          wait "$recorder" 2>/dev/null || true
          python3 - <<'PY'
          import array
          import json
          import math
          from pathlib import Path
          import sys
          path=Path("runtime-evidence/nexium-monitor-s16le-48k.pcm")
          data=path.read_bytes()
          count=len(data)//2
          pcm=array.array("h")
          pcm.frombytes(data[:count*2])
          if sys.byteorder!="little":
              pcm.byteswap()
          nonzero=sum(abs(s)>=256 for s in pcm)
          peak=max((abs(s) for s in pcm),default=0)
          rms=math.sqrt(sum(float(s)*s for s in pcm)/count) if count else 0.0
          sink_text=Path("runtime-evidence/pulse-sink-inputs.txt").read_text()
          observed_sink_input='application.name = "ALSA plug-in [nexium]"' in sink_text
          report={
              "schema":"vh-nexium-pcm-monitor/v1",
              "hardware_status":"HARDWARE NOT TESTED",
              "source_nro_sha256":json.loads(Path("integrated-nro-preflight.json").read_text(encoding="utf-8"))["nro_sha256"],
              "recording":"virtual PulseAudio null-sink monitor; not audible playback",
              "sample_format":"s16le stereo 48000Hz",
              "raw_bytes":len(data),
              "sample_values":count,
              "duration_seconds":round(count/96000,3),
              "samples_magnitude_at_least_256":nonzero,
              "peak_amplitude":peak,
              "rms_amplitude":round(rms,3),
              "guest_sink_input_observed":observed_sink_input,
              "result":("NONZERO_VIRTUAL_PCM_UNATTRIBUTED_TO_MUSIC"
                        if observed_sink_input and nonzero>=9600 and rms>=32
                        else "SILENCE_OR_GUEST_AUDIO_NOT_ESTABLISHED"),
              "audible_music_confirmed":False,
              "notes":"Virtual sink data cannot prove sound was heard or that original game music was reproduced."
          }
          output=Path("runtime-evidence/pcm-monitor-report.json")
          output.write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2),flush=True)
          PY
          python3 tools/analyze_nexium_pcm.py \
            runtime-evidence/nexium-monitor-s16le-48k.pcm \
            --output runtime-evidence/pcm-quality-report.json
          python3 -m json.tool runtime-evidence/pcm-quality-report.json > /dev/null

      - name: Verify captured audio measurements
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          f=Path("runtime-evidence/pcm-quality-report.json")
          if not f.is_file():
              raise SystemExit("FAIL: missing audio quality report (capture step failed or skipped)")
          report=json.loads(f.read_text(encoding="utf-8"))
          if (report["observation"] != "NONZERO_MONITOR_PCM"
              or min(report["rms_by_channel"]) <= 50
              or report["duration_seconds"] < 30
              or sum(report["full_scale_clipped_samples_by_channel"])):
              raise SystemExit("FAIL: virtual PCM trace is silent, too short, or clipped")
          if report["audible_music_confirmed"] or report["original_soundtrack_confirmed"]:
              raise SystemExit("FAIL: virtual trace cannot claim audible or retail music")
