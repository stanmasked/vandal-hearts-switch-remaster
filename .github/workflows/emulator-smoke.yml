name: Experimental NRO runtime smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/emulator-smoke.yml'
      - 'source/main.c'
      - 'source/game_state.h'
      - 'source/game_rules.h'
      - 'Makefile'
      - 'tests/check_nro.py'

permissions:
  contents: read

jobs:
  build:
    name: Build libnx NRO for runtime smoke test
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test libnx prototype
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/switch/bin:$PATH"
          make test
          make verify-nro

      - name: Upload NROs for emulator smoke test
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-nro
          path: build/vandal-hearts-prototype.nro
          if-no-files-found: error

  run-in-emulator:
    name: Launch NROs in NeXium
    runs-on: ubuntu-26.04
    needs: build
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download test NROs
        uses: actions/download-artifact@v4
        with:
          name: runtime-smoke-nro
          path: nros

      - name: Install headless display and Vulkan runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers

      - name: Download NeXium nightly
        shell: bash
        run: |
          set -euxo pipefail
          asset_url="$(curl -fsSL https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly | jq -r '.assets[] | select(.name == "nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          test -n "$asset_url"
          curl -fL --retry 3 "$asset_url" -o /tmp/nexium-linux.tar.gz
          mkdir -p /tmp/nexium
          tar -xzf /tmp/nexium-linux.tar.gz -C /tmp/nexium
          emu_bin="$(find /tmp/nexium -type f -executable \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          if [ -z "$emu_bin" ]; then
            emu_bin="$(find /tmp/nexium -type f -executable ! -name 'ffmpeg' -print -quit)"
          fi
          test -n "$emu_bin"
          echo "NEXIUM_BIN=$emu_bin" >> "$GITHUB_ENV"
          echo "NeXium executable: $emu_bin"
          ldd "$emu_bin" || true

      - name: Run framebuffer, texture, and input probes
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p runtime-evidence
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          if [ -z "$icd" ]; then
            echo "Lavapipe Vulkan ICD not found" | tee runtime-evidence/runner.log
            exit 1
          fi
          echo "Vulkan ICD: $icd" | tee runtime-evidence/runner.log
          result=0

          run_probe() {
            local nro="$1"
            local label="$2"
            local check_input="${3:-0}"
            local shot="runtime-evidence/$label.png"
            local shot_after="runtime-evidence/$label-after-right.png"
            local log="runtime-evidence/$label.log"
            export NRO="$nro" SHOT="$shot" SHOT_AFTER="$shot_after" LOG="$log" CHECK_INPUT="$check_input" VK_ICD_FILENAMES="$icd"
            echo "Launching $nro in NeXium" | tee -a runtime-evidence/runner.log

            if ! timeout --kill-after=5s 60s xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
              set -euo pipefail
              "$NEXIUM_BIN" "$NRO" >"$LOG" 2>&1 &
              pid=$!
              for i in $(seq 1 30); do
                sleep 1
                state="$(ps -o stat= -p "$pid" 2>/dev/null | tr -d " " || true)"
                if [ -z "$state" ] || [[ "$state" == Z* ]] || ! kill -0 "$pid" 2>/dev/null; then
                  wait "$pid" || rc=$?
                  cat "$LOG"
                  echo "NeXium exited before screenshot (status ${rc:-unknown})"
                  exit 1
                fi
              done
              window="$(xdotool search --onlyvisible --name "NeXium" 2>/dev/null | tail -n 1 || true)"
              if [ -z "$window" ]; then
                echo "NeXium window not found" >&2
                exit 1
              fi
              timeout --kill-after=2s 10s import -window "$window" "$SHOT"
              if [ "$CHECK_INPUT" = "1" ]; then
                timeout --kill-after=1s 3s xdotool windowfocus --sync "$window" || true
                timeout --kill-after=1s 3s timeout --kill-after=1s 3s xdotool keydown --window "$window" Right
                sleep 0.15
                timeout --kill-after=1s 3s timeout --kill-after=1s 3s xdotool keyup --window "$window" Right
              fi
              sleep 1
              timeout --kill-after=2s 10s import -window "$window" "$SHOT_AFTER"
              test -s "$SHOT"
              test -s "$SHOT_AFTER"
              kill -INT "$pid" 2>/dev/null || true
              sleep 2
              kill -KILL "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            '; then
              echo "Runtime launch/screenshot failed for $label" | tee -a runtime-evidence/runner.log
              result=1
              return
            fi

            if ! python3 - "$shot" "$shot_after" "$label" <<'PY'
          from PIL import Image
          import sys

          before = Image.open(sys.argv[1]).convert("RGB")
          after = Image.open(sys.argv[2]).convert("RGB")
          label = sys.argv[3]
          hero = (86, 190, 244)
          cursor = (255, 219, 102)

          def near_color_count(image, color, box):
              crop = image.crop(box)
              return sum(
                  1 for r, g, b in crop.getdata()
                  if max(abs(r - color[0]), abs(g - color[1]), abs(b - color[2])) <= 16
              )

          hero_before = near_color_count(before, hero, (0, 0, before.width, before.height))
          hero_after = near_color_count(after, hero, (0, 0, after.width, after.height))
          print(f"{sys.argv[1]}: size={before.size}, hero pixels={hero_before}")
          print(f"{sys.argv[2]}: size={after.size}, hero pixels={hero_after}")
          if before.size != (1280, 720) or after.size != (1280, 720):
              raise SystemExit("Unexpected screenshot dimensions")
          if hero_before < 50 or hero_after < 50:
              raise SystemExit("Expected hero marker color was not detected")

          heartbeat_box = (1000, 600, 1120, 609)
          heartbeat_before = near_color_count(before, hero, heartbeat_box)
          heartbeat_after = near_color_count(after, hero, heartbeat_box)
          print(f"{label}: heartbeat pixels before={heartbeat_before} after={heartbeat_after}")
          if abs(heartbeat_after - heartbeat_before) < 80:
              raise SystemExit("Framebuffer heartbeat did not change between screenshots")

          if label == "libnx-framebuffer":
              grid_x, grid_y, cell = 352, 100, 72
              def tile_box(x, y):
                  return (x + 4, y + 4, x + cell - 4, y + cell - 4)
              tile_one = tile_box(grid_x + cell, grid_y + 2 * cell)
              tile_two = tile_box(grid_x + 2 * cell, grid_y + 2 * cell)
              before_one = near_color_count(before, cursor, tile_one)
              before_two = near_color_count(before, cursor, tile_two)
              after_one = near_color_count(after, cursor, tile_one)
              after_two = near_color_count(after, cursor, tile_two)
              print(f"{label}: cursor yellow counts before=({before_one},{before_two}) after=({after_one},{after_two})")
              if not (before_one >= 300 and before_two <= 100 and after_one <= 100 and after_two >= 300):
                  raise SystemExit("Right-arrow input did not move the cursor exactly one tile")
          else:
              print("SDL2 input is not asserted here; NeXium's host-key path did not move the SDL2 probe cursor in the exploratory run.")
          PY
            then
              echo "Render or right-arrow input check failed for $label" | tee -a runtime-evidence/runner.log
              result=1
            fi
          }

          run_probe "nros/vandal-hearts-prototype.nro" "libnx-framebuffer" "1"
          exit "$result"

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-runtime-evidence
          path: runtime-evidence/
          if-no-files-found: warn
