                  or a["guest_audio_second_windows"]<50
                  or a["slow_records_dropped"]!=0):
              raise SystemExit("Idle and switching traces cannot be compared")
          comparison={
              "schema":"vh-nexium-idle-versus-switch-same-nro/v1",
              "result":"SAME_NRO_GUEST_IDLE_AND_SWITCH_MEASUREMENTS_VERIFIED",
              "nro_sha256":a["nro_sha256"],
              "idle_run_id":a["run_id"],
              "guest_idle_audout_attempts":a["guest_audout_attempts"],
              "guest_switch_audout_attempts":b["audout_attempts"],
              "idle_slow_ge40ms_calls":a["slow_ge40ms_calls"],
              "switch_slow_ge40ms_calls":b["slow_calls_captured"],
              "idle_slow_ge50ms_calls":a["slow_ge50ms_calls"],
              "switch_slow_ge50ms_calls":b["slow_ge50ms_count"],
              "idle_ge40_per_1000_attempts":round(
                  1000*a["slow_ge40ms_calls"]/a["guest_audout_attempts"],3),
              "switch_ge40_per_1000_attempts":round(
                  1000*b["slow_calls_captured"]/b["audout_attempts"],3),
              "idle_ge50_per_1000_attempts":round(
                  1000*a["slow_ge50ms_calls"]/a["guest_audout_attempts"],3),
              "switch_ge50_per_1000_attempts":round(
                  1000*b["slow_ge50ms_count"]/b["audout_attempts"],3),
              "comparison_is_randomized":False,
              "scene_switching_causality_proven":False,
              "physical_hardware_tested":False,
              "audible_underruns_measured":False,
          }
          output=Path("runtime-evidence/idle-control/idle-vs-switch.json")
          output.write_text(json.dumps(comparison,indent=2,sort_keys=True)+"\n")
          print(json.dumps(comparison,sort_keys=True))
          PY
          echo "Same-NRO idle control has zero guest scene changes and verified original guest SD." >> "$GITHUB_STEP_SUMMARY"
          echo "Guest API-call duration comparisons do not prove scene causality or actual speaker underruns." >> "$GITHUB_STEP_SUMMARY"

      - name: Record audio capture boundary
        if: always()
