name: MAP02 v79 offline VBlank timeline
on:
  pull_request:
    paths:
      - 'tools/verify_map02_v79_vblank_timeline.py'
      - 'tests/test_map02_v79_vblank_timeline.py'
      - '.github/workflows/map02-v79-vblank-timeline.yml'
  workflow_dispatch:

jobs:
  synthetic-timeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Strict VBlank trace unit tests (synthetic only)
        run: python -m unittest discover -s tests -p 'test_map02_v79_vblank_timeline.py' -v
