name: SDL2 Switch feasibility probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sdl2-probe.yml'
      - 'probes/**'
      - 'Makefile'
      - 'source/game_rules.h'
      - 'source/game_state.h'
      - 'tests/check_nro.py'
      - 'tests/check_sdl2_runtime_screenshot.py'

permissions:
  contents: read

jobs:
  sdl2-probe:
    name: Build SDL2 Switch probe
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Switch SDL2 package
        shell: bash
        run: |
          set -euxo pipefail
          # Some package-mirror/CDN paths reject the default pacman downloader
          # User-Agent with HTTP 403. Use curl with a pacman-compatible UA.
          pacman_conf="${DEVKITPRO:-/opt/devkitpro}/pacman/etc/pacman.conf"
          if [ -f "$pacman_conf" ] && ! grep -q '^XferCommand[[:space:]]*=' "$pacman_conf"; then
            sed -i '/^\[options\]/a XferCommand = /usr/bin/curl --user-agent "pacman/6.1.0 (Linux x86_64) libalpm/14.0.0" -L -C - -f -o %o %u' "$pacman_conf"
          fi
          for attempt in 1 2 3 4 5; do
            if dkp-pacman -Sy --noconfirm switch-sdl2; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            echo "Package mirror unavailable; retrying ($attempt/5)" >&2
            sleep $((attempt * 5))
          done
          export PATH="$DEVKITPRO/portlibs/switch/bin:$PATH"
          command -v sdl2-config
          sdl2-config --version

      - name: Build and validate SDL2 probe
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/switch/bin:$PATH"
          make test
          make sdl2-probe
          make sdl2-gl-probe
          make sdl2-texture-probe
          make sdl2-audio-probe

      - name: Upload SDL2 software-renderer probe
        uses: actions/upload-artifact@v4
        with:
          name: sdl2-switch-probe
          path: build/sdl2-switch-probe.nro
          if-no-files-found: error

      - name: Upload SDL2 OpenGL ES probe
        uses: actions/upload-artifact@v4
        with:
          name: sdl2-gl-switch-probe
          path: build/sdl2-gl-switch-probe.nro
          if-no-files-found: error

      - name: Upload SDL2 texture-upload probe
        uses: actions/upload-artifact@v4
        with:
          name: sdl2-texture-switch-probe
          path: build/sdl2-texture-switch-probe.nro
          if-no-files-found: error

      - name: Upload SDL2 audio probe
        uses: actions/upload-artifact@v4
        with:
          name: sdl2-audio-switch-probe
          path: build/sdl2-audio-switch-probe.nro
          if-no-files-found: error

  sdl2-runtime:
    name: Run SDL2 texture and joystick probe in NeXium
    runs-on: ubuntu-26.04
    needs: sdl2-probe
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SDL2 texture-upload NRO
        uses: actions/download-artifact@v4
        with:
          name: sdl2-texture-switch-probe
          path: nros
      - name: Download SDL2 software-renderer NRO
        uses: actions/download-artifact@v4
        with:
          name: sdl2-switch-probe
          path: nros

      - name: Download SDL2 OpenGL ES NRO
        uses: actions/download-artifact@v4
        with:
          name: sdl2-gl-switch-probe
          path: nros

      - name: Download SDL2 audio NRO
        uses: actions/download-artifact@v4
        with:
          name: sdl2-audio-switch-probe
          path: nros

      - name: Install headless display and Vulkan runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers

      - name: Download NeXium nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          release_json="$(curl -fsSL --retry 3 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          asset_url="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name == "nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          test -n "$asset_url"
          curl -fL --retry 3 --retry-all-errors "$asset_url" -o /tmp/nexium-linux.tar.gz
          mkdir -p /tmp/nexium
          tar -xzf /tmp/nexium-linux.tar.gz -C /tmp/nexium
          emu_bin="$(find /tmp/nexium -type f -executable \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          if [ -z "$emu_bin" ]; then
            emu_bin="$(find /tmp/nexium -type f -executable ! -name 'ffmpeg' -print -quit)"
          fi
          test -n "$emu_bin"
          echo "NEXIUM_BIN=$emu_bin" >> "$GITHUB_ENV"
          echo "NeXium executable: $emu_bin"
          ldd "$emu_bin" || true

      - name: Verify SDL2 joystick input and texture presentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          if [ -z "$icd" ]; then
            echo "Lavapipe Vulkan ICD not found" | tee runtime-evidence/runner.log
            exit 1
          fi
          echo "Vulkan ICD: $icd" | tee runtime-evidence/runner.log
          export NRO="nros/sdl2-texture-switch-probe.nro"
          export SHOT="runtime-evidence/sdl2-before-right.png"
          export SHOT_SELECTED="runtime-evidence/sdl2-selected.png"
          export SHOT_CANCELLED="runtime-evidence/sdl2-cancelled.png"
          export SHOT_AFTER="runtime-evidence/sdl2-after-right.png"
          export LOG="runtime-evidence/sdl2-nexium.log"
          export VK_ICD_FILENAMES="$icd"
          if ! timeout --kill-after=5s 65s xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            set -euo pipefail
            "$NEXIUM_BIN" "$NRO" >"$LOG" 2>&1 &
            pid=$!
            for i in $(seq 1 30); do
              sleep 1
              state="$(ps -o stat= -p "$pid" 2>/dev/null | tr -d " " || true)"
              if [ -z "$state" ] || [[ "$state" == Z* ]] || ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid" || rc=$?
                cat "$LOG"
                echo "NeXium exited before screenshot (status ${rc:-unknown})"
                exit 1
              fi
            done
            window="$(xdotool search --onlyvisible --name "NeXium" 2>/dev/null | tail -n 1 || true)"
            if [ -z "$window" ]; then
              echo "NeXium window not found" >&2
              exit 1
            fi
            timeout --kill-after=2s 10s import -window "$window" "$SHOT"
            timeout --kill-after=1s 3s xdotool windowfocus --sync "$window" || true
            timeout --kill-after=1s 3s xdotool keydown --window "$window" c
            sleep 0.15
            timeout --kill-after=1s 3s xdotool keyup --window "$window" c
            sleep 0.3
            timeout --kill-after=2s 10s import -window "$window" "$SHOT_SELECTED"
            timeout --kill-after=1s 3s xdotool keydown --window "$window" x
            sleep 0.15
            timeout --kill-after=1s 3s xdotool keyup --window "$window" x
            sleep 0.3
            timeout --kill-after=2s 10s import -window "$window" "$SHOT_CANCELLED"
            for press in 1 2; do
              timeout --kill-after=1s 3s xdotool keydown --window "$window" Right
              sleep 0.15
              timeout --kill-after=1s 3s xdotool keyup --window "$window" Right
              sleep 0.15
            done
            sleep 1
            timeout --kill-after=2s 10s import -window "$window" "$SHOT_AFTER"
            test -s "$SHOT" && test -s "$SHOT_SELECTED" && test -s "$SHOT_CANCELLED" && test -s "$SHOT_AFTER"
            kill -INT "$pid" 2>/dev/null || true
            sleep 2
            kill -KILL "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          '; then
            echo "SDL2 runtime/input launch failed" | tee -a runtime-evidence/runner.log
            exit 1
          fi
          python3 - "$SHOT" "$SHOT_SELECTED" "$SHOT_CANCELLED" "$SHOT_AFTER" <<'PY'
          from PIL import Image
          import sys

          before = Image.open(sys.argv[1]).convert("RGB")
          selected = Image.open(sys.argv[2]).convert("RGB")
          cancelled = Image.open(sys.argv[3]).convert("RGB")
          after = Image.open(sys.argv[4]).convert("RGB")
          hero = (86, 190, 244)
          cursor = (255, 219, 102)

          def near_color_count(image, color, box):
              crop = image.crop(box)
              return sum(1 for r, g, b in crop.getdata()
                         if max(abs(r-color[0]), abs(g-color[1]), abs(b-color[2])) <= 16)

          for image in (before, selected, cancelled, after):
              if image.size != (1280, 720):
                  raise SystemExit(f"Unexpected screenshot dimensions: {image.size}")
              hero_count = near_color_count(image, hero, (0, 0, image.width, image.height))
              print(f"Screenshot {image.size}, hero-color-like pixels={hero_count}")
              if hero_count < 50:
                  raise SystemExit("Expected hero marker not detected")

          changed = sum(
              1 for a, b in zip(before.getdata(), after.getdata())
              if max(abs(a[0]-b[0]), abs(a[1]-b[1]), abs(a[2]-b[2])) > 24
          )
          print(f"SDL2 changed pixels between screenshots={changed}")
          if changed < 100:
              raise SystemExit("SDL2 output did not visibly change after input")

          cell, grid_x, grid_y = 64, 384, 120
          def tile_box(x, y):
              return (x + 4, y + 4, x + cell - 4, y + cell - 4)

          range_color = (43, 91, 91)
          range_box = tile_box(grid_x + 2 * cell, grid_y + 2 * cell)
          range_selected = near_color_count(selected, range_color, range_box)
          range_cancelled = near_color_count(cancelled, range_color, range_box)
          print(f"SDL2 range pixels selected={range_selected} cancelled={range_cancelled}")
          if not (range_selected >= 300 and range_cancelled <= 100):
              raise SystemExit("SDL2 A/B joystick events did not toggle the movement-range highlight")

          def cursor_cells(image):
              found = []
              for row in range(6):
                  for col in range(8):
                      x, y = grid_x + col * cell, grid_y + row * cell
                      count = near_color_count(image, cursor, tile_box(x, y))
                      if count > 100:
                          found.append((col, row, count))
              return found

          before_cells = cursor_cells(before)
          after_cells = cursor_cells(after)
          print(f"SDL2 cursor cells before={before_cells} after={after_cells}")
          if not (len(before_cells) == 1 and before_cells[0][:2] == (1, 2) and
                  len(after_cells) == 1 and after_cells[0][:2] == (3, 2) and
                  before_cells[0][2] >= 300 and after_cells[0][2] >= 300):
              raise SystemExit("Two SDL2 Switch joystick events did not move the cursor exactly two tiles right")
          PY

      - name: Verify SDL2 software renderer and OpenGL ES runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"

          run_static_probe() {
            local nro="$1"
            local label="$2"
            local shot="runtime-evidence/$label.png"
            local log="runtime-evidence/$label.log"
            export NRO="$nro" SHOT="$shot" LOG="$log"
            echo "Launching $nro in NeXium"
            timeout --kill-after=5s 60s xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
              set -euo pipefail
              "$NEXIUM_BIN" "$NRO" >"$LOG" 2>&1 &
              pid=$!
              for i in $(seq 1 30); do
                sleep 1
                state="$(ps -o stat= -p "$pid" 2>/dev/null | tr -d " " || true)"
                if [ -z "$state" ] || [[ "$state" == Z* ]] || ! kill -0 "$pid" 2>/dev/null; then
                  wait "$pid" || rc=$?
                  cat "$LOG"
                  echo "NeXium exited before screenshot (status ${rc:-unknown})"
                  exit 1
                fi
              done
              window="$(xdotool search --onlyvisible --name "NeXium" 2>/dev/null | tail -n 1 || true)"
              if [ -z "$window" ]; then
                echo "NeXium window not found" >&2
                exit 1
              fi
              sleep 2
              timeout --kill-after=2s 10s import -window "$window" "$SHOT"
              test -s "$SHOT"
              kill -INT "$pid" 2>/dev/null || true
              sleep 2
              kill -KILL "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            '
            python3 tests/check_sdl2_runtime_screenshot.py "$shot" "$label"
          }

          run_static_probe "nros/sdl2-switch-probe.nro" "sdl2-software-renderer"
          run_static_probe "nros/sdl2-gl-switch-probe.nro" "sdl2-opengles2"

      - name: Verify SDL2 audio callback runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export NRO="nros/sdl2-audio-switch-probe.nro"
          export LOG="runtime-evidence/sdl2-audio-nexium.log"
          export SHOT="runtime-evidence/sdl2-audio-status.png"
          timeout --kill-after=5s 50s xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            set -euo pipefail
            "$NEXIUM_BIN" "$NRO" >"$LOG" 2>&1 &
            pid=$!
            for i in $(seq 1 30); do
              sleep 1
              state="$(ps -o stat= -p "$pid" 2>/dev/null | tr -d " " || true)"
              if [ -z "$state" ] || [[ "$state" == Z* ]] || ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid" || rc=$?
                cat "$LOG"
                echo "NeXium exited before audio status screenshot (status ${rc:-unknown})"
                exit 1
              fi
            done
            window="$(xdotool search --onlyvisible --name "NeXium" 2>/dev/null | tail -n 1 || true)"
            test -n "$window"
            sleep 5
            timeout --kill-after=2s 10s import -window "$window" "$SHOT"
            test -s "$SHOT"
            kill -INT "$pid" 2>/dev/null || true
            sleep 2
            kill -KILL "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          '
          python3 - "$SHOT" "$LOG" <<'PY'
          from PIL import Image
          import sys

          image = Image.open(sys.argv[1]).convert("RGB")
          if image.size != (1280, 720):
              raise SystemExit(f"Unexpected screenshot dimensions: {image.size}")
          pixels = list(image.getdata())
          green = sum(1 for r, g, b in pixels if g > 130 and r < 70 and b < 130)
          orange = sum(1 for r, g, b in pixels if r > 160 and 70 < g < 200 and b < 70)
          red = sum(1 for r, g, b in pixels if r > 140 and g < 90 and b < 100)
          print(f"Audio probe status pixels: green={green}, orange={orange}, red={red}")
          log = open(sys.argv[2], encoding="utf-8", errors="replace").read()
          print(log)
          if "SDL audio callback observed" in log and green > 1000:
              print("PASS: SDL2 audio callback executed in NeXium; audible output is not verified.")
          elif ("SDL_OpenAudioDevice failed" in log or "Unknown PCM default" in log\n      or "cannot find card" in log or red > 300):
              print("INCONCLUSIVE: the CI host has no usable ALSA default audio device; this does not test audio output on a Switch.")
          else:
              raise SystemExit("Audio probe status was neither a confirmed callback nor a recognized missing-device condition.")
          PY

      - name: Upload SDL2 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdl2-nexium-runtime-evidence
          path: runtime-evidence/
          if-no-files-found: warn
