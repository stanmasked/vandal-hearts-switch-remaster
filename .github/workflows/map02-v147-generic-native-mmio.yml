name: MAP02 v147 bounded generic private MIPS MMIO observer
on:
  pull_request:
    paths:
      - '.github/workflows/map02-v147-generic-native-mmio.yml'
      - '.github/workflows/map02-v104-content-guard.yml'
      - 'tools/apply_map02_v147_generic_native_mmio.py'
      - 'tools/check_map02_v147_native_bounded_c.py'
      - 'tools/check_map02_v147_native_generic_mmio.py'
      - 'tools/run_map02_v146_verified_fd_native.py'
      - 'tests/test_map02_v147_generic_native_mmio.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-native-mmio-source-only:
    name: genuine native bounded collector safety (${{ matrix.cc }})
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Compile the generic 1024-event observer and test privacy
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          no_retail_exe_in_public_tests=1
          readonly no_retail_exe_in_public_tests
          test "$no_retail_exe_in_public_tests" = 1
          python3 -m unittest discover -s tests -p 'test_map02_v147_generic_native_mmio.py' -v
          python3 -m tools.check_map02_v147_native_bounded_c --cc "$CC" \
            | grep -Fx 'VH147_COMPILED_BOUNDED_NATIVE_PASS capacity=1024 generic=1 repeated_pc=1 overflow_refused=1 atomic_mode0600=1 no_overwrite=1 original_retail=0'
          python3 -m unittest discover -s tests -p 'test_map02_v146_verified_fd_native.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v145_native_build_binding.py' -v
          echo "VH147_DYNAMIC_MMIO_OBSERVER_SYNTHETIC_PASS retail_map02=0"
