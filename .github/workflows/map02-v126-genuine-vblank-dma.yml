name: MAP02 v126 real psxRcntUpdate VBlank between original MIPS DMA2
on:
  pull_request:
    paths:
      - '.github/workflows/map02-v126-genuine-vblank-dma.yml'
      - '.github/workflows/map02-v104-content-guard.yml'
      - 'tools/make_map02_v126_vblank_dma_exe.py'
      - 'tools/apply_map02_v126_pcsx_rearmed.py'
      - 'tools/summarize_map02_v126_genuine_vblank_dma.py'
      - 'tests/test_map02_v126_genuine_vblank_dma.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-psxcounters-vblank-dma-samples:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Verify MIPS CPU wait, real VBlank semantics and private count-only witness
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_map02_v126_genuine_vblank_dma.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v125_variable_dma.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v124_one_list_five_draws.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v123_gpu_linkedlist.py' -v
