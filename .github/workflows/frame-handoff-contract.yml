name: RGB24 frame handoff contract

on:
  push:
    branches:
      - audit/switch-platform-boundaries
      - feat/upstream-rgb24-observer-binding
    paths:
      - "source/rgb24_frame.h"
      - "source/rgb24_scratch.h"
      - "source/rgb24_scratch.c"
      - "source/switch_managed_frame.h"
      - "source/switch_managed_frame.c"
      - "source/frame_conversion.h"
      - "source/frame_conversion.c"
      - "source/switch_converted_frame.h"
      - "source/switch_converted_frame.c"
      - "source/frame_handoff.h"
      - "source/switch_frame_bridge.h"
      - "source/switch_frame_bridge.c"
      - "source/switch_completed_frame.h"
      - "source/switch_completed_frame.c"
      - "source/switch_present_hook.h"
      - "source/switch_present_hook.c"
      - "source/switch_upstream_observer.h"
      - "source/switch_upstream_observer.c"
      - "tests/test_rgb24_frame.c"
      - "tests/test_rgb24_scratch.c"
      - "tests/test_switch_managed_frame.c"
      - "tests/test_frame_conversion.c"
      - "tests/test_switch_converted_frame.c"
      - "tests/test_frame_handoff.c"
      - "tests/test_switch_frame_bridge.c"
      - "tests/test_switch_completed_frame.c"
      - "tests/test_switch_present_hook.c"
      - "tests/test_switch_upstream_observer.c"
      - "tools/patch_pc_gpu_present_observer.py"
      - "tests/test_pc_gpu_present_observer_patch.py"
      - ".github/workflows/frame-handoff-contract.yml"
  pull_request:
    paths:
      - "source/rgb24_frame.h"
      - "source/rgb24_scratch.h"
      - "source/rgb24_scratch.c"
      - "source/switch_managed_frame.h"
      - "source/switch_managed_frame.c"
      - "source/frame_conversion.h"
      - "source/frame_conversion.c"
      - "source/switch_converted_frame.h"
      - "source/switch_converted_frame.c"
      - "source/frame_handoff.h"
      - "source/switch_frame_bridge.h"
      - "source/switch_frame_bridge.c"
      - "source/switch_completed_frame.h"
      - "source/switch_completed_frame.c"
      - "source/switch_present_hook.h"
      - "source/switch_present_hook.c"
      - "source/switch_upstream_observer.h"
      - "source/switch_upstream_observer.c"
      - "tests/test_rgb24_frame.c"
      - "tests/test_rgb24_scratch.c"
      - "tests/test_switch_managed_frame.c"
      - "tests/test_frame_conversion.c"
      - "tests/test_switch_converted_frame.c"
      - "tests/test_frame_handoff.c"
      - "tests/test_switch_frame_bridge.c"
      - "tests/test_switch_completed_frame.c"
      - "tests/test_switch_present_hook.c"
      - "tests/test_switch_upstream_observer.c"
      - "tools/patch_pc_gpu_present_observer.py"
      - "tests/test_pc_gpu_present_observer_patch.py"
      - ".github/workflows/frame-handoff-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GLES2 headers
        run: sudo apt-get update && sudo apt-get install -y libgles2-mesa-dev
      - name: Compile and run frame contract tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-tests
          cc -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=undefined -fno-sanitize-recover=all \
            tests/test_rgb24_frame.c -o build-tests/test_rgb24_frame
          cc -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=undefined -fno-sanitize-recover=all \
            tests/test_frame_handoff.c -o build-tests/test_frame_handoff
          ./build-tests/test_rgb24_frame
          ./build-tests/test_frame_handoff
          cc -std=c11 -Wall -Wextra -Werror -Isource -c \
            source/switch_frame_bridge.c -o build-tests/switch_frame_bridge.o
          cc -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=undefined -fno-sanitize-recover=all \
            tests/test_switch_frame_bridge.c source/switch_frame_bridge.c \
            -o build-tests/test_switch_frame_bridge
          ./build-tests/test_switch_frame_bridge
          cc -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=undefined -fno-sanitize-recover=all \
            tests/test_frame_conversion.c source/frame_conversion.c \
            -o build-tests/test_frame_conversion
          ./build-tests/test_frame_conversion
          cc -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=undefined -fno-sanitize-recover=all \
            tests/test_switch_converted_frame.c source/frame_conversion.c \
            source/switch_frame_bridge.c source/switch_converted_frame.c \
            -o build-tests/test_switch_converted_frame
          ./build-tests/test_switch_converted_frame
          cc -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=undefined,address -fno-sanitize-recover=all \
            tests/test_rgb24_scratch.c source/rgb24_scratch.c source/frame_conversion.c \
            -o build-tests/test_rgb24_scratch
          ./build-tests/test_rgb24_scratch
          cc -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=undefined -fno-sanitize-recover=all \
            tests/test_switch_managed_frame.c source/rgb24_scratch.c \
            source/frame_conversion.c source/switch_frame_bridge.c \
            source/switch_converted_frame.c source/switch_managed_frame.c \
            -o build-tests/test_switch_managed_frame
          ./build-tests/test_switch_managed_frame
          cc -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=undefined -fno-sanitize-recover=all \
            tests/test_switch_completed_frame.c source/frame_conversion.c \
            source/switch_frame_bridge.c source/switch_completed_frame.c \
            -o build-tests/test_switch_completed_frame
          ./build-tests/test_switch_completed_frame
          cc -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=undefined -fno-sanitize-recover=all \
            tests/test_switch_present_hook.c source/frame_conversion.c \
            source/switch_frame_bridge.c source/switch_completed_frame.c \
            source/switch_present_hook.c -o build-tests/test_switch_present_hook
          ./build-tests/test_switch_present_hook
          python3 -m unittest discover -s tests -p test_pc_gpu_present_observer_patch.py -v
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/HalmyLyseas/VandalHearts-PcPort/14552fffa0e0b47e02b57592e274fc6e7a649923/platform/pc/src/pc_gpu_window.c \
            -o build-tests/upstream_pc_gpu_window.c
          python3 tools/patch_pc_gpu_present_observer.py \
            build-tests/upstream_pc_gpu_window.c build-tests/instrumented_pc_gpu_window.c
          grep -Fq 'VH_ObserveCompletedRGB24(s_rgbaScratch' build-tests/instrumented_pc_gpu_window.c
          grep -Fq 'SDL_GL_SwapWindow(s_window);' build-tests/instrumented_pc_gpu_window.c
          cc -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=undefined -fno-sanitize-recover=all \
            tests/test_switch_upstream_observer.c source/frame_conversion.c \
            source/switch_frame_bridge.c source/switch_completed_frame.c \
            source/switch_present_hook.c source/switch_upstream_observer.c \
            -o build-tests/test_switch_upstream_observer
          ./build-tests/test_switch_upstream_observer
