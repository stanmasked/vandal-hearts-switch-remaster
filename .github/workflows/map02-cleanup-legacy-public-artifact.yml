name: One-time cleanup of legacy MAP02 public artifact
on:
  push:
    branches:
      - work/map02-linux-owner-capture-stage520
    paths:
      - '.github/workflows/map02-cleanup-legacy-public-artifact.yml'
permissions:
  actions: write
  contents: read
concurrency:
  group: map02-legacy-public-artifact-cleanup
  cancel-in-progress: true
jobs:
  cleanup:
    name: Delete and verify legacy experimental DLL artifact
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Delete the known legacy artifact and verify absence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_id=12517180104
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          if gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" >/dev/null 2>&1; then
            echo "legacy artifact is still accessible after delete" >&2
            exit 1
          fi
          echo "VH_MAP02_LEGACY_PUBLIC_ARTIFACT_DELETE_VERIFIED artifact_id=${artifact_id} public_dll=0"
