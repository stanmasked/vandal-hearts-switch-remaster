name: MAP02 v141 private original code / MMIO tuple claim verification
on:
  pull_request:
    paths:
      - '.github/workflows/map02-v141-private-original-mmio.yml'
      - '.github/workflows/map02-v104-content-guard.yml'
      - 'tools/verify_map02_v141_private_original_mmio_claims.py'
      - 'tests/test_map02_v141_private_original_mmio_claims.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-original-mmio-source-gate:
    name: private source-bound MIPS MMIO claims (${{ matrix.cc }})
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Source-generated PS-X/ELF MIPS private claims, no original assets
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          no_retail_assets_in_ci=1
          readonly no_retail_assets_in_ci
          test "$no_retail_assets_in_ci" = 1
          python3 -m unittest discover -s tests -p 'test_map02_v141_private_original_mmio_claims.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v140_native_mmio_effects.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v139_native_words.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v138_interpreter_pc.py' -v
          echo "VH141_PRIVATE_ORIGINAL_SOURCE_TUPLES_SYNTHETIC_PASS real_retail_execution=0"
