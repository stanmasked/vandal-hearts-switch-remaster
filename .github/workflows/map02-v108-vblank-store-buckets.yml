name: MAP02 v108 Unai native stores by VBlank ordinal intervals
on:
  pull_request:
    paths:
      - '.github/workflows/map02-v108-vblank-store-buckets.yml'
      - 'tools/summarize_map02_v108_vblank_store_buckets.py'
      - 'tests/test_map02_v108_vblank_store_buckets.py'
      - '.github/workflows/map02-v104-content-guard.yml'
      - 'tools/summarize_map02_v83_unai_vblank.py'
      - 'tools/summarize_map02_v84_unai_samples.py'
      - 'tools/summarize_map02_v85_native_stores.py'
      - 'tools/verify_map02_v82_native_trace.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ordinal-vblank-regression:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate v83-v85 and v108 synthetic trace provenance
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          for pattern in test_map02_v83_unai_dispatch.py test_map02_v84_unai_samples.py test_map02_v85_native_stores.py test_map02_v108_vblank_store_buckets.py; do
            python3 -m unittest discover -s tests -p "$pattern" -v
          done
