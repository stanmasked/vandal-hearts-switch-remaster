name: MAP02 v122 interpreted MIPS PS1 DMA2 Unai GPU return
on:
  pull_request:
    paths:
      - '.github/workflows/map02-v122-mips-dma2-return.yml'
      - '.github/workflows/map02-v104-content-guard.yml'
      - 'tools/make_map02_v122_mips_dma2_gp0_exe.py'
      - 'tools/apply_map02_v122_pcsx_rearmed.py'
      - 'tools/summarize_map02_v122_mips_dma2_return.py'
      - 'tests/test_map02_v122_mips_dma2_return.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interpreted-mips-ram-to-gpu-dma2:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Validate authored RAM GPU commands, real DMA2 mode and private proof
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_map02_v122_mips_dma2_return.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v121_mips_return.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v120_real_gp0_return.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v119_five_native.py' -v
