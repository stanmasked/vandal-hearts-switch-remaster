name: MAP02 owner-private dual-replay contact sheet (synthetic CI)
on:
  pull_request:
    paths:
      - '.github/workflows/map02-private-owner-rgb-contact-sheet.yml'
      - 'tools/map02_private_owner_rgb_contact_sheet.py'
      - 'tests/test_map02_private_owner_rgb_contact_sheet.py'
      - 'docs/MAP02_PRIVATE_OWNER_RGB_CONTACT_SHEET.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-contact-sheet:
    name: Invented dual PNG visual review (${{ matrix.os }} Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-22.04
            python: '3.11'
          - os: macos-15-intel
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install Pillow only to render fake 2x1 PNG screenshots
        shell: bash
        run: python -m pip install 'Pillow>=10,<12'
      - name: Validate 22 invented owner-private report and screenshot paths
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_map02_private_owner_rgb_contact_sheet.py' -v \
            2>&1 | tee "$RUNNER_TEMP/map02-owner-contact-sheet-tests.log"
          grep -F 'Ran 22 tests' "$RUNNER_TEMP/map02-owner-contact-sheet-tests.log"
          if grep -E '^(FAILED|ERROR)' "$RUNNER_TEMP/map02-owner-contact-sheet-tests.log"; then exit 1; fi
          echo 'VH_MAP02_OWNER_CONTACT_SHEET_PASS synthetic=22 original_bk2=0 private_png=0 map02_identified=0'
