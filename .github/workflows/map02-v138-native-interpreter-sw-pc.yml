name: MAP02 v138 actual interpreter CPU SW instruction PC proof
on:
  pull_request:
    paths:
      - '.github/workflows/map02-v138-native-interpreter-sw-pc.yml'
      - '.github/workflows/map02-v104-content-guard.yml'
      - 'tools/apply_map02_v138_interpreter_pc_witness.py'
      - 'tests/test_map02_v138_native_interpreter_sw_pc.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-synthetic-interpreter-sw:
    name: native SW PC/opcode/MMIO corruption controls (${{ matrix.cc }})
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Independently compile the C runtime SW witness and mutate origin PC
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          no_original_ps1_assets=1
          readonly no_original_ps1_assets
          test "$no_original_ps1_assets" = 1
          python3 -m unittest discover -s tests -p 'test_map02_v138_native_interpreter_sw_pc.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v137_private_mips_pc_sites.py' -v
          python3 -m unittest discover -s tests -p 'test_map02_v136_original_code_sections.py' -v
          echo "VH138_NATIVE_C_INTERPRETER_SW_REGRESSION_PASS source_authored_mips=1 retail_map02_verified=0"
