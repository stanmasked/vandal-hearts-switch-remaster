name: Pinned upstream DrawOTag Switch cross-compile

on:
  push:
    branches:
      - feat/upstream-rgb24-observer-binding
    paths:
      - ".github/workflows/pinned-drawotag-switch-cross-compile.yml"
      - "docs/UPSTREAM_DRAWOTAG_SWITCH_AUDIT.md"
      - "tools/switch_psyq_compat.h"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drawotag-object:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream and compile original libgpu.c
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          git clone --filter=blob:none --no-checkout \
            https://github.com/HalmyLyseas/VandalHearts-PcPort.git /tmp/vh-raster-upstream
          git -C /tmp/vh-raster-upstream checkout --detach 14552fffa0e0b47e02b57592e274fc6e7a649923
          mkdir -p build/drawotag
          "$DEVKITA64/bin/aarch64-none-elf-gcc" -std=c11 -O2 -Wall -Wextra \
            -ffunction-sections -fdata-sections \
            -include tools/switch_psyq_compat.h \
            -I/tmp/vh-raster-upstream/platform/pc/include \
            -I/tmp/vh-raster-upstream/platform/pc/src \
            -I/tmp/vh-raster-upstream/include \
            -I"$DEVKITPRO/libnx/include" \
            -c /tmp/vh-raster-upstream/platform/pc/src/libgpu.c \
            -o build/drawotag/libgpu_switch.o
          "$DEVKITA64/bin/aarch64-none-elf-nm" --defined-only build/drawotag/libgpu_switch.o \
            > build/drawotag/defined-symbols.txt
          "$DEVKITA64/bin/aarch64-none-elf-nm" --undefined-only build/drawotag/libgpu_switch.o \
            > build/drawotag/undefined-symbols.txt
          grep -Eq ' [T] DrawOTag$' build/drawotag/defined-symbols.txt
          grep -Eq ' [U] PC_GpuPresent$' build/drawotag/undefined-symbols.txt
          grep -Eq ' [U] PC_GpuVram$' build/drawotag/undefined-symbols.txt
          echo "Original DrawOTag cross-compiled and still calls upstream PC_GpuPresent."
          echo "Unresolved GPU/raster dependencies:"
          cat build/drawotag/undefined-symbols.txt
      - name: Compile native VRAM software rasterizer for Switch
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          "$DEVKITA64/bin/aarch64-none-elf-gcc" -std=c11 -O2 -Wall -Wextra \
            -ffunction-sections -fdata-sections -include tools/switch_psyq_compat.h \
            -I/tmp/vh-raster-upstream/platform/pc/include \
            -I/tmp/vh-raster-upstream/platform/pc/src \
            -I/tmp/vh-raster-upstream/include \
            -I"$DEVKITPRO/libnx/include" \
            -c /tmp/vh-raster-upstream/platform/pc/src/pc_raster.c \
            -o build/drawotag/pc_raster_switch.o
          "$DEVKITA64/bin/aarch64-none-elf-nm" --defined-only build/drawotag/pc_raster_switch.o \
            > build/drawotag/raster-defined-symbols.txt
          "$DEVKITA64/bin/aarch64-none-elf-nm" --undefined-only build/drawotag/pc_raster_switch.o \
            > build/drawotag/raster-undefined-symbols.txt
          grep -Eq ' [T] PC_GpuVram$' build/drawotag/raster-defined-symbols.txt
          grep -Eq ' [T] FillRect$' build/drawotag/raster-defined-symbols.txt
          echo "Original rasterizer compiled; provides native VRAM and rectangle fill."
          cat build/drawotag/raster-undefined-symbols.txt
      - name: Partially link native DrawOTag to authentic rasterizer
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          "$DEVKITA64/bin/aarch64-none-elf-gcc" -nostdlib -r \
            build/drawotag/libgpu_switch.o build/drawotag/pc_raster_switch.o \
            -o build/drawotag/gpu-raster-combined.o
          "$DEVKITA64/bin/aarch64-none-elf-nm" --undefined-only \
            build/drawotag/gpu-raster-combined.o \
            > build/drawotag/combined-undefined-symbols.txt
          "$DEVKITA64/bin/aarch64-none-elf-nm" --defined-only \
            build/drawotag/gpu-raster-combined.o \
            > build/drawotag/combined-defined-symbols.txt
          grep -Eq ' [T] DrawOTag$' build/drawotag/combined-defined-symbols.txt
          grep -Eq ' [T] PC_GpuVram$' build/drawotag/combined-defined-symbols.txt
          grep -Eq ' [U] PC_GpuPresent$' build/drawotag/combined-undefined-symbols.txt
          if grep -Eq ' [U] (PC_GpuVram|FillRect|FillQuad)$' build/drawotag/combined-undefined-symbols.txt; then
            echo "Original rasterizer symbol remains unresolved" >&2
            exit 1
          fi
          echo "Original DrawOTag and rasterizer partially linked; PC_GpuPresent stays external."
      - name: Upload original DrawOTag dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-drawotag-switch-object-audit
          path: build/drawotag/
          if-no-files-found: ignore
