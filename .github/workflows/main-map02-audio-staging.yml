name: Main MAP02 plus staged native audio - isolated CI

on:
  pull_request:
    paths:
      - "source/vh_*"
      - "tests/test_vh_*"
      - "tools/run_staged_audio_foundation_tests.sh"
      - "docs/MAIN_MAP02_AUDIO_STAGING.md"
      - ".github/workflows/main-map02-audio-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-main-map02-regressions:
    name: Preserve main graphics and MAP02 host tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build and run unchanged graphics and MAP02 test targets
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            test_game_rules test_software_renderer test_ps1_abr_blend
            test_map02_face_direction test_map02_projection
            test_map02_terrain_ot_scene test_map02_vram4_frame
          )
          args=()
          for target in "${targets[@]}"; do args+=("build/$target"); done
          make "${args[@]}"
          for target in "${targets[@]}"; do "build/$target"; done
          echo "PASS: 7 unchanged main MAP02 and graphics test targets" >> "$GITHUB_STEP_SUMMARY"

  staged-native-audio:
    name: Audio foundation host regressions (${{ matrix.compiler }}; ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Run eight isolated audio regression executables
        shell: bash
        run: |
          set -euo pipefail
          bash tools/run_staged_audio_foundation_tests.sh "${{ matrix.compiler }}"
          echo "PASS: ${{ matrix.compiler }} staged audio tests without modifying main Makefile" >> "$GITHUB_STEP_SUMMARY"

  verify-origin-and-scope:
    name: Exact audio blobs and unchanged MAP02 files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare staged file blob IDs to integrated audio source commit
        shell: bash
        run: |
          set -euo pipefail
          audio="bb92f521596588ab47e2e529fc8a3ebacb5a93a8"
          parent="f30e44f1b2173fd991e688e9d3e5b07e9b63c25f"
          main="af8e1709488df6e9bcc591e66fae337bcf713c69"
          git cat-file -e "$audio^{commit}"
          git cat-file -e "$parent^{commit}"
          git cat-file -e "$main^{commit}"
          # Frozen integration audio has 50 vh_* source blobs. The staged
          # parent deliberately added 4 diagnostic sources and modified 6
          # integration files. This isolated 48k PR adds a fifth source
          # and changes only the synchronized observer pair.
          mapfile -t frozen < <(git ls-tree -r --name-only "$audio" source | \
            grep '^source/vh_' | grep -v '^source/vh_native_tone.h$')
          mapfile -t parent_sources < <(git ls-tree -r --name-only "$parent" source | \
            grep '^source/vh_' | grep -v '^source/vh_native_tone.h$')
          mapfile -t staged < <(git ls-tree -r --name-only HEAD source | \
            grep '^source/vh_' | grep -v '^source/vh_native_tone.h$')
          test "${#frozen[@]}" -eq 50
          test "${#parent_sources[@]}" -eq 54
          test "${#staged[@]}" -eq 59
          # Ten precisely reviewed opt-in source overlays vs frozen
          # parent (four NEW witness/optical files), no wildcard.
          expected_changes=(
            source/main.c
            source/vh_audout_presubmit_optical.c
            source/vh_audout_presubmit_optical.h
            source/vh_audout_presubmit_witness.c
            source/vh_audout_presubmit_witness.h
            source/vh_guest_native_48k.c
            source/vh_guest_sync_studio_c.c
            source/vh_guest_sync_studio_c.h
            source/vh_switch_game_audio.c
            source/vh_switch_game_audio.h
          )
          mapfile -t actual_changes < <(git diff --name-only "$parent" HEAD -- source)
          test "${#actual_changes[@]}" -eq "${#expected_changes[@]}"
          for i in "${!expected_changes[@]}"; do
            test "${actual_changes[i]}" = "${expected_changes[i]}"
          done
          # Every original parent file except the four precisely pinned
          # diagnostic overlays must keep its byte-identical Git blob.
          for file in "${parent_sources[@]}"; do
            case "$file" in
              source/vh_guest_sync_studio_c.c|source/vh_guest_sync_studio_c.h|\
              source/vh_switch_game_audio.c|source/vh_switch_game_audio.h)
                continue ;;
            esac
            test "$(git rev-parse "HEAD:$file")" = \
                 "$(git rev-parse "$parent:$file")"
          done
          # Enforce byte identity of 44 original audio blobs. The other
          # six belong to the approved parent-stage optical/runtime bridge
          # and must instead match that immutable parent commit.
          for file in "${frozen[@]}"; do
            case "$file" in
              source/vh_audio_scene_optical.c|source/vh_audio_scene_optical.h|\
              source/vh_audio_scene_trace.c|source/vh_audio_scene_trace.h)
                expected="$parent" ;;
              source/vh_switch_game_audio.c|source/vh_switch_game_audio.h)
                continue ;; # Explicit child-only SHA pins below
              *) expected="$audio" ;;
            esac
            test "$(git rev-parse "HEAD:$file")" = \
                 "$(git rev-parse "$expected:$file")"
          done
          # These seven exact Git blob pins protect new opt-in source
          # changes. Do not permit unreviewed audio/entrypoint changes.
          test "$(git rev-parse HEAD:source/main.c)" = \
               "679f68152fe1e9211911e221fa1fc18487733b61"
          test "$(git rev-parse HEAD:source/vh_switch_game_audio.c)" = \
               "b1ff92ee1d2725729b5e793715a9f68ade153837"
          test "$(git rev-parse HEAD:source/vh_switch_game_audio.h)" = \
               "ca8e1906cbc149dd98e1b293ecfb8d94bf50c237"
          test "$(git rev-parse HEAD:source/vh_audout_presubmit_optical.c)" = \
               "e0b7458af5e52bb197d00471843ebb70d17f4647"
          test "$(git rev-parse HEAD:source/vh_audout_presubmit_optical.h)" = \
               "35d53e7193a3d9c80b037e245595d5bbbca60c5b"
          test "$(git rev-parse HEAD:source/vh_audout_presubmit_witness.c)" = \
               "58b10244715e22d560ddd432318fafd36f1ab1c2"
          test "$(git rev-parse HEAD:source/vh_audout_presubmit_witness.h)" = \
               "eba4e6fe59683e85288bff7a07e8ca89815d5a1b"
          tests=(
            test_vh_audio_resample.c test_vh_audio_stream.c
            test_vh_music_scene.c test_vh_music_scene_soak.c
            test_vh_native_seq.c test_vh_native_spu.c
            test_vh_native_vab.c test_vh_spu_reverb.c
          )
          for file in "${tests[@]}"; do
            test "$(git rev-parse "HEAD:tests/$file")" = \
                 "$(git rev-parse "$audio:tests/$file")"
          done
          git diff --exit-code "$main" HEAD -- \
            Makefile source/game_rules.h source/game_renderer.h \
            'source/map02*' 'source/ps1_*' source/software_renderer.h
          echo "PASS: 44 frozen blobs + 52 parent blobs + 10 exact-scoped source changes (7 child blob pins), 8 tests and stock MAP02 graphics preserved" >> "$GITHUB_STEP_SUMMARY"
