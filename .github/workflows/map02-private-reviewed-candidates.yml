name: MAP02 private reviewed candidate shortlist (synthetic CI)
on:
  pull_request:
    paths:
      - '.github/workflows/map02-private-reviewed-candidates.yml'
      - 'tools/map02_private_reviewed_scene_candidates.py'
      - 'tests/test_map02_private_reviewed_scene_candidates.py'
      - 'docs/MAP02_PRIVATE_REVIEWED_SCENE_CANDIDATES.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invented-reviewed-shortlist:
    name: Synthetic owner-review shortlist (${{ matrix.os }} Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-22.04
            python: '3.11'
          - os: macos-15-intel
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Exercise 24 fabricated source-and-human-label scenarios
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_map02_private_reviewed_scene_candidates.py' -v \
            2>&1 | tee "$RUNNER_TEMP/map02-reviewed-candidate-shortlist.log"
          grep -F 'Ran 24 tests' "$RUNNER_TEMP/map02-reviewed-candidate-shortlist.log"
          if grep -E '^(FAILED|ERROR)' "$RUNNER_TEMP/map02-reviewed-candidate-shortlist.log"; then exit 1; fi
          echo 'VH_MAP02_PRIVATE_SHORTLIST_PASS synthetic=24 original_bk2=0 real_ps1=0 scene_authenticated=0'
